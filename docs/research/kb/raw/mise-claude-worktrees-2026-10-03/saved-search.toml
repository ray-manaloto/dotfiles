#                      --jq '.total_count, (.items[] | "\(.repository.full_name) \(.path)")'
#     Run control_hit (must be > 0) and control_absent (must be 0) with the SAME command shape first.
#     NOTE: `gh search issues --repo` is broken on this machine (returns 0 silently) — use gh api.

