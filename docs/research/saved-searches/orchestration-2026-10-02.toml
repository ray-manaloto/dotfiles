# Saved GitHub searches — orchestration research (2026-10-02)
#
# Re-runnable record of every GitHub search behind
# docs/research/kb/reports/agents/orchestration-parallel-coordination-2026-10-02.md.
#
# FORMAT: no `watches.toml` exists yet (N1 `github-watch` is unbuilt; issue #1502's
# Saved-searches phase depends on it). The [[watch]] tables below follow the DRAFT
# schema in docs/specs/research-watch-2026-09-30.md §3.1 (rev 2, on branch
# feat/native-cli-installers-workflow) so they can be moved into watches.toml
# unchanged when N1 lands. That draft loader REJECTS unknown keys, so the measured
# results live in a separate [[result]] array-of-tables keyed by `watch_id` — strip
# or relocate [[result]] when merging.
#
# Controls (shared by every code watch, Q1): control_hit must return >=1 confirmed hit;
# control_absent must contain {nonce}, rendered FRESH per run and never written back.
# Code-search tokenizer drops punctuation, so total_count is NOT a hit count: each
# result records how many of the top hits were re-fetched and matched `grep`.
# A 403 is a rate limit, never zero.

schema_version = 1

[[watch]]
id       = "orch-code-claude-bg"
kind     = "code"
origin   = "topic:parallel-orchestration"
question = "How do real repos use Claude Code / Herdr parallel-orchestration features?"
cadence  = "weekly"
tags     = ["orchestration", "claude-code"]
limit    = 10
queries  = ['"claude --bg"']
grep      = 'claude --bg'
path_grep = ''
control_hit           = '"[tools]" filename:mise.toml'
control_hit_grep      = '^\[tools\]'
control_hit_path_grep = ''
control_absent        = '"{nonce}" filename:mise.toml'

