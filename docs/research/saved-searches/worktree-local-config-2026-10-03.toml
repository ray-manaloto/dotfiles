watch_id = "_controls"
date_run = "2026-10-03T20:20:00Z"
must_hit_cc_hooks = 8921
must_hit_codex_sandbox = 5349
must_hit_codex_discussions_config = 138
known_absent_fresh_nonce = 0
verdict = "discriminates (must-hit>0, absent=0 on issues and discussions)"

