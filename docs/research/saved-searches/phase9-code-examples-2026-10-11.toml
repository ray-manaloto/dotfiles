# Curated code searches for every local issue linked in Phase 9 of the
# mac-global-mise-ownership PWF plan. Rerun with:
# mise run research-saved-search -- rerun docs/research/saved-searches/phase9-code-examples-2026-10-11.toml
# Code matches are leads, not proof of equivalent behavior. Read source and tests
# before applying a pattern. A zero requires the runner's same-shape controls.
schema_version = 1
question = "Which GitHub code examples inform all 19 dotfiles Phase 9 issue links?"
origin = "report:docs/research/kb/reports/agents/phase9-code-examples-2026-10-11.md"

