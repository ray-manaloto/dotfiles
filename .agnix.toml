severity = "Warning"
exclude = [
    "node_modules/**",
    ".git/**",
    ".codex/**",
    ".omx/**",
    ".omc/**",
    ".omg/**",
    ".logging/**",
    "plugins/**",
    "missions/**",
    # Deep-research artifacts: prose reports whose per-run `agents/` subdir
    # name collides with agnix's agent-definition validation (it treats any
    # **/agents/*.md as an agent file needing YAML frontmatter). These are
    # research findings, not agent docs — same rationale as the .omc/** exclude
    # above (r2 reports lived there; r3 moved to this tracked path for
    # visibility on `git pull`).
    "docs/research/runs/**",
    # Cross-surface session handoffs: prose docs with embedded resume prompts,
    # not agent definitions (the /handoff and /resume SKILLs under
    # .claude/skills/ ARE validated as skills — only the handoff output is not).
    "docs/handoffs/**",
    ".claude/skills.bak/**",
    # Third-party skill reference docs (upstream-controlled, hard-coded paths expected)
    ".claude/skills/context7-cli/references/**",
    # graphify: vendored third-party skill installed by `graphify install --project`
    # (#310-#318 adoption). Its SKILL.md is 699 lines (over agnix's 500 cap) and its
    # reference docs carry hard-coded `~/.graphify/` paths — both upstream-controlled,
    # not authored here, so exempt like context7-cli above. graphify is host-pinned in
    # mise.toml; the skill is regenerated by the installer, never hand-edited.
    ".claude/skills/graphify/**",
]
tools = ["claude-code"]
max_files_to_validate = 10000

# Per-file rule suppressions for by-design patterns in this repo's reference
# docs. Scoped by path so a stray hard-coded path or bad pattern in NEW code
# still flags. Rule IDs verified via `agnix --verbose .`.
[[overrides]]
# AGENTS.md / CLAUDE.md are hierarchical reference docs for a Claude Code repo:
#  - XP-003: intentional `.claude/` path references (and container `~/` paths in
#    .devcontainer/AGENTS.md, which are correct inside the container).
#  - AGM-006: the deliberate nested-AGENTS.md hierarchy (enforced by the
#    claude_agents_md_pairs hk step).
#  - AGM-004: these files carry project context without a literal
#    "## Project Context" header, and are at the 200-line md_size_budget cap.
#  - PE-001: "critical keyword in the 40-60% lost-in-middle zone" is a prompt
#    heuristic that misfires on reference docs.
# CONTEXT.md joins them (2026-07-15): it is the domain glossary the mattpocock
# engineering skills read, and the same XP-003 rationale applies verbatim — its
# `.claude/rules/*.md` references are the POINT (that is where this repo's ADRs
# live; see docs/adr/README.md). Rewording them to satisfy a portability check
# would delete the fact the section exists to state. Scoped to the exact filename
# so a stray hard-coded path in new code still flags.
paths = ["**/AGENTS.md", "**/CLAUDE.md", "AGENTS.md", "CLAUDE.md", "CONTEXT.md"]
disabled_rules = ["XP-003", "AGM-004", "AGM-006", "PE-001"]

[[overrides]]
# CC-HK-025 is a VERIFIED upstream agnix bug (source-confirmed at 0.37.5, the
# latest release; see .omc/research/research-20260714-agnix/report.md). It
# tests the RAW matcher string (e.g. "startup|resume") against the SessionStart
# enum {startup,resume,clear,compact} WITHOUT splitting on '|'/',' — but the
# official Claude Code hooks docs (code.claude.com/docs/en/hooks) parse a
# matcher containing only [A-Za-z0-9_ -,|] as a LIST of exact values split on
# '|'/','. So our `startup|resume` correctly fires on both; agnix is wrong.
# Version-pinning (VER-001) does NOT fix it (the enum is a compile-time const).
# Scoped to settings.json so a genuinely-bad matcher elsewhere still flags.
# Sibling precedent upstream fixed: agent-sh/agnix#1052 (CC-SK-008 whitespace
# split). Remove this override once an equivalent CC-HK-025 fix ships upstream.
paths = [".claude/settings.json", "**/settings.json"]
disabled_rules = ["CC-HK-025"]

[[overrides]]
# VER-001 ("No Tool/Spec Versions Pinned", Severity LOW / BEST_PRACTICE / info)
# nudges us to pin `[tool_versions] claude_code = "<ver>"`. We deliberately do
# NOT: Claude Code auto-updates and is not a mise/Renovate-managed dep here, so
# any pinned value goes stale within days — after which agnix would validate our
# config against a CC version we no longer run. Unpinned, agnix uses its
# latest-known schema, which MATCHES us (we run latest CC), so the default is the
# more accurate choice for a rolling CLI; pinning would be worse + endless manual
# bumps. Info-level so it never fails (--strict escalates warnings, not info) —
# disabled only to keep the agnix output clean. Decision record + revisit
# conditions: https://github.com/ray-manaloto/dotfiles/issues/258
paths = [".agnix.toml"]
disabled_rules = ["VER-001"]

[rules]
skills = true
hooks = true
agents = true
memory = true
plugins = true
xml = true
mcp = true
imports = true
agents_md = true
prompt_engineering = true
frontmatter_validation = true
xml_balance = true
import_references = true
# CC-SK-017: skills in this repo carry local metadata frontmatter fields
# (type, extracted-from, applicability, triggers, source, status, inspired-by,
# id, quality) that are not in agnix's canonical SKILL.md schema. They are an
# intentional convention, so disable the unknown-frontmatter-field check.
disabled_rules = ["CC-SK-017"]
disabled_validators = []

[files]
include_as_memory = []
include_as_generic = []
exclude = []
