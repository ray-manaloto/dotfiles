description = "OPERATOR ONLY: attest the planning-with-files plan. Run it as `! mise run plan-attest` — settings.json denies the model every other route, INCLUDING this task. Bare form WRITES; `-- --show` is read-only."
# Thin caller; python/src/dotfiles_setup/plan_attest.py.
