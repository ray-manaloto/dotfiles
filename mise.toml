description = "Blast radius: reverse-traverse the graph for what breaks if <node> changes"
# Thin caller (zero-bash-logic); logic in
# python/src/dotfiles_setup/graphify.py. Same deterministic BFS/DFS substrate
# as graphify-query, run in reverse (calls/imports/references/inherits) —
# no LLM, source-cited, ~free. Health-gated: a missing/stale/corrupt/drifted
