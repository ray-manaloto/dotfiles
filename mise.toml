min_version = "2026.10.20"
monorepo_root = true

[monorepo]
config_roots = ["python", "python/toolchains/p2996", "python/cbm", "python/home", "python/lsp", "python/visualplan", "python/jbctl", "python/depmaps", "python/guards", "cpp", "swift"]
lockfile = true

[monorepo.path_aliases]
p2996 = "python/toolchains/p2996"
cbm = "python/cbm"
home = "python/home"
lsp = "python/lsp"
visualplan = "python/visualplan"
jbctl = "python/jbctl"
depmaps = "python/depmaps"
guards = "python/guards"

# `pytest -n auto` starts one worker per core in every package's test task; hk runs two steps at a time (hk.pkl
# jobs), so at most 8 workers, not 12 per suite (owner, 2026-11-13: the load passed 200 on 12 cores).
[env]
PYTEST_XDIST_AUTO_NUM_WORKERS = "4"

[settings]
lockfile = true
# `mise use` and `mise upgrade --bump` write the resolved version, not the request
pin = true
minimum_release_age = "0s"
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]
# Keep each task's last output for `mise tasks log` (and `mise run test:times`).
task.logs = true

[tasks.test]
description = "Run every language root's tests"
depends = ["//python:test", "//cbm:test", "//home:test", "//lsp:test", "//visualplan:test", "//jbctl:test", "//guards:test", "//cpp:test", "//swift:test"]
run = "echo all tests passed"

[tasks."test:times"]
description = "Each test task's runs, median and last time, and its last run's 25 slowest tests, one JSON line per task"
run = "repotools test-times"

# Private values that must never reach a tracked file or a pushed commit. Rendered on each machine from its own
# environment, so the repo never holds them; privacy:scan reads them through its env.
[vars]
private_home = "{{ env.HOME }}"
private_user = "{{ env.USER }}"
# What shell:apply backs up and shell:rollback restores, relative to $HOME.
# The old .zprofile, .zshrc and .zshrc.d stay listed: a rollback puts the pre-ZDOTDIR layout back.
shell_backup_paths = ".zshenv .zprofile .zshrc .zprofile.d .zshrc.d .config/zsh"

[tasks."privacy:scan"]
description = "Refuse this machine's home path in tracked files, given files, or outgoing commits"
env = { PRIVATE_PATTERNS = "{{ vars.private_home }}\n/Users/{{ vars.private_user }}/\n/home/{{ vars.private_user }}/" }
usage = '''
flag "--outgoing" help="Scan every commit not yet on a remote, branches and tags (pre-push)"
arg "[file]" var=#true help="Files to scan; default every tracked file"
'''
# --option=value: a value that starts with - would otherwise be read by argparse as an option.
run = 'repotools privacy-scan --patterns="$PRIVATE_PATTERNS" --files="${usage_file:-}" ${usage_outgoing:+--outgoing}'

[tasks."shell:apply"]
description = "Back up the live zsh files, check a shell from the new ones, then link them into $HOME"
env = { SHELL_BACKUP_PATHS = "{{ vars.shell_backup_paths }}" }
run = "repotools shell-apply"

[tasks."shell:rollback"]
description = "Restore the zsh files from the pre-apply backup"
env = { SHELL_BACKUP_PATHS = "{{ vars.shell_backup_paths }}" }
run = "repotools shell-rollback"

# No usage spec, so mise appends the arguments to the line, each quoted; raw keeps both streams unprefixed, and
# raw_args hands a --help to the command, not to mise (v2026.11.2 src/cli/run.rs:911-915).
[tasks."scratch:env"]
description = "Run one command from this checkout with every home path inside a scratch folder"
raw = true
raw_args = true
run = "repotools scratch-env"

# repotools and workflowtools live in cpp-standard (its spec #147: #156 switched the install, #157 removed the copy
# here). These tasks run the copies its //repo:tools-install installed from its main, by name; this checkout holds
# no source of either. Rerun tools-install after a merge there that changes them.
[tasks.tools-install]
description = "Install workflowtools and repotools from cpp-standard's main checkout (its //repo:tools-install)"
run = "mise -C ~/dev/github/ray-manaloto/cpp-standard run //repo:tools-install"

# repotools reads the body file and pipes its bytes to gh pr create, against origin's default branch.
[tasks.pr-create]
description = "Open a pull request against main from its title and body file"
usage = '''
arg "<title>" help="The pull request title"
arg "<body>" help="The file holding the body"
'''
run = 'repotools pr-create --title "$usage_title" --body-file "$usage_body"'

# A lead's self-merge (owner ruling, 2026-11-15): every gate checked, then the one merge form, from the PR's checkout.
[tasks.pr-merge]
description = "Merge a pull request whose head is this clean HEAD, once its text matches and hk check --pr passes; --check-only merges nothing"
usage = '''
arg "<number>" help="The pull request number"
arg "<title>" help="The pull request title"
arg "<body>" help="The file holding the pull request body"
flag "--check-only" help="Run every gate and report each one; merge nothing"
'''
run = 'repotools pr-merge --number "$usage_number" --title "$usage_title" --body-file "$usage_body" ${usage_check_only:+--check-only}'

[tasks.zero-bash]
description = "Report shell scripts, shell shebangs and multi-line mise run in the given or tracked files; --strict fails on any"
usage = '''
flag "--strict" help="Exit 1 when anything is left"
arg "[file]" var=#true help="Files to check, as hk passes them; default every tracked file"
'''
# --files=value: a name that starts with - would otherwise be read as an option.
run = 'repotools zero-bash --files="${usage_file:-}" ${usage_strict:+--strict}'

# hk's fnox-refs step: `fnox set` on a doppler provider writes the value into the TOML in plain text.
[tasks.fnox-refs]
description = "Fail when a tracked fnox TOML's Doppler entry holds anything but a Doppler secret name"
run = "repotools fnox-refs"

[tasks.frontmatter]
description = "Check SKILL.md and okf concept frontmatter, and that every YAML file parses, as the index has them"
run = "workflowtools frontmatter"

# The main guard (AGENTS.md): git runs it from the shared .git/config on every ref update, so the hook names the
# installed repotools by its path in uv's tool bin folder. tools-install refreshes that copy; nothing here copies it.
[tasks.main-guard-install]
description = "Register the installed repotools as this repository's reference-transaction hook (the main guard)"
run = '"$(uv tool dir --bin)/repotools" main-guard-install --bin "$(uv tool dir --bin)/repotools"'

[tasks.main-guard-remove]
description = "Remove the main guard's hook entry from this repository's config"
run = "repotools main-guard-remove"

[tasks.pre-commit]
run = "hk run pre-commit"

# Names that must not be public (machine names, addresses) live in Doppler, never in this repo
# (docs/research/private-names.md). The global fnox file reads each one with env = "exec", so
# `fnox exec -- mise dot apply ...` puts it in the environment for the templates that call secret().
[bootstrap.secrets]
pc_host = "PC_HOST"
pc_lan_host = "PC_LAN_HOST"
cloudflare_account_id = "CF_ACCOUNT_ID"

# The ~/.gemini/config/skills entry's source is ~/.agents/skills, outside the repo, and one missing source stops
# the whole apply (mise 2026.11.6 crates/mise-system/src/files.rs:5722-5806). This hook runs before every
# `mise dot apply` and bootstrap's dotfiles step (src/cli/dotfiles/apply.rs:27), so a new Mac has the folder.
[bootstrap.hooks.pre-dotfiles]
run = "mkdir -p ~/.agents/skills"

[dotfiles]
"~/.config/mise/config.toml" = { source = "unix/home/.config/mise/config.toml", mode = "symlink" }
"~/.config/mise/miserc.toml" = { source = "unix/home/.config/mise/miserc.toml", mode = "symlink" }
"~/.config/mise/locks" = { source = "unix/home/.config/mise/locks", mode = "symlink" }
"~/.config/mise/apple-bin" = { source = "unix/home/.config/mise/apple-bin", mode = "symlink" }
"~/.config/mise/mise.lock" = { source = "unix/home/.config/mise/mise.lock", mode = "symlink" }
"~/.config/mise/tasks" = { source = "unix/home/.config/mise/tasks", mode = "symlink" }
"~/.config/fnox/config.toml" = { source = "unix/home/.config/fnox/config.toml", mode = "symlink" }
"~/.config/starship.toml" = { source = "unix/home/.config/starship.toml", mode = "symlink" }
# The OpenCode service binds loopback only (tailnet-only ruling, 2026-11-11): service.json also holds the
# service password, so this owns only its hostname key and leaves the rest to opencode. Unset, opencode 2.2.7
# binds 127.0.0.1 (packages/cli/src/server-process.ts:72); a 0.0.0.0 left by `opencode service set hostname`
# opened it to the LAN. No routine task applies this entry (shell:apply names its own targets): on each Mac run
# mise dot apply "~/.config/opencode/service.json/bind" from the main checkout, then
# `opencode service set hostname 127.0.0.1`, which stops the running service (service-config.ts:273-276) so its
# supervisor starts it again on loopback. The target assumes neither OPENCODE_CONFIG_DIR nor XDG_CONFIG_HOME
# moves opencode's config folder.
"~/.config/opencode/service.json/bind" = { source = "unix/home/.config/opencode/service.bind.json", merge = true, permissions = "0600" }
# OpenCode's context7 and exa servers send the key as a Bearer header from its own {env:VAR} syntax
# (packages/core/src/config/variable.ts:25-28 at v2.2.7), so `fnox proxy run` can swap the placeholder for the real
# key. This owns only those headers; the old literal "${CONTEXT7_API_KEY}" header is not removed by a merge.
"~/.config/opencode/opencode.json/mcp-keys" = { source = "unix/home/.config/opencode/mcp-keys.json", merge = true }
# OpenCode 2.3.1 writes the compaction summary in the background by default (v2.3.1
# packages/schema/src/config/compaction.ts:18-20), which spends tokens on a summary a session may never reach; the
# owner accepted 2.3.1 and asked for the config fixed (2026-11-18). This owns only compaction.background.
"~/.config/opencode/opencode.json/compaction" = { source = "unix/home/.config/opencode/compaction.json", merge = true }
# Claude's apify MCP server gets its key from `fnox get` at each connect (headersHelper,
# https://code.claude.com/docs/en/mcp; 10 s limit), with an explicit PATH as 1natsu172/dotfiles
# bin/claude-utils/mcp-auth-header.sh:22,35 and fapont/dotfiles modules/agents/claude/mcp.json:6 do. A missing key
# (if_missing = "warn" makes `fnox get` print nothing and exit 0) or a failed get exits non-zero instead of sending an
# empty header. Claude Code rewrites ~/.claude.json while it runs, so write this entry with Claude's own CLI
# (`claude mcp add-json apify '<this JSON>' -s user`) rather than a whole-root apply.
"~/.claude.json/mcp-apify" = { source = "unix/home/.claude.mcp-apify.json", merge = true, permissions = "0600" }
# jdx MCP servers (owner, 2026-11-13) for Claude and Codex: mise (tools, tasks, env, config; run_task needs a
# trusted project), hk (plan, checks, safe fixes), pitchfork --local (this project's daemons only), and usage
# serving mise's own CLI spec (list_commands, describe_command) from ~/.cache/mise/usage-mise.kdl, written at each start
# (stdin is the MCP transport, and Linux caps one argument at 128 KiB, so not inline).
# No fnox server: its exec tool would bypass the guard on `fnox exec`; agents use `fnox proxy run` for keys.
# Each launches through ~/.local/bin/mise, as risu729/dotfiles unix/claude/mcp.json and unix/codex/mcp.toml do.
# Claude's entry is written as apify's is (`claude mcp add-json <name> '<its JSON>' -s user`).
"~/.claude.json/mcp-jdx" = { source = "unix/home/.claude.mcp-jdx.json", merge = true, permissions = "0600" }
"~/.codex/config.toml/mcp-jdx" = { source = "unix/home/.codex/mcp-jdx.toml", merge = true, permissions = "0600" }
# The apify plugin stays enabled for its skills and agent, but its own MCP server (plugin:apify:apify, OAuth) is
# denied: the user-scope `apify` server above is the one with the key. deniedMcpServers merges from every settings
# source, so a user can deny servers for themselves (Claude Code 2.1.322 settings schema, allowManagedMcpServersOnly).
"~/.claude/settings.json/mcp-deny" = { source = "unix/home/.claude/settings.mcp-deny.json", merge = true }
# Keep the Artifact tools (owner, 2026-11-17). jouet 0.0.5's `jouet setup claude` denies Artifact, ArtifactComments
# and ArtifactData unless permissions.allow or permissions.ask already names them (jouet v0.0.5 docs/setup.md "the
# Artifact tools are denied", src/setup.rs:60). mise's merge replaces a whole array (mise v2026.11.9
# docs/dotfiles/edits.md:121-122), so this entry owns the whole allow list: an "always allow" added later shows up
# as drift in skills:doctor, to be copied here or dropped. A permission entry: the owner applies it.
"~/.claude/settings.json/allow" = { source = "unix/home/.claude/settings.allow.json", merge = true }
# No grayed-out prompt suggestions in the input box: a suggestion looks like a typed draft, so an agent sending to a
# tab can't tell it from the owner's text (owner ruling 2026-11-11). Claude Code 2.1.322 reads promptSuggestionEnabled
# from settings unless CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION is set (https://code.claude.com/docs/en/settings-reference).
"~/.claude/settings.json/prompt-suggestions" = { source = "unix/home/.claude/settings.prompt-suggestions.json", merge = true }
# Leads merge their own PRs once local hk checks pass (owner rulings 2026-11-15 and 2026-11-17: no review is
# required). The auto-mode soft-deny "Merge Without Review" wants a human approval, so the classifier blocked those
# merges. Auto mode reads prose
# exceptions from autoMode.allow in user settings only (https://code.claude.com/docs/en/auto-mode-config.md);
# "$defaults" keeps the shipped list. Undo: remove this entry, then `claude auto-mode reset`.
"~/.claude/settings.json/automode" = { source = "unix/home/.claude/settings.automode.json", merge = true }
# ssh: the PC over the tailnet. The line goes first in ~/.ssh/config, so the folder's hosts win over older
# entries below it; the rest of ~/.ssh/config stays the owner's. tailnet.conf is a template: the PC's private
# name and its break-glass LAN address (`ssh pc-lan`) come from Doppler (PC_HOST and PC_LAN_HOST, see
# [bootstrap.secrets]), so apply it with the real values in the
# environment: fnox exec -- mise dot apply "~/.ssh/config/include" "~/.ssh/config.d/tailnet.conf".
# Check: ssh -G pc | grep -i "^hostname" prints the PC's name.
"~/.ssh/config/include" = { line = "Include ~/.ssh/config.d/*", position = "prepend" }
"~/.ssh/config.d/tailnet.conf" = { source = "unix/home/.ssh/config.d/tailnet.conf.tera", mode = "template" }
# OpenCode's Workers AI base URL has the account ID in its path, which the fnox proxy can't add, so the ID is a
# plain mise env var (unix/home/.config/fnox/config.toml, CF_ACCOUNT_ID). Apply with the real value in the
# environment: fnox exec -- mise dot apply "~/.config/mise/conf.d/cloudflare.toml".
"~/.config/mise/conf.d/cloudflare.toml" = { source = "unix/home/.config/mise/conf.d/cloudflare.toml.tera", mode = "template", permissions = "0600" }
# The dependency-map registry (#510): which deps `//depmaps:sync` maps, never their versions.
"~/.config/dep-maps/deps.json" = { source = "unix/home/.config/dep-maps/deps.json", mode = "symlink" }
# jouet loads user rules from ~/.config/jouet/rules; Claude Code is native-install only (claude:doctor checks it).
"~/.config/jouet/rules/npm-claude-code.toml" = { source = "unix/home/.config/jouet/rules/npm-claude-code.toml", mode = "symlink" }
# zsh reads everything but ~/.zshenv from $ZDOTDIR=~/.config/zsh (set in ~/.zshenv), so ~/.zprofile and ~/.zshrc are
# unused: an installer that appends to them edits nothing tracked. Separate entries, so ~/.config/zsh/.zshrc.d stays
# a real folder. Applied by shell:apply, which backs up first.
"~/.config/zsh/.zshrc.d/60-agent-tools.zsh" = { source = "unix/home/.config/zsh/.zshrc.d/60-agent-tools.zsh", mode = "symlink" }
"~/.zshenv" = { source = "unix/home/.zshenv", mode = "symlink" }
# The same file again: ZDOTDIR is exported, so a zsh started inside another one reads $ZDOTDIR/.zshenv, not ~/.zshenv.
"~/.config/zsh/.zshenv" = { source = "unix/home/.zshenv", mode = "symlink" }
"~/.config/zsh/.zprofile" = { source = "unix/home/.config/zsh/.zprofile", mode = "symlink" }
"~/.config/zsh/.zshrc" = { source = "unix/home/.config/zsh/.zshrc", mode = "symlink" }
"~/.config/zsh/.zshrc.d/10-zsh.zsh" = { source = "unix/home/.config/zsh/.zshrc.d/10-zsh.zsh", mode = "symlink" }
"~/.config/zsh/.zshrc.d/90-mise.zsh" = { source = "unix/home/.config/zsh/.zshrc.d/90-mise.zsh", mode = "symlink" }
"~/.config/zsh/path.zsh" = { source = "unix/home/.config/zsh/path.zsh", mode = "symlink" }
# git's XDG config, read before ~/.gitconfig: no global credential helper, gh for GitHub. ~/.gitconfig stays
# untracked for machine-local settings (other hosts' helpers, safe.directory) and mise's hook blocks.
"~/.config/git/config" = { source = "unix/home/.config/git/config", mode = "symlink" }
"~/.config/herdr-app/programs.json" = { source = "unix/home/.config/herdr-app/programs.json", mode = "symlink" }
"~/.local/bin/codex-hc" = { source = "unix/home/.local/bin/codex-hc", mode = "symlink" }
# hc calls that can't start a second core (docs/agents/herdr-core.md): the herdr cutover's coordinator and /verify.
"~/.local/bin/hc-safe" = { source = "unix/home/.local/bin/hc-safe", mode = "symlink" }
# Claude Code mods that CLAUDE_CODE_PLUGIN_DIRS in ~/.claude/settings.json loads. Tests: `claude plugin test <folder>`.
"~/.local/share/claude-mods/side-notes" = { source = "unix/home/.local/share/claude-mods/side-notes", mode = "symlink" }
"~/.local/share/claude-mods/you-should-know-forward" = { source = "unix/home/.local/share/claude-mods/you-should-know-forward", mode = "symlink" }
# The Codex profile for isolated, read-only adversarial reviews (codex exec --profile adversarial-review).
"~/.codex/adversarial-review.config.toml" = { source = "unix/home/.codex/adversarial-review.config.toml", mode = "symlink" }
# A skill written here: Codex reads ~/.agents/skills and Claude ~/.claude/skills, so both link to it.
"~/.agents/skills/macos-agent-permissions" = { source = "unix/home/.agents/skills/macos-agent-permissions", mode = "symlink" }
"~/.claude/skills/macos-agent-permissions" = { source = "unix/home/.agents/skills/macos-agent-permissions", mode = "symlink" }
"~/.agents/skills/visual-plan" = { source = "unix/home/.agents/skills/visual-plan", mode = "symlink" }
"~/.claude/skills/visual-plan" = { source = "unix/home/.agents/skills/visual-plan", mode = "symlink" }
# TokenEconomizer's global policy, copied (TE rewrites the file, which would break a symlink). Change it
# with `te --host claude config set --global ...`, then capture it from the main checkout with
# `mise dot add ~/.tokeneconomizer/config.json` before any `mise dot apply`: an apply overwrites an
# uncaptured live change without asking. Deliver only these two entries, dry run first:
# `mise dot apply --dry-run ~/.tokeneconomizer/config.json ~/.tokeneconomizer`, then the same
# without `--dry-run`. A bare apply also touches every other entry here, the zsh links included.
# The second entry only sets the folder's mode.
"~/.tokeneconomizer/config.json" = { source = "unix/home/.tokeneconomizer/config.json", mode = "copy", permissions = "0600" }
"~/.tokeneconomizer" = { permissions = "0700" }
# The shared agent rules (#449): one tracked file, linked where an agent reads a plain file, imported by
# Claude Code. codebase-memory-mcp's block in it is verbatim, so its installer rewrites nothing; ctx7 setup
# never runs against it (decision 40).
"~/.config/agents/AGENTS.md" = { source = "unix/home/.config/agents/AGENTS.md", mode = "symlink" }
"~/.codex/AGENTS.md" = { source = "unix/home/.config/agents/AGENTS.md", mode = "symlink" }
"~/.gemini/GEMINI.md" = { source = "unix/home/.config/agents/AGENTS.md", mode = "symlink" }
"~/.claude/CLAUDE.md/agents" = { block = '''
@~/.config/agents/AGENTS.md
''' }
# The paths the shared file and the skills point at (#449, #453). The workflow documents and the ticket-retro and
# session-retro skills moved to cpp-standard (its spec #147, ticket #156): their links resolve into its main
# checkout, by a home-relative source. ~/.config/agents/skills is a real folder of one link per entry, since only
# two of its skills moved; a switch from the old folder link removes that link before the apply, or the apply
# writes the new links through it into this checkout.
"~/.config/agents/workflow" = { source = "~/dev/github/ray-manaloto/cpp-standard/unix/home/.config/agents/workflow", mode = "symlink" }
"~/.config/agents/skills/LICENSE" = { source = "unix/home/.config/agents/skills/LICENSE", mode = "symlink" }
"~/.config/agents/skills/ticket-retro" = { source = "~/dev/github/ray-manaloto/cpp-standard/unix/home/.config/agents/skills/ticket-retro", mode = "symlink" }
"~/.config/agents/skills/session-retro" = { source = "~/dev/github/ray-manaloto/cpp-standard/unix/home/.config/agents/skills/session-retro", mode = "symlink" }
"~/.config/agents/skills/work" = { source = "unix/home/.config/agents/skills/work", mode = "symlink" }
"~/.config/agents/skills/to-spec" = { source = "unix/home/.config/agents/skills/to-spec", mode = "symlink" }
"~/.config/agents/skills/to-tickets" = { source = "unix/home/.config/agents/skills/to-tickets", mode = "symlink" }
"~/.config/agents/skills/implement" = { source = "unix/home/.config/agents/skills/implement", mode = "symlink" }
"~/.config/agents/skills/implement-spec" = { source = "unix/home/.config/agents/skills/implement-spec", mode = "symlink" }
"~/.config/agents/skills/chief-of-staff" = { source = "unix/home/.config/agents/skills/chief-of-staff", mode = "symlink" }
"~/.config/agents/skills/lsp-server" = { source = "unix/home/.config/agents/skills/lsp-server", mode = "symlink" }
"~/.config/agents/skills/secrets" = { source = "unix/home/.config/agents/skills/secrets", mode = "symlink" }
"~/.config/agents/skills/herdr-startup" = { source = "unix/home/.config/agents/skills/herdr-startup", mode = "symlink" }
"~/.config/agents/skills/herdr-shutdown" = { source = "unix/home/.config/agents/skills/herdr-shutdown", mode = "symlink" }
# ticket-retro (#453): the user-scope skill, one folder for both agents; the LICENSE sits beside it in the source.
"~/.claude/skills/ticket-retro" = { source = "~/dev/github/ray-manaloto/cpp-standard/unix/home/.config/agents/skills/ticket-retro", mode = "symlink" }
"~/.agents/skills/ticket-retro" = { source = "~/dev/github/ray-manaloto/cpp-standard/unix/home/.config/agents/skills/ticket-retro", mode = "symlink" }
# session-retro (owner, 2026-11-18): mattpocock's retro, model-invocable, for a retro after any round of work; user
# scope only, like ticket-retro.
"~/.claude/skills/session-retro" = { source = "~/dev/github/ray-manaloto/cpp-standard/unix/home/.config/agents/skills/session-retro", mode = "symlink" }
"~/.agents/skills/session-retro" = { source = "~/dev/github/ray-manaloto/cpp-standard/unix/home/.config/agents/skills/session-retro", mode = "symlink" }
# work (#455): sets a repository up on first use; user scope only, like ticket-retro.
"~/.claude/skills/work" = { source = "unix/home/.config/agents/skills/work", mode = "symlink" }
"~/.agents/skills/work" = { source = "unix/home/.config/agents/skills/work", mode = "symlink" }
# to-spec and to-tickets (#451): the publishing skills; user scope only, like ticket-retro.
"~/.claude/skills/to-spec" = { source = "unix/home/.config/agents/skills/to-spec", mode = "symlink" }
"~/.agents/skills/to-spec" = { source = "unix/home/.config/agents/skills/to-spec", mode = "symlink" }
