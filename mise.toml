# Project tools — for linting, validating, and developing this repo
# These are Build Type 1 tools: run locally before commits

[deps.uv]
auto = true
dir = "python"
run = "uv sync --locked"

[tools]
# The tools shared with the devcontainer image live in
# .config/mise/conf.d/shared.toml — the single exact-pinned source both this
# host config and .devcontainer/mise-system.toml merge, so they never drift
# (Renovate bumps that one file). See epic #160 T5. Below: host-ONLY tools.
editorconfig-checker = "3.11.2" # provides `ec` — hk editorconfig_checker builtin (#154); host-only (image drops it in T6)
# Second secret scanner (hk `betterleaks` builtin, wired in hk.pkl). HOST-ONLY
# on purpose: shared.toml is a base image build input, and putting a second
# scanner in the image would cost a cold rebuild for no gain — the scanning that
# matters happens at the commit boundary. Measured before adopting: 0 findings
# over the whole 31.5 MB tree in 199 ms.
"aqua:betterleaks/betterleaks" = "1.8.1"
"npm:@devcontainers/cli" = "0.89.0"
# Critical host-side secrets transport for devcontainer initialization. Keep it
# deep-tracked in currency.toml: Doppler's mounted-secret behavior is part of
# the devcontainer security boundary, not an optional interactive convenience.
doppler = "3.76.5"
colima = "0.10.3"                  # Alternate Docker runtime (VZ + Rosetta); Docker Desktop is the CURRENT supported runtime — see AGENTS.md Docker Runtimes + docs/research/runs/research-20260409c-dockerdesktop-ssh/
lima = "2.2.0"
"github:agent-sh/agnix" = "0.52.1"
"npm:agents-lint" = "0.5.0"
"pipx:mcp2cli" = "3.7.0"
"npm:renovate" = "44.59.1"
biome = "2.5.11"
# Markdown + Claude-docs linters. Installed now; hk.pkl integration is
# scheduled for post-devcontainer-work review (see GH issue tracking
# follow-up). md_size_budget (below in hk.pkl) provides the immediate,
# class-aware enforcement — see .claude/rules/md-size-budgets.md.
"npm:claude-code-lint" = "0.8.0"
"npm:@contextlint/cli" = "1.1.1"
"npm:markdownlint-cli2" = "0.23.2"
"aqua:jackchuka/mdschema" = "0.15.2"
rumdl = "v0.2.63"
# zizmor: GHA security scanner — backs the hk zizmor builtin (#160 T12);
# host-only lint tool, so it lives here (not shared.toml).
zizmor = "1.30.0"
"npm:oh-my-claude-sisyphus" = "5.1.0"
"github:ast-grep/ast-grep" = "0.45.3"
lefthook = "2.1.12"
"npm:ctx7" = "0.5.9"
"aqua:rtk-ai/rtk" = "0.47.0"          # aqua is the registry's first backend (`mise registry rtk`); the old bare `rtk` resolved to github: and mise doctor flagged the mismatch
"npm:skills" = "1.5.23"
"npm:agent-browser" = "0.36.0"
"npm:portless" = "0.15.6"
"pipx:deepagents-cli" = "0.3.0"
# ffmpeg: system binary the graphify `video` extra (faster-whisper) needs to
# extract audio before transcription — it is NOT a pip dep, so `graphifyy[all]`
# cannot supply it. Host-only, same as graphify (root mise.toml is in the
# container's MISE_IGNORED_CONFIG_PATHS). conda backend (pixi) — the first
# conda tool in the host config; prebuilt, no source build. Enables
# `graphify add <youtube-url>` native download+transcribe.
# `os = ["macos"]`: graphify runs ONLY on the macOS host (project-scoped,
# host-only), so ffmpeg is never needed on Linux. The gate is load-bearing for
# CI, not cosmetic — CI's lint job runs `mise install --locked` at the repo
# root on a linux-x64 runner, and mise's conda/rattler backend cannot write a
# linux lockfile URL (it reports "✓ updated" but silently drops the entry —
# jdx/mise#7700). Without the gate, --locked fails "No lockfile URL found for
# conda:ffmpeg on platform linux-x64" and bricks lint. os-gating makes linux
# skip the tool entirely, so no linux URL is demanded.
"conda:ffmpeg" = { version = "9.0.1", os = ["macos"] }
aws-cli = { version = "2.36.38", symlink_bins = "true" }
azure-cli = { version = "2.90.0", uvx_args = "--prerelease=allow" }
docker-cli = "29.7.2"
opencode = "1.18.26"
# bun (the npm package_manager) is a host↔image SHARED tool → declared in
# .config/mise/conf.d/shared.toml, not here (mise-parity: a tool used by both
# sides lives only in the shared fragment).
# claude-flow + ralph-cli removed 2026-07-23: superseded by the cross-vendor
# orchestrator adoption (#346, fable-orchestrator + antigravity), and unused by
# CI/hk/scripts. Re-add if needed for interactive use.
# Cross-vendor executor-lane CLIs for the adopted Fable-5 orchestrator plugins
# (mar3co/fable-orchestrator in `codex` mode + yuting0624/antigravity-for-claude-code).
# Canonical mise registry short names (https://mise.jdx.dev/registry.html):
# `antigravity-cli`=aqua:google-antigravity/antigravity-cli (Google's current
# agentic CLI — Gemini 3.x; ships `antigravity` + the `agy` symlink the
# antigravity plugin drives). Host-only (root mise.toml is in the container's
# MISE_IGNORED_CONFIG_PATHS) — the Claude architect stays the chair; these are
# executor lanes only. Auth is per-user (codex login / Google account).
#
# `codex` (the orchestrator's executor lane here, and separately the #613
# in-container review lane's `npm:@openai/codex` in mise-runtime.toml) moved
# OFF the `aqua:openai/codex` registry short name — aqua's release only ships
# the Rust CLI binary, with no `codex agents` daemon/app-server support (that
# shipped in the npm package first) — to a single shared npm declaration in
# `.config/mise/conf.d/shared.toml` (mise-parity: the two per-tier npm
# declarations pinned the SAME tool under the same key, which the parity
# test correctly flags as drift risk).
antigravity-cli = "1.1.24"

[settings]
experimental = true
auto_install = true
lockfile = true
# npm.package_manager = "bun": mise 2026.7.12 made the embedded `aube` manager
# the npm default, whose supply-chain guards (low-download threshold + stricter
# dependency resolution) reject several of this repo's pinned npm tools
# (contextlint 978/wk, agents-lint 714/wk; renovate dep-resolution). Keep the
# same `bun` manager the image bakes (mise-system.toml) so host/CI/image agree.
# `bun` is declared in [tools] below so CI installs it, and the setup-mise
# action installs it BEFORE the npm tools that need it (bare runners have no
# bun). Opt back into aube once its allow mechanism is a documented mise setting.
npm.package_manager = "bun"
# #160 T12.5 (decision 15): new tool requests get exact-pinned versions on
# `mise use` instead of fuzzy ranges — pins are the repo's whole versioning
# model. (task.timings from the decision does not exist as a setting in mise
# 2026.7.0 — verified via `mise settings ls --all`; env_cache is already the
# default true, so neither is set here.)
pin = true

[settings.status]
show_tools = true
missing_tools = "always"
show_env = true

[hooks]
# Reshim after every tool install so `mise doctor` does not report stale
# shims from the pipx backend (observed in CI for pipx:mcp2cli — local was
# clean, CI failed with "unused shims: mcp2cli" on fresh install).
postinstall = "mise reshim && hk install --mise"

[env]
# THE platform default (#673). Everything that targets an architecture — the
# container tasks below, devcontainer.json's build/run `--platform`, every
# Python entry point via `platform_target.resolve_platform()`, and
# scripts/benchmark-docker.sh — resolves from THIS variable, so retargeting is
# one edit instead of the twelve-plus literals it used to be (miss two and you
# get a container running one architecture while a probe asserts another — a
# false pass, not a crash).
#
# The value is a full platform TRIPLE, not an arch word: `v2` is a
# microarchitecture level, and arm64's analogue is `linux/arm64/v8`.
#
# It is pinned here rather than left to the host because :dev is amd64-only
# today; `resolve_platform()` falls back to the HOST's native triple when this
# is unset, so deleting the pin is what flips the default to native once #676
# publishes both architectures and #678 brings up a native arm64 container.
# Templated so a per-clone gitignored mise.local.toml `[env]` (or a shell
# export) overrides it — the same pattern as BASE_IMAGE below.
#
# `docker-bake.hcl` repeats this literal because CI's docker/bake-action jobs
# do not run under mise and HCL cannot read a TOML file; the two are held equal
# by `mise run lint`'s `no_platform_literals` step, which also forbids the
# literal anywhere else.
DOTFILES_PLATFORM = "{{ env.DOTFILES_PLATFORM | default(value='linux/amd64/v2') }}"

# HK_PKL_BACKEND dropped (#160 T12): hk 1.49's default pklr backend evaluates
# the import/spread config identically to the pkl CLI (probe: --plan -J output
# byte-identical minus timestamp). The pkl binary stays pinned in shared.toml
# for the hk `pkl` builtin step (evals *.pkl files), not for hk itself.
HK_MISE = "1"

# #154: the hk `gitleaks` builtin runs `gitleaks dir` (whole-tree scan, no
# --config flag), so point gitleaks at the repo allowlist config via env — it
# scopes the scan to first-party source (see .gitleaks.toml). config_root
# resolves to the repo root both locally and in CI.
GITLEAKS_CONFIG = "{{config_root}}/.gitleaks.toml"

# Console stays at the default (warn) — interactive use isn't spammed —
# but the on-disk log captures debug-level detail so a stuck/slow run
# can be diagnosed via `tail -f` after the fact. When a hk run hangs,
# `tail -f ~/.local/state/hk/hk.log` is the live ground truth.
# Refs: https://hk.jdx.dev/logging.html#log-file-output
HK_LOG_FILE_LEVEL = "debug"

# Same pattern for mise: keep console quiet, write a debug-level log to
# a stable path so `tail -f ~/.local/state/mise/mise.log` is the
# always-on debugging surface for slow installs / failed resolutions /
# HTTP errors. Set MISE_LOG_HTTP=1 ad hoc if needed.
# Refs: https://mise.jdx.dev/configuration.html#mise-log-file-mise-log
MISE_LOG_FILE = "~/.local/state/mise/mise.log"
MISE_LOG_FILE_LEVEL = "debug"

# Directory-scoped shell aliases — auto-activated when cwd is inside this
# repo, deactivated on leave. Interactive-shell only (not usable inside
# task `run` blocks per mise docs). Kept short for inner-loop muscle
# memory; the canonical UX is still `mise run <task>`.
[shell_alias]
dcu = "mise run up"
dcd = "mise run down"
dcdev = "mise run dev"
dcrb = "mise run dev-rebuild"
dcsh = "mise run sh"
dcps = "mise run ps"
dcsmoke = "mise run smoke"
dcverify = "mise run verify-image"

[tasks."deps:python"]
description = "Sync python venv when pyproject.toml or uv.lock changes"
dir = "python"
sources = ["pyproject.toml", "uv.lock"]
outputs = [".venv/"]
run = "uv sync"

[tasks.pre-commit]
description = "Run all hk pre-commit checks (≡ `hk run pre-commit --all`)"
run = "hk run pre-commit --all"

[tasks.lint]
# #160 T12.5: native outer backstop ABOVE the wrapper's 600s — probe showed
# mise's task timeout kills the child and fails loud, but it lacks lint.py's
# hk-log-tail diagnostics, so the wrapper STAYS (decision 15's retire
# condition was full equivalence; it is not equivalent). This bound only
# fires if the Python wrapper itself wedges.
timeout = "700s"
# Preferred manual/agent entrypoint for the lint gate. Wraps hk in a hard
# timeout (hk has none of its own) so a hung step self-aborts with the
# tail of the debug log instead of wedging for hours (see the 7h hang in
# .claude/rules/long-running-command-hangs.md). Default 600s; override
# with `--timeout <secs>` or `DOTFILES_LINT_TIMEOUT=<secs> mise run lint`.
description = "Run hk check --all (read-only, ≡ CI) under a hard timeout (default 600s) so a hung lint self-aborts; fix path is `mise run fmt`"
run = "uv run --project python dotfiles-setup lint"

[tasks.check]
description = "Run full quality check (pre-commit + test)"
depends = ["pre-commit", "test"]

[tasks.test]
description = "Run Python test suite"
run = "uv run --project python pytest tests/ -x -q"

[tasks.test-hook-isolated]
description = "Run the Python suite without credentials or hook-exported Git-local variables"
run = "uv run --project python dotfiles-setup process git-isolated -- uv run --project python pytest tests/ -x -q"

[tasks.smoke-exec]
description = "Run the containerized real-toolchain exec tests against the local :dev image (needs Docker + `mise run sync`; tier-3 compiles under Rosetta — minutes)"
# `-m image_exec` re-selects the tests the root pytest.ini deselects by default
# (last -m wins), so these run ONLY here, never in `mise run test` / CI.
run = "uv run --project python pytest -m image_exec tests/test_image_smoke_exec.py -v"

[tasks.up]
description = "Bring the devcontainer up via the official @devcontainers/cli (Mac-local)"
# BASE_IMAGE default is task-scoped (not global [env]) so it does not leak
# into unrelated subprocesses. Override with e.g.
#   BASE_IMAGE=ghcr.io/ray-manaloto/dotfiles-devcontainer:latest mise run up
# or pin to a specific SHA tag.
#
# DOCKER_DEFAULT_PLATFORM is task-scoped so it only affects `devcontainer up`
# (and its child docker calls) — host-level docker/colima invocations are
# unaffected. Its VALUE now comes from the global `[env] DOTFILES_PLATFORM`
# (#673), which is the one place the platform is chosen; the scoping is what
# stays task-local, because DOTFILES_PLATFORM is inert to docker while
# DOCKER_DEFAULT_PLATFORM is not.
#
# DEVCONTAINER_SSH_PORT is the HOST-side port for the inbound shell
# (Requirement R1: `ssh ${USER}@localhost -p 4444` opens a shell in the
# container). Container-internal sshd listens on 2222 (feature hardcoded);
# devcontainer.json maps ${DEVCONTAINER_SSH_PORT}:2222 via appPort.
# Override per-clone via mise.local.toml on port collision without losing
# named volumes — volume names do NOT include the port (C10/C11/C12).
#
# Outbound agent forwarding (Requirement R2: `ssh -T git@github.com` from
# inside container) is independent; uses the host-TCP + container-unix-
# socket proxy pattern spawned from initializeCommand/postStartCommand.
# Research: docs/research/runs/research-20260407-ssh-devcontainer/report.md.
#
# Image pull: handled inside `devcontainer up` via buildx (the
# Dockerfile.host-user `FROM ${BASE_IMAGE}` triggers a registry pull
# when the base layer is missing). DO NOT add a standalone `docker
# pull` here — it bypasses the devcontainer-cli lifecycle (no
# initializeCommand etc.) and recreates the silent-failure surface
# from PR #86. To force-refresh, use `mise run dev-rebuild`.
#
# BASE_IMAGE + DEVCONTAINER_SSH_PORT are templated `{{ env.VAR |
# default(value='...') }}` so a per-clone gitignored mise.local.toml
# `[env]` (or a shell env var) overrides them WITHOUT redefining the
# task. A bare `[tasks.up]` in mise.local.toml REPLACES the whole task and
# strips this `run` body (see mise.local.toml.example and
# feedback_mise_local_toml_replaces_task) — templating is how the
# documented override actually works. The Tera `env.VAR` variable (NOT the
# documented `get_env()` function) is required: `get_env()` reads only the
# ambient process env and is blind to mise's own merged `[env]` layer, so
# it would silently ignore a mise.local.toml `[env]` override. The default
# keeps these TASK-scoped (no global leak of BASE_IMAGE, nor of the
# docker-honoured DOCKER_DEFAULT_PLATFORM, into unrelated subprocesses)
# unless the user opts in.
env = { BASE_IMAGE = "{{ env.BASE_IMAGE | default(value='ghcr.io/ray-manaloto/dotfiles-devcontainer:dev') }}", DOCKER_DEFAULT_PLATFORM = "{{ env.DOTFILES_PLATFORM }}", DEVCONTAINER_SSH_PORT = "{{ env.DEVCONTAINER_SSH_PORT | default(value='') }}", DOPPLER_PROJECT = "dotfiles", DOPPLER_CONFIG = "{{ env.DOPPLER_CONFIG | default(value='dev_personal') }}" }
run = '''
set -euo pipefail
# v7 (#677): every devcontainer resource name — container, home volume and
# SSH port — is resolved by dotfiles_setup.devcontainer_names and exported
# for devcontainer.json's ${localEnv:...} substitution. All three carry the
# ARCHITECTURE, so amd64 and arm64 can be up in this directory at once
# without silently sharing a home volume full of compiled output.
# Nothing is composed here: [[zero-bash-logic]], and the arch word must come
# from platform_target, never from a literal (`no_platform_literals`).
#
# Assigned BEFORE eval, deliberately. `eval "$(cmd)"` discards cmd's exit
# status — under `set -euo pipefail`, eval of the empty string returns 0 — so a
# resolver that failed loud (a typo'd DEVCONTAINER_SSH_PORT raises) would print
# nothing, `up` would proceed, and devcontainer.json would substitute EMPTY
# strings for the name and the home-volume source. A command substitution in an
# assignment does propagate the failure.
_dc_env="$(uv run --project python dotfiles-setup devcontainer env)"
eval "${_dc_env}"
# Clear stale host keys for the devcontainer SSH port — each container
# recreate generates new host keys, causing "REMOTE HOST IDENTIFICATION
# HAS CHANGED" warnings. ssh-keygen -R removes the old entry. The
# `|| true` is acceptable here: keygen exits 1 when the entry doesn't
# exist (first run on a fresh host), which is the normal case.
ssh-keygen -R "[localhost]:${DEVCONTAINER_SSH_PORT}" 2>/dev/null || true
# --id-label is what makes the arch scoping REAL (#677). @devcontainers/cli
# 0.88.0 looks an existing container up by id labels, and with none supplied it
# infers them from the WORKSPACE FOLDER alone (devContainersSpecCLI.js `bg`) —
# so without these an arm64 `up` in a directory that already has an amd64
# container finds and reuses it, and the arch-scoped --name never matters.
# Both labels are required: --id-label REPLACES the inferred set, so the arch
# label alone would let two clones collide.
fnox exec --non-interactive -- devcontainer up --workspace-folder . \
  --id-label "${DEVCONTAINER_WORKSPACE_LABEL}" \
  --id-label "${DEVCONTAINER_ARCH_LABEL}"
'''

[tasks.names]
description = "Print this workspace+architecture's devcontainer names (container, volume, port)"
# The one place to look when `ssh -p` fails or two containers appear: which
# resources does THIS directory own, for the CURRENTLY targeted architecture?
run = 'uv run --project python dotfiles-setup devcontainer env'

[tasks.ssh-port]
description = "Print the host-side SSH port for this workspace + architecture (R1)"
# Derived from the workspace path and the arch, so a second clone and a second
# architecture each get a distinct port with no configuration (#677). Pin one
# per-clone with DEVCONTAINER_SSH_PORT in mise.local.toml.
run = 'uv run --project python dotfiles-setup devcontainer name port'

[tasks.migrate-home-volume]
description = "One-shot: copy a pre-#677 home volume into this architecture's volume"
# Dry-run by default; pass `-- --apply` to execute. Runs under mise so the
# repo's DOTFILES_PLATFORM pin decides which architecture the copied home is
# recorded as — a bare CLI invocation refuses rather than taking it from the
# host, because the old volume name records no architecture at all.
run = 'uv run --project python dotfiles-setup devcontainer migrate-home'

[tasks.dev-rebuild]
description = "Force a full rebuild + re-pull of :dev (lifecycle hooks fire)"
# Equivalent to a force-refresh. `--remove-existing-container` ensures
# `devcontainer up` recreates the container (which re-fetches the base
# layer if the registry has a new digest), and `--build-no-cache` rebuilds
# the host-user overlay without cached layers. Lifecycle hooks
# (initializeCommand → onCreateCommand → postCreateCommand) all fire.
# BASE_IMAGE + DEVCONTAINER_SSH_PORT templated for per-clone override — see the up task.
env = { BASE_IMAGE = "{{ env.BASE_IMAGE | default(value='ghcr.io/ray-manaloto/dotfiles-devcontainer:dev') }}", DOCKER_DEFAULT_PLATFORM = "{{ env.DOTFILES_PLATFORM }}", DEVCONTAINER_SSH_PORT = "{{ env.DEVCONTAINER_SSH_PORT | default(value='') }}", DOPPLER_PROJECT = "dotfiles", DOPPLER_CONFIG = "{{ env.DOPPLER_CONFIG | default(value='dev_personal') }}" }
run = '''
set -euo pipefail
_dc_env="$(uv run --project python dotfiles-setup devcontainer env)"
eval "${_dc_env}"
ssh-keygen -R "[localhost]:${DEVCONTAINER_SSH_PORT}" 2>/dev/null || true
fnox exec --non-interactive -- devcontainer up --workspace-folder . \
  --id-label "${DEVCONTAINER_WORKSPACE_LABEL}" \
  --id-label "${DEVCONTAINER_ARCH_LABEL}" \
  --remove-existing-container --build-no-cache
'''

[tasks.verify]
description = "Run the structured verification contracts (suites.toml) — the third local gate"
# Canonical entrypoint. AGENTS.md previously told agents to run a bare
# `dotfiles-setup verify run`, which is NOT on PATH and returns rc=127 (hit
# 2026-07-20 while running the pre-commit gates). The console script only
# exists inside the uv-managed venv, so it must be invoked through `uv run
# --project python`. Wrapping it as a task is what `mise-tasks-only.md`
# requires of every recurring workflow, and it keeps the AGENTS.md quick-start
# shorter than the broken form it replaces.
run = 'uv run --project python dotfiles-setup verify run'

[tasks.verify-image]
description = "Spot-check cookbook paths in :dev (cargo/rustup cookbook layout + core toolchains)"
# Source of truth for what's INSIDE :dev is .devcontainer/mise-system.toml,
# NOT root mise.toml. Root mise.toml tools (hk, pkl, the 5 markdown
# linters, etc.) live on the HOST, not in the image. Keep assertions here
# scoped to what mise-system.toml actually provides.
env = { BASE_IMAGE = "{{ env.BASE_IMAGE | default(value='ghcr.io/ray-manaloto/dotfiles-devcontainer:dev') }}", DOCKER_DEFAULT_PLATFORM = "{{ env.DOTFILES_PLATFORM }}" }
run = '''
# Review finding [29]: --pull=never — an absent local tag must fail loud
# (use `mise run sync` to fetch via buildkit), never classic-pull ~38GB.
docker run --rm --pull=never "$BASE_IMAGE" bash -lc '
  set -euo pipefail
  # Cookbook cargo/rustup homes (PR-2 commit F)
  ls /usr/local/share/cargo/bin
  ls /usr/local/share/rustup/toolchains
  test ! -d /opt/cargo
  test ! -d /opt/rustup
  # Core toolchain reachability via mise activation
  cargo --version
  rustc --version
  clang --version
'
'''

[tasks.smoke]
description = "Run tier 1-3 smoke checks inside the running devcontainer"
# $DEVCONTAINER_ID_FLAGS is UNQUOTED on purpose: it carries two --id-label
# flag pairs, and both values are whitespace-free by construction (a hex digest
# and one of two arch words), pinned by test_id_labels_are_whitespace_free.
# Without them `exec` resolves the container by FOLDER and can smoke the OTHER
# architecture once both are up (#677).
run = '''
set -euo pipefail
_dc_env="$(uv run --project python dotfiles-setup devcontainer env)"
eval "${_dc_env}"
# shellcheck disable=SC2086 — deliberate word splitting, see above
devcontainer exec --workspace-folder . $DEVCONTAINER_ID_FLAGS scripts/devcontainer-smoke.sh
'''

[tasks.sh]
description = "Open an interactive shell in the running devcontainer"
alias = "shell"
run = '''
set -euo pipefail
_dc_env="$(uv run --project python dotfiles-setup devcontainer env)"
eval "${_dc_env}"
devcontainer exec --workspace-folder . $DEVCONTAINER_ID_FLAGS bash -l
'''

[tasks.ps]
description = "Show the running devcontainer + its named volumes"
run = '''
set -euo pipefail
_stem="$(uv run --project python dotfiles-setup devcontainer name legacy-volume)"
_stem="${_stem%-home}"
_ws_label="$(uv run --project python dotfiles-setup devcontainer name workspace-label)"
# EVERY architecture of this clone (#677): filtered on our workspace label, not
# on the CLI's per-folder one, because a container brought up with --id-label
# carries ours. A pre-#677 container has neither and shows up in the second
# listing below as an orphaned volume instead.
docker ps --filter "label=${_ws_label}" --format 'table {{"{{"}}.Names{{"}}"}}\t{{"{{"}}.Status{{"}}"}}\t{{"{{"}}.Ports{{"}}"}}'
# Scoped to this clone's hashed volumes: every arch's home plus any surviving
# pre-#677 one, which shares the stem and so shows up here too.
docker volume ls --format '{{"{{"}}.Name{{"}}"}}' | grep -E "^${_stem}" || true
'''

[tasks.dev]
description = "Full devloop: up → smoke (sequential)"
# NOTE: `depends = [...]` in mise runs tasks in parallel when independent
# — not what we want here. A sequential shell body forces ordering while
# keeping each sub-task independently runnable.
#
# Image pulling is delegated to devcontainer-cli (called by `mise run up`).
# Standalone `docker pull` was removed — it bypassed the lifecycle and
# masked silent failures (PR #86 review). Use `mise run dev-rebuild`
# for an explicit force-refresh.
run = '''
set -euo pipefail
mise run up
mise run smoke
'''

[tasks.persistence]
description = "Verify .devcontainer/mise-system.toml tools survive a devcontainer stop/up cycle"
# Source of truth for the expected tool set is .devcontainer/mise-system.toml
# (installed to /usr/local/share/mise/config.toml inside :dev). This task
# takes the runtime `mise ls --json --installed` view as ground truth,
# cross-checked against a minimum count parsed from mise-system.toml, and
# asserts every (tool, version) entry survives a stop/up cycle unchanged.
#
# Requires a running devcontainer on entry; the devloop
# `mise run dev` / `mise run verify-local` brings it up first.
run = '''
set -euo pipefail
# Resolve the id labels BEFORE the first `devcontainer exec` — every exec below
# needs them, and `set -u` turns a missing one into a hard failure rather than a
# silent resolve-by-folder (which is exactly how this task reached the OTHER
# architecture's container). It failed loud on the first real run; that is the
# design working.
_dc_env="$(uv run --project python dotfiles-setup devcontainer env)"
eval "${_dc_env}"
SNAPSHOT=/tmp/mise-persistence-before.json
AFTER=/tmp/mise-persistence-after.json
SYSTEM_TOML=.devcontainer/mise-system.toml

# (0) Derive the expected minimum tool count from mise-system.toml.
#     Python tomllib is the canonical parser; python 3.14 is pinned in
#     project mise.toml so this is always available during local runs.
EXPECTED_MIN=$(python3 -c "
import tomllib, sys
with open('$SYSTEM_TOML', 'rb') as f:
    cfg = tomllib.load(f)
print(len(cfg.get('tools', {})))
")
echo "==> mise-system.toml declares $EXPECTED_MIN tools"

# (1) Pre-teardown: snapshot resolved versions.
#     `mise doctor` is advisory only — inside the container it sees the
#     workspace /workspaces/dotfiles/mise.toml which legitimately lists
#     host-only tools (colima, lima, @devcontainers/cli, agnix, markdown
#     linters) that are NOT in mise-system.toml. Doctor reports them as
#     "(missing)" with a non-zero exit. The TRUE persistence invariant is
#     the snapshot diff (step 4) being empty; doctor is logged but never
#     fails the gate. Architectural cleanup (untrust the workspace config
#     in-container) is tracked as a follow-up — see issue #70 thread.
echo "==> mise doctor (pre-teardown, advisory)"
devcontainer exec --workspace-folder . $DEVCONTAINER_ID_FLAGS bash -lc 'mise doctor || true'

echo "==> capturing pre-teardown snapshot"
devcontainer exec --workspace-folder . $DEVCONTAINER_ID_FLAGS bash -lc 'mise ls --json --installed' > "$SNAPSHOT"
PRE_COUNT=$(jq 'length' "$SNAPSHOT")
echo "pre-teardown installed tool count: $PRE_COUNT"
if [ "$PRE_COUNT" -lt "$EXPECTED_MIN" ]; then
  echo "FAIL: fewer tools installed ($PRE_COUNT) than mise-system.toml declares ($EXPECTED_MIN)" >&2
  exit 1
fi

# (1a) v6 single-home-volume contract: write an in-volume canary file.
#      This file lives on the persistent home volume; if the volume is
#      correctly mounted across stop/up, it must survive. Contrast with
#      /tmp (ephemeral per container) — the canary proves the VOLUME is
#      the thing persisting, not just the container state.
echo "==> writing in-volume persistence canary"
CANARY_CONTENT="canary-$(date +%s)-$$"
devcontainer exec --workspace-folder . $DEVCONTAINER_ID_FLAGS bash -lc "printf '%s' '${CANARY_CONTENT}' > ~/.local/tmp/persistence-canary.txt"

# (2) Stop/up cycle — the actual persistence test.
echo "==> tearing container down"
mise run stop
echo "==> bringing container back up"
mise run up

# (3) Post-restart: snapshot. `mise doctor` advisory only (see step 1).
echo "==> mise doctor (post-restart, advisory)"
devcontainer exec --workspace-folder . $DEVCONTAINER_ID_FLAGS bash -lc 'mise doctor || true'

echo "==> capturing post-restart snapshot"
devcontainer exec --workspace-folder . $DEVCONTAINER_ID_FLAGS bash -lc 'mise ls --json --installed' > "$AFTER"
POST_COUNT=$(jq 'length' "$AFTER")
echo "post-restart installed tool count: $POST_COUNT"

# (4) Snapshot parity: every (tool, version) in $SNAPSHOT must be in $AFTER.
#     Host-side jq diff so we can fail with a clear drift message.
jq -r 'to_entries[] | .key as $k | .value[] | "\($k)\t\(.version)"' "$SNAPSHOT" | sort > /tmp/mise-persistence-pre.tsv
jq -r 'to_entries[] | .key as $k | .value[] | "\($k)\t\(.version)"' "$AFTER"    | sort > /tmp/mise-persistence-post.tsv
if ! diff -u /tmp/mise-persistence-pre.tsv /tmp/mise-persistence-post.tsv; then
  echo "FAIL: installed-tool set drifted across stop/up" >&2
  exit 1
fi

# (5) v6 home-volume contract: assert the single home volume preserved
#     the in-volume canary AND the seeded essentials (shell files, .ssh,
#     mise install dir). This closes the Codex v4 finding that the
#     previous persistence task only covered `mise ls` — the new home
#     volume needs broader restart-level assertions.
echo "==> asserting home-volume persistence (canary + seed survivors)"
devcontainer exec --workspace-folder . $DEVCONTAINER_ID_FLAGS bash -lc "
set -euo pipefail
[ -f ~/.local/tmp/persistence-canary.txt ] || { echo 'FAIL: TMPDIR canary lost across restart' >&2; exit 1; }
got_canary=\$(cat ~/.local/tmp/persistence-canary.txt)
if [ \"\${got_canary}\" != '${CANARY_CONTENT}' ]; then
  echo \"FAIL: TMPDIR canary content mismatch (expected '${CANARY_CONTENT}', got '\${got_canary}')\" >&2
  exit 1
fi
[ -f ~/.bashrc ]            || { echo 'FAIL: ~/.bashrc missing after restart' >&2; exit 1; }
[ -f ~/.zshrc ]             || { echo 'FAIL: ~/.zshrc missing after restart' >&2; exit 1; }
[ -f ~/.profile ]           || { echo 'FAIL: ~/.profile missing after restart' >&2; exit 1; }
[ -d ~/.ssh ]               || { echo 'FAIL: ~/.ssh missing after restart' >&2; exit 1; }
[ -d ~/.local/share/mise ]  || { echo 'FAIL: ~/.local/share/mise missing after restart' >&2; exit 1; }
# Cleanup the canary so it doesn't accumulate.
rm -f ~/.local/tmp/persistence-canary.txt
echo 'OK: home-volume seed survivors + canary present'
"

echo "OK: $PRE_COUNT tools persisted identically across stop/up (mise-system.toml baseline: $EXPECTED_MIN)"
'''

