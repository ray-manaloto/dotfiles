# lsp-server: runs `mise run lsp` with its arguments (python/lsp); user scope only, like ticket-retro.
"~/.claude/skills/lsp-server" = { source = "unix/home/.config/agents/skills/lsp-server", mode = "symlink" }
"~/.agents/skills/lsp-server" = { source = "unix/home/.config/agents/skills/lsp-server", mode = "symlink" }
# secrets: the global secret:* tasks (the doppler CLI); user scope only, like lsp-server.
"~/.claude/skills/secrets" = { source = "unix/home/.config/agents/skills/secrets", mode = "symlink" }
