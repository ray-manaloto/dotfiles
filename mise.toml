min_version = "2026.10.20"
monorepo_root = true

[monorepo]
config_roots = ["typescript", "python", "python/toolchains/p2996", "python/repo", "python/workflow", "python/cbm", "python/home", "python/visualplan", "python/jbctl", "cpp", "swift"]
lockfile = true

[monorepo.path_aliases]
p2996 = "python/toolchains/p2996"
repo = "python/repo"
workflow = "python/workflow"
cbm = "python/cbm"
home = "python/home"
visualplan = "python/visualplan"
jbctl = "python/jbctl"

[settings]
lockfile = true
# `mise use` and `mise upgrade --bump` write the resolved version, not the request
pin = true
minimum_release_age = "0s"
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]

[tasks.test]
description = "Run every language root's tests"
depends = ["//typescript:test", "//python:test", "//repo:test", "//workflow:test", "//cbm:test", "//home:test", "//visualplan:test", "//jbctl:test", "//cpp:test", "//swift:test"]
run = "echo all tests passed"

# Private values that must never reach a tracked file or a pushed commit. Rendered on each machine from its own
# environment, so the repo never holds them; privacy:scan reads them through its env.
[vars]
private_home = "{{ env.HOME }}"
private_user = "{{ env.USER }}"
# What shell:apply backs up and shell:rollback restores, relative to $HOME.
shell_backup_paths = ".zshenv .zprofile .zshrc .zprofile.d .zshrc.d .config/zsh"

[tasks."privacy:scan"]
description = "Refuse this machine's home path in tracked files, given files, or outgoing commits"
env = { PRIVATE_PATTERNS = "{{ vars.private_home }}\n/Users/{{ vars.private_user }}/\n/home/{{ vars.private_user }}/" }
usage = '''
flag "--outgoing" help="Scan every commit not yet on a remote, branches and tags (pre-push)"
arg "[file]" var=#true help="Files to scan; default every tracked file"
'''
# --option=value: a value that starts with - would otherwise be read by argparse as an option.
run = 'uv run --project python/repo --locked repotools privacy-scan --patterns="$PRIVATE_PATTERNS" --files="${usage_file:-}" ${usage_outgoing:+--outgoing}'

[tasks."shell:apply"]
description = "Back up the live zsh files, check a shell from the new ones, then link them into $HOME"
env = { SHELL_BACKUP_PATHS = "{{ vars.shell_backup_paths }}" }
run = "uv run --project python/repo --locked repotools shell-apply"

[tasks."shell:rollback"]
description = "Restore the zsh files from the pre-apply backup"
env = { SHELL_BACKUP_PATHS = "{{ vars.shell_backup_paths }}" }
run = "uv run --project python/repo --locked repotools shell-rollback"

# Here, not in python/repo: that config's _.python.venv takes a lock under ~/.cache/mise on every run.
# No usage spec, so mise appends the arguments to the line, each quoted; raw keeps both streams unprefixed, and
# raw_args hands a --help to the command, not to mise (v2026.11.2 src/cli/run.rs:911-915).
[tasks."scratch:env"]
description = "Run one command from this checkout with every home path inside a scratch folder"
raw = true
raw_args = true
run = "uv run --project python/repo --locked repotools scratch-env"

[tasks.pre-commit]
run = "hk run pre-commit"

# Run after staging a Python unit; fix or answer every finding, then rerun until PASS. A full PASS
# records a fingerprint of the staged python/ files, which the pre-commit hook compares. repotools
# review-python does the work (python/repo/src/repotools/gates.py).
# Pattern: jazzsequence/jazz-nextjs@9c427f84 .githooks/lib/approval.sh:48-64 (index fingerprint from
# `git ls-files -s`, so a later `git add` voids the approval); Open-BFME/Open-BFME-1@5a6f78cf
# .githooks/pre-commit:411,640 does it with `git write-tree`. Marketplace saved searches review-gate-*.
[tasks."review:python"]
description = "A read-only Codex reviewer checks the uncommitted changes against CODING_STANDARDS.md"
usage = '''
arg "[path]" default="python" help="Directory whose uncommitted changes are reviewed"
flag "--commit <sha>" help="Review this commit instead of the uncommitted changes"
flag "--out <file>" help="Report file (default review-python.md in the git dir, never tracked)"
'''
# --option=value: a value that starts with - would otherwise be read by argparse as an option.
run = 'uv run --project python/repo --locked repotools review-python --path="$usage_path" ${usage_commit:+--commit="$usage_commit"} ${usage_out:+--out="$usage_out"}'

[tasks."review:python:approved"]
description = "Refuse unless review:python passed on exactly the staged python/ files"
run = "uv run --project python/repo --locked repotools review-python-approved"

[dotfiles]
"~/.config/mise/config.toml" = { source = "unix/home/.config/mise/config.toml", mode = "symlink" }
"~/.config/mise/miserc.toml" = { source = "unix/home/.config/mise/miserc.toml", mode = "symlink" }
"~/.config/mise/locks" = { source = "unix/home/.config/mise/locks", mode = "symlink" }
"~/.config/mise/mise.lock" = { source = "unix/home/.config/mise/mise.lock", mode = "symlink" }
"~/.config/mise/tasks" = { source = "unix/home/.config/mise/tasks", mode = "symlink" }
"~/.config/fnox/config.toml" = { source = "unix/home/.config/fnox/config.toml", mode = "symlink" }
"~/.config/starship.toml" = { source = "unix/home/.config/starship.toml", mode = "symlink" }
"~/.config/fnox/agent-tools.toml" = { source = "unix/home/.config/fnox/agent-tools.toml", mode = "symlink" }
"~/.zshrc.d/60-agent-tools.zsh" = { source = "unix/home/.zshrc.d/60-agent-tools.zsh", mode = "symlink" }
# Separate entries, so ~/.zshrc.d stays a real folder. Applied by shell:apply, which backs up first.
"~/.zshenv" = { source = "unix/home/.zshenv", mode = "symlink" }
"~/.zprofile" = { source = "unix/home/.zprofile", mode = "symlink" }
"~/.zshrc" = { source = "unix/home/.zshrc", mode = "symlink" }
"~/.zshrc.d/10-zsh.zsh" = { source = "unix/home/.zshrc.d/10-zsh.zsh", mode = "symlink" }
"~/.zshrc.d/90-mise.zsh" = { source = "unix/home/.zshrc.d/90-mise.zsh", mode = "symlink" }
"~/.config/zsh/path.zsh" = { source = "unix/home/.config/zsh/path.zsh", mode = "symlink" }
"~/.config/herdr-app/programs.json" = { source = "unix/home/.config/herdr-app/programs.json", mode = "symlink" }
"~/.local/bin/codex-fnox" = { source = "unix/home/.local/bin/codex-fnox", mode = "symlink" }
"~/.local/bin/codex-hc" = { source = "unix/home/.local/bin/codex-hc", mode = "symlink" }
# A skill written here: Codex reads ~/.agents/skills and Claude ~/.claude/skills, so both link to it.
"~/.agents/skills/macos-agent-permissions" = { source = "unix/home/.agents/skills/macos-agent-permissions", mode = "symlink" }
"~/.claude/skills/macos-agent-permissions" = { source = "unix/home/.agents/skills/macos-agent-permissions", mode = "symlink" }
"~/.agents/skills/visual-plan" = { source = "unix/home/.agents/skills/visual-plan", mode = "symlink" }
"~/.claude/skills/visual-plan" = { source = "unix/home/.agents/skills/visual-plan", mode = "symlink" }
# TokenEconomizer's global policy, copied (TE rewrites the file, which would break a symlink). Change it
# with `te --host claude config set --global ...`, then capture it from the main checkout with
# `mise dot add ~/.tokeneconomizer/config.json` before any `mise dot apply`: an apply overwrites an
# uncaptured live change without asking. The second entry only sets the folder's mode.
"~/.tokeneconomizer/config.json" = { source = "unix/home/.tokeneconomizer/config.json", mode = "copy", permissions = "0600" }
"~/.tokeneconomizer" = { permissions = "0700" }
# Both files are not this repo's, so only this block is managed. Other repos get the rule from here,
# until ~/.claude/CLAUDE.md imports the shared ~/.config/agents/AGENTS.md and the rule moves there.
"~/.codex/AGENTS.md/hc-codex" = { block = '''
Any agent the user may watch (a reviewer pane, a peer Claude or Codex) opens as a tab in the current herdr-app space, never as an `hc run` popup: `herdr-app do tab.new --space <id> --name <name> --folder <dir> --argv '["codex-hc", "<task>"]'`. The current space is the one whose tabs list `$HC_TERMINAL_ID` in `herdr-app ls`. Start Codex as `codex-hc`: plain `codex` has no keys and no `--no-daemon`. `hc run` is only for short helpers nobody watches. If `herdr-app ls` fails, stop and ask the user; do not fall back to `hc run`. Close a tab you opened when you are done with it: `herdr-app do tab.close --id <tab id>`.
''' }
"~/.claude/CLAUDE.md/hc-codex" = { block = '''
Any agent the user may watch (a reviewer pane, a peer Claude or Codex) opens as a tab in the current herdr-app space, never as an `hc run` popup: `herdr-app do tab.new --space <id> --name <name> --folder <dir> --argv '["codex-hc", "<task>"]'`. The current space is the one whose tabs list `$HC_TERMINAL_ID` in `herdr-app ls`. Start Codex as `codex-hc`: plain `codex` has no keys and no `--no-daemon`. `hc run` is only for short helpers nobody watches. If `herdr-app ls` fails, stop and ask the user; do not fall back to `hc run`. Close a tab you opened when you are done with it: `herdr-app do tab.close --id <tab id>`.
''' }
# Every repository: pushes run the gh checks in the global config. HK=0 skips, like the hk hooks.
"~/.gitconfig/gh-doctor" = { block = '''
[hook "gh-doctor-pre-push"]
	command = test "${HK:-1}" = "0" || sh -c '~/.local/share/mise/shims/mise doctor project'
	event = pre-push
''' }
"~/.config/mise/agentsview-native/fnox.toml" = { source = "unix/home/.config/mise/agentsview-native/fnox.toml", mode = "symlink" }

# No [tools]: every tool is in the global config (DL-757).
