[tasks.doctor]
description = "Project doctor: does the declared setup (doctor.toml) match reality on this host? (SessionStart hook; silent unless drift)"
# Thin caller (zero-bash-logic); logic in
# python/src/dotfiles_setup/doctor.py. Checks the seam every in-tree gate is
# blind to (#418): MCP `${VAR}` interpolation that silently resolves EMPTY, an
# MCP scope declaration the harness's roots replace, and fnox's env mode one
# `bootstrap-config` run from a wipe. Host-only by nature — it reads
# ~/.config/fnox and ~/.claude, which a CI runner does not have.
#
# ALWAYS exits 0 (findings included) so the SessionStart hook can never disrupt
# a session; `-- --strict` exits 1 for use as a gate. `-- --live` adds the MCP
# server spawns, deliberately OFF the per-session path.
#
#   mise run doctor                 # what the SessionStart hook runs
#   mise run doctor -- --verbose    # print a PASS line per clean check
#   mise run doctor -- --live       # + spawn each stdio server, diff its tools
run = 'uv run --project python dotfiles-setup doctor'

[tasks.dag-tick]
description = "launchd watchdog tick (#578): census this repo's background agents, classify ALIVE/DEAD/WEDGED/DONE, respawn DEAD and stop lingering DONE. WEDGED is log-only in this slice (#590)"
# Thin caller (zero-bash-logic); logic in
# python/src/dotfiles_setup/dag_tick.py. Fired every 60s by the
# dev.mise.dotfiles-dag-tick LaunchAgent declared below
# ([bootstrap.macos.launchd.agents.dotfiles-dag-tick]) — that block is
# inert until a human runs `mise bootstrap macos launchd-agents apply`
# (never implicit, `.claude/rules/do-not.md`). A single fcntl flock
# (~/.local/state/dotfiles/dag-tick.lock) makes overlapping ticks a silent
# no-op rather than a race against a respawn/stop.
#
#   mise run dag-tick -- --dry-run --verbose   # manual, read-only preview
run = 'uv run --project python dotfiles-setup dag-tick'

[tasks.dag-project]
description = "Project NEEDS_HUMAN nodes to the tracker (#602): the dag:needs-human label + one append-only escalation comment per (node, question), deduped on (node, digest). Pass exactly one of --dry-run or --write — neither REFUSES, because writing is outward-facing"
# Thin caller (zero-bash-logic); logic in
