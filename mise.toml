# Project tools — for linting, validating, and developing this repo
# These are Build Type 1 tools: run locally before commits

[tools]
# The tools shared with the devcontainer image live in
# .config/mise/conf.d/shared.toml — the single exact-pinned source both this
# host config and .devcontainer/mise-system.toml merge, so they never drift
# (Renovate bumps that one file). See epic #160 T5. Below: host-ONLY tools.
editorconfig-checker = "3.8.0"      # provides `ec` — hk editorconfig_checker builtin (#154); host-only (image drops it in T6)
"npm:@devcontainers/cli" = "0.87.0"
colima = "0.10.3"                   # Alternate Docker runtime (VZ + Rosetta); Docker Desktop is the CURRENT supported runtime — see AGENTS.md Docker Runtimes + docs/research/runs/research-20260409c-dockerdesktop-ssh/
lima = "2.2.0"
"github:agent-sh/agnix" = "0.40.0"
"npm:agents-lint" = "0.5.0"
"pipx:mcp2cli" = "3.3.1"
"npm:renovate" = "43.278.2"
biome = "2.5.5"
# Markdown + Claude-docs linters. Installed now; hk.pkl integration is
# scheduled for post-devcontainer-work review (see GH issue tracking
# follow-up). md_size_budget (below in hk.pkl) provides the immediate,
# class-aware enforcement — see .claude/rules/md-size-budgets.md.
"npm:claude-code-lint" = "0.7.0"
"npm:@contextlint/cli" = "1.1.1"
"npm:markdownlint-cli2" = "0.23.1"
"aqua:jackchuka/mdschema" = "0.13.4"
rumdl = "v0.2.40"
# zizmor: GHA security scanner — backs the hk zizmor builtin (#160 T12);
# host-only lint tool, so it lives here (not shared.toml).
zizmor = "1.28.0"
"npm:oh-my-claude-sisyphus" = "4.15.6"
"github:ast-grep/ast-grep" = "0.44.1"
lefthook = "2.1.10"
"npm:ctx7" = "0.5.5"
rtk = "0.43.0"                         # re-probed at #160 T12.5: mise #10703 (2026.7.0) fixed the github-backend url_api lock hold that pinned this at 0.37.2
"npm:skills" = "1.5.20"
"npm:agent-browser" = "0.32.3"
"npm:portless" = "0.15.4"
"pipx:deepagents-cli" = "0.2.2"
# graphify: host-only knowledge-graph substrate (#310 / T1 #312). The [all]
# extra resolves on host Python 3.14 — graphify's own PEP 508 markers auto-skip
# the leiden/graspologic extra (needs <3.13), so clustering falls back to
# Louvain (accepted). Host-only: root mise.toml is in the container's
# MISE_IGNORED_CONFIG_PATHS, so this never touches the image. Do NOT run
# `graphify claude install` (writes into root CLAUDE.md, breaks the @AGENTS.md
# stub), `graphify hook install` (post-commit auto-rebuild, violates the
# gated/manual-build rule), or `graphify --watch` (auto-rebuild). See T6 #316.
# Documented table form (mise pipx backend § Tool Options → extras). Prefer it
# over the bracket-in-name form `"pipx:graphifyy[all]"`: on 2026-07-20
# `mise upgrade --bump pipx:graphifyy` could not update the bracket form and
# instead appended a SECOND, bare `"pipx:graphifyy" = "0.9.22"` entry, leaving
# the real pin stranded at 0.9.20. The table form is what the bump path can
# rewrite in place.
"pipx:graphifyy" = { version = "0.9.27", extras = ["all"] }
# ffmpeg: system binary the graphify `video` extra (faster-whisper) needs to
# extract audio before transcription — it is NOT a pip dep, so `graphifyy[all]`
# cannot supply it. Host-only, same as graphify (root mise.toml is in the
# container's MISE_IGNORED_CONFIG_PATHS). conda backend (pixi) — the first
# conda tool in the host config; prebuilt, no source build. Enables
# `graphify add <youtube-url>` native download+transcribe.
# `os = ["macos"]`: graphify runs ONLY on the macOS host (project-scoped,
# host-only), so ffmpeg is never needed on Linux. The gate is load-bearing for
# CI, not cosmetic — CI's lint job runs `mise install --locked` at the repo
# root on a linux-x64 runner, and mise's conda/rattler backend cannot write a
# linux lockfile URL (it reports "✓ updated" but silently drops the entry —
# jdx/mise#7700). Without the gate, --locked fails "No lockfile URL found for
# conda:ffmpeg on platform linux-x64" and bricks lint. os-gating makes linux
# skip the tool entirely, so no linux URL is demanded.
"conda:ffmpeg" = { version = "8.1.2", os = ["macos"] }
aws-cli = { version = "2.36.5", symlink_bins = "true" }
azure-cli = { version = "2.88.0", uvx_args = "--prerelease=allow" }
docker-cli = "29.6.2"
opencode = "1.18.4"
# bun (the npm package_manager) is a host↔image SHARED tool → declared in
# .config/mise/conf.d/shared.toml, not here (mise-parity: a tool used by both
# sides lives only in the shared fragment).
# claude-flow + ralph-cli removed 2026-07-23: superseded by the cross-vendor
# orchestrator adoption (#346, fable-orchestrator + antigravity), and unused by
# CI/hk/scripts. Re-add if needed for interactive use.
# Cross-vendor executor-lane CLIs for the adopted Fable-5 orchestrator plugins
# (mar3co/fable-orchestrator in `codex` mode + yuting0624/antigravity-for-claude-code).
# Canonical mise registry short names (https://mise.jdx.dev/registry.html):
# `codex`=aqua:openai/codex, `antigravity-cli`=aqua:google-antigravity/antigravity-cli
# (Google's current agentic CLI — Gemini 3.x; ships `antigravity` + the `agy`
# symlink the antigravity plugin drives). Host-only (root mise.toml is in the
# container's MISE_IGNORED_CONFIG_PATHS) — the Claude architect stays the chair;
# these are executor lanes only. Auth is per-user (codex login / Google account).
codex = "0.145.0"
antigravity-cli = "1.1.5"

[settings]
experimental = true
auto_install = true
lockfile = true
# npm.package_manager = "bun": mise 2026.7.12 made the embedded `aube` manager
# the npm default, whose supply-chain guards (low-download threshold + stricter
# dependency resolution) reject several of this repo's pinned npm tools
# (contextlint 978/wk, agents-lint 714/wk; renovate dep-resolution). Keep the
# same `bun` manager the image bakes (mise-system.toml) so host/CI/image agree.
# `bun` is declared in [tools] below so CI installs it, and the setup-mise
# action installs it BEFORE the npm tools that need it (bare runners have no
# bun). Opt back into aube once its allow mechanism is a documented mise setting.
npm.package_manager = "bun"
# #160 T12.5 (decision 15): new tool requests get exact-pinned versions on
# `mise use` instead of fuzzy ranges — pins are the repo's whole versioning
# model. (task.timings from the decision does not exist as a setting in mise
# 2026.7.0 — verified via `mise settings ls --all`; env_cache is already the
# default true, so neither is set here.)
pin = true

[settings.status]
show_tools = true
missing_tools = "always"
show_env = true

[hooks]
# Reshim after every tool install so `mise doctor` does not report stale
# shims from the pipx backend (observed in CI for pipx:mcp2cli — local was
# clean, CI failed with "unused shims: mcp2cli" on fresh install).
postinstall = "mise reshim && hk install --mise"

[env]
# HK_PKL_BACKEND dropped (#160 T12): hk 1.49's default pklr backend evaluates
# the import/spread config identically to the pkl CLI (probe: --plan -J output
# byte-identical minus timestamp). The pkl binary stays pinned in shared.toml
# for the hk `pkl` builtin step (evals *.pkl files), not for hk itself.
HK_MISE = "1"

# #154: the hk `gitleaks` builtin runs `gitleaks dir` (whole-tree scan, no
# --config flag), so point gitleaks at the repo allowlist config via env — it
# scopes the scan to first-party source (see .gitleaks.toml). config_root
# resolves to the repo root both locally and in CI.
GITLEAKS_CONFIG = "{{config_root}}/.gitleaks.toml"

# Console stays at the default (warn) — interactive use isn't spammed —
# but the on-disk log captures debug-level detail so a stuck/slow run
# can be diagnosed via `tail -f` after the fact. When a hk run hangs,
# `tail -f ~/.local/state/hk/hk.log` is the live ground truth.
# Refs: https://hk.jdx.dev/logging.html#log-file-output
HK_LOG_FILE_LEVEL = "debug"

# Same pattern for mise: keep console quiet, write a debug-level log to
# a stable path so `tail -f ~/.local/state/mise/mise.log` is the
# always-on debugging surface for slow installs / failed resolutions /
# HTTP errors. Set MISE_LOG_HTTP=1 ad hoc if needed.
# Refs: https://mise.jdx.dev/configuration.html#mise-log-file-mise-log
MISE_LOG_FILE = "~/.local/state/mise/mise.log"
MISE_LOG_FILE_LEVEL = "debug"

# Directory-scoped shell aliases — auto-activated when cwd is inside this
# repo, deactivated on leave. Interactive-shell only (not usable inside
# task `run` blocks per mise docs). Kept short for inner-loop muscle
# memory; the canonical UX is still `mise run <task>`.
[shell_alias]
dcu = "mise run up"
dcd = "mise run down"
dcdev = "mise run dev"
dcrb = "mise run dev-rebuild"
dcsh = "mise run sh"
dcps = "mise run ps"
dcsmoke = "mise run smoke"
dcverify = "mise run verify-image"

[tasks."deps:python"]
description = "Sync python venv when pyproject.toml or uv.lock changes"
dir = "python"
sources = ["pyproject.toml", "uv.lock"]
outputs = [".venv/"]
run = "uv sync"

[tasks.pre-commit]
description = "Run all hk pre-commit checks (≡ `hk run pre-commit --all`)"
run = "hk run pre-commit --all"

[tasks.lint]
# #160 T12.5: native outer backstop ABOVE the wrapper's 600s — probe showed
# mise's task timeout kills the child and fails loud, but it lacks lint.py's
# hk-log-tail diagnostics, so the wrapper STAYS (decision 15's retire
# condition was full equivalence; it is not equivalent). This bound only
# fires if the Python wrapper itself wedges.
timeout = "700s"
# Preferred manual/agent entrypoint for the lint gate. Wraps hk in a hard
# timeout (hk has none of its own) so a hung step self-aborts with the
# tail of the debug log instead of wedging for hours (see the 7h hang in
# .claude/rules/long-running-command-hangs.md). Default 600s; override
# with `--timeout <secs>` or `DOTFILES_LINT_TIMEOUT=<secs> mise run lint`.
description = "Run hk check --all (read-only, ≡ CI) under a hard timeout (default 600s) so a hung lint self-aborts; fix path is `mise run fmt`"
run = "uv run --project python dotfiles-setup lint"

[tasks.check]
description = "Run full quality check (pre-commit + test)"
depends = ["pre-commit", "test"]

[tasks.test]
description = "Run Python test suite"
run = "uv run --project python pytest tests/ -x -q"

[tasks.smoke-exec]
description = "Run the containerized real-toolchain exec tests against the local :dev image (needs Docker + `mise run sync`; tier-3 compiles under Rosetta — minutes)"
# `-m image_exec` re-selects the tests the root pytest.ini deselects by default
# (last -m wins), so these run ONLY here, never in `mise run test` / CI.
run = "uv run --project python pytest -m image_exec tests/test_image_smoke_exec.py -v"

[tasks.up]
description = "Bring the devcontainer up via the official @devcontainers/cli (Mac-local)"
# BASE_IMAGE default is task-scoped (not global [env]) so it does not leak
# into unrelated subprocesses. Override with e.g.
#   BASE_IMAGE=ghcr.io/ray-manaloto/dotfiles-devcontainer:latest mise run up
# or pin to a specific SHA tag.
#
# DOCKER_DEFAULT_PLATFORM is task-scoped so it only affects `devcontainer up`
# (and its child docker calls) — host-level docker/colima invocations are
# unaffected. Required because the devcontainer image is amd64-only.
#
# DEVCONTAINER_SSH_PORT is the HOST-side port for the inbound shell
# (Requirement R1: `ssh ${USER}@localhost -p 4444` opens a shell in the
# container). Container-internal sshd listens on 2222 (feature hardcoded);
# devcontainer.json maps ${DEVCONTAINER_SSH_PORT}:2222 via appPort.
# Override per-clone via mise.local.toml on port collision without losing
# named volumes — volume names do NOT include the port (C10/C11/C12).
#
# Outbound agent forwarding (Requirement R2: `ssh -T git@github.com` from
# inside container) is independent; uses the host-TCP + container-unix-
# socket proxy pattern spawned from initializeCommand/postStartCommand.
# Research: docs/research/runs/research-20260407-ssh-devcontainer/report.md.
#
# Image pull: handled inside `devcontainer up` via buildx (the
# Dockerfile.host-user `FROM ${BASE_IMAGE}` triggers a registry pull
# when the base layer is missing). DO NOT add a standalone `docker
# pull` here — it bypasses the devcontainer-cli lifecycle (no
# initializeCommand etc.) and recreates the silent-failure surface
# from PR #86. To force-refresh, use `mise run dev-rebuild`.
#
# BASE_IMAGE + DEVCONTAINER_SSH_PORT are templated `{{ env.VAR |
# default(value='...') }}` so a per-clone gitignored mise.local.toml
# `[env]` (or a shell env var) overrides them WITHOUT redefining the
# task. A bare `[tasks.up]` in mise.local.toml REPLACES the whole task and
# strips this `run` body (see mise.local.toml.example and
# feedback_mise_local_toml_replaces_task) — templating is how the
# documented override actually works. The Tera `env.VAR` variable (NOT the
# documented `get_env()` function) is required: `get_env()` reads only the
# ambient process env and is blind to mise's own merged `[env]` layer, so
# it would silently ignore a mise.local.toml `[env]` override. The default
# keeps these TASK-scoped (no global leak of BASE_IMAGE / the amd64
# platform into unrelated subprocesses) unless the user opts in.
env = { BASE_IMAGE = "{{ env.BASE_IMAGE | default(value='ghcr.io/ray-manaloto/dotfiles-devcontainer:dev') }}", DOCKER_DEFAULT_PLATFORM = "linux/amd64/v2", DEVCONTAINER_SSH_PORT = "{{ env.DEVCONTAINER_SSH_PORT | default(value='4444') }}", DOPPLER_PROJECT = "dotfiles", DOPPLER_CONFIG = "dev" }
run = '''
set -euo pipefail
# v6 collision guard: compute an 8-char hash of $PWD so sibling clones
# of `dotfiles` on the same host get distinct Docker volume + container
# names. Exported so devcontainer.json ${localEnv:DEVCONTAINER_WORKSPACE_HASH}
# substitution picks it up. Single source of truth at scripts/workspace-hash.sh.
DEVCONTAINER_WORKSPACE_HASH="$(scripts/workspace-hash.sh)"
export DEVCONTAINER_WORKSPACE_HASH
# Clear stale host keys for the devcontainer SSH port — each container
# recreate generates new host keys, causing "REMOTE HOST IDENTIFICATION
# HAS CHANGED" warnings. ssh-keygen -R removes the old entry. The
# `|| true` is acceptable here: keygen exits 1 when the entry doesn't
# exist (first run on a fresh host), which is the normal case.
ssh-keygen -R "[localhost]:${DEVCONTAINER_SSH_PORT}" 2>/dev/null || true
devcontainer up --workspace-folder .
'''

[tasks.dev-rebuild]
description = "Force a full rebuild + re-pull of :dev (lifecycle hooks fire)"
# Equivalent to a force-refresh. `--remove-existing-container` ensures
# `devcontainer up` recreates the container (which re-fetches the base
# layer if the registry has a new digest), and `--build-no-cache` rebuilds
# the host-user overlay without cached layers. Lifecycle hooks
# (initializeCommand → onCreateCommand → postCreateCommand) all fire.
# BASE_IMAGE + DEVCONTAINER_SSH_PORT templated for per-clone override — see the up task.
env = { BASE_IMAGE = "{{ env.BASE_IMAGE | default(value='ghcr.io/ray-manaloto/dotfiles-devcontainer:dev') }}", DOCKER_DEFAULT_PLATFORM = "linux/amd64/v2", DEVCONTAINER_SSH_PORT = "{{ env.DEVCONTAINER_SSH_PORT | default(value='4444') }}", DOPPLER_PROJECT = "dotfiles", DOPPLER_CONFIG = "dev" }
run = '''
set -euo pipefail
DEVCONTAINER_WORKSPACE_HASH="$(scripts/workspace-hash.sh)"
export DEVCONTAINER_WORKSPACE_HASH
ssh-keygen -R "[localhost]:${DEVCONTAINER_SSH_PORT}" 2>/dev/null || true
devcontainer up --workspace-folder . --remove-existing-container --build-no-cache
'''

[tasks.verify]
description = "Run the structured verification contracts (suites.toml) — the third local gate"
# Canonical entrypoint. AGENTS.md previously told agents to run a bare
# `dotfiles-setup verify run`, which is NOT on PATH and returns rc=127 (hit
# 2026-07-20 while running the pre-commit gates). The console script only
# exists inside the uv-managed venv, so it must be invoked through `uv run
# --project python`. Wrapping it as a task is what `mise-tasks-only.md`
# requires of every recurring workflow, and it keeps the AGENTS.md quick-start
# shorter than the broken form it replaces.
run = 'uv run --project python dotfiles-setup verify run'

[tasks.verify-image]
description = "Spot-check cookbook paths in :dev (cargo/rustup cookbook layout + core toolchains)"
# Source of truth for what's INSIDE :dev is .devcontainer/mise-system.toml,
# NOT root mise.toml. Root mise.toml tools (hk, pkl, the 5 markdown
# linters, etc.) live on the HOST, not in the image. Keep assertions here
# scoped to what mise-system.toml actually provides.
env = { BASE_IMAGE = "{{ env.BASE_IMAGE | default(value='ghcr.io/ray-manaloto/dotfiles-devcontainer:dev') }}", DOCKER_DEFAULT_PLATFORM = "linux/amd64/v2" }
run = '''
# Review finding [29]: --pull=never — an absent local tag must fail loud
# (use `mise run sync` to fetch via buildkit), never classic-pull ~38GB.
docker run --rm --pull=never "$BASE_IMAGE" bash -lc '
  set -euo pipefail
  # Cookbook cargo/rustup homes (PR-2 commit F)
  ls /usr/local/share/cargo/bin
  ls /usr/local/share/rustup/toolchains
  test ! -d /opt/cargo
  test ! -d /opt/rustup
  # Core toolchain reachability via mise activation
  cargo --version
  rustc --version
  clang --version
'
'''

[tasks.smoke]
description = "Run tier 1-3 smoke checks inside the running devcontainer"
run = "devcontainer exec --workspace-folder . scripts/devcontainer-smoke.sh"

[tasks.sh]
description = "Open an interactive shell in the running devcontainer"
alias = "shell"
run = "devcontainer exec --workspace-folder . bash -l"

[tasks.ps]
description = "Show the running devcontainer + its named volumes"
run = '''
set -euo pipefail
_hash="$(scripts/workspace-hash.sh)"
docker ps --filter "label=devcontainer.local_folder=$PWD" --format 'table {{"{{"}}.Names{{"}}"}}\t{{"{{"}}.Status{{"}}"}}\t{{"{{"}}.Ports{{"}}"}}'
# Scoped to this clone's hashed home volume (v6 single-volume consolidation).
docker volume ls --format '{{"{{"}}.Name{{"}}"}}' | grep -E "dotfiles-$(basename "$PWD")-${USER}-${_hash}" || true
'''

[tasks.dev]
description = "Full devloop: up → smoke (sequential)"
# NOTE: `depends = [...]` in mise runs tasks in parallel when independent
# — not what we want here. A sequential shell body forces ordering while
# keeping each sub-task independently runnable.
#
# Image pulling is delegated to devcontainer-cli (called by `mise run up`).
# Standalone `docker pull` was removed — it bypassed the lifecycle and
# masked silent failures (PR #86 review). Use `mise run dev-rebuild`
# for an explicit force-refresh.
run = '''
set -euo pipefail
mise run up
mise run smoke
'''

[tasks.persistence]
description = "Verify .devcontainer/mise-system.toml tools survive a devcontainer stop/up cycle"
# Source of truth for the expected tool set is .devcontainer/mise-system.toml
# (installed to /usr/local/share/mise/config.toml inside :dev). This task
# takes the runtime `mise ls --json --installed` view as ground truth,
# cross-checked against a minimum count parsed from mise-system.toml, and
# asserts every (tool, version) entry survives a stop/up cycle unchanged.
#
# Requires a running devcontainer on entry; the devloop
# `mise run dev` / `mise run verify-local` brings it up first.
run = '''
set -euo pipefail
SNAPSHOT=/tmp/mise-persistence-before.json
AFTER=/tmp/mise-persistence-after.json
SYSTEM_TOML=.devcontainer/mise-system.toml

# (0) Derive the expected minimum tool count from mise-system.toml.
#     Python tomllib is the canonical parser; python 3.14 is pinned in
#     project mise.toml so this is always available during local runs.
EXPECTED_MIN=$(python3 -c "
import tomllib, sys
with open('$SYSTEM_TOML', 'rb') as f:
    cfg = tomllib.load(f)
print(len(cfg.get('tools', {})))
")
echo "==> mise-system.toml declares $EXPECTED_MIN tools"

# (1) Pre-teardown: snapshot resolved versions.
#     `mise doctor` is advisory only — inside the container it sees the
#     workspace /workspaces/dotfiles/mise.toml which legitimately lists
#     host-only tools (colima, lima, @devcontainers/cli, agnix, markdown
#     linters) that are NOT in mise-system.toml. Doctor reports them as
#     "(missing)" with a non-zero exit. The TRUE persistence invariant is
#     the snapshot diff (step 4) being empty; doctor is logged but never
#     fails the gate. Architectural cleanup (untrust the workspace config
#     in-container) is tracked as a follow-up — see issue #70 thread.
echo "==> mise doctor (pre-teardown, advisory)"
devcontainer exec --workspace-folder . bash -lc 'mise doctor || true'

echo "==> capturing pre-teardown snapshot"
devcontainer exec --workspace-folder . bash -lc 'mise ls --json --installed' > "$SNAPSHOT"
PRE_COUNT=$(jq 'length' "$SNAPSHOT")
echo "pre-teardown installed tool count: $PRE_COUNT"
if [ "$PRE_COUNT" -lt "$EXPECTED_MIN" ]; then
  echo "FAIL: fewer tools installed ($PRE_COUNT) than mise-system.toml declares ($EXPECTED_MIN)" >&2
  exit 1
fi

# (1a) v6 single-home-volume contract: write an in-volume canary file.
#      This file lives on the persistent home volume; if the volume is
#      correctly mounted across stop/up, it must survive. Contrast with
#      /tmp (ephemeral per container) — the canary proves the VOLUME is
#      the thing persisting, not just the container state.
echo "==> writing in-volume persistence canary"
CANARY_CONTENT="canary-$(date +%s)-$$"
devcontainer exec --workspace-folder . bash -lc "printf '%s' '${CANARY_CONTENT}' > ~/.local/tmp/persistence-canary.txt"

# (2) Stop/up cycle — the actual persistence test.
echo "==> tearing container down"
mise run stop
echo "==> bringing container back up"
mise run up

# (3) Post-restart: snapshot. `mise doctor` advisory only (see step 1).
echo "==> mise doctor (post-restart, advisory)"
devcontainer exec --workspace-folder . bash -lc 'mise doctor || true'

echo "==> capturing post-restart snapshot"
devcontainer exec --workspace-folder . bash -lc 'mise ls --json --installed' > "$AFTER"
POST_COUNT=$(jq 'length' "$AFTER")
echo "post-restart installed tool count: $POST_COUNT"

# (4) Snapshot parity: every (tool, version) in $SNAPSHOT must be in $AFTER.
#     Host-side jq diff so we can fail with a clear drift message.
jq -r 'to_entries[] | .key as $k | .value[] | "\($k)\t\(.version)"' "$SNAPSHOT" | sort > /tmp/mise-persistence-pre.tsv
jq -r 'to_entries[] | .key as $k | .value[] | "\($k)\t\(.version)"' "$AFTER"    | sort > /tmp/mise-persistence-post.tsv
if ! diff -u /tmp/mise-persistence-pre.tsv /tmp/mise-persistence-post.tsv; then
  echo "FAIL: installed-tool set drifted across stop/up" >&2
  exit 1
fi

# (5) v6 home-volume contract: assert the single home volume preserved
#     the in-volume canary AND the seeded essentials (shell files, .ssh,
#     mise install dir). This closes the Codex v4 finding that the
#     previous persistence task only covered `mise ls` — the new home
#     volume needs broader restart-level assertions.
echo "==> asserting home-volume persistence (canary + seed survivors)"
devcontainer exec --workspace-folder . bash -lc "
set -euo pipefail
[ -f ~/.local/tmp/persistence-canary.txt ] || { echo 'FAIL: TMPDIR canary lost across restart' >&2; exit 1; }
got_canary=\$(cat ~/.local/tmp/persistence-canary.txt)
if [ \"\${got_canary}\" != '${CANARY_CONTENT}' ]; then
  echo \"FAIL: TMPDIR canary content mismatch (expected '${CANARY_CONTENT}', got '\${got_canary}')\" >&2
  exit 1
fi
[ -f ~/.bashrc ]            || { echo 'FAIL: ~/.bashrc missing after restart' >&2; exit 1; }
[ -f ~/.zshrc ]             || { echo 'FAIL: ~/.zshrc missing after restart' >&2; exit 1; }
[ -f ~/.profile ]           || { echo 'FAIL: ~/.profile missing after restart' >&2; exit 1; }
[ -d ~/.ssh ]               || { echo 'FAIL: ~/.ssh missing after restart' >&2; exit 1; }
[ -d ~/.local/share/mise ]  || { echo 'FAIL: ~/.local/share/mise missing after restart' >&2; exit 1; }
# Cleanup the canary so it doesn't accumulate.
rm -f ~/.local/tmp/persistence-canary.txt
echo 'OK: home-volume seed survivors + canary present'
"

echo "OK: $PRE_COUNT tools persisted identically across stop/up (mise-system.toml baseline: $EXPECTED_MIN)"
'''

[tasks.autofix-apply]
description = "Apply a run's autofix.ci artifact locally (App-down fallback): mise run autofix-apply -- <run-id>"
run = 'uv run --project python dotfiles-setup autofix-apply'

[tasks.gha-dispatch]
description = "Dispatch a workflow: mise run gha-dispatch -- <workflow.yml> [gh args]"
# Thin gh wrapper (allowed: no logic). Args append after --.
run = 'gh workflow run'

[tasks.gha-rerun]
description = "Re-run a run's failed jobs: mise run gha-rerun -- <run-id>"
# Cross-verify afterwards per gh-cli-watch.md (conclusion via gh run view).
run = 'gh run rerun --failed'

[tasks.tool-currency]
description = "Daily tool-currency report: deep due-diligence on the fast-movers + a broad mise-outdated sweep"
# Thin caller of the SHARED engine (`kb-setup currency`, a pinned uv git dep on
# the knowledge-base package — one implementation, D2/G4). `daily` renders the
# standing-issue report: deep-tracked tools (currency.toml) that moved get a
# per-tool verdict, everything else outdated gets a broad row. Run daily by
# refresh.yml's tool-currency job; locally it feeds the tool-currency-check skill.
run = 'uv run --project python kb-setup currency daily'

[tasks.tool-currency-check]
description = "Offline step-1 drift check for deep-tracked tools (SessionStart hook; silent unless drift)"
# Subprocess-free, ~10ms, silent when clean, ALWAYS exits 0 — the SessionStart
# hook runs it every session and must never block over a version pin. Prints a
# nudge to run the tool-currency skill only when the install drifts from the pin.
# Logic in the shared engine (kb_setup.currency.sync). Mirrors the KB repo's
# kb-currency-check task.
run = 'uv run --project python kb-setup currency check'

[tasks.apt-repo]
description = "List the packages an apt repository publishes (defaults to apt.llvm.org)"
# Thin caller (zero-bash-logic); logic in
# python/src/dotfiles_setup/apt_repo.py. Reads the repo's Packages index
# directly via python-debian, so it needs neither the repo configured in
# sources.list nor libapt -- enumeration works BEFORE deciding to adopt a
# source, which is what #251 asks for. mise itself cannot do this
# (`mise bootstrap packages` has no search; `import`/dpkg-query only ever see
# INSTALLED packages), and apt-cache would require adding the repo first.
#
#   mise run apt-repo                                  # llvm 22 (qualification)
#   mise run apt-repo -- --llvm-version 21             # stable
#   mise run apt-repo -- --llvm-version dev            # development (clang 23)
#   mise run apt-repo -- --llvm-version dev --toml --exclude-runtime
#   mise run apt-repo -- --repo <url> --suite <suite>  # any apt repo
#
# --llvm-version takes a VERSION, not a channel label: apt.llvm.org's
# stable/qualification/development roles shift every release cycle
# (2026-07-15: 21/22/23), so a label pinned today silently becomes a
# different major later.
run = 'uv run --project python dotfiles-setup apt-repo'

[tasks.command-audit]
description = "Scan recent Claude Code transcripts for one-off Bash culprits to package as mise tasks"
# Thin caller (zero-bash-logic); logic in
# python/src/dotfiles_setup/command_audit.py. The self-learning half of the
# mise-tasks-only loop: mines native transcript JSONL (no capture hook), flags
# mutating hand-run commands the PreToolUse guard does not yet cover. Review
# the report to refine rules/hooks/docs. Pass flags through: mise run
# command-audit -- --limit 20
# Also run automatically by the SessionEnd hook in .claude/settings.json
# (`-- --output .agent/command-audit.md`) — run it by hand for an ad-hoc report.
run = 'uv run --project python dotfiles-setup command-audit'

[tasks.memory-index]
description = "Check MEMORY.md before trimming it: budget, dead links, and facts a trim would silently destroy"
# Thin caller (zero-bash-logic); logic in
# python/src/dotfiles_setup/memory_index.py. The auto-memory index only loads
# to 200 lines / 25KB, so it must stay short — but shortening a hook silently
# destroys any fact that lives only in that hook (measured: 4 such facts on
# 2026-07-14). Run this BEFORE trimming; `-- --refs <name>` before deleting a
# memory. On-demand by design — no hook wires it yet (see the skill).
# Pass flags through: mise run memory-index -- --refs feedback_colima_recommendation
run = 'uv run --project python dotfiles-setup memory-index'

[tasks.graphify-query]
description = "Deterministically query the project knowledge graph (host-only, #310)"
# Thin caller (zero-bash-logic); logic in
# python/src/dotfiles_setup/graphify.py. Deterministic BFS/DFS over
# graphify-out/graph.json — no LLM, source-cited, ~free (build is separate and
# gated). Errors clearly if the graph has not been built yet.
# Pass flags through: mise run graphify-query -- "how does lint work?" --budget 3000
run = 'uv run --project python dotfiles-setup graphify query'

[tasks.bakeoff]
description = "Run the graphify extraction bake-off (writes OUTSIDE the repo)"
# Thin caller (zero-bash-logic); logic in
# python/src/dotfiles_setup/graph_bakeoff.py.
#
# Every artifact lands in the WORKBENCH (~/dev/graphify-bakeoff), never in this
# repo: bake-off output is result data, not source. The one exception is the
# gold corpus at tests/fixtures/graphify-gold, which is an INPUT and is
# versioned so a score is reproducible across machines.
#
# Each (corpus, arm, repeat) gets a FRESH directory. That is not tidiness — it
# is the cache-isolation guarantee. graphify's semantic cache is keyed by file
# content + relative path and carries NO model identity, so two arms sharing an
# output tree would silently serve one model's results to the other.
#
# The arm list includes a NULL ARM: the reference model run twice under
# identical conditions. The spread between the twins is the noise floor, and a
# cross-arm gap smaller than it is reported as "indistinguishable" rather than
# as a finding. Without it, no gap in the report means anything.
#
#   mise run bakeoff                          # gold corpus, 3 repeats, null arm
#   mise run bakeoff -- --repeats 5
#   mise run bakeoff -- --corpus docs/research/kb/raw --run-id full-corpus
run = 'uv run --project python dotfiles-setup graphify bakeoff'

[tasks.verify-apt-pins]
description = "Prove every pinned [bootstrap.packages] version still resolves (~60s, no image build)"
# Thin caller per zero-bash-logic; the probe container, the Dockerfile-ARG
# reads, and the generated apt script live in
# python/src/dotfiles_setup/apt_pins.py — which documents each with the probe
# that established it. Read-only: simulates, installs nothing, builds no image.
#   mise run verify-apt-pins           # report; rc=1 if any pin is unresolvable
#   mise run verify-apt-pins -- --json # machine-readable
#
# THE POINT (#288, .claude/rules/local-devcontainer-first.md): a pin fails in
# exactly one way — that exact version stops resolving — and until this task
# the ONLY thing that noticed was a cold base rebuild (~2.5h of CI). This runs
# apt's real solver against the digest-pinned base in ~60s. Run it after ANY
# [bootstrap.packages] edit, BEFORE pushing.
#
# It runs a throwaway `docker run` on the ubuntu base, NOT the devcontainer:
# the devcontainer already has these packages installed, so simulating a pin
# below an installed version reports FAIL for "apt refuses to downgrade" — a
# false negative about the container, not the pin (measured 2026-07-16). Not
# devcontainer lifecycle, so `do-not.md` #3 does not apply.
run = 'uv run --project python dotfiles-setup apt-pins'

[tasks.renovate-dryrun]
description = "Report the updates Renovate would raise, from this working tree (no PRs)"
# Thin caller per zero-bash-logic; the renovate invocation, its three
# non-obvious env requirements, and the native-report parsing live in
# python/src/dotfiles_setup/renovate_dryrun.py — which documents each with the
# probe that established it. Read-only: opens no PR, writes no branch.
#   mise run renovate-dryrun            # report; always rc=0
#   mise run renovate-dryrun -- --check # rc=1 if any update is pending
#   mise run renovate-dryrun -- --json  # machine-readable
#
# #290 (FIXED): the failure was never the node pin and never submodules — the
# `github>jdx/renovate-config` preset we extend sets `cloneSubmodules: true`,
# which makes initRepo reach syncGit(), which throws outright under
# platform=local. The module forces it off via RENOVATE_FORCE (the only config
# layer applied AFTER repo config, so env/CLI both lose to the preset), leaving
# renovate.json byte-identical to what hosted Renovate reads.
#
# tools.node pins THIS TASK to node 24 (#251). Renovate 43.x declares
# `engines.node ^24.11.0`; under our node 26 the binary logs "Unsupported node
# environment detected" and exits rc=1. CORRECTED in #299: it still extracts
# and resolves NORMALLY — the pin buys a clean exit code, not report
# correctness. (The former "extracts NOTHING" note was true of some older
# renovate, not of 43.265.1, and cost a hunt for a data-loss bug that does not
# exist.) `depends` cannot fix this (it is install ORDER only); `tasks.*.tools`
# is mise's documented per-task version override ("a tool with a different
# version... only used for that task").
# Probed 2026-07-15: default task -> v26.5.0, tools.node="24" task -> v24.x.
# Renovate's own mise manager reads `tasks.*.tools`, so this pin stays current.
#
# NOTE: a lookup is slow when a `deb` datasource points at Ubuntu's archive (it
# downloads the whole main,universe Packages index). apt.llvm.org's index is
# ~13 KB and resolves fast; a full pass over this repo takes ~80s.
tools.node = "24"
run = 'uv run --project python dotfiles-setup renovate-dryrun'

[tasks.renovate-status]
description = "Report Mend-hosted Renovate install + privileges + open update PRs"
# Thin caller (zero-bash-logic); logic in
# python/src/dotfiles_setup/renovate.py. Read-only — replaces ad-hoc
# gh/git polling for Renovate status (skill -> mise task -> python).
# Pass --json for machine-readable output.
run = 'uv run --project python dotfiles-setup renovate-status'

[tasks.ship]
description = "Gate matrix → push → open/update PR → watch checks to verified green"
# Thin caller per zero-bash-logic; orchestration in
# python/src/dotfiles_setup/pr.py. Requires committed work on a feature
# branch (refuses main / dirty tree). Devcontainer-surface diffs trigger
# the hard `sync --full` gate — no override. Flags pass through:
#   mise run ship -- --title "feat: ..."
run = 'uv run --project python dotfiles-setup pr ship'

[tasks.land]
description = "Verify PR green → pinned squash-merge → watch main CI → local sync validation"
# Thin caller; see pr.py. Invocation IS the merge approval:
#   mise run land -- 172
run = 'uv run --project python dotfiles-setup pr land'

[tasks.sync]
description = "Converge the devcontainer onto the latest CI image + verify (digest fast-path)"
# Thin caller per zero-bash-logic; the orchestration (registry-vs-local-tag
# digest compare, container state matrix, in-flight ci.yml awareness,
# buildkit tag refresh, tiered verification) lives in
# python/src/dotfiles_setup/sync.py. Extra flags pass through:
#   mise run sync -- --check          # dry-run staleness report (rc 1 if stale)
#   mise run sync -- --full           # verify-local chain instead of smoke gate
#   mise run sync -- --tag pr-169     # pre-merge validation against a PR image
#   mise run sync -- --force          # rebuild even when current
#   mise run sync -- --wait           # await an in-flight ci.yml run first
run = 'uv run --project python dotfiles-setup docker sync'

[tasks.verify-container-latest]
description = "Gate: running devcontainer is on the latest branch code + current base + smoke"
# Enforces verify-before-advancing's devcontainer row: the running container
# must bind-mount THIS workspace (source = latest branch code, live) and pass
# scripts/devcontainer-smoke.sh, whose tier-1 image-identity check hard-fails a
# stale base (predating the current mise-system.toml). Logic is in
# python/src/dotfiles_setup/container.py (zero-bash-logic policy); this task is
# a thin caller. Use `--no-smoke` for a fast container/bind-mount pre-check.
run = 'uv run --project python dotfiles-setup docker verify-latest'

[tasks.verify-arch]
description = "R3: container runs as linux/amd64 x86_64 (not ARM passthrough)"
# Proves Requirement 3: the container is AMD64 regardless of host arch.
# Three independent signals: (1) docker image manifest architecture,
# (2) container uname -m, (3) container arch. All three must report
# x86_64/amd64. The host can be arm64 (macOS ARM via Docker Desktop
# Rosetta, or the deferred Colima VZ+Rosetta path) or amd64 (Linux CI
# runner); we don't check the host.
run = '''
set -euo pipefail
container_name="$(docker ps -q --filter "label=devcontainer.local_folder=$PWD" | head -1)"
if [ -z "${container_name}" ]; then
  echo "FAIL: no running devcontainer for $PWD" >&2
  exit 1
fi
echo "==> docker image architecture"
image_id=$(docker inspect "${container_name}" --format '{{"{{"}}.Image{{"}}"}}')
image_arch=$(docker image inspect "${image_id}" --format '{{"{{"}}.Architecture{{"}}"}}')
echo "image: ${image_arch}"
[ "${image_arch}" = "amd64" ] || { echo "FAIL: image arch is ${image_arch}, expected amd64" >&2; exit 1; }

echo "==> container uname -m"
uname_m=$(docker exec "${container_name}" uname -m)
echo "uname -m: ${uname_m}"
[ "${uname_m}" = "x86_64" ] || { echo "FAIL: uname -m is ${uname_m}, expected x86_64" >&2; exit 1; }

echo "==> container arch"
arch_out=$(docker exec "${container_name}" arch)
echo "arch: ${arch_out}"
[ "${arch_out}" = "x86_64" ] || { echo "FAIL: arch is ${arch_out}, expected x86_64" >&2; exit 1; }

echo "OK: R3 container is linux/amd64 x86_64 on all three signals"
'''

[tasks.verify-ssh-inbound]
description = "R1: ssh ${USER}@localhost -p ${DEVCONTAINER_SSH_PORT} succeeds from the host"
# Proves Requirement 1: the ghcr.io/devcontainers/features/sshd feature
# is running sshd inside the container, the host port mapping is live,
# and the authorized_keys copy in postCreateCommand worked (host user
# can log in without a password). Runs on the HOST, not inside the
# container. StrictHostKeyChecking=accept-new + UserKnownHostsFile=/dev/
# null so we don't pollute the host's known_hosts with the container's
# ephemeral host keys.
env = { DEVCONTAINER_SSH_PORT = "{{ env.DEVCONTAINER_SSH_PORT | default(value='4444') }}" }
run = '''
set -euo pipefail
port="${DEVCONTAINER_SSH_PORT}"
echo "==> probing ssh ${USER}@localhost -p ${port}"
out=$(ssh -o BatchMode=yes \
          -o StrictHostKeyChecking=accept-new \
          -o UserKnownHostsFile=/dev/null \
          -o LogLevel=ERROR \
          -o ConnectTimeout=10 \
          -p "${port}" "${USER}@localhost" 'hostname && whoami')
echo "${out}"
echo "${out}" | grep -q "${USER}" || {
  echo "FAIL: whoami did not return ${USER}" >&2
  exit 1
}
echo "OK: R1 inbound ssh ${USER}@localhost -p ${port} works"
'''

[tasks.verify-secrets]
description = "S1: doppler env file exists and contains secrets"
env = { DOPPLER_PROJECT = "dotfiles", DOPPLER_CONFIG = "dev" }
run = '''
set -euo pipefail
envfile="${HOME}/.local/state/dotfiles/doppler.env"
if [ ! -f "${envfile}" ]; then
  echo "FAIL: ${envfile} does not exist (run 'mise run up' to generate)" >&2
  exit 1
fi
count=$(wc -l < "${envfile}" | tr -d ' ')
if [ "${count}" -lt 1 ]; then
  echo "FAIL: ${envfile} is empty (doppler download failed?)" >&2
  exit 1
fi
# Verify canary keys are present
for key in DOPPLER_PROJECT DOPPLER_CONFIG; do
  if ! grep -q "^${key}=" "${envfile}"; then
    echo "FAIL: ${key} not found in ${envfile}" >&2
    exit 1
  fi
done
echo "OK: S1 doppler env file has ${count} secrets (project=${DOPPLER_PROJECT}, config=${DOPPLER_CONFIG})"
'''

[tasks.verify-local]
description = "Full local devcontainer validation (verify-image → up → ps → smoke → persistence → verify-ssh-inbound → verify-secrets)"
# Sequential shell body (not `depends = [...]`) so mise can't parallelize
# the steps — smoke/persistence rely on up finishing first.
# verify-ssh-inbound (R1) runs last because it needs postCreateCommand
# to have installed ~/.ssh/authorized_keys from the host-state bind
# mount. verify-secrets (S1) validates the host-side doppler env file.
#
# Image pulling: verify-image's `docker run --rm` and `up`'s
# `devcontainer up` both auto-pull when the layer is missing — no
# standalone `docker pull` step needed. To force-refresh, use
# `mise run dev-rebuild` instead of this task.
run = '''
set -euo pipefail
mise run verify-image
mise run up
mise run ps
mise run verify-arch
mise run smoke
mise run persistence
mise run verify-ssh-inbound
mise run verify-secrets
'''

[tasks.prune]
description = "Full devcontainer prune: stop container, remove volumes, images, and build cache"
run = '''
set -euo pipefail
# Portable hash for this workspace (v6 single-volume collision guard).
# Scoped prune prevents deleting sibling-clone hashed home volumes
# (Codex v3 finding — broad-prefix prune was cross-clone destructive).
_hash="$(scripts/workspace-hash.sh)"

# Differentiate "no match" (acceptable, idempotent) from "docker command
# failed" (must be loud) per feedback_never_suppress_warnings. Pattern:
# capture command output, check non-empty, then act. Daemon failures
# propagate via set -e on the capturing subshell.
echo "==> stopping container"
container_ids="$(docker ps -aq --filter "label=devcontainer.local_folder=$PWD")"
if [ -n "${container_ids}" ]; then
  # shellcheck disable=SC2086
  docker rm -f ${container_ids}
else
  echo "    (no container labeled for $PWD — already stopped)"
fi

echo "==> removing named volumes (scoped to hash ${_hash})"
all_volumes="$(docker volume ls --format '{{"{{"}}.Name{{"}}"}}')"
hashed_volumes="$(echo "${all_volumes}" | grep -E "dotfiles-$(basename "$PWD")-${USER}-${_hash}" || true)"
if [ -n "${hashed_volumes}" ]; then
  echo "${hashed_volumes}" | xargs docker volume rm
else
  echo "    (no hashed volumes for ${_hash} — already removed)"
fi

# Also clean up any ORPHANED legacy volumes from the pre-v6 per-directory
# layout (mise-user / cargo-user / rustup-user). Bounded by the
# basename+user prefix so only this repo's orphans are targeted.
legacy_volumes="$(echo "${all_volumes}" | grep -E "dotfiles-$(basename "$PWD")-${USER}-(mise-user|cargo-user|rustup-user)$" || true)"
if [ -n "${legacy_volumes}" ]; then
  echo "==> removing legacy v5 volumes"
  echo "${legacy_volumes}" | xargs docker volume rm
fi

echo "==> removing overlay images"
all_images="$(docker images --format '{{"{{"}}.Repository{{"}}"}}:{{"{{"}}.Tag{{"}}"}}')"
overlay_images="$(echo "${all_images}" | grep vsc-dotfiles || true)"
if [ -n "${overlay_images}" ]; then
  echo "${overlay_images}" | xargs docker rmi
else
  echo "    (no vsc-dotfiles overlay images — already removed)"
fi

echo "==> pruning build cache"
docker builder prune -f
echo "==> done"
'''

[tasks.stop]
description = "Tear the devcontainer down (no 'devcontainer down' verb in v0.85.0)"
alias = "down"
# devcontainer CLI v0.85.0 has no 'down' verb (verified 2026-04-06 via
# `devcontainer --help`; verbs: up, set-up, build, run-user-commands,
# read-configuration, outdated, upgrade, features, templates, exec).
# Teardown uses `docker rm -f` filtered on the workspace-folder label
# that the devcontainer CLI applies to every container it creates.
#
# R2 outbound now uses Docker Desktop's native magic socket — no host
# proxy to tear down (deleted in #77 stage 2).
run = '''
set -euo pipefail
container_ids="$(docker ps -aq --filter "label=devcontainer.local_folder=$PWD")"
if [ -n "${container_ids}" ]; then
  # shellcheck disable=SC2086
  docker rm -f ${container_ids}
else
  echo "(no container labeled for $PWD — already stopped)"
fi
'''

[tasks.build]
description = "Build the docker image locally using docker bake"
run = "docker buildx bake dev-load"

[tasks.fmt]
description = "Auto-fix formatting issues"
run = "hk fix"

[tasks.outdated]
description = "Check for outdated tool versions"
run = "mise outdated"

[tasks.validate]
description = "Validate Docker and CI contracts"
run = "docker buildx bake validate"

[tasks.pin-actions]
description = "Verify GHA actions are SHA-pinned"
run = "pinact run --verify"

[tasks.parity]
description = "Assert the declared cross-repo shared set (parity.toml) holds in dotfiles + knowledge-base"
# Reads the sibling repo, so it cannot be an hk step: hk runs on a checkout of
# THIS repo alone. CI checks knowledge-base out inside the workspace and points
# KB_REPO_PATH at it (contract-preflight); locally it defaults to the sibling
# directory and SKIPs loudly when absent. In CI absence is a hard FAIL — see
# python/src/dotfiles_setup/parity.py for why that asymmetry is the point.
run = "uv run --project python dotfiles-setup parity"

[tasks.eval]
description = "Eval harness, tiers 1+2 (offline, gated; `-- --live` adds the lane doctor)"
# Tier 0 is suites.toml (`orchestration.*` / `eval.*`) — is it DECLARED? Tier 1
# — does it RESOLVE? Tier 2 — does the wired guard DECIDE correctly? All three
# are different questions: a lane can be named in doctrine, in both repos, with
# a passing contract, while its CLI is absent (#354); and a guard can be
# declared AND wired AND still deny a legitimate command (#265).
#
# ONE COMMAND PER ENGINE, not one overall: tiers 1+2 share the runner so they
# share this command, while tier 0 stays in `dotfiles-setup verify run`. Folding
# tier 0 in here would run ~103 contracts twice per ship.
#
# Offline by default so it joins the ship gates for free. `--live` shells out to
# the fable-orchestrator plugin's doctor.sh, which has NO offline mode and spends
# one real API call per installed lane. Runner is the SHARED kb_setup.evals;
# this repo's cases are dotfiles_setup.eval_cases.
run = "uv run --project python dotfiles-setup eval"

[tasks.lint-docs]
description = "Validate agent documentation"
# --strict: warnings-as-errors (#250) — parity with ci.yml + the hk agnix step.
run = "agnix . --strict"

[tasks.lock]
description = "Regenerate mise.lock"
run = "mise lock"

[tasks.p2996-hash]
description = "Print the content-hash of P2996 cache inputs (matches the CI :p2996-<hash> tag)"
run = "uv run --project python dotfiles-setup p2996-hash"

[tasks.p2996-refresh]
description = "Bump CLANG_P2996_REF in docker-bake.hcl to the latest bloomberg/clang-p2996 p2996-branch HEAD (writes only on change; the scheduled refresh.yml workflow's p2996-refresh job does this in CI)"
run = "uv run --project python dotfiles-setup p2996-refresh"
