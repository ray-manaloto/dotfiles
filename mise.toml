[tasks.sync]
description = "Converge the devcontainer onto the latest CI image + verify (digest fast-path)"
# Thin caller per zero-bash-logic; the orchestration (registry-vs-local-tag
# digest compare, container state matrix, in-flight ci.yml awareness,
# buildkit tag refresh, tiered verification) lives in
# python/src/dotfiles_setup/sync.py. Extra flags pass through:
#   mise run sync -- --check          # dry-run currency report (rc 1 if stale or this architecture's container is outdated)
#   mise run sync -- --full           # verify-local chain instead of smoke gate
#   mise run sync -- --tag pr-169     # pre-merge validation against a PR image
#   mise run sync -- --force          # rebuild even when current
#   mise run sync -- --wait           # await an in-flight ci.yml run first
run = 'uv run --project python dotfiles-setup docker sync'

[tasks.verify-container-latest]
description = "Gate: running devcontainer is on the latest branch code + current base + smoke"
# Enforces verify-before-advancing's devcontainer row: the running container
# must bind-mount THIS workspace (source = latest branch code, live) and pass
# scripts/devcontainer-smoke.sh, whose tier-1 image-identity check hard-fails a
# stale base (predating the current mise-system.toml). Logic is in
# python/src/dotfiles_setup/container.py (zero-bash-logic policy); this task is
# a thin caller. Use `--no-smoke` for a fast container/bind-mount pre-check.
run = 'uv run --project python dotfiles-setup docker verify-latest'

[tasks.verify-arch]
description = "R3: container runs as the targeted platform (not host passthrough)"
# Proves Requirement 3: the container is the architecture we ASKED for,
# regardless of host arch. Three independent signals: (1) docker image
# manifest architecture, (2) container uname -m, (3) container arch. All
# three must agree with $DOTFILES_PLATFORM. The host can be arm64 (macOS ARM
# via Docker Desktop Rosetta, or the deferred Colima VZ+Rosetta path) or
# amd64 (Linux CI runner); we don't check the host.
#
# #673: the expected values are DERIVED from the one platform parameter
# rather than hard-coded to amd64/x86_64 — the triple→arch and triple→uname
# mappings live in python/src/dotfiles_setup/platform_target.py
# (zero-bash-logic); the two lines below are assignments, not logic.
run = '''
set -euo pipefail
expected_arch="$(uv run --project python dotfiles-setup platform arch)"
expected_machine="$(uv run --project python dotfiles-setup platform machine)"
# #677: select by NAME, not by the devcontainer.local_folder label. That label
# is per-FOLDER, so once both architectures can be up in one directory it
# matches TWO containers and the old `| head -1` picked an arbitrary one —
# R3 would then have asserted the architecture of whichever docker listed
# first, which is a false pass in exactly the direction R3 exists to catch.
container_name="$(uv run --project python dotfiles-setup devcontainer name container)"
if [ -z "$(docker ps -q --filter "name=^${container_name}$")" ]; then
  echo "FAIL: no running devcontainer named ${container_name}" >&2
  exit 1
fi
echo "==> docker image architecture"
image_id=$(docker inspect "${container_name}" --format '{{"{{"}}.Image{{"}}"}}')
image_arch=$(docker image inspect "${image_id}" --format '{{"{{"}}.Architecture{{"}}"}}')
echo "image: ${image_arch}"
[ "${image_arch}" = "${expected_arch}" ] || { echo "FAIL: image arch is ${image_arch}, expected ${expected_arch}" >&2; exit 1; }

echo "==> container uname -m"
uname_m=$(docker exec "${container_name}" uname -m)
echo "uname -m: ${uname_m}"
[ "${uname_m}" = "${expected_machine}" ] || { echo "FAIL: uname -m is ${uname_m}, expected ${expected_machine}" >&2; exit 1; }

echo "==> container arch"
arch_out=$(docker exec "${container_name}" arch)
echo "arch: ${arch_out}"
[ "${arch_out}" = "${expected_machine}" ] || { echo "FAIL: arch is ${arch_out}, expected ${expected_machine}" >&2; exit 1; }

echo "OK: R3 container is ${DOTFILES_PLATFORM} ${expected_machine} on all three signals"
'''

[tasks.verify-ssh-inbound]
description = "R1: ssh ${USER}@localhost -p ${DEVCONTAINER_SSH_PORT} succeeds from the host"
# Proves Requirement 1: the ghcr.io/devcontainers/features/sshd feature
# is running sshd inside the container, the host port mapping is live,
# and the authorized_keys copy in postCreateCommand worked (host user
# can log in without a password). Runs on the HOST, not inside the
# container. StrictHostKeyChecking=accept-new + UserKnownHostsFile=/dev/
# null so we don't pollute the host's known_hosts with the container's
# ephemeral host keys.
env = { DEVCONTAINER_SSH_PORT = "{{ env.DEVCONTAINER_SSH_PORT | default(value='') }}" }
run = '''
set -euo pipefail
# Resolved, not defaulted (#677): the port is derived from workspace+arch
# unless DEVCONTAINER_SSH_PORT pins one, so R1 must ask the same resolver
# `mise run up` asked rather than restating a number.
port="$(uv run --project python dotfiles-setup devcontainer name port)"
echo "==> probing ssh ${USER}@localhost -p ${port}"
uv run --project python dotfiles-setup docker verify-ssh-inbound \
  --port "${port}" --user "${USER}"
echo "OK: R1 inbound ssh ${USER}@localhost -p ${port} works"
'''

[tasks.verify-secrets]
description = "S1: doppler env file exists and contains secrets"
env = { DOPPLER_PROJECT = "dotfiles", DOPPLER_CONFIG = "{{ env.DOPPLER_CONFIG | default(value='dev_personal') }}" }
run = '''
set -euo pipefail
# #893: the path carries this workspace's hash+arch, so it is RESOLVED
# (like every other devcontainer name), never composed here.
_dc_env="$(uv run --project python dotfiles-setup devcontainer env)"
eval "${_dc_env}"
envfile="${DEVCONTAINER_ENV_FILE}"
if [ ! -f "${envfile}" ]; then
  echo "FAIL: ${envfile} does not exist (run 'mise run up' to generate)" >&2
  exit 1
fi
count=$(wc -l < "${envfile}" | tr -d ' ')
if [ "${count}" -lt 1 ]; then
  echo "FAIL: ${envfile} is empty (doppler download failed?)" >&2
  exit 1
fi
# Verify canary keys are present
for key in DOPPLER_PROJECT DOPPLER_CONFIG; do
  if ! grep -q "^${key}=" "${envfile}"; then
    echo "FAIL: ${key} not found in ${envfile}" >&2
    exit 1
  fi
done
echo "OK: S1 doppler env file has ${count} secrets (project=${DOPPLER_PROJECT}, config=${DOPPLER_CONFIG})"
'''

[tasks.verify-local]
description = "Full local devcontainer validation (verify-image → up → ps → smoke → persistence → verify-ssh-inbound → verify-secrets)"
# Sequential shell body (not `depends = [...]`) so mise can't parallelize
# the steps — smoke/persistence rely on up finishing first.
# verify-ssh-inbound (R1) runs last because it needs postCreateCommand
# to have installed ~/.ssh/authorized_keys from the host-state bind
# mount. verify-secrets (S1) validates the host-side doppler env file.
#
# Image pulling: verify-image's `docker run --rm` and `up`'s
# `devcontainer up` both auto-pull when the layer is missing — no
# standalone `docker pull` step needed. To force-refresh, use
# `mise run dev-rebuild` instead of this task.
run = '''
set -euo pipefail
mise run verify-image
mise run up
mise run ps
mise run verify-arch
mise run smoke
mise run persistence
mise run verify-ssh-inbound
mise run verify-secrets
'''

[tasks.prune]
description = "Full devcontainer prune: stop container, remove volumes, images, and build cache"
run = '''
set -euo pipefail
# Scoped prune prevents deleting sibling-clone hashed home volumes
# (Codex v3 finding — broad-prefix prune was cross-clone destructive).
# The stem is `dotfiles-<basename>-<user>-<hash>`, shared by every
# architecture's volume AND by the pre-#677 one, so prune stays whole-clone
# while remaining blind to other clones.
_stem="$(uv run --project python dotfiles-setup devcontainer name legacy-volume)"
_stem="${_stem%-home}"
_hash="$(uv run --project python dotfiles-setup devcontainer name hash)"

# #803 I11: resolve BOTH the container ids and the overlay image refs HERE,
# before anything is removed. `teardown-images` reaches an image through the
# container that references it; once the container stage below has run,
# `docker inspect` can no longer answer that question, and this whole change
# would silently degrade back to a hash-scoped tag grep. `--all-arches`
# widens the container set past `mise run stop`'s single architecture — every
# container this clone owns, across BOTH architectures, plus any pre-#677
# leftover this folder owns. Identity, not a tag, is the source of truth for
# both sets now (#804 M6: the workspace-label filter used to be duplicated
# here in bash; it lives only in Python). `--container-ids` feeds
# `teardown-images` the set just captured above instead of letting it repeat
# the `docker ps` query itself — one capture, no TOCTOU between the two calls
# (#803 C6). Quoted, unlike the `xargs`-bound uses below: this one crosses a
# single `argparse` argument and must survive as one string, embedded
# newlines and all.
container_ids="$(uv run --project python dotfiles-setup devcontainer teardown --all-arches)"
overlay_images="$(uv run --project python dotfiles-setup devcontainer teardown-images --container-ids "${container_ids}")"

# The plan below is a RECORD of the resolved set, shown before the fact
# rather than after — not a confirmation gate. Nothing pauses between this
# print and the removals that follow; on a warm host the window is
# milliseconds. This set has been wrong twice already (#803: an unscoped tag
# grep took 6 of 8 sibling clones' overlays), so printing it is still worth
# doing, just not as a safety mechanism.
echo "==> prune plan for this clone (hash ${_hash})"
echo "    containers:"
echo "${container_ids:-(none)}" | sed 's/^/      /'
echo "    overlay images:"
echo "${overlay_images:-(none)}" | sed 's/^/      /'

# Differentiate "no match" (acceptable, idempotent) from "docker command
# failed" (must be loud) per feedback_never_suppress_warnings. Pattern:
# capture command output, check non-empty, then act. Daemon failures
# propagate via set -e on the capturing subshell — which now means a failed
# lookup (e.g. the docker daemon is down) aborts prune HERE, before the
# "stopping container" line prints, rather than after it as before this
# change. That is correct (a failed lookup is a failed teardown, I10) but the
# failure now surfaces one step earlier than a reader of the old script would
# expect.
echo "==> stopping container"
if [ -n "${container_ids}" ]; then
  # shellcheck disable=SC2086
  docker rm -f ${container_ids}
else
  echo "    (no container for this clone — already stopped)"
fi

echo "==> removing named volumes (scoped to hash ${_hash})"
all_volumes="$(docker volume ls --format '{{"{{"}}.Name{{"}}"}}')"
hashed_volumes="$(echo "${all_volumes}" | grep -E "^${_stem}" || true)"
if [ -n "${hashed_volumes}" ]; then
  # Named before removed, same reason as the plan block above. These cannot
  # join it: they are resolved after the container stage, by design (#800).
  echo "${hashed_volumes}" | sed 's/^/      /'
  echo "${hashed_volumes}" | xargs docker volume rm
else
  echo "    (no hashed volumes for ${_hash} — already removed)"
fi

# Also clean up any ORPHANED legacy volumes from the pre-v6 per-directory
# layout (mise-user / cargo-user / rustup-user). Bounded by the
# basename+user prefix so only this repo's orphans are targeted.
legacy_volumes="$(echo "${all_volumes}" | grep -E "^dotfiles-$(basename "$PWD")-${USER}-(mise-user|cargo-user|rustup-user)$" || true)"
if [ -n "${legacy_volumes}" ]; then
  echo "==> removing legacy v5 volumes"
  echo "${legacy_volumes}" | xargs docker volume rm
fi

echo "==> removing overlay images"
# #803: resolved by container identity (this clone's containers, every
# architecture) plus two derivable orphan-tag shapes for an overlay whose
# container is already gone — never by an unscoped tag grep, which matched
# every OTHER clone's overlay too (measured: 6 of 8 image ids on the
# maintainer's host) and could not see an untagged overlay at all.
if [ -n "${overlay_images}" ]; then
  echo "${overlay_images}" | xargs docker rmi
else
  # Not necessarily "already removed" (#803 E4): an image `docker image
  # inspect` could not identify is refused rather than removed (C1, logged
  # as a warning), so this empty set can also mean "nothing was resolved to
  # remove" rather than "there was nothing to remove".
  echo "    (no overlay image resolved for this clone)"
fi

echo "==> pruning build cache"
docker builder prune -f
echo "==> done"
'''

[tasks.stop]
description = "Tear the devcontainer down (no 'devcontainer down' verb in v0.85.0)"
alias = "down"
# devcontainer CLI v0.85.0 has no 'down' verb (verified 2026-04-06 via
# `devcontainer --help`; verbs: up, set-up, build, run-user-commands,
# read-configuration, outdated, upgrade, features, templates, exec).
# Teardown uses `docker rm -f` filtered on the workspace-folder label
# that the devcontainer CLI applies to every container it creates.
#
# R2 outbound now uses Docker Desktop's native magic socket — no host
# proxy to tear down (deleted in #77 stage 2).
run = '''
set -euo pipefail
# #677: which containers to remove is a DECISION, not a filter — this
# architecture's container by our id labels, plus any pre-#677 leftover this
# folder owns that carries none of our labels. A bare per-folder filter would
# also kill the OTHER architecture once both are up. [[zero-bash-logic]].
container_ids="$(uv run --project python dotfiles-setup devcontainer teardown)"
if [ -n "${container_ids}" ]; then
  # shellcheck disable=SC2086
  docker rm -f ${container_ids}
else
  echo "(no container for this workspace + architecture — already stopped)"
fi
'''

[tasks.build]
description = "Build the docker image locally using docker bake"
run = "docker buildx bake dev-load"

[tasks.fmt]
description = "Auto-fix formatting issues"
run = "hk fix"

[tasks.outdated]
description = "Check for outdated tool versions"
run = "mise outdated"

[tasks.validate]
description = "Validate Docker and CI contracts"
run = "docker buildx bake validate"

[tasks.pin-actions]
description = "Verify GHA actions are SHA-pinned"
run = "pinact run --verify"

[tasks.parity]
description = "Assert the declared cross-repo shared set (parity.toml) holds in dotfiles + knowledge-base"
# Reads the sibling repo, so it cannot be an hk step: hk runs on a checkout of
# THIS repo alone. CI checks knowledge-base out inside the workspace and points
# KB_REPO_PATH at it (contract-preflight); locally it defaults to the sibling
# directory and SKIPs loudly when absent. In CI absence is a hard FAIL — see
# python/src/dotfiles_setup/parity.py for why that asymmetry is the point.
run = "uv run --project python dotfiles-setup parity"

[tasks.eval]
description = "Eval harness, tiers 1+2 (offline, gated; `-- --live` adds the lane doctor)"
# Tier 0 is suites.toml (`orchestration.*` / `eval.*`) — is it DECLARED? Tier 1
# — does it RESOLVE? Tier 2 — does the wired guard DECIDE correctly? All three
# are different questions: a lane can be named in doctrine, in both repos, with
# a passing contract, while its CLI is absent (#354); and a guard can be
# declared AND wired AND still deny a legitimate command (#265).
#
# ONE COMMAND PER ENGINE, not one overall: tiers 1+2 share the runner so they
# share this command, while tier 0 stays in `dotfiles-setup verify run`. Folding
# tier 0 in here would run ~103 contracts twice per ship.
#
# Offline by default so it joins the ship gates for free. `--live` shells out to
# the fable-orchestrator plugin's doctor.sh, which has NO offline mode and spends
# one real API call per installed lane. Runner is the SHARED kb_setup.evals;
# this repo's cases are dotfiles_setup.eval_cases.
run = "uv run --project python dotfiles-setup eval"

[tasks.hk-audit]
description = "Regenerate docs/hk-builtins-audit.md from `hk builtins` + the hk configs"
run = "uv run --project python dotfiles-setup hk-builtins-audit"

[tasks.codex-agent-parity]
description = "Assert the hand-authored codex agent lanes stay paired + at xhigh"
# Thin caller; see python/src/dotfiles_setup/codex_agent_parity.py. Also wired as
# the `codex_agent_parity` hk step, so `mise run lint` covers it.
run = "uv run --project python dotfiles-setup codex-agent-parity"

[tasks.lint-docs]
description = "Validate agent documentation"
# --strict: warnings-as-errors (#250) — parity with ci.yml + the hk agnix step.
run = "agnix . --strict"

[tasks.mise-config-context]
description = "PostToolUse hook body: emit the native-first context when a mise config file was just edited"
# Thin caller; see python/src/dotfiles_setup/mise_config_context.py. Wired from
# .claude/settings.json as a PostToolUse hook on Edit|Write|NotebookEdit. It
# reads the hook payload on stdin and writes JSON to stdout; mise's own task
# banner goes to STDERR (probed), so stdout stays a clean JSON channel.
# No shell wrapper, per zero-bash-logic. The HOOK does NOT route through this
# task: the task is defined in mise.toml, which is one of the files the hook
# guards, so a wholesale Write that replaces mise.toml would delete the task
# before PostToolUse could run it (`no task mise-config-context found`, rc 1)
# — the hook would fail in exactly its motivating case. settings.json calls
# `uv run --project <root>/python dotfiles-setup mise-config-context` directly.
# This task remains the manual entry point.
run = 'uv run --project python dotfiles-setup mise-config-context'
quiet = true

[tasks.lock]
description = "Re-lock the NAMED tool(s), scoped, then assert coverage held"
# Thin caller; see lock_integrity.py. The task no longer runs a bare
# `mise lock`, because that form is destructive on this macOS host: it
# re-locks the WHOLE file for this platform, and macOS mise cannot write
# linux-x64 conda entries (jdx/mise#7700, #370). Measured 2026-07-29 on mise
# 2026.7.16 with every tool installed and NO config change — conda entries
# 962 -> 427, linux-x64 628 -> 80. `mise lock --dry-run` does not reveal it.
# Invocation names the tool, using the FULL backend-qualified config key:
#   mise run lock -- "aqua:jackchuka/mdschema"
# A bare short name exits 0 having silently done nothing, so the wrapper
# verifies the artifact afterwards instead of trusting the exit code.
run = 'uv run --project python dotfiles-setup lock-tools'

[tasks.lock-shared]
description = "Re-lock the NAMED tool(s) in the SHARED host<->image lockfile (.config/mise/mise.lock) with LINUX-native asset resolution; routes into the amd64 devcontainer from macOS"
# Thin caller; see lock_shared.py. `lock` above never leaves this host, which
# is right for the root lock but wrong here: mise resolves a DIFFERENT
# release asset than macOS for at least one shared tool, and the choice is
# made by the RESOLVING host, not by the platform being locked for. Measured
# 2026-08-27: bumping uv 0.12.4 -> 0.12.6 via `mise run lock -- uv` on this
# macOS host wrote the gnu tarball into the linux-x64 platform entry; mise on
# linux resolves musl for that same entry, so a linux runner would have
# downloaded the gnu tarball, extracted it to a gnu-named directory, and then
# looked for the binary under the musl path — `uv: not found`, cascading into
# ~18 hk steps. Every local gate passed, because macOS exercises the macOS
# entries. `lock-image` (below) does not cover this either: it only ever
# touches the two `.devcontainer/*.lock` files, never `.config/mise/mise.lock`.
#
#   mise run lock-shared -- "uv"          # derive host capability, auto-route
#   mise run lock-shared -- --no-container "uv"  # fail instead of routing
run = 'uv run --project python dotfiles-setup lock-shared'

[tasks.token-check]
description = "Pre-flight a candidate contract token: does it bind exactly one site in its target file? (#652)"
# Thin caller; see token_audit.py. Same predicate as the `token-audit` gate in
# `mise run verify`, asked EARLY — the gate can only speak once the contract
# exists, so its finding arrives after the work, while this one costs one edit.
# A token matching more than once can be satisfied by a stand-in, which is how
# a deleted registration stayed green (#394); a token matching zero times means
# the path or the spelling is wrong.
#
#   mise run token-check -- <file> "<token>" ["<token>" ...]
#   mise run token-check -- <file> "<token>" --expect 2   # deliberate multiplicity
run = 'uv run --project python dotfiles-setup token-audit --check'

[tasks.lock-image]
description = "Regenerate the IMAGE locks (mise-system.lock + mise-runtime.lock) with CI's recipe, coverage-verified; routes into the amd64 devcontainer from macOS"
# Thin caller; see image_lock.py. Sibling of `lock` above, and the division is
# by ARTIFACT: `lock` re-locks named tools in the HOST lockfile, this rebuilds
# the two IMAGE locks wholesale. Until #650 the only thing that knew this
# recipe was .github/actions/lock-refresh/action.yml, so a session bumping the
# shared fragment hand-transcribed it from a workflow — ~15 turns on
# 2026-08-08, ending in a near-committed 51% coverage loss that the collect
# step returned rc=0 on (#648, now fixed by verifying against HEAD).
#
# macOS CANNOT do this: mise there cannot write the linux conda checksums
# (jdx/mise#7700) and the tool count does not move, so the truncation is
# silent. The default routes into the devcontainer rather than refusing.
#
#   mise run lock-image                          # derive platforms, auto-route
#   mise run lock-image -- --platform linux-x64  # narrow it deliberately
#   mise run lock-image -- --no-container        # fail instead of routing
run = 'uv run --project python dotfiles-setup image-lock'

[tasks.p2996-hash]
description = "Print the content-hash of P2996 cache inputs (matches the CI :p2996-<hash> tag)"
run = "uv run --project python dotfiles-setup p2996-hash"

[tasks.p2996-refresh]
description = "Bump CLANG_P2996_REF in docker-bake.hcl to the latest bloomberg/clang-p2996 p2996-branch HEAD (writes only on change; the scheduled refresh.yml workflow's p2996-refresh job does this in CI)"
run = "uv run --project python dotfiles-setup p2996-refresh"

[tasks.cc]
description = "Launch Claude Code rooted in THIS repo with a VERIFIED environment (tmux, --add-dir knowledge-base, auto mode)"
# raw: mise normally CAPTURES a task's output so it can prefix each line with
# `[cc]`, which leaves the child with NO TTY — tmux then dies with "open terminal
# failed: not a terminal", and the buffering even prints that error BEFORE the
# preflight lines. `raw` connects stdin/stdout/stderr straight through, which an
# interactive session requires. Without it this task can never attach.
raw = true
# Thin BY DESIGN. Every decision — PATH hygiene, the tmux env injection, and a
# preflight that can REFUSE — lives in `kb_setup.launch`, shared by both repos so
# the two launchers cannot drift. That module's docstring carries the
# measurements; the short version:
#
#   * a stale `mise/installs/<tool>/<ver>/bin` entry can shadow the shims and
#     does NOT follow the pin (MISE_ENV_CACHE freezes it), so the whole CLASS is
#     stripped rather than a named version — naming one is how the previous
#     guard went inert;
#   * tmux hands a NEW session the SERVER's environment, not the caller's, so
#     the verified PATH is injected explicitly via `new-session -e PATH=...`;
#   * it REFUSES to launch unless graphify resolves through the shims AT this
#     repo's pinned version. A corpus rebuilt by one version and stamped with
#     another is unfalsifiable afterwards, and that is the one failure this
#     queue cannot absorb.
#
# `--root "$MISE_PROJECT_ROOT"` is NOT optional: the CLI otherwise derives the
# root from the CWD, and inside a mise task the CWD is wherever mise was invoked
# from, not the repo (measured). Session name: CC_TMUX_SESSION, default the repo.
# Single-quoted TOML so the inner double quotes need no escaping.
run = 'uv run --project python kb-setup cc --root "$MISE_PROJECT_ROOT" --sibling "$MISE_PROJECT_ROOT/../knowledge-base"'

# macOS user LaunchAgent for the dag-tick watchdog (#578). This section is
# DECLARATIVE ONLY — mise never writes or loads a LaunchAgent implicitly
# (`.claude/rules/do-not.md`); a human runs
# `mise bootstrap macos launchd-agents apply` to write
# ~/Library/LaunchAgents/dev.mise.dotfiles-dag-tick.plist and load it, and
# `mise bootstrap macos launchd-agents status` to check drift. Plain
# `mise bootstrap` (no subcommand) ALSO applies this block — it is step 11
# of the bootstrap sequence per the LIVE `mise bootstrap --help` at 2026.8.2
# (the vendored docs snapshot says 7; the binary wins — it gained steps
# since). Nothing in THIS repo auto-runs either `mise bootstrap` or
# `mise bootstrap macos launchd-agents apply` — both are always a human's
# explicit call.
#
# Tracked here in `mise.toml`, not in the gitignored `mise.local.toml`, on
# purpose (#578 respec round 3): this LaunchAgent IS the feature this
# ticket ships, not a per-clone preference — every clone of this repo gets
# the same watchdog by declaring it, and a change to its schedule/PATH/
# working directory is a reviewable diff in this file, not silent drift in
# a file `git status` never sees.
#
# `program` is the literal `mise` BINARY path, not the name — `mise` is a
# zsh function on this host (shell activation), which launchd cannot exec.

[bootstrap.macos.launchd.agents.dotfiles-dag-tick]
program = "~/.local/bin/mise"
args = ["run", "dag-tick"]
start_interval = 60
working_directory = "~/dev/github/ray-manaloto/dotfiles"
stdout_path = "~/Library/Logs/dotfiles-dag-tick.log"
stderr_path = "~/Library/Logs/dotfiles-dag-tick.err.log"
# `environment` values are NOT ~-expanded (unlike program/working_directory/
# std*_path above), so this is the literal absolute PATH launchd needs to
# find `uv` and the mise-shimmed `dotfiles-setup` the task shells out to.
# The shims dir is prepended (not appended): it is the non-interactive
# access path to mise-managed tools (no shell activation, no `mise exec`
# wrapper needed) — a watchdog-respawned supervisor and the workers it
# spawns inherit this PATH, and they need mise's own binaries resolvable
# the same way a `mise run` invocation would find them.
environment = { PATH = "/Users/rmanaloto/.local/share/mise/shims:/Users/rmanaloto/.local/bin:/opt/homebrew/bin:/usr/bin:/bin" }

# --- #602 phase 4: the tracker projection, on its OWN schedule ---------------
#
# Separate from the tick above, and the separation is the design: `575.md` R1
# assigns projection to the SCHEDULER while the tick is the WATCHDOG, and a tick
# that labelled directly would put a second writer on the tracker. Keeping them
# as two agents means #573's pull loop absorbs this one as a phase by re-wiring
# a LaunchAgent, never by refactoring the watchdog.
#
# **300s, not 60s, and that is deliberate.** The watchdog's 60s exists because a
# crashed process should be recovered fast. A human's QUESTION does not become
# more answerable at 60s than at 5 minutes, and the tracker is a shared,
# rate-limited resource. Do not "align" this with the tick.
#
# `--write` is passed explicitly because the CLI REFUSES a bare invocation
# (rc=2): posting to the tracker is outward-facing and must never be what a
# default falls into. The `--` separates mise's own flags from the task's.
#
# ⚠️ Armed only after the LIVE two-run gate passed on 2026-08-07 (scratch issue
# #629): run 1 posted exactly one comment and applied the label, run 2 skipped as
# a duplicate and posted NOTHING, and the payload round-tripped verbatim through
# the real `gh --body`. An injected recorder cannot catch a malformed body or a
# wrong `-R`; that gate can, and the spec made it the precondition for this block
# existing. Do not widen this agent's job without re-running it.
#
# INERT until a human runs `mise bootstrap macos launchd-agents apply` — never
# implicit (`.claude/rules/do-not.md`), so a tracked entry cannot surprise CI or
# a fresh clone.
[bootstrap.macos.launchd.agents.dotfiles-dag-project]
program = "~/.local/bin/mise"
args = ["run", "dag-project", "--", "--write"]
start_interval = 300
working_directory = "~/dev/github/ray-manaloto/dotfiles"
stdout_path = "~/Library/Logs/dotfiles-dag-project.log"
stderr_path = "~/Library/Logs/dotfiles-dag-project.err.log"
# Same literal PATH as the tick, and for the same reason: `environment` values
# are NOT ~-expanded, and `gh` must resolve from the mise shims. Measured under
# exactly this PATH: `gh auth status` rc=0 via ~/.config/gh/hosts.yml (a `gho_`
# token with `repo` scope — NOT the shell's GITHUB_TOKEN, which launchd does not
# inherit), and a live `gh api` call rc=0. That measurement is why this agent
# needs no credential plumbing of its own.
environment = { PATH = "/Users/rmanaloto/.local/share/mise/shims:/Users/rmanaloto/.local/bin:/opt/homebrew/bin:/usr/bin:/bin" }

[tasks.session-review]
description = "Review Claude and Codex requirements plus manual-work candidates (#654/#715)"
# Thin caller; see session_review.py. The default runs requirement coverage plus
# the two automation-candidate lanes —
# lane 1 ranks recurring command shapes by session spread, lane 2 surfaces the
# reasoning sinks that leave no repeated command (#650 was ~15 turns with no
# repeated one-liner, so lane 1 alone would have missed the best candidate).
# Sibling of `command-audit`, which mines the same transcripts for a different
# verdict: that one asks "should this be a GUARD REDIRECT", this one asks
# "should this be a SKILL".
#
#   mise run session-review                          # all three lanes
#   mise run session-review -- --output .agent/session-review.md
#   mise run session-review -- --narrative-only      # cheap re-check
#   mise run session-review -- --requirements-only   # lossless evidence ledger
run = 'uv run --project python dotfiles-setup session-review'

[tasks.session-requirements]
description = "Review bounded Claude roots and the active Codex root for requirements and promises"
# Requirements-only remains a focused seam; default session-review includes it.
# Unknown transcript records exit non-zero instead of reading as "no issues".
usage = '''
arg "<source_repo_root>" help="Exact checkout path recorded in the transcripts"
arg "[max_sessions]" help="Maximum root sessions to review" default="5"
arg "[max_iterations]" help="Maximum agent-team prevention passes (1-5)" default="1"
'''
run = 'uv run --project python dotfiles-setup session-review --requirements-only --sessions "${usage_max_sessions?}" --max-iterations "${usage_max_iterations?}" --source-repo-root "${usage_source_repo_root?}" --output .agent/session-review.md'

[tasks.session-review-gate]
description = "Trusted bounded runner for session-review mutation, gate, and GitHub receipts"
run = 'uv run --project python python -m dotfiles_setup.session_gate'

[tasks.session-review-mutation-credential-launcher]
description = "Hostile credential-launcher mutant sentinel for session review"
run = 'uv run --project python python -m dotfiles_setup.session_gate --repo-root "$MISE_PROJECT_ROOT" mutation-sentinel --prevention-id credential-launcher'

[tasks.session-review-mutation-git-hook-contamination]
description = "Hostile Git-hook-contamination mutant sentinel for session review"
run = 'uv run --project python python -m dotfiles_setup.session_gate --repo-root "$MISE_PROJECT_ROOT" mutation-sentinel --prevention-id git-hook-contamination'

[tasks.skillopt-provenance-check]
description = "Verify SkillOpt GitHub objects and three present-day hostile replays"
run = "uv run --project python python -m dotfiles_setup.skillopt_provenance"

[tasks.session-review-focused-gate]
description = "Normal session-review prevention gate"
run = 'uv run --project python python -m dotfiles_setup.session_gate --repo-root "$MISE_PROJECT_ROOT" prevention-check'

[tasks.lint-delta]
description = "Partition linter violations into YOURS vs THE UPGRADE'S by running the previous pinned version against the same tree (#651)"
# Thin caller; see lint_delta.py. A linter bump makes every newly-enabled rule
# look like a regression in your own change: measured 2026-08-08, ruff
# 0.15.20 -> 0.16.2 went 2 -> 138 violations on ONE unchanged tree. The old
# version IS the control arm, so every difference belongs to the bump.
#
#   mise run lint-delta                              # ruff, baseline derived
#   mise run lint-delta -- --tool ty
#   mise run lint-delta -- --baseline 0.15.20
run = 'uv run --project python dotfiles-setup lint-delta'

[tasks.reap]
description = "Reap wedged processes by pattern and age, ancestor-protected (#653). DRY RUN unless --kill"
# Thin caller; see reap.py. The 2026-08-08 pile was 1,174 wedged mise/shims/git
# processes with a stuck `fnox export` child each — 2,362 to clear, oldest
# 1d10h. Reaping them safely needs ancestor-chain protection (or it kills the
# shell that ran it), an age floor, exact matching under a pattern you supply
# rather than a pkill substring, and TERM-then-KILL with a liveness re-check.
# `--kill` is required to signal anything, like `lock`/`lock-image` refuse
# their unsafe forms. A reap removes PID and MEMORY pressure, NOT load.
#
#   mise run reap -- --pattern 'fnox export'                    # dry run
#   mise run reap -- --pattern 'shims/git' --min-age 3600
#   mise run reap -- --pattern 'fnox export' --kill             # signals
run = 'uv run --project python dotfiles-setup reap'
