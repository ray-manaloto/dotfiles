min_version = "2026.10.20"
monorepo_root = true

[monorepo]
config_roots = ["typescript", "python", "python/toolchains/p2996", "python/repo", "python/workflow", "python/cbm", "python/home", "python/visualplan", "python/jbctl", "python/depmaps", "python/guards", "cpp", "swift"]
lockfile = true

[monorepo.path_aliases]
p2996 = "python/toolchains/p2996"
repo = "python/repo"
workflow = "python/workflow"
cbm = "python/cbm"
home = "python/home"
visualplan = "python/visualplan"
jbctl = "python/jbctl"
depmaps = "python/depmaps"
guards = "python/guards"

[settings]
lockfile = true
# `mise use` and `mise upgrade --bump` write the resolved version, not the request
pin = true
minimum_release_age = "0s"
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]
# Keep each task's last output for `mise tasks log` (and `mise run test:times`).
task.logs = true

[tasks.test]
description = "Run every language root's tests"
depends = ["//typescript:test", "//python:test", "//repo:test", "//workflow:test", "//cbm:test", "//home:test", "//visualplan:test", "//jbctl:test", "//guards:test", "//cpp:test", "//swift:test"]
run = "echo all tests passed"

[tasks."test:times"]
description = "Each test task's runs, median and last time, and its last run's 25 slowest tests, one JSON line per task"
run = "uv run --project python/repo --locked repotools test-times"

# Private values that must never reach a tracked file or a pushed commit. Rendered on each machine from its own
# environment, so the repo never holds them; privacy:scan reads them through its env.
[vars]
private_home = "{{ env.HOME }}"
private_user = "{{ env.USER }}"
# What shell:apply backs up and shell:rollback restores, relative to $HOME.
# The old .zprofile, .zshrc and .zshrc.d stay listed: a rollback puts the pre-ZDOTDIR layout back.
shell_backup_paths = ".zshenv .zprofile .zshrc .zprofile.d .zshrc.d .config/zsh"

[tasks."privacy:scan"]
description = "Refuse this machine's home path in tracked files, given files, or outgoing commits"
env = { PRIVATE_PATTERNS = "{{ vars.private_home }}\n/Users/{{ vars.private_user }}/\n/home/{{ vars.private_user }}/" }
usage = '''
flag "--outgoing" help="Scan every commit not yet on a remote, branches and tags (pre-push)"
arg "[file]" var=#true help="Files to scan; default every tracked file"
'''
# --option=value: a value that starts with - would otherwise be read by argparse as an option.
run = 'uv run --project python/repo --locked repotools privacy-scan --patterns="$PRIVATE_PATTERNS" --files="${usage_file:-}" ${usage_outgoing:+--outgoing}'

[tasks."shell:apply"]
description = "Back up the live zsh files, check a shell from the new ones, then link them into $HOME"
env = { SHELL_BACKUP_PATHS = "{{ vars.shell_backup_paths }}" }
run = "uv run --project python/repo --locked repotools shell-apply"

[tasks."shell:rollback"]
description = "Restore the zsh files from the pre-apply backup"
env = { SHELL_BACKUP_PATHS = "{{ vars.shell_backup_paths }}" }
run = "uv run --project python/repo --locked repotools shell-rollback"

# Here, not in python/repo: that config's _.python.venv takes a lock under ~/.cache/mise on every run.
# No usage spec, so mise appends the arguments to the line, each quoted; raw keeps both streams unprefixed, and
# raw_args hands a --help to the command, not to mise (v2026.11.2 src/cli/run.rs:911-915).
[tasks."scratch:env"]
description = "Run one command from this checkout with every home path inside a scratch folder"
raw = true
raw_args = true
run = "uv run --project python/repo --locked repotools scratch-env"

[tasks.pre-commit]
run = "hk run pre-commit"

# Run after staging a Python unit; fix or answer every finding, then rerun until PASS. A full PASS
# records a fingerprint of the staged python/ files, which the pre-commit hook compares. repotools
# review-python does the work (python/repo/src/repotools/gates.py).
# Pattern: jazzsequence/jazz-nextjs@9c427f84 .githooks/lib/approval.sh:48-64 (index fingerprint from
# `git ls-files -s`, so a later `git add` voids the approval); Open-BFME/Open-BFME-1@5a6f78cf
# .githooks/pre-commit:411,640 does it with `git write-tree`. Both were found by the review-gate-* saved
# searches of the retired marketplace project.
[tasks."review:python"]
description = "A read-only Codex reviewer checks the uncommitted changes against CODING_STANDARDS.md"
usage = '''
arg "[path]" default="python" help="Directory whose uncommitted changes are reviewed"
flag "--commit <sha>" help="Review this commit instead of the uncommitted changes"
flag "--out <file>" help="Report file (default review-python.md in the git dir, never tracked)"
'''
# --option=value: a value that starts with - would otherwise be read by argparse as an option.
run = 'uv run --project python/repo --locked repotools review-python --path="$usage_path" ${usage_commit:+--commit="$usage_commit"} ${usage_out:+--out="$usage_out"}'

[tasks."review:python:approved"]
description = "Refuse unless review:python passed on exactly the staged python/ files"
run = "uv run --project python/repo --locked repotools review-python-approved"

# The ~/.gemini/config/skills entry's source is ~/.agents/skills, outside the repo, and one missing source stops
# the whole apply (mise 2026.11.6 crates/mise-system/src/files.rs:5722-5806). This hook runs before every
# `mise dot apply` and bootstrap's dotfiles step (src/cli/dotfiles/apply.rs:27), so a new Mac has the folder.
[bootstrap.hooks.pre-dotfiles]
run = "mkdir -p ~/.agents/skills"

[dotfiles]
"~/.config/mise/config.toml" = { source = "unix/home/.config/mise/config.toml", mode = "symlink" }
"~/.config/mise/miserc.toml" = { source = "unix/home/.config/mise/miserc.toml", mode = "symlink" }
"~/.config/mise/locks" = { source = "unix/home/.config/mise/locks", mode = "symlink" }
"~/.config/mise/mise.lock" = { source = "unix/home/.config/mise/mise.lock", mode = "symlink" }
"~/.config/mise/tasks" = { source = "unix/home/.config/mise/tasks", mode = "symlink" }
"~/.config/fnox/config.toml" = { source = "unix/home/.config/fnox/config.toml", mode = "symlink" }
"~/.config/starship.toml" = { source = "unix/home/.config/starship.toml", mode = "symlink" }
# The OpenCode service binds loopback only (tailnet-only ruling, 2026-11-11): service.json also holds the
# service password, so this owns only its hostname key and leaves the rest to opencode. Unset, opencode 2.2.7
# binds 127.0.0.1 (packages/cli/src/server-process.ts:72); a 0.0.0.0 left by `opencode service set hostname`
# opened it to the LAN. No routine task applies this entry (shell:apply names its own targets): on each Mac run
# mise dot apply "~/.config/opencode/service.json/bind" from the main checkout, then
# `opencode service set hostname 127.0.0.1`, which stops the running service (service-config.ts:273-276) so its
# supervisor starts it again on loopback. The target assumes neither OPENCODE_CONFIG_DIR nor XDG_CONFIG_HOME
# moves opencode's config folder.
"~/.config/opencode/service.json/bind" = { source = "unix/home/.config/opencode/service.bind.json", merge = true, permissions = "0600" }
# OpenCode's context7 and exa servers send the key as a Bearer header from its own {env:VAR} syntax
# (packages/core/src/config/variable.ts:25-28 at v2.2.7), so `fnox proxy run` can swap the placeholder for the real
# key. This owns only those headers; the old literal "${CONTEXT7_API_KEY}" header is not removed by a merge.
"~/.config/opencode/opencode.json/mcp-keys" = { source = "unix/home/.config/opencode/mcp-keys.json", merge = true }
# Claude's apify MCP server gets its key from `fnox get` at each connect (headersHelper,
# https://code.claude.com/docs/en/mcp; 10 s limit), with an explicit PATH as 1natsu172/dotfiles
# bin/claude-utils/mcp-auth-header.sh:22,35 and fapont/dotfiles modules/agents/claude/mcp.json:6 do. A missing key
# (if_missing = "warn" makes `fnox get` print nothing and exit 0) or a failed get exits non-zero instead of sending an
# empty header. Claude Code rewrites ~/.claude.json while it runs, so write this entry with Claude's own CLI
# (`claude mcp add-json apify '<this JSON>' -s user`) rather than a whole-root apply.
"~/.claude.json/mcp-apify" = { source = "unix/home/.claude.mcp-apify.json", merge = true, permissions = "0600" }
# The apify plugin stays enabled for its skills and agent, but its own MCP server (plugin:apify:apify, OAuth) is
# denied: the user-scope `apify` server above is the one with the key. deniedMcpServers merges from every settings
# source, so a user can deny servers for themselves (Claude Code 2.1.322 settings schema, allowManagedMcpServersOnly).
"~/.claude/settings.json/mcp-deny" = { source = "unix/home/.claude/settings.mcp-deny.json", merge = true }
# No grayed-out prompt suggestions in the input box: a suggestion looks like a typed draft, so an agent sending to a
# tab can't tell it from the owner's text (owner ruling 2026-11-11). Claude Code 2.1.322 reads promptSuggestionEnabled
# from settings unless CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION is set (https://code.claude.com/docs/en/settings-reference).
"~/.claude/settings.json/prompt-suggestions" = { source = "unix/home/.claude/settings.prompt-suggestions.json", merge = true }
# The dependency-map registry (#510): which deps `//depmaps:sync` maps, never their versions.
"~/.config/dep-maps/deps.json" = { source = "unix/home/.config/dep-maps/deps.json", mode = "symlink" }
# zsh reads everything but ~/.zshenv from $ZDOTDIR=~/.config/zsh (set in ~/.zshenv), so ~/.zprofile and ~/.zshrc are
# unused: an installer that appends to them edits nothing tracked. Separate entries, so ~/.config/zsh/.zshrc.d stays
# a real folder. Applied by shell:apply, which backs up first.
"~/.config/zsh/.zshrc.d/60-agent-tools.zsh" = { source = "unix/home/.config/zsh/.zshrc.d/60-agent-tools.zsh", mode = "symlink" }
"~/.zshenv" = { source = "unix/home/.zshenv", mode = "symlink" }
# The same file again: ZDOTDIR is exported, so a zsh started inside another one reads $ZDOTDIR/.zshenv, not ~/.zshenv.
"~/.config/zsh/.zshenv" = { source = "unix/home/.zshenv", mode = "symlink" }
"~/.config/zsh/.zprofile" = { source = "unix/home/.config/zsh/.zprofile", mode = "symlink" }
"~/.config/zsh/.zshrc" = { source = "unix/home/.config/zsh/.zshrc", mode = "symlink" }
"~/.config/zsh/.zshrc.d/10-zsh.zsh" = { source = "unix/home/.config/zsh/.zshrc.d/10-zsh.zsh", mode = "symlink" }
"~/.config/zsh/.zshrc.d/90-mise.zsh" = { source = "unix/home/.config/zsh/.zshrc.d/90-mise.zsh", mode = "symlink" }
"~/.config/zsh/path.zsh" = { source = "unix/home/.config/zsh/path.zsh", mode = "symlink" }
"~/.config/herdr-app/programs.json" = { source = "unix/home/.config/herdr-app/programs.json", mode = "symlink" }
"~/.local/bin/codex-hc" = { source = "unix/home/.local/bin/codex-hc", mode = "symlink" }
# hc calls that can't start a second core (docs/agents/herdr-core.md): the herdr cutover's coordinator and /verify.
"~/.local/bin/hc-safe" = { source = "unix/home/.local/bin/hc-safe", mode = "symlink" }
# The Codex profile for isolated, read-only adversarial reviews (codex exec --profile adversarial-review).
"~/.codex/adversarial-review.config.toml" = { source = "unix/home/.codex/adversarial-review.config.toml", mode = "symlink" }
# A skill written here: Codex reads ~/.agents/skills and Claude ~/.claude/skills, so both link to it.
"~/.agents/skills/macos-agent-permissions" = { source = "unix/home/.agents/skills/macos-agent-permissions", mode = "symlink" }
"~/.claude/skills/macos-agent-permissions" = { source = "unix/home/.agents/skills/macos-agent-permissions", mode = "symlink" }
"~/.agents/skills/visual-plan" = { source = "unix/home/.agents/skills/visual-plan", mode = "symlink" }
"~/.claude/skills/visual-plan" = { source = "unix/home/.agents/skills/visual-plan", mode = "symlink" }
# TokenEconomizer's global policy, copied (TE rewrites the file, which would break a symlink). Change it
# with `te --host claude config set --global ...`, then capture it from the main checkout with
# `mise dot add ~/.tokeneconomizer/config.json` before any `mise dot apply`: an apply overwrites an
# uncaptured live change without asking. The second entry only sets the folder's mode.
"~/.tokeneconomizer/config.json" = { source = "unix/home/.tokeneconomizer/config.json", mode = "copy", permissions = "0600" }
"~/.tokeneconomizer" = { permissions = "0700" }
# The shared agent rules (#449): one tracked file, linked where an agent reads a plain file, imported by
# Claude Code. codebase-memory-mcp's block in it is verbatim, so its installer rewrites nothing; ctx7 setup
# never runs against it (decision 40).
"~/.config/agents/AGENTS.md" = { source = "unix/home/.config/agents/AGENTS.md", mode = "symlink" }
"~/.codex/AGENTS.md" = { source = "unix/home/.config/agents/AGENTS.md", mode = "symlink" }
"~/.gemini/GEMINI.md" = { source = "unix/home/.config/agents/AGENTS.md", mode = "symlink" }
"~/.claude/CLAUDE.md/agents" = { block = '''
@~/.config/agents/AGENTS.md
''' }
# The paths the shared file and the skills point at (#449, #453). Folder links: ~/.config/agents holds only
# what dotfiles delivers, so its subfolders need not stay real folders.
"~/.config/agents/workflow" = { source = "unix/home/.config/agents/workflow", mode = "symlink" }
"~/.config/agents/skills" = { source = "unix/home/.config/agents/skills", mode = "symlink" }
# ticket-retro (#453): the user-scope skill, one folder for both agents; the LICENSE sits beside it in the source.
"~/.claude/skills/ticket-retro" = { source = "unix/home/.config/agents/skills/ticket-retro", mode = "symlink" }
"~/.agents/skills/ticket-retro" = { source = "unix/home/.config/agents/skills/ticket-retro", mode = "symlink" }
# work (#455): sets a repository up on first use; user scope only, like ticket-retro.
"~/.claude/skills/work" = { source = "unix/home/.config/agents/skills/work", mode = "symlink" }
"~/.agents/skills/work" = { source = "unix/home/.config/agents/skills/work", mode = "symlink" }
# to-spec and to-tickets (#451): the publishing skills; user scope only, like ticket-retro.
"~/.claude/skills/to-spec" = { source = "unix/home/.config/agents/skills/to-spec", mode = "symlink" }
"~/.agents/skills/to-spec" = { source = "unix/home/.config/agents/skills/to-spec", mode = "symlink" }
"~/.claude/skills/to-tickets" = { source = "unix/home/.config/agents/skills/to-tickets", mode = "symlink" }
"~/.agents/skills/to-tickets" = { source = "unix/home/.config/agents/skills/to-tickets", mode = "symlink" }
# implement, implement-spec (#452): worker skills pinned by PLAN_ID; user scope only, like ticket-retro.
"~/.claude/skills/implement" = { source = "unix/home/.config/agents/skills/implement", mode = "symlink" }
"~/.agents/skills/implement" = { source = "unix/home/.config/agents/skills/implement", mode = "symlink" }
"~/.claude/skills/implement-spec" = { source = "unix/home/.config/agents/skills/implement-spec", mode = "symlink" }
"~/.agents/skills/implement-spec" = { source = "unix/home/.config/agents/skills/implement-spec", mode = "symlink" }
# chief-of-staff: the coordinator's role contract; user scope only, like ticket-retro.
"~/.claude/skills/chief-of-staff" = { source = "unix/home/.config/agents/skills/chief-of-staff", mode = "symlink" }
"~/.agents/skills/chief-of-staff" = { source = "unix/home/.config/agents/skills/chief-of-staff", mode = "symlink" }
# herdr-startup and herdr-shutdown: reopen and close the herdr sessions around a reboot. Their scripts are tracked
# as they run, outside python/ (CODING_STANDARDS.md, "Exceptions"); packaging them is a later ticket.
"~/.claude/skills/herdr-startup" = { source = "unix/home/.config/agents/skills/herdr-startup", mode = "symlink" }
"~/.agents/skills/herdr-startup" = { source = "unix/home/.config/agents/skills/herdr-startup", mode = "symlink" }
"~/.claude/skills/herdr-shutdown" = { source = "unix/home/.config/agents/skills/herdr-shutdown", mode = "symlink" }
"~/.agents/skills/herdr-shutdown" = { source = "unix/home/.config/agents/skills/herdr-shutdown", mode = "symlink" }
# One skill set: ~/.agents/skills. Codex 0.167.1 reads it (codex-rs/ext/skills/src/host_roots.rs:134-147) and
# OpenCode 2.2.7 reads it beside its own folder (packages/core/src/config/discovery.ts:69-73,157,163), so neither
# needs a link. Antigravity CLI 1.5.6 reads only ~/.gemini/config/skills: the whole folder links to the shared one.
# skills 1.8.1 `skills add -g` writes through the link once (createSymlink returns when both paths resolve to the
# same folder, dist/_chunks/remove.mjs:2767-2773), but `skills remove -a <one agent>` through it deletes the shared
# copy, for every harness: remove a skill for all agents or none. herdr:doctor names the Claude link that leaves
# dangling, and `mise dot apply` restores a skill this repo owns. Claude Code stays per-skill (the entries above),
# since agentsview and openwiki install a different copy into ~/.claude/skills. `mise run skills:doctor` checks
# these entries, herdr:doctor that ~/.claude/skills lists every skill of ~/.agents/skills.
"~/.gemini/config/skills" = { source = "~/.agents/skills", mode = "symlink", relative = true }
# Every repository: pushes run the gh checks in the global config. HK=0 skips, like the hk hooks.
"~/.gitconfig/gh-doctor" = { block = '''
[hook "gh-doctor-pre-push"]
	command = test "${HK:-1}" = "0" || sh -c '~/.local/share/mise/shims/mise doctor project'
	event = pre-push
''' }
"~/.config/mise/agentsview-native/fnox.toml" = { source = "unix/home/.config/mise/agentsview-native/fnox.toml", mode = "symlink" }
# Rule guards: the hook every agent runs as `python3 -I ~/.config/agents/guards/hook.py` (registration is the
# owner's, one settings file at a time), and each agent's own policy file. The policy files are copies: Codex
# 0.167 and Gemini CLI 0.67 both skip a .rules or .toml entry that is a symlink.
"~/.config/agents/guards" = { source = "python/guards/src/guards", mode = "symlink" }
"~/.codex/rules/guards.rules" = { source = "unix/home/.codex/rules/guards.rules", mode = "copy" }
"~/.gemini/policies/guards.toml" = { source = "unix/home/.gemini/policies/guards.toml", mode = "copy" }

# No [tools]: every tool is in the global config (DL-757).
