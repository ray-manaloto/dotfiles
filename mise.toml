# Pass flags through: mise run graphify-affected -- "some_function" --depth 3
run = 'uv run --project python dotfiles-setup graphify affected'

[tasks.graphify-prs]
description = "PR dashboard; with a PR number, its graph-impact deep dive"
# Thin caller (zero-bash-logic); logic in
# python/src/dotfiles_setup/graphify.py. Needs an authenticated `gh` and
# makes NETWORK calls (gh pr list / gh pr diff) — never call from a gate or
# hook. The bare dashboard is cheap; passing a PR number triggers the
# expensive graph-impact computation (concurrent gh pr diff calls) —
# deliberate, see graphify's own cmd_prs comment.
# Pass flags through: mise run graphify-prs -- 822 --base main
run = 'uv run --project python dotfiles-setup graphify prs'

[tasks.bakeoff]
description = "Run the graphify extraction bake-off (writes OUTSIDE the repo)"
# Thin caller (zero-bash-logic); logic in
# python/src/dotfiles_setup/graph_bakeoff.py.
#
# Every artifact lands in the WORKBENCH (~/dev/graphify-bakeoff), never in this
# repo: bake-off output is result data, not source. The one exception is the
# gold corpus at tests/fixtures/graphify-gold, which is an INPUT and is
# versioned so a score is reproducible across machines.
#
# Each (corpus, arm, repeat) gets a FRESH directory. That is not tidiness — it
# is the cache-isolation guarantee. graphify's semantic cache is keyed by file
# content + relative path and carries NO model identity, so two arms sharing an
# output tree would silently serve one model's results to the other.
#
# The arm list includes a NULL ARM: the reference model run twice under
# identical conditions. The spread between the twins is the noise floor, and a
# cross-arm gap smaller than it is reported as "indistinguishable" rather than
# as a finding. Without it, no gap in the report means anything.
#
#   mise run bakeoff                          # gold corpus, 3 repeats, null arm
#   mise run bakeoff -- --repeats 5
#   mise run bakeoff -- --corpus docs/research/kb/raw --run-id full-corpus
run = 'uv run --project python dotfiles-setup graphify bakeoff'

[tasks.verify-apt-pins]
description = "Prove every pinned [bootstrap.packages] version still resolves (~60s, no image build)"
# Thin caller per zero-bash-logic; the probe container, the Dockerfile-ARG
# reads, and the generated apt script live in
# python/src/dotfiles_setup/apt_pins.py — which documents each with the probe
# that established it. Read-only: simulates, installs nothing, builds no image.
#   mise run verify-apt-pins           # report; rc=1 if any pin is unresolvable
#   mise run verify-apt-pins -- --json # machine-readable
#
# THE POINT (#288, .claude/rules/local-devcontainer-first.md): a pin fails in
# exactly one way — that exact version stops resolving — and until this task
# the ONLY thing that noticed was a cold base rebuild (~2.5h of CI). This runs
# apt's real solver against the digest-pinned base in ~60s. Run it after ANY
# [bootstrap.packages] edit, BEFORE pushing.
#
# It runs a throwaway `docker run` on the ubuntu base, NOT the devcontainer:
# the devcontainer already has these packages installed, so simulating a pin
# below an installed version reports FAIL for "apt refuses to downgrade" — a
# false negative about the container, not the pin (measured 2026-07-16). Not
# devcontainer lifecycle, so `do-not.md` #3 does not apply.
run = 'uv run --project python dotfiles-setup apt-pins'

[tasks.renovate-dryrun]
description = "Report the updates Renovate would raise, from this working tree (no PRs)"
# Thin caller per zero-bash-logic; the renovate invocation, its three
# non-obvious env requirements, and the native-report parsing live in
# python/src/dotfiles_setup/renovate_dryrun.py — which documents each with the
# probe that established it. Read-only: opens no PR, writes no branch.
#   mise run renovate-dryrun            # report; always rc=0
#   mise run renovate-dryrun -- --check # rc=1 if any update is pending
#   mise run renovate-dryrun -- --json  # machine-readable
#
# #290 (FIXED): the failure was never the node pin and never submodules — the
# `github>jdx/renovate-config` preset we extend sets `cloneSubmodules: true`,
# which makes initRepo reach syncGit(), which throws outright under
# platform=local. The module forces it off via RENOVATE_FORCE (the only config
# layer applied AFTER repo config, so env/CLI both lose to the preset), leaving
# renovate.json byte-identical to what hosted Renovate reads.
#
# tools.node pins THIS TASK to node 24 (#251). Renovate 43.x declares
# `engines.node ^24.11.0`; under our node 26 the binary logs "Unsupported node
# environment detected" and exits rc=1. CORRECTED in #299: it still extracts
# and resolves NORMALLY — the pin buys a clean exit code, not report
# correctness. (The former "extracts NOTHING" note was true of some older
# renovate, not of 43.265.1, and cost a hunt for a data-loss bug that does not
# exist.) `depends` cannot fix this (it is install ORDER only); `tasks.*.tools`
# is mise's documented per-task version override ("a tool with a different
# version... only used for that task").
# Probed 2026-07-15: default task -> v26.5.0, tools.node="24" task -> v24.x.
# Renovate's own mise manager reads `tasks.*.tools`, so this pin stays current.
#
# NOTE: a lookup is slow when a `deb` datasource points at Ubuntu's archive (it
# downloads the whole main,universe Packages index). apt.llvm.org's index is
# ~13 KB and resolves fast; a full pass over this repo takes ~80s.
tools.node = "24"
run = 'uv run --project python dotfiles-setup renovate-dryrun'

[tasks.renovate-status]
description = "Report Mend-hosted Renovate install + privileges + open update PRs"
# Thin caller (zero-bash-logic); logic in
