name: build-publish
# ============================================================
# Reusable build/publish pipeline (Phase B, issue #118).
#
# Holds the Docker build chain — base-prep → p2996-prep → build →
# smoke-test — exactly as it lived inline in ci.yml, parameterized by
# inputs so every trigger (PR via ci.yml, nightly, and future
# refresh/repository_dispatch callers) drives the SAME pipeline.
#
# The `changes` path-gate and the push-to-main exemption stay in the
# CALLER (ci.yml): a `uses:` job carries `needs`/`if`/`permissions` but
# no steps, so the gate lives one level up and this workflow is only
# ever invoked when a build should actually run. `promote` (push-to-main
# manifest retag) also stays in ci.yml — there is no rebuild here on main.
#
# The `github` context inside a called workflow is the CALLER's
# triggering event (event_name, sha, ref, event.pull_request all
# inherited), so `type=sha` / `type=ref,event=pr` metadata tags and the
# `:<short-sha>` smoke tag resolve identically to the inline version.
# Spec: docs/research/gha-workflow-optimization.md § "v2 architecture".
# ============================================================
on:
  workflow_call:
    inputs:
      tag_strategy:
        description: "Tag set to emit: 'pr' (=> :pr-NNN + :sha) or 'nightly' (=> :dev + :latest + :sha). Any other value emits :sha only (the retired Phase D dispatch caller used this; resurrect from git history if needed)"
        required: true
        type: string
      publish:
        description: "Push the final dev image (base/p2996 cache layers always push when built)"
        required: false
        default: true
        type: boolean
      target:
        description: "Bake target for the final build (dev, cpp, all)"
        required: false
        default: "dev"
        type: string
      ref:
        description: "Git ref to check out (empty = the caller event's default ref)"
        required: false
        default: ""
        type: string
      p2996_ref:
        description: "Phase D (#120): override CLANG_P2996_REF to build an exact upstream clang-p2996 SHA on demand. Exported as CLANG_P2996_REF so BOTH the content hash (p2996/dev) AND docker bake's variable override resolve the same ref. Empty => the docker-bake.hcl pin is authoritative (byte-identical canonical build)."
        required: false
        default: ""
        type: string
      platform:
        description: "Reserved (Phase D, #120): target platform override. Unused when empty; docker-bake.hcl PLATFORM (linux/amd64/v2) is authoritative today."
        required: false
        default: ""
        type: string
    outputs:
      image_ref:
        description: "The :<short-sha> ref of the built image (the one promote retags on merge)"
        value: ${{ jobs.build.outputs.image_ref }}
      digest:
        description: "containerimage.digest of the built dev image (best-effort, from bake metadata)"
        value: ${{ jobs.build.outputs.digest }}
env:
  CONTAINER_REGISTRY: ghcr.io
  IMAGE_NAME: ray-manaloto/dotfiles-devcontainer
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Mirror ci.yml's logging defaults so failed runs are diagnosable from
  # the artifact-uploaded log files (env does NOT cross workflow_call).
  HK_LOG_FILE_LEVEL: debug
  MISE_LOG_FILE: /tmp/mise.log
  MISE_LOG_FILE_LEVEL: debug
permissions:
  contents: read
  packages: write
jobs:
  # ============================================================
  # Base cache prep: compute content-hash of devcontainer-base inputs
  # (apt + mise install + cargo crates layer) and ensure
  # ghcr.io/<owner>/<repo>:base-<hash16> exists. On hit, exits in <30s.
  # On miss, builds the `base` target and pushes it. Both p2996-prep
  # and build pull this image instead of rebuilding the heavy ~30 min
  # base layer.
  # ============================================================
  base-prep:
    runs-on: ubuntu-latest
    # Cold base rebuild (apt + mise install + cargo crates + conda solve) runs
    # ~20-30 min; conda solve time varies, so keep generous headroom.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
      cache_ref: ${{ steps.hash.outputs.cache_ref }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install mise (python + uv)
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"
      - name: Compute base cache hash
        id: hash
        run: |
          set -euo pipefail
          hash=$(uv run --project python dotfiles-setup base-hash)
          cache_ref="${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:base-${hash}"
          {
            echo "hash=${hash}"
            echo "cache_ref=${cache_ref}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Base cache lookup"
            echo ""
            echo "- Hash: \`${hash}\`"
            echo "- Cache ref: \`${cache_ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe cache
        id: probe
        env:
          CACHE_REF: ${{ steps.hash.outputs.cache_ref }}
        run: |
          set -euo pipefail
          if out=$(docker manifest inspect "${CACHE_REF}" 2>&1); then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Cache HIT — skipping base build" >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            if printf '%s\n' "$out" | grep -qiE 'manifest unknown|not found|no such manifest'; then
              echo "hit=false" >> "$GITHUB_OUTPUT"
              echo "Cache MISS — building base target" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAIL: docker manifest inspect failed with non-miss error (rc=$rc):" >&2
              printf '%s\n' "$out" >&2
              exit "$rc"
            fi
          fi
      - name: Free runner disk space
        if: steps.probe.outputs.hit != 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - name: Set up Docker Buildx
        if: steps.probe.outputs.hit != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Write GitHub token for build secret
        if: steps.probe.outputs.hit != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" > /tmp/github_token
      - name: Build and push base image
        if: steps.probe.outputs.hit != 'true'
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: base
          push: true
          files: |
            docker-bake.hcl
          set: |
            base.tags=${{ steps.hash.outputs.cache_ref }}
            *.secrets=id=github_token,src=/tmp/github_token
      - name: Resolve cache image digest
        # #160 T11: the build job consumes this image as a DIGEST-pinned
        # named build context — capture the digest here (works on both the
        # hit and miss-after-push paths) and fail loud if empty, since an
        # unpinned context would silently accept a repushed tag.
        id: digest
        env:
          CACHE_REF: ${{ steps.hash.outputs.cache_ref }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${CACHE_REF}" --format '{{.Manifest.Digest}}')
          [ -n "$digest" ] || { echo "FAIL: empty digest for ${CACHE_REF}" >&2; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
  # ============================================================
  # P2996 cache prep: compute content-hash of clang-builder inputs and
  # ensure ghcr.io/<owner>/<repo>:p2996-<hash16> exists. On hash hit
  # (the typical case), this job exits in <30s with cache_ref set; the
  # build job then skips the multi-hour clang compile entirely. On
  # miss, this job builds the p2996-cache target FROM the parameterized
  # BUILDER_IMAGE — fully decoupled from base-prep since #160 T11, so
  # the two prep jobs run in PARALLEL.
  # See .devcontainer/P2996-CACHE.md for the cache mechanism.
  # ============================================================
  p2996-prep:
    runs-on: ubuntu-latest
    # Cold clang-p2996 build is a multi-hour from-source compile (~2h+). The
    # earlier 60 was far too low and CANCELLED cold rebuilds (regression from
    # #154's timeout-minutes addition; only warm cache-hits — seconds — masked
    # it). Cache HITS still finish in seconds; this ceiling only bounds a cold
    # build. See docs/research/.../P2996-CACHE.md + feedback_ci_build_duration.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write # explicit; do not rely on workflow-level inheritance
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
      cache_ref: ${{ steps.hash.outputs.cache_ref }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install mise (python + uv)
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"
      - name: Resolve p2996 ref override
        # Phase D (#120): when a caller passes p2996_ref, export it as
        # CLANG_P2996_REF so BOTH `dotfiles-setup p2996-hash` AND docker
        # bake's native variable override resolve the SAME upstream SHA —
        # the cache tag tracks the overridden ref, never poisoning the
        # canonical pinned-ref cache. Empty input exports nothing, so the
        # docker-bake.hcl pin stays authoritative (byte-identical to the
        # canonical build). Value passed via env (not inline ${{ }}) to
        # keep an untrusted client_payload out of the shell.
        if: inputs.p2996_ref != ''
        env:
          P2996_REF: ${{ inputs.p2996_ref }}
        run: echo "CLANG_P2996_REF=${P2996_REF}" >> "$GITHUB_ENV"
      - name: Compute P2996 cache hash
        id: hash
        run: |
          set -euo pipefail
          hash=$(uv run --project python dotfiles-setup p2996-hash)
          cache_ref="${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:p2996-${hash}"
          {
            echo "hash=${hash}"
            echo "cache_ref=${cache_ref}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## P2996 cache lookup"
            echo ""
            echo "- Hash: \`${hash}\`"
            echo "- Cache ref: \`${cache_ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe cache
        id: probe
        # Discriminate "manifest not found" (legitimate cache miss) from
        # auth/network/registry failures. Capturing stderr instead of
        # `2>/dev/null` honors `build.no-stderr-suppression`.
        env:
          CACHE_REF: ${{ steps.hash.outputs.cache_ref }}
        run: |
          set -euo pipefail
          if out=$(docker manifest inspect "${CACHE_REF}" 2>&1); then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Cache HIT — skipping clang-p2996 compile" >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            if printf '%s\n' "$out" | grep -qiE 'manifest unknown|not found|no such manifest'; then
              echo "hit=false" >> "$GITHUB_OUTPUT"
              echo "Cache MISS — building p2996-cache on top of base-prep image" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAIL: docker manifest inspect failed with non-miss error (rc=$rc):" >&2
              printf '%s\n' "$out" >&2
              exit "$rc"
            fi
          fi
      - name: Free runner disk space
        if: steps.probe.outputs.hit != 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - name: Set up Docker Buildx
        if: steps.probe.outputs.hit != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Write GitHub token for build secret
        if: steps.probe.outputs.hit != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" > /tmp/github_token
      - name: Build and push p2996-cache image
        if: steps.probe.outputs.hit != 'true'
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: p2996-cache
          push: true
          files: |
            docker-bake.hcl
          set: |
            p2996-cache.tags=${{ steps.hash.outputs.cache_ref }}
            *.secrets=id=github_token,src=/tmp/github_token
      - name: Resolve cache image digest
        # #160 T11: same digest-pin capture as base-prep — the build job
        # injects this as the p2996-export named context.
        id: digest
        env:
          CACHE_REF: ${{ steps.hash.outputs.cache_ref }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${CACHE_REF}" --format '{{.Manifest.Digest}}')
          [ -n "$digest" ] || { echo "FAIL: empty digest for ${CACHE_REF}" >&2; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
  # ============================================================
  # Dev cache prep (#122): the THIRD content-hash tier. Computes
  # `dotfiles-setup dev-hash` (= base-hash + p2996-hash + whole
  # Dockerfile + dev bake target) and probes ghcr.io for
  # `:dev-<hash16>`. That tag is a "built AND smoke-validated" marker —
  # it is pushed by `dev-tag` ONLY after smoke-test passes — so a probe
  # HIT means the identical image already exists and was validated:
  #   HIT  → retag it to :sha-<sha> / :pr-NNN (so promote works on
  #          merge) and skip build + smoke-test entirely (~12m → ~2m).
  #   MISS → build + smoke-test as normal, then dev-tag pushes the marker.
  # Runs for PR builds only (tag_strategy == 'pr'); schedule/dispatch
  # (tag_strategy == 'nightly') is SKIPPED so the nightly always rebuilds
  # — it exists to catch rolling-tool drift (gcc-latest .deb) that the
  # content hash cannot see. See .devcontainer/P2996-CACHE.md +
  # .github/workflows/AGENTS.md § three-tier probe cache.
  # ============================================================
  dev-prep:
    needs: [base-prep, p2996-prep]
    if: inputs.tag_strategy == 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
      cache_ref: ${{ steps.hash.outputs.cache_ref }}
      hit: ${{ steps.probe.outputs.hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install mise (python + uv)
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"
      - name: Resolve p2996 ref override
        # Phase D (#120): keep `dotfiles-setup dev-hash` in lockstep with
        # the p2996 override so the probed :dev-<hash> matches the image
        # the dispatch path actually builds. See p2996-prep for rationale.
        if: inputs.p2996_ref != ''
        env:
          P2996_REF: ${{ inputs.p2996_ref }}
        run: echo "CLANG_P2996_REF=${P2996_REF}" >> "$GITHUB_ENV"
      - name: Compute dev cache hash
        id: hash
        run: |
          set -euo pipefail
          hash=$(uv run --project python dotfiles-setup dev-hash)
          cache_ref="${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${hash}"
          {
            echo "hash=${hash}"
            echo "cache_ref=${cache_ref}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Dev cache lookup"
            echo ""
            echo "- Hash: \`${hash}\`"
            echo "- Cache ref: \`${cache_ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe dev cache
        id: probe
        # Same miss/non-miss discrimination as base-prep / p2996-prep:
        # a "manifest not found" is a legitimate MISS; anything else
        # (auth/network/registry) fails loud rather than silently
        # forcing a rebuild. Captures stderr (no `2>/dev/null`) to honor
        # build.no-stderr-suppression.
        env:
          CACHE_REF: ${{ steps.hash.outputs.cache_ref }}
        run: |
          set -euo pipefail
          if out=$(docker manifest inspect "${CACHE_REF}" 2>&1); then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Dev cache HIT — image already built AND smoke-validated; skipping build + smoke-test" >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            if printf '%s\n' "$out" | grep -qiE 'manifest unknown|not found|no such manifest'; then
              echo "hit=false" >> "$GITHUB_OUTPUT"
              echo "Dev cache MISS — building + smoke-testing, then tagging the validated marker" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAIL: docker manifest inspect failed with non-miss error (rc=$rc):" >&2
              printf '%s\n' "$out" >&2
              exit "$rc"
            fi
          fi
      - name: Set up Docker Buildx
        if: steps.probe.outputs.hit == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Retag validated image to :sha / :pr (cache hit)
        if: steps.probe.outputs.hit == 'true'
        # On a hit, build + smoke-test are skipped, so the tags they
        # would have pushed (:sha-<sha>, :pr-NNN) must be created here
        # from the already-validated :dev-<hash> image. `promote` then
        # finds :pr-NNN on merge exactly as it would after a real build.
        env:
          IMAGE: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}
          SOURCE_REF: ${{ steps.hash.outputs.cache_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha=$(printf '%s' "${COMMIT_SHA}" | head -c 7)
          tags=(--tag "${IMAGE}:${short_sha}")
          if [ -n "${PR_NUMBER}" ]; then
            tags+=(--tag "${IMAGE}:pr-${PR_NUMBER}")
          fi
          docker buildx imagetools create "${tags[@]}" "${SOURCE_REF}"
          source_digest=$(docker buildx imagetools inspect "${SOURCE_REF}" --format '{{.Manifest.Digest}}')
          sha_digest=$(docker buildx imagetools inspect "${IMAGE}:${short_sha}" --format '{{.Manifest.Digest}}')
          [ -n "${sha_digest}" ] || { echo "FAIL: empty digest after retag" >&2; exit 1; }
          if [ "${sha_digest}" != "${source_digest}" ]; then
            echo "FAIL: retag did not propagate the validated digest" >&2
            echo "  source : ${source_digest}" >&2
            echo "  :sha   : ${sha_digest}" >&2
            exit 1
          fi
          {
            echo "## Dev cache retag (validated image reused)"
            echo ""
            echo "- Source: \`${SOURCE_REF}\` (digest \`${source_digest}\`)"
            echo "- New tags: \`:${short_sha}\`${PR_NUMBER:+, \`:pr-${PR_NUMBER}\`}"
          } >> "$GITHUB_STEP_SUMMARY"
  # ============================================================
  # Build Type 2: Dotfiles environment image (Docker → ghcr.io)
  # ============================================================
  build:
    needs: [base-prep, p2996-prep, dev-prep]
    # Run when the dev cache MISSED (PR, image changed) OR when dev-prep
    # was SKIPPED (nightly/dispatch always rebuilds). Skip only on a hit,
    # where dev-prep already retagged the validated image. `always()` is
    # required so a skipped dev-prep doesn't cascade-skip this job; the
    # explicit upstream success checks restore the failure gating.
    if: |
      always()
      && needs.base-prep.result == 'success'
      && needs.p2996-prep.result == 'success'
      && (needs.dev-prep.result == 'skipped'
          || (needs.dev-prep.result == 'success' && needs.dev-prep.outputs.hit != 'true'))
    runs-on: ubuntu-latest
    # Cold dev assembly (pull p2996 cache + final COPY/overlay + bake) can run
    # longer than a warm build; keep headroom for a cold path.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.out.outputs.image_ref }}
      digest: ${{ steps.out.outputs.digest }}
    steps:
      - name: Free runner disk space
        # The multi-stage Dockerfile (clang-p2996 builds clang from
        # source, ~30 GB of intermediate artifacts) plus BuildKit cache
        # exceeds the ubuntu-latest runner's ~14 GB free-space budget.
        # Use the maintained `jlumbroso/free-disk-space` action which
        # knows the actual ubuntu-latest image layout — frees ~30 GB
        # reliably (vs. our hand-rolled rm -rf list which only got
        # ~14 GB because half the paths don't exist on this image).
        # Critically: do NOT prune docker system here — it wipes the
        # BuildKit cache that the build NEEDS for the warm-cache path.
        # The cache-cold path needs more disk, not less, and that's
        # what bit ffd6b50.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # tool-cache (mise / hostedtoolcache / etc.) is only used by
          # the lint + contract-preflight jobs, which run on separate
          # runner VMs. The build job doesn't read from
          # /opt/hostedtoolcache, so we can wipe it here for ~10-20 GB
          # extra headroom on top of the standard ~30 GB.
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          # docker-images: false — preserve BuildKit cache (ffd6b50
          # learned this the hard way; pruning it forces cold rebuilds
          # which need MORE disk, not less).
          docker-images: false
          swap-storage: true
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ inputs.tag_strategy == 'nightly' }}
            type=raw,value=latest,enable=${{ inputs.tag_strategy == 'nightly' }}
            type=sha,prefix=
            type=ref,event=pr
      - name: Write GitHub token for build secret
        run: echo "${{ secrets.GITHUB_TOKEN }}" > /tmp/github_token
      - name: Build and push
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: ${{ inputs.target }}
          push: ${{ inputs.publish }}
          files: |
            docker-bake.hcl
            ${{ steps.meta.outputs.bake-file-tags }}
            ${{ steps.meta.outputs.bake-file-labels }}
          # #160 T11: the prebuilt tiers arrive as DIGEST-pinned named build
          # contexts — each overrides the same-named local stage, so the
          # heavy stages are never built here (native warm path); BuildKit
          # fails the solve on any digest mismatch (exact-bytes guarantee).
          set: |
            *.secrets=id=github_token,src=/tmp/github_token
            dev.contexts.devcontainer-base=docker-image://${{ needs.base-prep.outputs.cache_ref }}@${{ needs.base-prep.outputs.digest }}
            dev.contexts.p2996-export=docker-image://${{ needs.p2996-prep.outputs.cache_ref }}@${{ needs.p2996-prep.outputs.digest }}
      # docker/bake-action v6.8.0+ emits a per-job build summary with inputs,
      # errors, and a downloadable .dockerbuild record by default. The prior
      # hand-rolled "Build performance summary" + "Build diagnostics" steps
      # duplicated this and have been removed.
      - name: Export build outputs
        id: out
        # Surface the canonical :<short-sha> ref (the one smoke validates and
        # promote retags on merge) and the dev image digest for callers/Phase
        # C. Digest is best-effort from bake metadata — never fails the build.
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha=$(printf '%s' "${COMMIT_SHA}" | head -c 7)
          image_ref="${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${short_sha}"
          digest=$(printf '%s' "${METADATA:-}" | jq -r '.dev["containerimage.digest"] // empty' 2>/dev/null || true)
          {
            echo "image_ref=${image_ref}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"
      - name: Assert provenance materials contain the p2996 digest (#160 T11)
        # The pushed image's SLSA provenance (attest mode=max, T7) must
        # record the exact p2996 artifact digest among its materials —
        # closing the loop from "we injected a digest-pinned context" to
        # "the published attestation proves those bytes went in".
        if: inputs.publish
        env:
          IMAGE_REF: ${{ steps.out.outputs.image_ref }}
          P2996_DIGEST: ${{ needs.p2996-prep.outputs.digest }}
        run: |
          set -euo pipefail
          provenance=$(docker buildx imagetools inspect "${IMAGE_REF}" --format '{{json .Provenance}}')
          if ! printf '%s' "$provenance" | jq -e --arg d "${P2996_DIGEST}" 'tostring | contains($d)' >/dev/null; then
            echo "FAIL: provenance of ${IMAGE_REF} does not reference p2996 digest ${P2996_DIGEST}" >&2
            exit 1
          fi
          echo "OK: provenance materials include p2996 digest ${P2996_DIGEST}"
      - name: Write hash report (#160 T7)
        # The content-addressed lineage of this build as a downloadable
        # artifact: which :base-/:p2996- cache refs fed the dev image and
        # what digest came out. Complements the per-job step summaries.
        env:
          BASE_REF: ${{ needs.base-prep.outputs.cache_ref }}
          P2996_REF: ${{ needs.p2996-prep.outputs.cache_ref }}
          IMAGE_REF: ${{ steps.out.outputs.image_ref }}
          DIGEST: ${{ steps.out.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "base_cache_ref=${BASE_REF}"
            echo "p2996_cache_ref=${P2996_REF}"
            echo "image_ref=${IMAGE_REF}"
            echo "digest=${DIGEST}"
          } > /tmp/build-hash-report.txt
      - name: Upload hash report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-hash-report
          path: /tmp/build-hash-report.txt
  # ============================================================
  # Smoke test: validate the freshly-pushed image (PR or main).
  # PRs validate the exact :sha-<sha> that promote will retag as
  # :dev/:latest on merge — no rebuild gap between PR validation
  # and main publication.
  # ============================================================
  smoke-test:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Free disk space
        # smoke-test `docker pull`s the full ~38 GB dev image; the stock
        # ubuntu-latest runner (~14 GB free) runs out of space extracting it
        # ("no space left on device"). Sibling build jobs already free disk;
        # smoke-test was the one that didn't (it passed before only on roomier
        # runners). No BuildKit cache to preserve here — this job only pulls.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - name: Install mise (python + uv)
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"
      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tag
        id: smoke-tag
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: echo "tag=$(printf '%s' "${COMMIT_SHA}" | head -c 7)" >> "$GITHUB_OUTPUT"
      - name: Pull published image
        env:
          IMAGE_REF: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.smoke-tag.outputs.tag }}
        run: docker pull "${IMAGE_REF}"
      - name: Smoke published image
        env:
          IMAGE_REF: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.smoke-tag.outputs.tag }}
        run: |
          uv run --project python dotfiles-setup image smoke \
            --image-ref "${IMAGE_REF}"
      - name: Bootstrap packages gap report (#160 T7)
        # Capture `status --json` from the published image and assert the
        # declared [bootstrap.packages] set is fully installed. The Python
        # check fails on `missing`/`version_mismatch` AND on an unexpectedly
        # unavailable apt manager or set drift — conditions the build-time
        # `status --missing` exit code cannot see (unavailable managers emit
        # state "skipped"). Plain `status --json` exits 0 even with gaps, so
        # the JSON is always captured for the artifact; the assert gates.
        env:
          IMAGE_REF: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.smoke-tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE_REF}" \
            mise bootstrap packages status --json > /tmp/bootstrap-gap-report.json
          uv run --project python dotfiles-setup bootstrap-gap-report \
            --status-json /tmp/bootstrap-gap-report.json
      - name: Upload bootstrap gap report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-gap-report
          path: /tmp/bootstrap-gap-report.json
          if-no-files-found: ignore
        # smoke (+ the bootstrap gap report above) is the PR-blocking image
        # gate. Dive layer-efficiency analysis, benchmark metrics, and the
        # Trivy CVE scan all run asynchronously in `image-analysis.yml`
        # (triggered on CI success) so their minutes never extend the
        # merge-to-main → image-pullable-on-the-Mac critical path — see
        # .github/workflows/AGENTS.md (GHA restructure, 2026-07-07).
        #
        # Note: the host-user overlay (Dockerfile.host-user + `devcontainer up`)
        # is a Mac-local concern — it wraps the published base image with the
        # host user's UID/GID for bind-mount permission parity on macOS. CI has
        # no meaningful "host user" to match, no mount sources, and no overlay
        # to rebuild; the Pull / Smoke / Dive steps above fully validate the
        # published base image. Overlay behavior is validated locally via
        # `mise run up` on the Mac.
  # ============================================================
  # Dev cache tag (#122): push `:dev-<hash>` as the "built AND
  # smoke-validated" marker — ONLY after smoke-test passes. This is what
  # makes the dev-prep probe-skip safe: the tag can only ever point at an
  # image that cleared smoke, so a future probe HIT reuses a
  # validated image, never an untested one. Runs whenever build+smoke ran
  # and passed (PR cache-miss AND nightly), so the marker stays fresh.
  # Recomputes dev-hash independently (deterministic) since dev-prep is
  # skipped on the nightly path.
  # ============================================================
  dev-tag:
    needs: [build, smoke-test]
    if: needs.smoke-test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install mise (python + uv)
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve p2996 ref override
        # Phase D (#120): the validated marker is content-addressed by
        # dev-hash, which folds in CLANG_P2996_REF. dev-tag MUST honor the
        # same override the p2996 cache built with — otherwise it would
        # stamp a pinned-ref hash onto overridden-ref content, poisoning a
        # later canonical build's probe. See p2996-prep for rationale.
        if: inputs.p2996_ref != ''
        env:
          P2996_REF: ${{ inputs.p2996_ref }}
        run: echo "CLANG_P2996_REF=${P2996_REF}" >> "$GITHUB_ENV"
      - name: Tag validated image as :dev-<hash>
        env:
          IMAGE: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          hash=$(uv run --project python dotfiles-setup dev-hash)
          short_sha=$(printf '%s' "${COMMIT_SHA}" | head -c 7)
          source_ref="${IMAGE}:${short_sha}"
          marker_ref="${IMAGE}:dev-${hash}"
          # The just-built + smoked image is published at :sha-<sha>;
          # stamp the content-hash marker onto that exact digest.
          docker buildx imagetools create --tag "${marker_ref}" "${source_ref}"
          source_digest=$(docker buildx imagetools inspect "${source_ref}" --format '{{.Manifest.Digest}}')
          marker_digest=$(docker buildx imagetools inspect "${marker_ref}" --format '{{.Manifest.Digest}}')
          [ -n "${marker_digest}" ] || { echo "FAIL: empty digest after marker tag" >&2; exit 1; }
          if [ "${marker_digest}" != "${source_digest}" ]; then
            echo "FAIL: marker tag did not propagate the validated digest" >&2
            echo "  source : ${source_digest}" >&2
            echo "  marker : ${marker_digest}" >&2
            exit 1
          fi
          {
            echo "## Dev cache marker tagged"
            echo ""
            echo "- \`${marker_ref}\` → digest \`${source_digest}\` (smoke-validated)"
          } >> "$GITHUB_STEP_SUMMARY"
