name: build-publish
# ============================================================
# Reusable build/publish pipeline (Phase B, issue #118).
#
# Holds the Docker build chain — base-prep → p2996-prep → build →
# smoke-test — exactly as it lived inline in ci.yml, parameterized by
# inputs so every trigger (PR via ci.yml, nightly, and future
# refresh/repository_dispatch callers) drives the SAME pipeline.
#
# The `changes` path-gate and the push-to-main exemption stay in the
# CALLER (ci.yml): a `uses:` job carries `needs`/`if`/`permissions` but
# no steps, so the gate lives one level up and this workflow is only
# ever invoked when a build should actually run. `promote` (push-to-main
# manifest retag) also stays in ci.yml — there is no rebuild here on main.
#
# The `github` context inside a called workflow is the CALLER's
# triggering event (event_name, sha, ref, event.pull_request all
# inherited), so `type=sha` / `type=ref,event=pr` metadata tags and the
# `:<short-sha>` smoke tag resolve identically to the inline version.
# Spec: docs/research/gha-workflow-optimization.md § "v2 architecture".
# ============================================================
on:
  workflow_call:
    inputs:
      tag_strategy:
        description: "Tag set to emit: 'pr' (=> :pr-NNN + :sha) or 'nightly' (=> :dev + :latest + :sha). Any other value emits :sha only (the retired Phase D dispatch caller used this; resurrect from git history if needed)"
        required: true
        type: string
      publish:
        description: "Push the final dev image (base/p2996 cache layers always push when built)"
        required: false
        default: true
        type: boolean
      target:
        description: "Bake target for the final build (dev, cpp, all)"
        required: false
        default: "dev"
        type: string
      ref:
        description: "Git ref to check out (empty = the caller event's default ref)"
        required: false
        default: ""
        type: string
      p2996_ref:
        description: "Phase D (#120): override CLANG_P2996_REF to build an exact upstream clang-p2996 SHA on demand. Exported as CLANG_P2996_REF so BOTH the content hash (p2996/dev) AND docker bake's variable override resolve the same ref. Empty => the docker-bake.hcl pin is authoritative (byte-identical canonical build)."
        required: false
        default: ""
        type: string
      platform:
        description: "Reserved (Phase D, #120): target platform override. Unused when empty; the docker-bake.hcl PLATFORM variable is authoritative today (its default mirrors mise.toml DOTFILES_PLATFORM, #673)."
        required: false
        default: ""
        type: string
    outputs:
      image_ref:
        description: "The :<short-sha> MANIFEST ref (the multi-architecture index promote retags on merge)"
        value: ${{ jobs.manifest.outputs.image_ref }}
      digest:
        description: "Digest of the published :<short-sha> index"
        value: ${{ jobs.manifest.outputs.digest }}
env:
  CONTAINER_REGISTRY: ghcr.io
  IMAGE_NAME: ray-manaloto/dotfiles-devcontainer
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Mirror ci.yml's logging defaults so failed runs are diagnosable from
  # the artifact-uploaded log files (env does NOT cross workflow_call).
  HK_LOG_FILE_LEVEL: debug
  MISE_LOG_FILE: /tmp/mise.log
  MISE_LOG_FILE_LEVEL: debug
  # Silence git's "Using 'master' as the name for the initial branch" hint
  # that actions/checkout's `git init` emits (#21). git reads GIT_CONFIG_COUNT/
  # KEY/VALUE directly, so this needs no `git config` step and applies to every
  # git invocation in the workflow. It MUST be repeated per workflow file: env
  # does NOT cross workflow_call, and it must be set before checkout runs.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

permissions:
  contents: read
  packages: write
jobs:
  # ============================================================
  # Publish plan (#676): the ONE declaration of which architectures ship.
  #
  # It lives in `dotfiles_setup.platform_target` and arrives here as JSON
  # because `no_platform_literals` scans `.github/workflows/*.yml` — a triple
  # written in this file fails `mise run lint`. That constraint pushes the set
  # somewhere better than YAML anyway: one list, unit-tested, with each
  # architecture's NATIVE runner label and per-architecture tag suffix attached.
  #
  # Every build job below fans out over this and exports `PLATFORM` for its leg.
  # bake reads that env var into its `PLATFORM` variable, and since #676 so do
  # the three content hashes — so a leg's build and its cache tags cannot
  # disagree about which architecture is being produced.
  # ============================================================
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install mise (python + uv)
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"
      - name: Resolve the publish matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix=$(uv run --project python dotfiles-setup platform-matrix)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          {
            echo "## Publish plan"
            echo ""
            echo '```json'
            echo "${matrix}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  # ============================================================
  # Base cache prep: compute content-hash of devcontainer-base inputs
  # (apt + mise install + cargo crates layer) and ensure
  # ghcr.io/<owner>/<repo>:base-<hash16> exists. On hit, exits in <30s.
  # On miss, builds the `base` target and pushes it. Both p2996-prep
  # and build pull this image instead of rebuilding the heavy ~30 min
  # base layer.
  # ============================================================
  base-prep:
    needs: [plan]
    strategy:
      # One architecture failing must not cancel the other: a partial result is
      # still diagnosable, and a cancelled leg reports as "cancelled" rather
      # than naming what broke.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.target.runner }}
    # Cold base rebuild (apt + mise install + cargo crates + conda solve) runs
    # ~20-30 min; conda solve time varies, so keep generous headroom.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    # Read by BOTH `docker/bake-action` (into the `PLATFORM` HCL variable) and
    # `dotfiles-setup base-hash` (#676) — one value, so the image this leg
    # builds and the tag it is cached under cannot describe different
    # architectures.
    env:
      PLATFORM: ${{ matrix.target.platform }}
    # NOTE: deliberately NO job `outputs` any more. A matrix job has ONE output
    # set — the last leg to finish wins — so `needs.base-prep.outputs.cache_ref`
    # would hand the arm64 build the amd64 base image roughly half the time, and
    # the digest pin would then fail the solve with a mismatch that names
    # neither architecture. Downstream jobs recompute the hash for their own
    # leg instead; it is deterministic, so recomputing is free and unambiguous.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install mise (python + uv)
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"
      - name: Compute base cache hash
        id: hash
        run: |
          set -euo pipefail
          hash=$(uv run --project python dotfiles-setup base-hash)
          cache_ref="${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:base-${hash}"
          {
            echo "hash=${hash}"
            echo "cache_ref=${cache_ref}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Base cache lookup"
            echo ""
            echo "- Hash: \`${hash}\`"
            echo "- Cache ref: \`${cache_ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe cache
        id: probe
        env:
          CACHE_REF: ${{ steps.hash.outputs.cache_ref }}
        run: |
          set -euo pipefail
          if out=$(docker manifest inspect "${CACHE_REF}" 2>&1); then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Cache HIT — skipping base build" >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            if printf '%s\n' "$out" | grep -qiE 'manifest unknown|not found|no such manifest'; then
              echo "hit=false" >> "$GITHUB_OUTPUT"
              echo "Cache MISS — building base target" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAIL: docker manifest inspect failed with non-miss error (rc=$rc):" >&2
              printf '%s\n' "$out" >&2
              exit "$rc"
            fi
          fi
      - name: Free runner disk space
        if: steps.probe.outputs.hit != 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - name: Set up Docker Buildx
        if: steps.probe.outputs.hit != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Write GitHub token for build secret
        if: steps.probe.outputs.hit != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" > /tmp/github_token
      - name: Build and push base image
        if: steps.probe.outputs.hit != 'true'
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        # PUSH=true (bake reads it into the `PUSH` variable) instead of the
        # `push: true` shorthand: the shorthand injects `--set *.output=type=
        # registry`, and a bake `--set` on output REPLACES the list, dropping
        # the zstd/OCI compression flags on the target's `output` (#222).
        env:
          PUSH: "true"
        with:
          source: .
          targets: base
          files: |
            docker-bake.hcl
          set: |
            base.tags=${{ steps.hash.outputs.cache_ref }}
            *.secrets=id=github_token,src=/tmp/github_token
      - name: Resolve cache image digest
        # #160 T11: the build job consumes this image as a DIGEST-pinned
        # named build context — capture the digest here (works on both the
        # hit and miss-after-push paths) and fail loud if empty, since an
        # unpinned context would silently accept a repushed tag.
        id: digest
        env:
          CACHE_REF: ${{ steps.hash.outputs.cache_ref }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${CACHE_REF}" --format '{{.Manifest.Digest}}')
          [ -n "$digest" ] || { echo "FAIL: empty digest for ${CACHE_REF}" >&2; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
  # ============================================================
  # P2996 cache prep: compute content-hash of clang-builder inputs and
  # ensure ghcr.io/<owner>/<repo>:p2996-<hash16> exists. On hash hit
  # (the typical case), this job exits in <30s with cache_ref set; the
  # build job then skips the multi-hour clang compile entirely. On
  # miss, this job builds the p2996-cache target FROM the parameterized
  # BUILDER_IMAGE — fully decoupled from base-prep since #160 T11, so
  # the two prep jobs run in PARALLEL.
  # See .devcontainer/P2996-CACHE.md for the cache mechanism.
  # ============================================================
  p2996-prep:
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.target.runner }}
    # Native, never emulated: this job compiles clang-p2996 from source, and
    # under QEMU that is the multi-hour build made several times worse. The arm
    # runner label was measured, not assumed (#676).
    env:
      PLATFORM: ${{ matrix.target.platform }}
    # Cold clang-p2996 build is a multi-hour from-source compile (~2h+). The
    # earlier 60 was far too low and CANCELLED cold rebuilds (regression from
    # #154's timeout-minutes addition; only warm cache-hits — seconds — masked
    # it). Cache HITS still finish in seconds; this ceiling only bounds a cold
    # build. See docs/research/.../P2996-CACHE.md + feedback_ci_build_duration.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write # explicit; do not rely on workflow-level inheritance
    # No job `outputs` — see the note on base-prep: a matrix job has one output
    # set, so cross-leg reads silently mix architectures.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install mise (python + uv)
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"
      - name: Resolve p2996 ref override
        # Phase D (#120): when a caller passes p2996_ref, export it as
        # CLANG_P2996_REF so BOTH `dotfiles-setup p2996-hash` AND docker
        # bake's native variable override resolve the SAME upstream SHA —
        # the cache tag tracks the overridden ref, never poisoning the
        # canonical pinned-ref cache. Empty input exports nothing, so the
        # docker-bake.hcl pin stays authoritative (byte-identical to the
        # canonical build). Value passed via env (not inline ${{ }}) to
        # keep an untrusted client_payload out of the shell.
        if: inputs.p2996_ref != ''
        env:
          P2996_REF: ${{ inputs.p2996_ref }}
        run: echo "CLANG_P2996_REF=${P2996_REF}" >> "$GITHUB_ENV"
      - name: Compute P2996 cache hash
        id: hash
        run: |
          set -euo pipefail
          hash=$(uv run --project python dotfiles-setup p2996-hash)
          cache_ref="${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:p2996-${hash}"
          {
            echo "hash=${hash}"
            echo "cache_ref=${cache_ref}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## P2996 cache lookup"
            echo ""
            echo "- Hash: \`${hash}\`"
            echo "- Cache ref: \`${cache_ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe cache
        id: probe
        # Discriminate "manifest not found" (legitimate cache miss) from
        # auth/network/registry failures. Capturing stderr instead of
        # `2>/dev/null` honors `build.no-stderr-suppression`.
        env:
          CACHE_REF: ${{ steps.hash.outputs.cache_ref }}
        run: |
          set -euo pipefail
          if out=$(docker manifest inspect "${CACHE_REF}" 2>&1); then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Cache HIT — skipping clang-p2996 compile" >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            if printf '%s\n' "$out" | grep -qiE 'manifest unknown|not found|no such manifest'; then
              echo "hit=false" >> "$GITHUB_OUTPUT"
              echo "Cache MISS — building p2996-cache on top of base-prep image" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAIL: docker manifest inspect failed with non-miss error (rc=$rc):" >&2
              printf '%s\n' "$out" >&2
              exit "$rc"
            fi
          fi
      - name: Free runner disk space
        if: steps.probe.outputs.hit != 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - name: Set up Docker Buildx
        if: steps.probe.outputs.hit != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Write GitHub token for build secret
        if: steps.probe.outputs.hit != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" > /tmp/github_token
      - name: Build and push p2996-cache image
        if: steps.probe.outputs.hit != 'true'
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        # PUSH=true instead of `push: true` — see base-prep step for why (a
        # `--set` output override from the push shorthand would drop the zstd
        # compression flags, #222).
        env:
          PUSH: "true"
        with:
          source: .
          targets: p2996-cache
          files: |
            docker-bake.hcl
          set: |
            p2996-cache.tags=${{ steps.hash.outputs.cache_ref }}
            *.secrets=id=github_token,src=/tmp/github_token
      - name: Resolve cache image digest
        # #160 T11: same digest-pin capture as base-prep — the build job
        # injects this as the p2996-export named context.
        id: digest
        env:
          CACHE_REF: ${{ steps.hash.outputs.cache_ref }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${CACHE_REF}" --format '{{.Manifest.Digest}}')
          [ -n "$digest" ] || { echo "FAIL: empty digest for ${CACHE_REF}" >&2; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
  # ============================================================
  # Dev cache prep (#122): the THIRD content-hash tier. Computes
  # `dotfiles-setup dev-hash` (= base-hash + p2996-hash + whole
  # Dockerfile + dev bake target) and probes ghcr.io for
  # `:dev-<hash16>`. That tag is a "built AND smoke-validated" marker —
  # it is pushed by `dev-tag` ONLY after smoke-test passes — so a probe
  # HIT means the identical image already exists and was validated:
  #   HIT  → retag it to :sha-<sha> / :pr-NNN (so promote works on
  #          merge) and skip build + smoke-test entirely (~12m → ~2m).
  #   MISS → build + smoke-test as normal, then dev-tag pushes the marker.
  # Runs for PR builds only (tag_strategy == 'pr'); schedule/dispatch
  # (tag_strategy == 'nightly') is SKIPPED so the nightly always rebuilds
  # — it exists to catch rolling-tool drift (gcc-latest .deb) that the
  # content hash cannot see. See .devcontainer/P2996-CACHE.md +
  # .github/workflows/AGENTS.md § three-tier probe cache.
  # ============================================================
  dev-prep:
    needs: [plan, base-prep, p2996-prep]
    if: inputs.tag_strategy == 'pr'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: ${{ matrix.target.platform }}
    # `hit` is per-leg and CANNOT be a job output (last leg wins). The `build`
    # job re-probes for its own architecture instead — the probe is a single
    # `docker manifest inspect`, so re-running it is cheaper than the class of
    # bug a shared output invites.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install mise (python + uv)
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"
      - name: Resolve p2996 ref override
        # Phase D (#120): keep `dotfiles-setup dev-hash` in lockstep with
        # the p2996 override so the probed :dev-<hash> matches the image
        # the dispatch path actually builds. See p2996-prep for rationale.
        if: inputs.p2996_ref != ''
        env:
          P2996_REF: ${{ inputs.p2996_ref }}
        run: echo "CLANG_P2996_REF=${P2996_REF}" >> "$GITHUB_ENV"
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe dev cache for this architecture
        id: probe
        uses: ./.github/actions/dev-cache-probe
        with:
          image: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Set up Docker Buildx
        if: steps.probe.outputs.hit == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Retag validated image to the per-architecture tag (cache hit)
        if: steps.probe.outputs.hit == 'true'
        # On a hit, build + smoke-test are skipped for THIS architecture, so
        # the per-architecture tag they would have pushed must be created here
        # from the already-validated :dev-<hash> image. The `manifest` job then
        # merges the per-architecture tags into :<sha> / :pr-NNN exactly as it
        # would after a real build, and `promote` finds :pr-NNN on merge.
        #
        # Only the per-architecture tag is written here (#676). The moving tags
        # are an INDEX over both architectures, so a leg writing them directly
        # would publish a single-architecture image under a name the other leg
        # is about to overwrite — the two legs run concurrently, and the loser
        # would vanish with no error anywhere.
        env:
          IMAGE: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}
          SOURCE_REF: ${{ steps.probe.outputs.cache_ref }}
          TAG_SUFFIX: ${{ matrix.target.tag_suffix }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha=$(printf '%s' "${COMMIT_SHA}" | head -c 7)
          arch_ref="${IMAGE}:${short_sha}-${TAG_SUFFIX}"
          docker buildx imagetools create --tag "${arch_ref}" "${SOURCE_REF}"
          source_digest=$(docker buildx imagetools inspect "${SOURCE_REF}" --format '{{.Manifest.Digest}}')
          arch_digest=$(docker buildx imagetools inspect "${arch_ref}" --format '{{.Manifest.Digest}}')
          [ -n "${arch_digest}" ] || { echo "FAIL: empty digest after retag" >&2; exit 1; }
          if [ "${arch_digest}" != "${source_digest}" ]; then
            echo "FAIL: retag did not propagate the validated digest" >&2
            echo "  source : ${source_digest}" >&2
            echo "  arch   : ${arch_digest}" >&2
            exit 1
          fi
          {
            echo "## Dev cache retag (validated image reused)"
            echo ""
            echo "- Source: \`${SOURCE_REF}\` (digest \`${source_digest}\`)"
            echo "- New tag: \`:${short_sha}-${TAG_SUFFIX}\`"
          } >> "$GITHUB_STEP_SUMMARY"
  # ============================================================
  # Build Type 2: Dotfiles environment image (Docker → ghcr.io)
  # ============================================================
  build:
    needs: [plan, base-prep, p2996-prep, dev-prep]
    # The job now RUNS on a dev-cache hit and no-ops inside (#676). The hit is
    # per-architecture and a matrix job has one `outputs` map, so it cannot be
    # read at job level without mixing the two legs — every build/push step
    # below carries `if: steps.probe.outputs.hit != 'true'` instead. `always()`
    # is still required so a skipped dev-prep (nightly) doesn't cascade-skip
    # this job; the explicit upstream success checks restore failure gating.
    if: |
      always()
      && needs.base-prep.result == 'success'
      && needs.p2996-prep.result == 'success'
      && (needs.dev-prep.result == 'skipped' || needs.dev-prep.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.target.runner }}
    # Cold dev assembly (pull p2996 cache + final COPY/overlay + bake) can run
    # longer than a warm build; keep headroom for a cold path.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: ${{ matrix.target.platform }}
    steps:
      - name: Free runner disk space
        # The multi-stage Dockerfile (clang-p2996 builds clang from
        # source, ~30 GB of intermediate artifacts) plus BuildKit cache
        # exceeds the ubuntu-latest runner's ~14 GB free-space budget.
        # Use the maintained `jlumbroso/free-disk-space` action which
        # knows the actual ubuntu-latest image layout — frees ~30 GB
        # reliably (vs. our hand-rolled rm -rf list which only got
        # ~14 GB because half the paths don't exist on this image).
        # Critically: do NOT prune docker system here — it wipes the
        # BuildKit cache that the build NEEDS for the warm-cache path.
        # The cache-cold path needs more disk, not less, and that's
        # what bit ffd6b50.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # tool-cache (mise / hostedtoolcache / etc.) is only used by
          # the lint + contract-preflight jobs, which run on separate
          # runner VMs. The build job doesn't read from
          # /opt/hostedtoolcache, so we can wipe it here for ~10-20 GB
          # extra headroom on top of the standard ~30 GB.
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          # docker-images: false — preserve BuildKit cache (ffd6b50
          # learned this the hard way; pruning it forces cold rebuilds
          # which need MORE disk, not less).
          docker-images: false
          swap-storage: true
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install mise (python + uv)
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"
      - name: Resolve p2996 ref override
        # Phase D (#120): the cache refs resolved below are content-addressed by
        # hashes that fold in CLANG_P2996_REF, so this job must honor the same
        # override the prep jobs built with.
        if: inputs.p2996_ref != ''
        env:
          P2996_REF: ${{ inputs.p2996_ref }}
        run: echo "CLANG_P2996_REF=${P2996_REF}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe dev cache for this architecture
        id: probe
        uses: ./.github/actions/dev-cache-probe
        with:
          image: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Resolve prebuilt tier refs for this architecture
        # #676: these used to be `needs.base-prep.outputs.{cache_ref,digest}`.
        # Under a matrix that is a correctness bug — one output map, written by
        # the last leg to finish — so roughly half the time the arm64 build
        # would be handed the amd64 base image. Recomputing the hash here is
        # deterministic given PLATFORM (which this job exports), and resolving
        # the digest from the registry proves the image actually exists before
        # BuildKit is asked to pin it.
        id: tiers
        if: steps.probe.outputs.hit != 'true'
        env:
          IMAGE: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          base_ref="${IMAGE}:base-$(uv run --project python dotfiles-setup base-hash)"
          p2996_ref="${IMAGE}:p2996-$(uv run --project python dotfiles-setup p2996-hash)"
          base_digest=$(docker buildx imagetools inspect "${base_ref}" --format '{{.Manifest.Digest}}')
          p2996_digest=$(docker buildx imagetools inspect "${p2996_ref}" --format '{{.Manifest.Digest}}')
          for pair in "base:${base_digest}" "p2996:${p2996_digest}"; do
            if [ -z "${pair#*:}" ]; then
              echo "FAIL: empty digest for the ${pair%%:*} tier" >&2
              exit 1
            fi
          done
          {
            echo "base_context=docker-image://${base_ref}@${base_digest}"
            echo "p2996_context=docker-image://${p2996_ref}@${p2996_digest}"
            echo "p2996_digest=${p2996_digest}"
          } >> "$GITHUB_OUTPUT"
      - name: Extract metadata
        id: meta
        if: steps.probe.outputs.hit != 'true'
        # Labels only (#676). The tag set is now written by `--set dev.tags`
        # below: every matrix leg pushes ONE per-architecture tag, and the
        # moving tags (:sha, :pr-NNN, :dev, :latest) are an index the
        # `manifest` job assembles from them. Letting metadata-action's tags
        # through here would have each leg push the moving tags as a
        # SINGLE-architecture image, and the two legs would silently overwrite
        # one another.
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=-${{ matrix.target.tag_suffix }}
      - name: Write GitHub token for build secret
        if: steps.probe.outputs.hit != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" > /tmp/github_token
      - name: Build and push
        id: bake
        if: steps.probe.outputs.hit != 'true'
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        # PUSH=<publish> feeds the bake `PUSH` variable (target output =
        # type=image,push=${PUSH},...zstd...) instead of the `push:` shorthand,
        # which would inject `--set *.output=type=registry` and REPLACE the
        # target's compression output (#222). force-compression on the `dev`
        # target recompresses the inherited gzip base/p2996 context layers
        # (~82% of the pull) to zstd here — the actual pull-speed lever.
        env:
          PUSH: ${{ inputs.publish }}
        with:
          source: .
          targets: ${{ inputs.target }}
          files: |
            docker-bake.hcl
            ${{ steps.meta.outputs.bake-file-tags }}
            ${{ steps.meta.outputs.bake-file-labels }}
          # #160 T11: the prebuilt tiers arrive as DIGEST-pinned named build
          # contexts — each overrides the same-named local stage, so the
          # heavy stages are never built here (native warm path); BuildKit
          # fails the solve on any digest mismatch (exact-bytes guarantee).
          set: |
            *.secrets=id=github_token,src=/tmp/github_token
            dev.contexts.devcontainer-base=${{ steps.tiers.outputs.base_context }}
            dev.contexts.p2996-export=${{ steps.tiers.outputs.p2996_context }}
      # docker/bake-action v6.8.0+ emits a per-job build summary with inputs,
      # errors, and a downloadable .dockerbuild record by default. The prior
      # hand-rolled "Build performance summary" + "Build diagnostics" steps
      # duplicated this and have been removed.
      - name: Export build outputs
        id: out
        # Surface this leg's per-architecture ref and its digest. Digest is
        # best-effort from bake metadata — never fails the build.
        if: steps.probe.outputs.hit != 'true'
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          TAG_SUFFIX: ${{ matrix.target.tag_suffix }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha=$(printf '%s' "${COMMIT_SHA}" | head -c 7)
          image_ref="${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${short_sha}-${TAG_SUFFIX}"
          digest=$(printf '%s' "${METADATA:-}" | jq -r '.dev["containerimage.digest"] // empty' 2>/dev/null || true)
          {
            echo "image_ref=${image_ref}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"
      - name: Assert provenance materials contain the p2996 digest (#160 T11)
        # The pushed image's SLSA provenance (attest mode=max, T7) must
        # record the exact p2996 artifact digest among its materials —
        # closing the loop from "we injected a digest-pinned context" to
        # "the published attestation proves those bytes went in".
        if: inputs.publish && steps.probe.outputs.hit != 'true'
        env:
          IMAGE_REF: ${{ steps.out.outputs.image_ref }}
          P2996_DIGEST: ${{ steps.tiers.outputs.p2996_digest }}
        run: |
          set -euo pipefail
          provenance=$(docker buildx imagetools inspect "${IMAGE_REF}" --format '{{json .Provenance}}')
          if ! printf '%s' "$provenance" | jq -e --arg d "${P2996_DIGEST}" 'tostring | contains($d)' >/dev/null; then
            echo "FAIL: provenance of ${IMAGE_REF} does not reference p2996 digest ${P2996_DIGEST}" >&2
            exit 1
          fi
          echo "OK: provenance materials include p2996 digest ${P2996_DIGEST}"
      - name: Write hash report (#160 T7)
        # The content-addressed lineage of this build as a downloadable
        # artifact: which :base-/:p2996- cache refs fed the dev image and
        # what digest came out. Complements the per-job step summaries.
        if: steps.probe.outputs.hit != 'true'
        env:
          BASE_CONTEXT: ${{ steps.tiers.outputs.base_context }}
          P2996_CONTEXT: ${{ steps.tiers.outputs.p2996_context }}
          PLATFORM_TRIPLE: ${{ matrix.target.platform }}
          IMAGE_REF: ${{ steps.out.outputs.image_ref }}
          DIGEST: ${{ steps.out.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "platform=${PLATFORM_TRIPLE}"
            echo "base_cache_ref=${BASE_CONTEXT}"
            echo "p2996_cache_ref=${P2996_CONTEXT}"
            echo "image_ref=${IMAGE_REF}"
            echo "digest=${DIGEST}"
          } > /tmp/build-hash-report.txt
      - name: Upload hash report artifact
        # Per-architecture name: two matrix legs uploading one artifact name is
        # a hard error on upload-artifact v4+, so the arm64 leg would fail with
        # a conflict that says nothing about architectures.
        if: steps.probe.outputs.hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-hash-report-${{ matrix.target.arch }}
          path: /tmp/build-hash-report.txt
  # ============================================================
  # Smoke test: validate the freshly-pushed image (PR or main).
  # PRs validate the exact :sha-<sha> that promote will retag as
  # :dev/:latest on merge — no rebuild gap between PR validation
  # and main publication.
  # ============================================================
  smoke-test:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # NATIVE, and that is the point of AC4: an amd64 runner smoking the arm64
    # image would need QEMU, and the in-image probes (TSan among them) do not
    # survive emulation — the smoke would fail for a reason that has nothing to
    # do with the image.
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      PLATFORM: ${{ matrix.target.platform }}
      DOTFILES_PLATFORM: ${{ matrix.target.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Free disk space
        # smoke-test `docker pull`s the full ~38 GB dev image; the stock
        # ubuntu-latest runner (~14 GB free) runs out of space extracting it
        # ("no space left on device"). Sibling build jobs already free disk;
        # smoke-test was the one that didn't (it passed before only on roomier
        # runners). No BuildKit cache to preserve here — this job only pulls.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - name: Install mise (python + uv)
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe dev cache for this architecture
        # A hit means this exact content already passed smoke on a previous
        # run, and `dev-prep` has retagged it — re-smoking it is the ~10 minutes
        # the third cache tier exists to avoid (#122).
        id: probe
        uses: ./.github/actions/dev-cache-probe
        with:
          image: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Derive image tag
        id: smoke-tag
        env:
          COMMIT_SHA: ${{ github.sha }}
          TAG_SUFFIX: ${{ matrix.target.tag_suffix }}
        run: |
          set -euo pipefail
          short_sha=$(printf '%s' "${COMMIT_SHA}" | head -c 7)
          echo "tag=${short_sha}-${TAG_SUFFIX}" >> "$GITHUB_OUTPUT"
      - name: Pull published image
        if: steps.probe.outputs.hit != 'true'
        env:
          IMAGE_REF: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.smoke-tag.outputs.tag }}
        run: docker pull "${IMAGE_REF}"
      - name: Assert the pulled image is this leg's architecture
        # AC4, and a control arm for the whole matrix. The per-architecture tag
        # resolves to a single image, so a plain `docker pull` cannot select the
        # wrong one — but a WIRING mistake (both legs pushing one suffix, a
        # matrix entry with a stale platform) would produce two tags holding the
        # same architecture, and every other check in this job would still pass.
        # Asking the image what it is is the only step that notices.
        if: steps.probe.outputs.hit != 'true'
        env:
          IMAGE_REF: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.smoke-tag.outputs.tag }}
          EXPECTED_ARCH: ${{ matrix.target.arch }}
        run: |
          set -euo pipefail
          actual=$(docker image inspect "${IMAGE_REF}" --format '{{.Architecture}}')
          if [ "${actual}" != "${EXPECTED_ARCH}" ]; then
            echo "FAIL: ${IMAGE_REF} reports architecture '${actual}', expected '${EXPECTED_ARCH}'" >&2
            exit 1
          fi
          echo "OK: ${IMAGE_REF} is ${actual}" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke published image
        if: steps.probe.outputs.hit != 'true'
        env:
          IMAGE_REF: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.smoke-tag.outputs.tag }}
        run: |
          uv run --project python dotfiles-setup image smoke \
            --image-ref "${IMAGE_REF}"
      - name: Bootstrap packages gap report (#160 T7)
        # Capture `status --json` from the published image and assert the
        # declared [bootstrap.packages] set is fully installed. The Python
        # check fails on `missing`/`version_mismatch` AND on an unexpectedly
        # unavailable apt manager or set drift — conditions the build-time
        # `status --missing` exit code cannot see (unavailable managers emit
        # state "skipped"). Plain `status --json` exits 0 even with gaps, so
        # the JSON is always captured for the artifact; the assert gates.
        if: steps.probe.outputs.hit != 'true'
        env:
          IMAGE_REF: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.smoke-tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE_REF}" \
            mise bootstrap packages status --json > /tmp/bootstrap-gap-report.json
          uv run --project python dotfiles-setup bootstrap-gap-report \
            --status-json /tmp/bootstrap-gap-report.json
      - name: Upload bootstrap gap report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-gap-report-${{ matrix.target.arch }}
          path: /tmp/bootstrap-gap-report.json
          if-no-files-found: ignore
        # smoke (+ the bootstrap gap report above) is the PR-blocking image
        # gate. Dive layer-efficiency analysis, benchmark metrics, and the
        # Trivy CVE scan all run asynchronously in `image-analysis.yml`
        # (triggered on CI success) so their minutes never extend the
        # merge-to-main → image-pullable-on-the-Mac critical path — see
        # .github/workflows/AGENTS.md (GHA restructure, 2026-07-07).
        #
        # Note: the host-user overlay (Dockerfile.host-user + `devcontainer up`)
        # is a Mac-local concern — it wraps the published base image with the
        # host user's UID/GID for bind-mount permission parity on macOS. CI has
        # no meaningful "host user" to match, no mount sources, and no overlay
        # to rebuild; the Pull / Smoke / Dive steps above fully validate the
        # published base image. Overlay behavior is validated locally via
        # `mise run up` on the Mac.
  # ============================================================
  # Dev cache tag (#122): push `:dev-<hash>` as the "built AND
  # smoke-validated" marker — ONLY after smoke-test passes. This is what
  # makes the dev-prep probe-skip safe: the tag can only ever point at an
  # image that cleared smoke, so a future probe HIT reuses a
  # validated image, never an untested one. Runs whenever build+smoke ran
  # and passed (PR cache-miss AND nightly), so the marker stays fresh.
  # Recomputes dev-hash independently (deterministic) since dev-prep is
  # skipped on the nightly path.
  # ============================================================
  dev-tag:
    needs: [plan, build, smoke-test]
    if: needs.smoke-test.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # This job only moves tags, so it does not need a native runner — but it
    # DOES need `dev-hash` to resolve this leg's architecture, and that reads
    # PLATFORM. Running on the matching runner keeps the two facts in one place
    # rather than making the label and the exported platform independently
    # correct-by-inspection.
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: ${{ matrix.target.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install mise (python + uv)
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve p2996 ref override
        # Phase D (#120): the validated marker is content-addressed by
        # dev-hash, which folds in CLANG_P2996_REF. dev-tag MUST honor the
        # same override the p2996 cache built with — otherwise it would
        # stamp a pinned-ref hash onto overridden-ref content, poisoning a
        # later canonical build's probe. See p2996-prep for rationale.
        if: inputs.p2996_ref != ''
        env:
          P2996_REF: ${{ inputs.p2996_ref }}
        run: echo "CLANG_P2996_REF=${P2996_REF}" >> "$GITHUB_ENV"
      - name: Tag validated image as :dev-<hash>
        env:
          IMAGE: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}
          COMMIT_SHA: ${{ github.sha }}
          TAG_SUFFIX: ${{ matrix.target.tag_suffix }}
        run: |
          set -euo pipefail
          # `dev-hash` resolves PLATFORM, so this is THIS leg's hash and the
          # marker it stamps is per-architecture without any suffix of its own
          # (#676). Stamping it from the per-architecture source tag is what
          # keeps that true: marking a multi-architecture index with a
          # single-architecture hash would make the other leg's probe hit an
          # image it never validated.
          hash=$(uv run --project python dotfiles-setup dev-hash)
          short_sha=$(printf '%s' "${COMMIT_SHA}" | head -c 7)
          source_ref="${IMAGE}:${short_sha}-${TAG_SUFFIX}"
          marker_ref="${IMAGE}:dev-${hash}"
          # The just-built + smoked image is published at :sha-<sha>;
          # stamp the content-hash marker onto that exact digest.
          docker buildx imagetools create --tag "${marker_ref}" "${source_ref}"
          source_digest=$(docker buildx imagetools inspect "${source_ref}" --format '{{.Manifest.Digest}}')
          marker_digest=$(docker buildx imagetools inspect "${marker_ref}" --format '{{.Manifest.Digest}}')
          [ -n "${marker_digest}" ] || { echo "FAIL: empty digest after marker tag" >&2; exit 1; }
          if [ "${marker_digest}" != "${source_digest}" ]; then
            echo "FAIL: marker tag did not propagate the validated digest" >&2
            echo "  source : ${source_digest}" >&2
            echo "  marker : ${marker_digest}" >&2
            exit 1
          fi
          {
            echo "## Dev cache marker tagged"
            echo ""
            echo "- \`${marker_ref}\` → digest \`${source_digest}\` (smoke-validated)"
          } >> "$GITHUB_STEP_SUMMARY"
  # ============================================================
  # Manifest merge (#676): the moving tags become an INDEX.
  #
  # Every build leg publishes exactly one `:<sha>-<arch>` tag and nothing else,
  # so until this job runs there is no `:<sha>`, `:pr-NNN`, `:dev` or `:latest`
  # at this commit. This job assembles them with one
  # `docker buildx imagetools create -t <moving> <per-arch>…`, which builds an
  # OCI index referencing both architectures' existing manifests — no bytes are
  # re-uploaded and no image is rebuilt.
  #
  # That split is what makes `docker pull` do the right thing for both callers
  # this repo has: the Mac asks for `:dev` and the daemon picks the entry
  # matching what it wants, while anything needing determinism names
  # `:<sha>-<arch>` and gets exactly one image.
  #
  # It runs on `always()` with explicit success checks because the legs may
  # legitimately have SKIPPED their build+smoke on a dev-cache hit — in that
  # case the per-architecture tags exist because `dev-prep` retagged them, and
  # they still need merging.
  # ============================================================
  manifest:
    needs: [plan, dev-prep, build, smoke-test, dev-tag]
    if: |
      always()
      && needs.build.result == 'success'
      && needs.smoke-test.result == 'success'
      && (needs.dev-tag.result == 'success' || needs.dev-tag.result == 'skipped')
      && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.merge.outputs.image_ref }}
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install mise (python + uv)
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge the per-architecture tags into the moving tags
        id: merge
        env:
          IMAGE: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NIGHTLY: ${{ inputs.tag_strategy == 'nightly' }}
        run: |
          set -euo pipefail
          short_sha=$(printf '%s' "${COMMIT_SHA}" | head -c 7)
          # Sources come from the SAME matrix the legs fanned out over, so a
          # published architecture can never be silently left out of the index.
          mapfile -t suffixes < <(printf '%s' "${MATRIX}" | jq -r '.[].tag_suffix')
          sources=()
          for suffix in "${suffixes[@]}"; do
            sources+=("${IMAGE}:${short_sha}-${suffix}")
          done
          tags=(--tag "${IMAGE}:${short_sha}")
          if [ -n "${PR_NUMBER}" ]; then
            tags+=(--tag "${IMAGE}:pr-${PR_NUMBER}")
          fi
          if [ "${NIGHTLY}" = "true" ]; then
            tags+=(--tag "${IMAGE}:dev" --tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          # The MOVING per-architecture tags (spec D1): `:dev` is what a caller
          # pulls to get its own architecture, `:dev-<arch>` is how it names one
          # deliberately — which is what a cross-architecture identity check and
          # a `mise.local.toml` pin both need. Written one at a time from the
          # matching per-architecture source so each stays a single image, never
          # an index.
          #
          # Safe beside the `:dev-<hash16>` content-hash markers despite sharing
          # the prefix: `ghcr_cleanup`'s retention planner matches
          # `^(base|p2996|dev)-[0-9a-f]{16}$`, so an architecture word is not a
          # hash-family member and is never proposed for deletion.
          if [ "${NIGHTLY}" = "true" ]; then
            for suffix in "${suffixes[@]}"; do
              docker buildx imagetools create \
                --tag "${IMAGE}:dev-${suffix}" "${IMAGE}:${short_sha}-${suffix}"
            done
          fi
          digest=$(docker buildx imagetools inspect "${IMAGE}:${short_sha}" --format '{{.Manifest.Digest}}')
          [ -n "${digest}" ] || { echo "FAIL: empty digest after manifest merge" >&2; exit 1; }
          {
            echo "image_ref=${IMAGE}:${short_sha}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Manifest published"
            echo ""
            echo "- Index: \`${IMAGE}:${short_sha}\` (digest \`${digest}\`)"
            printf -- "- Source: \`%s\`\n" "${sources[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Assert the index lists every published architecture (AC1)
        env:
          IMAGE_REF: ${{ steps.merge.outputs.image_ref }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          # `imagetools inspect --raw` returns the index document itself, so
          # this reads what the registry will actually serve rather than what
          # the merge step believed it wrote.
          raw=$(docker buildx imagetools inspect "${IMAGE_REF}" --raw)
          # Attestation entries carry `unknown/unknown` and must not count as
          # coverage — an index of two attestations and one real image would
          # otherwise pass a naive count.
          mapfile -t present < <(printf '%s' "${raw}" \
            | jq -r '.manifests[].platform | select(.os != "unknown") | .architecture' \
            | sort -u)
          mapfile -t expected < <(printf '%s' "${MATRIX}" | jq -r '.[].arch' | sort -u)
          echo "index architectures: ${present[*]}"
          if [ "${present[*]}" != "${expected[*]}" ]; then
            echo "FAIL: ${IMAGE_REF} lists [${present[*]}], expected [${expected[*]}]" >&2
            exit 1
          fi
      - name: Assert each architecture resolves to its own image (AC2 + AC4)
        # The deferred half of #674's AC3, now runnable for real: that ticket
        # proved a mismatched architecture FAILS the manifest measure, but only
        # against synthetic fixtures, because no arm64 image existed to measure.
        # This is the same probe against the registry — and it is a genuine
        # two-armed check, since `size-report` exits 1 naming the available
        # platforms when the requested one is absent.
        env:
          IMAGE_REF: ${{ steps.merge.outputs.image_ref }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          sums=()
          while read -r platform; do
            echo "--- measuring ${platform} of ${IMAGE_REF}"
            report=$(uv run --project python dotfiles-setup image size-report \
              --image-ref "${IMAGE_REF}" --platform "${platform}")
            printf '%s\n' "${report}"
            sums+=("$(printf '%s' "${report}" | sha256sum)")
          done < <(printf '%s' "${MATRIX}" | jq -r '.[].platform')
          # Two architectures whose measurements are byte-identical mean the
          # index points both entries at one image — the exact failure a plain
          # "did the pull succeed" check cannot see.
          unique=$(printf '%s\n' "${sums[@]}" | sort -u | wc -l)
          if [ "${unique}" -ne "${#sums[@]}" ]; then
            echo "FAIL: architectures produced identical measurements — the index is not really multi-architecture" >&2
            exit 1
          fi
          echo "OK: each architecture resolves to a distinct image" >> "$GITHUB_STEP_SUMMARY"
