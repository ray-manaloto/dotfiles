# Throwaway measurement job (#840 / the two-image plan, step S0).
#
# WHY THIS EXISTS
# The `ubuntu-26.04-arm` validation leg has never passed its smoke test --
# 0 successes since #840 landed -- with every other stage of that same leg
# green and this in the log:
#
#     FATAL: ThreadSanitizer: encountered an incompatible memory layout
#     FATAL: Please rerun with lower ASLR entropy
#
# Control arm already measured: in the SAME run and on the SAME arm64 image,
# the `ubuntu-24.04-arm` leg's smoke-test PASSED, so the defect is
# runner-kernel-side (26.04-arm ships a 7.0 azure kernel vs 24.04-arm's 6.17),
# not image-side.
#
# UNVERIFIED, and the only reason this exists: what the 26.04 runners'
# `vm.mmap_rnd_bits` actually is, and whether lowering it is SUFFICIENT on a
# 7.0 kernel. Do not "fix" the smoke test by skipping TSan -- inside docker
# TSan cannot self-correct, because the default seccomp profile denies
# `personality(ADDR_NO_RANDOMIZE)`. That is what the seccomp arm isolates.
#
# WHY v2 (this file) REPLACES THE v1 JOB THAT LIVED IN ci.yml
# v1 measured nothing on either leg, and its control arm is what revealed it:
#
#   1. It installed clang with `--no-install-recommends`, which omits
#      `libclang_rt.tsan.a`, so `clang -fsanitize=thread` died at LINK time
#      on every leg. v1 collapsed build and run into one rc, so a toolchain
#      failure was published in the summary table as a "TSan rc" -- a build
#      break wearing an ASLR result's clothes. Fixed by dropping
#      `--no-install-recommends` AND reporting BUILD_RC separately from
#      TSAN_RC, so this class of failure can never again be read as a verdict.
#   2. It read the entropy with `sysctl -n ... 2>/dev/null || echo unknown`.
#      `sysctl` lives in /sbin and is not reliably on a non-root PATH here, and
#      the `2>/dev/null` discarded the reason -- turning "the probe could not
#      look" into a value that reads like a kernel answer. Fixed by reading
#      /proc/sys/vm/mmap_rnd_bits, which needs no binary on PATH at all.
#   3. It had no seccomp arm and no x64 leg, so it could not distinguish the
#      sysctl fix from the seccomp fix, and said nothing about the runner S5
#      flips amd64 onto.
#
# It is `workflow_dispatch` only and is deliberately NOT in `ci-gate`'s
# `needs:` -- a measurement is not a merge gate. The proven knob lands in the
# real `smoke-test` job at S1; this file is DELETED once the answer is
# recorded, along with its `EXPECTED_JOBS` entry in tests/test_workflow_hooks.py.
name: probe-aslr-tsan

on:
  workflow_dispatch:
    inputs:
      target_bits:
        description: "vm.mmap_rnd_bits value the sysctl arm lowers to"
        required: false
        default: "28"

permissions:
  contents: read

jobs:
  probe-aslr-tsan:
    strategy:
      fail-fast: false
      # 24.04 legs are CONTROLS: known-good today. If the default arm fails
      # THERE too, this probe's repro is wrong and it says nothing about
      # 26.04. A probe that can only report one outcome is not a probe.
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Probe ASLR entropy and TSan across three arms
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
          TARGET_BITS: ${{ inputs.target_bits }}
        run: |
          # GitHub runs this as `/bin/bash -e {0}`; this step inspects its own
          # exit codes, so clear the -e or a failing arm aborts the step before
          # it can report anything. That is what made v1's diagnostics dead code.
          set +e
          set -uo pipefail

          # /proc is authoritative and needs no binary on PATH. v1 used
          # `sysctl -n ... 2>/dev/null || echo unknown`, which cannot tell a
          # kernel that has no such knob from a `sysctl` it could not resolve.
          read_bits() {
            if [ -r /proc/sys/vm/mmap_rnd_bits ]; then
              cat /proc/sys/vm/mmap_rnd_bits
            else
              echo "NO_SUCH_KNOB"
            fi
          }

          kernel="$(uname -r)"
          before="$(read_bits)"
          echo "runner=${RUNNER_LABEL} kernel=${kernel} mmap_rnd_bits=${before}"

          cat > /tmp/tsan.c <<'CSRC'
          #include <pthread.h>
          static int shared;
          static void *worker(void *arg) { (void)arg; shared++; return 0; }
          int main(void) {
            pthread_t t; pthread_create(&t, 0, worker, 0);
            shared++; pthread_join(t, 0); return 0;
          }
          CSRC

          # BUILD and RUN are reported separately and the inner script always
          # exits 0, so the caller parses verdicts from stdout rather than
          # inheriting one collapsed rc. Any docker flags are passed through
          # as "$@" (an array, never an unquoted string) so shellcheck stays
          # clean and an empty arm adds no stray argument.
          #
          # No --privileged and no extra capabilities beyond the arm under
          # test: the real smoke-test does not get them either, so a probe
          # that used them would answer a question we do not ship.
          probe() {
            docker run --rm "$@" -v /tmp/tsan.c:/tsan.c:ro ubuntu:26.04 bash -c '
              set -u
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq >/dev/null 2>&1
              # NOT --no-install-recommends: that is precisely what omitted
              # libclang_rt.tsan.a and made v1 fail at link time.
              apt-get install -y -qq clang >/dev/null 2>&1
              clang -fsanitize=thread -o /tmp/t /tsan.c 2>/tmp/build.err
              build_rc=$?
              if [ "$build_rc" -ne 0 ]; then
                echo "BUILD_RC=${build_rc}"
                echo "TSAN_RC=na"
                echo "--- build stderr ---"
                tail -3 /tmp/build.err
                exit 0
              fi
              echo "BUILD_RC=0"
              /tmp/t > /tmp/run.out 2>&1
              echo "TSAN_RC=$?"
              echo "--- run output ---"
              tail -3 /tmp/run.out
              exit 0
            ' 2>&1
          }

          verdict() { echo "$1" | grep -E "^${2}=" | head -1 | cut -d= -f2; }

          echo "=== ARM 1: default seccomp, entropy as-is (${before}) ==="
          out1="$(probe)"
          echo "${out1}"
          b1="$(verdict "${out1}" BUILD_RC)"; t1="$(verdict "${out1}" TSAN_RC)"

          # Measured BEFORE the sysctl write, so it isolates seccomp from
          # entropy. Running it after lowering would confound the two.
          echo "=== ARM 2: seccomp=unconfined, entropy as-is (${before}) ==="
          out2="$(probe --security-opt seccomp=unconfined)"
          echo "${out2}"
          b2="$(verdict "${out2}" BUILD_RC)"; t2="$(verdict "${out2}" TSAN_RC)"

          echo "=== lowering vm.mmap_rnd_bits to ${TARGET_BITS} on the HOST ==="
          sudo /sbin/sysctl -w "vm.mmap_rnd_bits=${TARGET_BITS}" 2>&1 | tail -1
          after="$(read_bits)"
          echo "mmap_rnd_bits now=${after}"

          echo "=== ARM 3: default seccomp, entropy lowered (${after}) ==="
          out3="$(probe)"
          echo "${out3}"
          b3="$(verdict "${out3}" BUILD_RC)"; t3="$(verdict "${out3}" TSAN_RC)"

          {
            echo "## ${RUNNER_LABEL}"
            echo ""
            echo "| fact | value |"
            echo "|---|---|"
            echo "| kernel | \`${kernel}\` |"
            echo "| mmap_rnd_bits before | ${before} |"
            echo "| mmap_rnd_bits after | ${after} |"
            echo ""
            echo "| arm | build rc | tsan rc |"
            echo "|---|---|---|"
            echo "| 1 default, entropy as-is | ${b1} | ${t1} |"
            echo "| 2 seccomp=unconfined, entropy as-is | ${b2} | ${t2} |"
            echo "| 3 default, entropy ${after} | ${b3} | ${t3} |"
            echo ""
            echo "**How to read this.** Any \`build rc\` that is not 0 means the"
            echo "TOOLCHAIN failed and that row's \`tsan rc\` says nothing about"
            echo "ASLR -- that is the exact failure v1 published as a result."
            echo ""
            echo "On a CONTROL leg (\`ubuntu-24.04\`, \`ubuntu-24.04-arm\`) arm 1"
            echo "MUST be build 0 / tsan 0. If it is not, the repro is wrong and"
            echo "the 26.04 numbers are unreadable -- fix the probe, not the runner."
            echo ""
            echo "On a 26.04 leg: arm 1 non-zero with arm 3 zero means the sysctl"
            echo "knob is the fix and S1 wires it into smoke-test. Arm 1 non-zero"
            echo "with arm 2 zero means seccomp is the blocker instead. Both arm 2"
            echo "and arm 3 non-zero means ${TARGET_BITS} is not sufficient on this"
            echo "kernel and the plan needs a different value or approach."
          } >> "$GITHUB_STEP_SUMMARY"

          # Always exit 0: every outcome here is a RESULT to read, not a build
          # failure. This job is not in ci-gate's needs, so a non-zero exit
          # would only make a completed measurement look like a broken build.
          exit 0
