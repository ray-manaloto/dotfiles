name: image-analysis
# Async image analysis: Dive layer efficiency + benchmark metrics + Trivy CVE
# scan, decoupled from the PR critical path. Runs after a successful CI run
# that actually built an image (pull_request / schedule / workflow_dispatch —
# NOT push-to-main, which skips the build and lets `promote` retag instead).
# smoke remains the only blocking image gate in ci.yml; this workflow carries
# every non-gating analysis so nothing here can extend the merge-to-main →
# image-pullable-on-the-Mac critical path (GHA restructure, 2026-07-07).
# A Dive threshold breach fails THIS run (visible, zero-skip: investigate it)
# without blocking the already-smoked image.
#
# SECURITY: this is a privileged `workflow_run` context. It checks out the
# DEFAULT branch's trusted code (no `ref:` → main), never the PR head, and runs
# that trusted benchmark code against the PR-built *image*. So untrusted PR code
# never executes here with the workflow token.
#
# GOTCHA: `workflow_run` always uses this file as it exists on the default
# branch, so edits here only take effect once merged to main.
# zizmor: ignore[dangerous-triggers] — workflow_run is the DELIBERATE design
# here: this workflow runs off the PR critical path, triggered by CI
# completion, and never checks out or executes PR-authored code with its
# token (single-maintainer repo, no fork PRs). See workflows/AGENTS.md.
on: # zizmor: ignore[dangerous-triggers] — deliberate: see comment above
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: read
  packages: read
  actions: read # read the upstream CI run's job timings (build-metrics, #17)
  security-events: write # Trivy SARIF → GitHub code scanning
concurrency:
  group: image-analysis-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true
env:
  CONTAINER_REGISTRY: ghcr.io
  IMAGE_NAME: ray-manaloto/dotfiles-devcontainer
  # Silence git's "Using 'master' as the name for the initial branch" hint
  # that actions/checkout's `git init` emits (#21). git reads GIT_CONFIG_COUNT/
  # KEY/VALUE directly, so this needs no `git config` step and applies to every
  # git invocation in the workflow. It MUST be repeated per workflow file: env
  # does NOT cross workflow_call, and it must be set before checkout runs.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  analyze:
    # Only for successful CI runs whose event built a fresh image. push-to-main
    # skips the build (promote retags), so there is no new :sha image to scan.
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted code (default branch)
        # No `ref:` — checks out the default branch (main), NOT the PR head.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise (python + uv)
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve analyzable image ref (#231)
        id: image
        # #231: a PR build tags the image :<github.sha> = the ephemeral
        # refs/pull/N/merge commit (head != merge), so the pre-#231 lookup by
        # :<workflow_run.head_sha> (the PR HEAD) missed on every PR build and all
        # analysis silently skipped. The resolver (python, unit-tested) analyzes
        # :pr-NNN instead — resolved from the head sha via commits/<sha>/pulls,
        # NOT workflow_run.pull_requests[] (empty on same-repo PR runs) — and
        # FAILS LOUD (exit 1 -> red job) when a pull_request run resolves no PR
        # number (the #231 silent-lookup signature). A resolved PR whose :pr-NNN
        # is absent is a docs/path-gated PR (build correctly skipped) -> quiet
        # green skip. This job is async/non-gating, so a red FAIL surfaces the
        # regression without blocking merge. Emits present=/ref= to $GITHUB_OUTPUT.
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          IMAGE_BASE: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          uv run --project python dotfiles-setup image resolve-analysis-ref \
            --event "$EVENT" \
            --head-sha "$HEAD_SHA" \
            --repo "$REPO" \
            --image "$IMAGE_BASE" >> "$GITHUB_OUTPUT"
      - name: Pull image
        if: steps.image.outputs.present == 'true'
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: docker pull "$REF"
      - name: Analyze image layer efficiency (Dive)
        # Dive --ci enforces .dive-ci thresholds (lowestEfficiency,
        # highestWastedBytes). Moved out of the PR-blocking smoke-test job
        # (2026-07-07): layer efficiency does not affect whether the image
        # works, so it runs async here.
        #
        # Direct binary install (NOT `uses: wagoodman/dive@<sha>`):
        # the upstream "action" is a bare Dockerfile (no action.yml)
        # auto-detected by GHA. That Dockerfile has the bug
        #   ARG DOCKER_CLI_VERSION=${DOCKER_CLI_VERSION}
        # which under BuildKit resolves to empty (no env-var inheritance
        # for ARG defaults), so the action build fetches docker-.tgz
        # and fails with 404 before our scan ever runs. The release
        # tarball has no such bug — invoke the binary directly.
        if: steps.image.outputs.present == 'true'
        env:
          DIVE_VERSION: 0.13.1
          REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/dive.tar.gz \
            "https://github.com/wagoodman/dive/releases/download/v${DIVE_VERSION}/dive_${DIVE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/dive.tar.gz -C /tmp dive
          sudo install -m 0755 /tmp/dive /usr/local/bin/dive
          dive --ci --ci-config .dive-ci "$REF"
      - name: Benchmark image (size + smoke metrics)
        # Compressed-size now comes from the registry manifest (instant), not
        # `docker save | gzip`. See python/src/dotfiles_setup/image.py.
        if: steps.image.outputs.present == 'true'
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: |
          uv run --project python dotfiles-setup image benchmark \
            --image-ref "$REF" \
            --output-path artifacts/build/devcontainer-metrics.json \
            > /tmp/devcontainer-metrics.stdout.json
      - name: Render metrics step summary (#17)
        # Renders size + installed-tool-count + smoke + upstream CI build-time
        # to the run summary. Visibility-only — never gates. build-time comes
        # from the source CI run's jobs API (workflow_run.id → actions:read).
        if: steps.image.outputs.present == 'true'
        env:
          METRICS_RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --project python dotfiles-setup image metrics-summary \
            --metrics-path artifacts/build/devcontainer-metrics.json \
            --run-id "$METRICS_RUN_ID" \
            --repo "$REPO" \
            --summary-path "$GITHUB_STEP_SUMMARY"
      - name: Scan image for CVEs (Trivy, warn-only)
        # warn-only (exit-code 0): SARIF surfaces in the Security tab; does not
        # gate. `scanners: vuln` + `timeout: 15m` per the heavy-image notes that
        # previously lived in ci.yml (issue #92).
        if: steps.image.outputs.present == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          scanners: vuln
          timeout: 15m
      - name: Upload Trivy SARIF to code scanning
        # Associate the result with the analyzed commit/branch (workflow_run
        # context defaults to the default branch otherwise).
        if: steps.image.outputs.present == 'true' && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy.sarif
          category: trivy-image
          ref: refs/heads/${{ github.event.workflow_run.head_branch }}
          sha: ${{ github.event.workflow_run.head_sha }}
      - name: Upload metrics artifact
        if: always() && steps.image.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devcontainer-metrics
          path: |
            artifacts/build/devcontainer-metrics.json
            /tmp/devcontainer-metrics.stdout.json
            trivy.sarif
          if-no-files-found: ignore
