name: CI
on:
  schedule:
    # Staggered 2h after refresh.yml's 00:00 refresh so a same-day pin bump
    # (snapshot / CLANG_P2996_REF), once merged, is what this nightly
    # rebuild+publish picks up. This job rebuilds+publishes on the *pinned*
    # ref (catches base-image CVEs / floating-tool drift); refresh.yml
    # *changes* the pins. Distinct, complementary roles — see
    # `.github/workflows/AGENTS.md` § Cron schedules.
    - cron: "0 2 * * *" # Daily 02:00 America/Chicago
      timezone: "America/Chicago"
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - "docker-bake.hcl"
      - "home/**"
      - "python/**"
      - ".github/workflows/ci.yml"
      - "hk.pkl"
      - "hk-image.pkl"
      - "hk-common.pkl"
      - "renovate.json"
      # Image build input: COPYd to /usr/local/share/mise/conf.d/ by the
      # Dockerfile and covered by the base content-hash — a merge touching
      # only this file must still run promote (gap found landing #178).
      - ".config/mise/conf.d/shared.toml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Bake target (dev, cpp, all)"
        required: false
        default: "dev"
      force_dev_tag:
        description: "Tag the build as :dev / :latest (used by promote fallback for direct-to-main pushes without an associated PR)"
        required: false
        default: false
        type: boolean
# Serialize runs per branch and cancel superseded ones — only the latest
# commit's run survives; in-flight runs for older commits on the same branch
# are cancelled. `head_ref` groups by source branch for pull_request events;
# `ref` covers push / schedule / workflow_dispatch. main is exempt from
# cancellation: its push-path runs `promote` (a manifest-retag of
# :dev/:latest) which must not be interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CONTAINER_REGISTRY: ghcr.io
  IMAGE_NAME: ray-manaloto/dotfiles-devcontainer
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Workflow-wide logging defaults so failed runs are diagnosable from
  # the artifact-uploaded log files instead of needing a re-run with
  # `--debug` toggled on. Console stays at default level; disk log is
  # debug-level. Aligns with `mise.toml [env]` for local/CI parity.
  # The lint/contract-preflight/p2996-prep/smoke-test jobs upload these
  # via per-job `if: always()` upload-artifact steps.
  # Refs: https://hk.jdx.dev/logging.html, https://mise.jdx.dev/configuration.html#mise-log-file-mise-log
  HK_LOG_FILE_LEVEL: debug
  MISE_LOG_FILE: /tmp/mise.log
  MISE_LOG_FILE_LEVEL: debug
  # Silence git's "Using 'master' as the name for the initial branch" hint
  # that actions/checkout's `git init` emits (#21). git reads GIT_CONFIG_COUNT/
  # KEY/VALUE directly, so this needs no `git config` step and applies to every
  # git invocation in the workflow. It MUST be repeated per workflow file: env
  # does NOT cross workflow_call, and it must be set before checkout runs.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

permissions:
  contents: read
  packages: write
jobs:
  # ============================================================
  # Build Type 1: Project linting (hk + mise)
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # #160 T8: fail-fast deterministic installs — lint runs on the exact
      # versions recorded in mise.lock, the same lock the Mac host consumes
      # (macOS local == CI/CD parity principle). Lock↔config coverage is
      # gated by tests/test_lock_coverage.py in contract-preflight.
      MISE_LOCKED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        # No install_args → installs every tool in mise.toml. The composite
        # forwards to jdx/mise-action, whose default `cache: true` keys on
        # {platform}-{install_args_hash}-{file_hash} — granular per-platform
        # AND per-install-args cache hygiene, preserved across all jobs.
        uses: ./.github/actions/setup-mise
      - name: Configure git identity for hk
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Validate hk config
        run: hk validate
        env:
          HK_LOG: debug
      - name: Run hk checks
        # #160 T12: the canonical read-only `check` hook (same steps as
        # pre-commit, no fix/stash) — CI never wants write-backs.
        run: hk run check --all
      - name: Assert chezmoiignore mise overlay hard gate
        # Machine-checks the .chezmoiignore devcontainer-only gate. Uses the
        # canonical chezmoi.os pattern (linux = devcontainer, darwin = host).
        # The runner is always linux → mise overlay MUST be in `chezmoi managed`.
        # The darwin path is the inverse and is verified locally on Mac via
        # `chezmoi --source ./home managed | grep mise`. Prevents future edits
        # from silently breaking the Mac-pollution defense.
        # See feedback_use_tool_builtins.md and the C10 commit body.
        run: |
          set -euo pipefail
          SRC="$PWD/home"
          T=$(mktemp -d)
          HOME="$T" chezmoi init --source "$SRC" --apply=false >/dev/null
          if ! HOME="$T" chezmoi --source "$SRC" managed \
               | grep -qE '^\.config/mise/config\.toml$'; then
            echo "FAIL: .chezmoiignore regression — mise overlay NOT rendered on linux runner (devcontainer simulation)" >&2
            exit 1
          fi
          rm -rf "$T"
          echo "OK: .chezmoiignore mise overlay renders on linux runner. Darwin path verified locally on Mac."
      - name: Check for outdated tools
        run: mise outdated || true
      - name: Reshim mise tools
        # Explicit reshim to handle the cache-restored-from-fallback case:
        # when mise.lock changes (e.g., a new tool like pipx:mcp2cli is added)
        # the exact cache key misses and restore-keys hydrates an older cache.
        # In that state mise does not re-run install, so the postinstall
        # hook's reshim does not fire, and `mise doctor` reports stale
        # shims. Running reshim explicitly here resynchronises the shim
        # index against the actual installs/ directory.
        run: mise reshim
      - name: Run mise doctor
        run: |
          mise doctor
          echo "## mise doctor" >> "$GITHUB_STEP_SUMMARY"
          mise doctor -J | jq '.' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Validate agent documentation
        # --strict: warnings are errors (agnix exits 0 on warnings otherwise,
        # so they were invisible — #250). Kept CI/local-parity with the hk
        # `agnix` step and `mise run lint-docs`. Known false positives are
        # scoped out in .agnix.toml, so a NEW warning fails loud here.
        run: agnix . --strict
      - name: Upload mise lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mise-lock
          path: mise.lock
      - name: Upload diagnostic logs (hk + mise)
        # Always upload so failed/hung runs are diagnosable from the
        # artifact tab without re-running with --verbose. Aligns with
        # the workflow-level HK_LOG_FILE_LEVEL=debug + MISE_LOG_FILE
        # env vars at the top of this file.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-job-logs
          path: |
            /tmp/mise.log
            ~/.local/state/hk/hk.log
          if-no-files-found: ignore
  contract-preflight:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, NOT the default shallow clone: `session_review`,
          # `lint_delta` and `skillopt_provenance` all resolve a merge-base
          # against `origin/main`, and `.claude/rules/goal-history.md` says
          # review FAILS CLOSED when that baseline is unresolvable. Those
          # tests are history-dependent, not host-hostile — deselecting them
          # would remove the check from the only place it runs unattended.
          fetch-depth: 0
      - name: Checkout knowledge-base (cross-repo parity)
        # `eval.cross-repo-parity` compares this repo against the sibling
        # knowledge-base repo, so the gate needs both trees. actions/checkout
        # refuses a path outside $GITHUB_WORKSPACE, so it lands inside the
        # workspace and KB_REPO_PATH points the gate at it. Public repo — no
        # token needed. If this step is ever dropped, the parity gate FAILS in
        # CI rather than skipping: a gate that goes quiet when its own wiring
        # disappears is the #354 bug one level up.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ray-manaloto/knowledge-base
          path: .parity/knowledge-base
          persist-credentials: false
      - name: Install mise
        # FULL install, not the former `python uv` subset (#808). pytest now
        # runs here, and 7 of its tests shell out to host-merged tools —
        # `hk`, `chezmoi`, `pixi`, `codex`. Under the subset they failed as
        # "not on PATH", which reads identically to "host-hostile" and is how
        # over-marking silently deletes CI coverage. `graphify` is
        # `os = ["macos"]` in mise.toml so linux skips it either way.
        uses: ./.github/actions/setup-mise
      - name: Validate Dockerfile contracts
        run: |
          uv run --project python dotfiles-setup verify run \
            --category build --category ci --category identity --category architecture \
            --json
      - name: Validate orchestration + eval contracts
        run: |
          uv run --project python dotfiles-setup verify run \
            --category orchestration --category eval \
            --json
      - name: Cross-repo parity gate
        env:
          KB_REPO_PATH: ${{ github.workspace }}/.parity/knowledge-base
        run: mise run parity
      - name: Run pytest
        # #808: `mise run ship` gates on pytest, but a BOT PR never runs ship
        # (#369) and pytest ran nowhere in CI — so bot PRs had test coverage
        # on neither path. That is how #778 (a lockfile bot PR) turned `main`
        # red on a test ABOUT lockfiles and merged green.
        #
        # No `-m` here on purpose: pytest.ini's addopts already deselects
        # image_exec/codex_exec, and a command-line `-m` would REPLACE it.
        # The five genuinely host-only tests skip themselves via $CI —
        # GitHub sets it — in tests/conftest.py.
        run: uv run --project python pytest tests/ -q
  # ============================================================
  # Change detection: gate the Docker build chain (base-prep →
  # p2996-prep → build → smoke-test) AND `promote` on whether the
  # change actually touches image- or test-relevant paths. Skips the
  # whole chain for PRs/merges that only touch docs, root mise.toml/
  # mise.lock (host-only — the image uses .devcontainer/mise-system.toml),
  # hk.pkl, home/**, .claude/**, etc.
  #
  # Build-relevant paths = the image's actual inputs:
  #   - .devcontainer/** (Dockerfile, mise-system.toml, resolved snapshot,
  #     devcontainer.json), docker-bake.hcl, hk-common.pkl, hk-image.pkl
  #     (all COPYd into the image or feed the bake/base/p2996 hashes)
  #   - python/** + .dive-ci (drive base-hash/p2996-hash, contract-preflight
  #     verify, and smoke-test) and ci.yml itself (build behaviour).
  #
  # schedule + workflow_dispatch always build (nightly full rebuild is
  # intentional; do NOT gate it). The build jobs keep their existing
  # push-to-main exemption; `promote` additionally skips when the merge
  # changed no build paths (the image is unchanged, so :dev/:latest is
  # already current and needs no retag/rebuild).
  # ============================================================
  changes:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filter build-relevant paths
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Emit the matched-file list so `decide` can drop markdown-only
          # matches (a pattern-level `!**/*.md` can't: dorny's default `some`
          # quantifier OR-matches the negation, and `**/*.md` skips dot-dirs
          # like .devcontainer/).
          list-files: json
          filters: |
            build:
              - '.devcontainer/**'
              - 'docker-bake.hcl'
              - 'hk-common.pkl'
              - 'hk-image.pkl'
              - 'python/**'
              - '.dive-ci'
              - '.github/workflows/ci.yml'
              - '.config/mise/conf.d/shared.toml'
      - name: Decide whether the build chain runs
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BUILD_FILES: ${{ steps.filter.outputs.build_files }}
        run: |
          # schedule / workflow_dispatch always build. For PR/push, build only
          # when a changed build-relevant file is NOT markdown — docs (incl.
          # docs under .devcontainer/** or python/**) never affect the image or
          # build/verify logic. `jq` is preinstalled on the runner.
          case "$EVENT" in
            pull_request|push)
              if printf '%s' "${BUILD_FILES:-[]}" \
                | jq -e 'map(select(endswith(".md") | not)) | length > 0' >/dev/null; then
                echo "build=true" >> "$GITHUB_OUTPUT"
              else
                echo "build=false" >> "$GITHUB_OUTPUT"
              fi ;;
            *) echo "build=true" >> "$GITHUB_OUTPUT" ;;
          esac
  # ============================================================
  # Docker build chain — extracted to the reusable build-publish.yml
  # (Phase B, #118). This caller carries the `changes` path-gate and the
  # push-to-main exemption; the reusable workflow holds base-prep →
  # p2996-prep → build → smoke-test verbatim. `promote` stays below
  # (push-to-main only — no rebuild on main).
  #
  # tag_strategy maps the prior inline metadata-action enable logic:
  # schedule / force_dev_tag dispatch => 'nightly' (emits :dev + :latest
  # + :sha); PR => 'pr' (emits :pr-NNN + :sha). `github` context inside
  # the called workflow is THIS event, so type=sha / type=ref,event=pr
  # resolve identically. `secrets: inherit` forwards GITHUB_TOKEN.
  # ============================================================
  build-publish:
    needs: [contract-preflight, changes]
    if: (github.event_name != 'push' || github.ref != 'refs/heads/main') && needs.changes.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-publish.yml
    with:
      tag_strategy: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_dev_tag)) && 'nightly' || 'pr' }}
      publish: true
      target: ${{ github.event.inputs.target || 'dev' }}
  # ============================================================
  # CI gate (#119/#129): a single ALWAYS-run aggregator that branch
  # protection requires INSTEAD of the path-gated `build-publish /
  # smoke-test`. A non-build PR (docs/hk/home/refresh) skips the
  # `build-publish` caller, so `build-publish / smoke-test` produces NO
  # check run — requiring it directly would block every such PR ("Expected
  # — waiting"). ci-gate sidesteps that: it passes when every upstream job
  # SUCCEEDED or was legitimately SKIPPED, and fails if any FAILED/
  # cancelled. Auto-merge safety is preserved — a failed smoke-test fails
  # `build-publish`, which fails ci-gate — while letting non-build PRs
  # merge normally. See .github/workflows/AGENTS.md § GitHub App.
  # ============================================================
  ci-gate:
    needs: [lint, contract-preflight, changes, build-publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require all upstream jobs to succeed or skip
        env:
          RESULTS: >-
            ${{ needs.lint.result }} ${{ needs.contract-preflight.result }} ${{ needs.changes.result }} ${{ needs.build-publish.result }}
        run: |
          set -euo pipefail
          rc=0
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "FAIL: an upstream job result is '$r'" >&2; rc=1 ;;
            esac
          done
          if [ "$rc" -eq 0 ]; then
            echo "ci-gate: all upstream jobs success or skipped — mergeable"
          fi
          exit "$rc"
  # ============================================================
  # Promote: tag-only retag of the PR-built image as :dev / :latest.
  # No rebuild — the PR's :pr-<NNN> manifest digest is reused. If the
  # merge commit has no associated PR (e.g., direct push to main, force
  # push), fall back to a workflow_dispatch with force_dev_tag=true.
  # ============================================================
  promote:
    needs: [lint, changes]
    # Only promote when the merge changed build-relevant paths. A docs-only
    # merge skipped the PR build (no :pr-NNN image) and left the image
    # unchanged, so :dev/:latest is already current — promoting would
    # needlessly trigger the fallback rebuild.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Find source PR for this commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          # Values passed via env (not inline ${{ }}) so template expansion
          # never lands inside the shell — zizmor template-injection (#160 T12).
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Look up the PR(s) associated with this commit. Works uniformly
          # for squash, merge-commit, and rebase merges. Query lives in a
          # quoted heredoc so the GraphQL $-parameters are not bash vars.
          cat > /tmp/associated_pr.gql <<'GQL'
          query($owner:String!,$repo:String!,$sha:GitObjectID!){
            repository(owner:$owner,name:$repo){
              object(oid:$sha){
                ... on Commit {
                  associatedPullRequests(first:1) { nodes { number } }
                }
              }
            }
          }
          GQL
          # Capture the raw GraphQL response first so we can discriminate
          # "no PR" (legitimate fallback) from API/auth/scope failure
          # (would silently trigger a multi-hour rebuild today).
          resp=$(gh api graphql \
            -F query=@/tmp/associated_pr.gql \
            -F owner="${REPO_OWNER}" \
            -F repo="${REPO_NAME}" \
            -F sha="${COMMIT_SHA}")
          if jq -e '.errors' <<<"$resp" >/dev/null 2>&1; then
            echo "FAIL: graphql returned errors:" >&2
            jq '.errors' <<<"$resp" >&2
            exit 1
          fi
          pr_number=$(jq -r \
            '.data.repository.object.associatedPullRequests.nodes[0].number // empty' \
            <<<"$resp")
          if [ -z "$pr_number" ]; then
            echo "No associated PR for ${COMMIT_SHA} — will fall back to rebuild" >&2
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "Found associated PR #${pr_number}" >&2
            echo "fallback=false" >> "$GITHUB_OUTPUT"
            echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        if: steps.pr.outputs.fallback != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to Container Registry
        if: steps.pr.outputs.fallback != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe source PR image exists (else fall through to rebuild)
        if: steps.pr.outputs.fallback != 'true'
        id: source_probe
        env:
          IMAGE: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          source_ref="${IMAGE}:pr-${PR_NUMBER}"
          # The PR image may have been pruned (GHCR retention, manual
          # delete) by the time a long-running revert merges. If so, the
          # promote retag would fail hard; we instead route this to the
          # rebuild fallback path so the operator never gets stuck. We
          # also discriminate auth/network/registry errors from the
          # legitimate "tag not found" miss.
          err_log=$(mktemp)
          if source_digest=$(docker buildx imagetools inspect "${source_ref}" --format '{{.Manifest.Digest}}' 2>"${err_log}"); then
            if [ -z "${source_digest}" ]; then
              echo "FAIL: imagetools inspect succeeded but Manifest.Digest was empty for ${source_ref}" >&2
              cat "${err_log}" >&2
              exit 1
            fi
            {
              echo "source_present=true"
              echo "source_ref=${source_ref}"
              echo "source_digest=${source_digest}"
            } >> "$GITHUB_OUTPUT"
          elif grep -qiE 'manifest unknown|not found|no such manifest' "${err_log}"; then
            echo "WARN: ${source_ref} not present (retention prune?); switching to rebuild fallback" >&2
            echo "source_present=false" >> "$GITHUB_OUTPUT"
          else
            echo "FAIL: imagetools inspect failed with non-miss error:" >&2
            cat "${err_log}" >&2
            exit 1
          fi
      - name: Retag PR image as :dev and :latest
        if: steps.pr.outputs.fallback != 'true' && steps.source_probe.outputs.source_present == 'true'
        env:
          IMAGE: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}
          SOURCE_REF: ${{ steps.source_probe.outputs.source_ref }}
          SOURCE_DIGEST: ${{ steps.source_probe.outputs.source_digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:dev" \
            --tag "${IMAGE}:latest" \
            "${SOURCE_REF}"
          # Verify both new tags resolve to the source digest. Without
          # this, `imagetools create` could no-op silently (concurrent
          # push race) and pre-existing stale-but-equal digests would
          # pass the dev==latest check while neither tag was updated.
          dev_digest=$(docker buildx imagetools inspect "${IMAGE}:dev" --format '{{.Manifest.Digest}}')
          latest_digest=$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}')
          for d in "${dev_digest}" "${latest_digest}"; do
            [ -n "$d" ] || { echo "FAIL: empty digest after retag" >&2; exit 1; }
          done
          if [ "${dev_digest}" != "${SOURCE_DIGEST}" ] || [ "${latest_digest}" != "${SOURCE_DIGEST}" ]; then
            echo "FAIL: retag did not propagate source digest" >&2
            echo "  source : ${SOURCE_DIGEST}" >&2
            echo "  :dev   : ${dev_digest}"   >&2
            echo "  :latest: ${latest_digest}" >&2
            exit 1
          fi
          # The moving PER-ARCHITECTURE tags (#676). `:dev` is a multi-
          # architecture index, so a caller that must name one architecture —
          # a cross-architecture identity check, a `mise.local.toml` pin —
          # reaches for `:dev-<arch>`. Advancing `:dev` without advancing those
          # leaves a stale image behind a moving name, which is exactly the
          # confusing failure mode the spec's D1 warns about, and it is silent:
          # the pin keeps resolving, just to last month's image.
          #
          # The architecture list is read from the INDEX rather than passed in,
          # so it describes what was actually published and cannot drift from
          # the matrix that produced it. Attestation entries carry
          # `os: unknown` and are filtered out.
          raw=$(docker buildx imagetools inspect "${SOURCE_REF}" --raw)
          while read -r arch digest; do
            [ -n "${arch}" ] || continue
            # --prefer-index=false is LOAD-BEARING, not tidiness. Its default
            # is true and means, per the CLI's own help, "when only a single
            # source is specified, prefer outputting an image index or manifest
            # list instead of performing a carbon copy". The source here is one
            # single-platform manifest, so the default would wrap it in a NEW
            # index whose digest is necessarily different — making the equality
            # assertion below unsatisfiable and failing `promote` on every main
            # merge, AFTER :dev and :latest had already moved. A carbon copy is
            # also what the tag should mean: `:dev-amd64` IS the amd64 image,
            # not an index containing it.
            docker buildx imagetools create --prefer-index=false \
              --tag "${IMAGE}:dev-${arch}" "${IMAGE}@${digest}"
            got=$(docker buildx imagetools inspect "${IMAGE}:dev-${arch}" --format '{{.Manifest.Digest}}')
            if [ "${got}" != "${digest}" ]; then
              echo "FAIL: :dev-${arch} is ${got}, expected ${digest}" >&2
              exit 1
            fi
            echo "- Per-arch tag: \`:dev-${arch}\` → \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done < <(printf '%s' "${raw}" | jq -r \
            '.manifests[] | select(.platform.os != "unknown") | "\(.platform.architecture) \(.digest)"')
          {
            echo "## Promote (tag-only)"
            echo ""
            echo "- Source: \`${SOURCE_REF}\`"
            echo "- New tags: \`:dev\`, \`:latest\` (digest \`${SOURCE_DIGEST}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Trigger fallback rebuild
        if: steps.pr.outputs.fallback == 'true' || steps.source_probe.outputs.source_present == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Verify the dispatch actually created a run — `gh workflow run`
          # returns 0 on a successful queue but does not guarantee a run
          # appears (rare API hiccup, scope misconfig, branch protection).
          # Without verification, a green "fallback rebuild" summary could
          # mask a missing :dev/:latest publication.
          gh workflow run ci.yml \
            --ref main \
            -f target=dev \
            -f force_dev_tag=true
          # The dispatched run takes a moment to appear in the listing;
          # poll briefly rather than rely on a fixed sleep.
          run_id=""
          for _ in 1 2 3 4 5; do
            sleep 3
            run_id=$(gh run list --workflow=ci.yml --branch=main \
                       --event=workflow_dispatch --limit 1 \
                       --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "FAIL: dispatched ci.yml but no workflow_dispatch run appeared" >&2
            exit 1
          fi
          run_url="https://github.com/${{ github.repository }}/actions/runs/${run_id}"
          {
            echo "## Promote (fallback rebuild)"
            echo ""
            echo "No PR / source image available; dispatched ci.yml with force_dev_tag=true."
            echo ""
            echo "Dispatched run: <${run_url}>"
          } >> "$GITHUB_STEP_SUMMARY"
  # ============================================================
  # Failure report: normalized triage artifact when anything in this
  # run failed. Replaces the standalone ci-failure-report.yml
  # workflow_run follower (GHA restructure, 2026-07-07): as an
  # `if: failure()` job it executes ONLY on real failures — the old
  # follower spawned a skipped run entry on every CI success (93% of
  # its run history). Same script, same artifact; RUN_ID is this run.
  # Never on the critical path: it only runs when the run already failed.
  # ============================================================
  failure-report:
    needs: [lint, contract-preflight, changes, build-publish, ci-gate, promote]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Generate normalized failure report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          uv run --script plugins/dotfiles-build-optimizer/scripts/github_failure_report.py \
            --repo "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --output-dir artifacts/ci-failure
      - name: Upload failure report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-report-${{ github.run_id }}
          path: artifacts/ci-failure
