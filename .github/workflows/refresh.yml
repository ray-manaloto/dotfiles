name: Refresh upstream pins

# Two independent daily-refresh jobs merged into one workflow. Each detects
# a different upstream drift and opens a PR via the shared
# `./.github/actions/open-refresh-pr` composite. Each job mints a GitHub
# App token (actions/create-github-app-token) for the PR push so the PR's
# normal `pull_request` CI fires on its own — no `gh workflow run ci.yml`
# dispatch hack, and no dependency on the "Allow Actions to create PRs"
# repo setting (Phase C, #119). The jobs share nothing but that tail —
# distinct detection, concurrency groups, and cache needs — so they run
# fully in parallel and one failing never blocks the other.
#
# Merge policy: snapshot-refresh AUTO-MERGES (squash) once smoke-test
# passes — fully unattended; p2996-refresh is REVIEW-REQUIRED (the clang
# compiler bump gets human eyes; smoke-test is the safety net either way).
#
# One-time setup (repo admin) — see .github/workflows/AGENTS.md § GitHub
# App: install an App with contents:write + pull-requests:write, add
# `REFRESH_APP_ID` + `REFRESH_APP_PRIVATE_KEY` secrets, enable "Allow
# auto-merge", and require the `build-publish / smoke-test` check on main.
#
#   - snapshot-refresh: refreshes `.devcontainer/mise-system-resolved.json`
#     so the P2996 cache hash picks up conda-forge drift on `"latest"`-pinned
#     tools. Without it the snapshot can stale-hit the cache (binaries inside
#     the cached image are last-snapshot, not latest).
#   - p2996-refresh: bumps the pinned `CLANG_P2996_REF` in `docker-bake.hcl`
#     to the latest `bloomberg/clang-p2996` `p2996`-branch HEAD. clang-p2996
#     ships no releases/tags, so that branch HEAD is "latest stable". The SHA
#     stays pinned (reproducible) and feeds the content-addressed cache key
#     in `dotfiles_setup.p2996_hash` (issue #100).
#
# Triggers:
#   - Daily cron at 00:00 America/Chicago. ci.yml's nightly publish runs at
#     02:00 (staggered) so a same-day refresh PR — once merged — is what the
#     nightly rebuild publishes. GHA honors the sibling `timezone:` field.
#   - workflow_dispatch — manual trigger via `gh workflow run refresh.yml`
#     or the web UI (fires both jobs).
#
# Outcome per job: opens a PR if its tracked file changed; no-op if not.

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot-refresh:
    runs-on: ubuntu-latest
    # Job-level concurrency keeps this independent of p2996-refresh — a
    # superseding snapshot run cancels only its own group.
    concurrency:
      group: snapshot-refresh
      cancel-in-progress: false
    env:
      # Disk-only debug-level logs for diagnosing snapshot-capture failures.
      HK_LOG_FILE_LEVEL: debug
      MISE_LOG_FILE: /tmp/mise.log
      MISE_LOG_FILE_LEVEL: debug
    steps:
      - name: Mint GitHub App token
        # App-token PR push fires `pull_request` CI on its own (unlike
        # secrets.GITHUB_TOKEN). Token is scoped to this repo via the App
        # installation; permissions = the App's grant (contents + PRs write).
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.REFRESH_APP_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest devcontainer image
        run: docker pull ghcr.io/ray-manaloto/dotfiles-devcontainer:dev

      - name: Capture mise-system resolved snapshot from container
        # Run `mise ls --json` inside the container (where the system
        # mise config is installed and resolved), feed through our Python
        # snapshot helper to filter + format deterministically.
        # `--user "$(id -u):$(id -g)"` matches the runner UID so the
        # written file is owned by the runner, not root — otherwise
        # peter-evans/create-pull-request fails to stage the change.
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspaces/dotfiles" \
            -w /workspaces/dotfiles \
            ghcr.io/ray-manaloto/dotfiles-devcontainer:dev \
            bash -lc 'uv run --project python dotfiles-setup mise-snapshot'

      - name: Open PR if snapshot drifted
        uses: ./.github/actions/open-refresh-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: refresh mise-system-resolved snapshot"
          title: "chore: refresh mise-system-resolved snapshot"
          body: |
            Automated daily refresh of `.devcontainer/mise-system-resolved.json`.

            Captures conda-forge resolutions of system-mise tools whose
            `mise-system.toml` versions are pinned to `"latest"`. This PR
            auto-merges (squash) once `build-publish / smoke-test` passes —
            the smoke test validates the rebuilt image, so the snapshot
            drift lands unattended.

            Trigger: ${{ github.event_name }}.
          branch: chore/snapshot-refresh
          paths: .devcontainer/mise-system-resolved.json
          labels: mise-snapshot
          summary-heading: Snapshot refresh
          auto-merge: "true"

  p2996-refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: p2996-refresh
      cancel-in-progress: false
    steps:
      - name: Mint GitHub App token
        # App-token PR push fires `pull_request` CI on its own (unlike
        # secrets.GITHUB_TOKEN). This job does NOT auto-merge — the clang
        # compiler bump is review-required.
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.REFRESH_APP_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mise (python + uv)
        # Subset install: only python + uv, both pinned in mise.toml.
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"

      - name: Bump CLANG_P2996_REF to latest p2996 HEAD
        # `git ls-remote` the p2996 branch, compare to the pinned SHA, and
        # rewrite docker-bake.hcl only when it advanced. Emits a one-line
        # JSON result (changed/old_ref/new_ref) to the step summary.
        id: bump
        run: |
          set -euo pipefail
          result=$(uv run --project python dotfiles-setup p2996-refresh)
          echo "$result"
          {
            echo "## CLANG_P2996_REF refresh"
            echo ""
            echo '```json'
            echo "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open PR if the pinned ref advanced
        uses: ./.github/actions/open-refresh-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: bump CLANG_P2996_REF to latest p2996 HEAD"
          title: "chore: bump CLANG_P2996_REF to latest p2996 HEAD"
          body: |
            Automated daily bump of `CLANG_P2996_REF` in `docker-bake.hcl`
            to the latest `bloomberg/clang-p2996` `p2996`-branch HEAD.

            clang-p2996 ships no releases or tags, so the active P2996 work
            on the `p2996` branch HEAD is tracked as "latest". The pinned
            SHA feeds the content-addressed P2996 cache key, so this PR will
            trigger exactly one clang rebuild (ccache gives ~80% object
            reuse). **Review-required** — the compiler bump gets human eyes;
            review the upstream commit range before merging.

            Trigger: ${{ github.event_name }}.
          branch: chore/p2996-refresh
          paths: docker-bake.hcl
          labels: enhancement
          summary-heading: CLANG_P2996_REF refresh validation
          auto-merge: "false"
