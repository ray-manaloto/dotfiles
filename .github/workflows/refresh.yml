name: Refresh lockfiles
# Daily lock-refresh (#160 T8). Regenerates the three committed lockfiles
# via the $/.github/actions/lock-refresh composite and opens an
# auto-merging PR when anything drifted:
#
#   - mise.lock (repo root)                  — host/CI tools
#   - .devcontainer/mise-system.lock         — image tools (pinned image
#     MISE_VERSION, linux-x64 — the runner IS linux-x64, which is why this
#     job exists: macOS mise cannot write the conda checksums)
#   - .devcontainer/devcontainer-lock.json   — devcontainer features
#
# Why not Renovate: the hosted app can never run `mise lock` (the command
# is admin-allowlisted) and does not know mise-system.lock by name; its
# native `mise` manager only rewrites version STRINGS in config files.
# This job owns re-RESOLUTION of `"latest"` pins; per-PR lock↔config
# coverage is gated deterministically by tests/test_lock_coverage.py in
# contract-preflight (a per-PR regen would false-fail on any upstream
# release since the last refresh).
#
# The predecessor snapshot-refresh job (mise-system-resolved.json) was
# retired with the snapshot itself (#160 T1); p2996-refresh was retired in
# #169. S28b-1 fixed its defective successor (#1434): Renovate's scoped
# git-refs manager now bumps the single docker-bake.hcl pin in its own PR.
# Do not re-wire a second scheduled writer here.
#
# The job mints a GitHub App token (actions/create-github-app-token) for
# the PR push so the PR's normal `pull_request` CI fires on its own
# (GITHUB_TOKEN-created PRs don't — GitHub's recursion guard). Merge
# policy: AUTO-MERGE (squash) once ci-gate passes — a lock bump is
# validated by the full build + smoke chain like any other PR. One-time
# App setup: .github/workflows/AGENTS.md § GitHub App.
#
# Triggers:
#   - Daily cron at 00:00 America/Chicago; ci.yml's nightly publish runs
#     at 02:00 (staggered) so a same-day lock PR — once merged — is what
#     the nightly rebuild publishes. GHA honors the sibling `timezone:`.
#   - workflow_dispatch — manual trigger via `gh workflow run refresh.yml`.
#   - pull_request — feeds ONLY the `image-lock-pr` job below (#887); the two
#     `schedule`/`workflow_dispatch` jobs below are gated `if:` to stay off
#     pull_request entirely, so their cron/dispatch behaviour is unchanged.
on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: write
  pull-requests: write

env:
  # Silence git's "Using 'master' as the name for the initial branch" hint
  # that actions/checkout's `git init` emits (#21). git reads GIT_CONFIG_COUNT/
  # KEY/VALUE directly, so this needs no `git config` step and applies to every
  # git invocation in the workflow. It MUST be repeated per workflow file: env
  # does NOT cross workflow_call, and it must be set before checkout runs.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  lock-refresh:
    # Never on pull_request — this job's cron/dispatch behaviour is otherwise
    # byte-for-byte unchanged (#887 INV-7).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: lock-refresh
      cancel-in-progress: false
    env:
      # Disk-only debug-level logs for diagnosing lock-regen failures.
      MISE_LOG_FILE: /tmp/mise.log
      MISE_LOG_FILE_LEVEL: debug
      # The repo no longer installs hooks from mise postinstall (jdx/hk#1376),
      # so this runner gets them only if another setup installs them. Keep the
      # skip as defense in depth: create-pull-request commits AND pushes, and
      # those hooks cannot pass here (no `gh auth` or `claude` on PATH).
      # CI runs its own lint job.
      HK_SKIP_HOOKS: pre-commit,pre-push
    steps:
      - name: Mint GitHub App token
        # App-token PR push fires `pull_request` CI on its own (unlike
        # secrets.GITHUB_TOKEN). REFRESH_APP_ID must be the NUMERIC App ID
        # — `app-id` signs the JWT `iss`, which GitHub requires be an
        # integer; the Client ID (`Iv…`) fails even via `client-id`
        # (verified live, #119).
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REFRESH_APP_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise (all tools)
        # Full install: the composite needs mise itself (root lock), uv +
        # python (lock-stage/lock-collect), and @devcontainers/cli
        # (devcontainer upgrade) — all pinned in mise.toml/shared.toml.
        uses: $/.github/actions/setup-mise
      - name: Regenerate lockfiles
        uses: $/.github/actions/lock-refresh
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Open PR if any lock drifted
        uses: $/.github/actions/open-refresh-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: refresh lockfiles (mise.lock, mise-system.lock, mise-runtime.lock, devcontainer-lock.json)"
          title: "chore: refresh lockfiles"
          body: |
            Automated daily regeneration of the three committed lockfiles
            (#160 T8):

            - `mise.lock` — host/CI tool resolutions
            - `.devcontainer/mise-system.lock` — image tool resolutions
              (pinned image MISE_VERSION, linux-x64)
            - `.devcontainer/mise-runtime.lock` — runtime-tier image tool
              resolutions (`MISE_ENV=runtime`, written beside mise-system.lock
              in the same pinned-mise pass, #160 T9)
            - `.devcontainer/devcontainer-lock.json` — devcontainer features

            Re-resolves `"latest"` pins that the hosted Renovate app cannot
            (it may not run `mise lock`). This PR auto-merges (squash) once
            ci-gate passes — an image-input lock change runs the full
            build + smoke chain first.

            Trigger: ${{ github.event_name }}.
          branch: chore/lock-refresh
          paths: |
            mise.lock
            .config/mise/mise.lock
            .devcontainer/mise-system.lock
            .devcontainer/mise-runtime.lock
            .devcontainer/devcontainer-lock.json
          labels: lockfile
          summary-heading: Lock refresh
          auto-merge: "true"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lock-refresh-logs
          path: /tmp/mise.log
          if-no-files-found: ignore
  # ============================================================
  # Tool-currency signal (2026-07-07, Ray's self-learning ask): render
  # `mise outdated --json` into a markdown report with per-tool
  # release-notes links and upsert it into a standing issue. The
  # AGENT-grade half (read the release notes, decide adopt/retire,
  # research newer tools/techniques) happens locally via the
  # tool-currency-check skill, with this issue as its daily input —
  # a workflow can produce the signal, not the judgment.
  # ============================================================
  tool-currency:
    # Never on pull_request — this job mutates a standing issue with
    # `issues: write` (`gh issue create`/`edit`/`close`); an ungated
    # `pull_request` trigger would let every PR in the repo rewrite or close
    # it. Cron/dispatch behaviour is otherwise byte-for-byte unchanged
    # (#887 INV-7).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise (all tools)
        uses: $/.github/actions/setup-mise
      - name: Render tool-currency report
        run: mise run tool-currency > /tmp/tool-currency.md
      - name: Upsert the standing report issue
        # Only when something moved upstream (the report has table rows).
        # One standing issue, body replaced daily — history lives in the
        # issue timeline, not in N stale issues.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! grep -q '^| `' /tmp/tool-currency.md; then
            # Review finding [32]: when everything is current, CLOSE the
            # standing issue (if open) so it cannot go silently stale —
            # 'no rows' and 'job broken' must not look identical.
            title="Tool currency report (daily)"
            number=$(gh issue list --repo "$REPO" --state open \
                       --search "in:title \"$title\"" \
                       --json number,title \
                       --jq ".[] | select(.title == \"$title\") | .number" | head -1)
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$REPO" \
                --comment "All pinned tools are current — closing until upstream moves again."
            fi
            echo "All tools current — no issue update."
            exit 0
          fi
          title="Tool currency report (daily)"
          # Review finding [30]: --search word-matches; filter to the
          # EXACT title so an unrelated issue can never be clobbered.
          number=$(gh issue list --repo "$REPO" --state open \
                     --search "in:title \"$title\"" \
                     --json number,title \
                     --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$REPO" --body-file /tmp/tool-currency.md
            echo "Updated issue #$number"
          else
            # needs-triage puts bot-filed issues into the /triage flow rather than
            # leaving them unlabelled (docs/triage-labels.md). Safe to add: this
            # issue is deduped by EXACT TITLE above, never by label.
            gh issue create --repo "$REPO" --title "$title" \
              --body-file /tmp/tool-currency.md --label dependencies,needs-triage
          fi
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tool-currency-report
          path: /tmp/tool-currency.md
          if-no-files-found: ignore

  # ============================================================
  # PR-reactive image-lock regeneration (#887). Renovate rewrites an exact
  # pin in `.config/mise/conf.d/shared.toml` and correctly regenerates both
  # HOST locks (mise.lock, .config/mise/mise.lock), but can never regenerate
  # the two IMAGE locks. Both this job and the `lock-refresh` job above call
  # the SAME producer, `mise run lock-image`; what this job adds is the
  # TRIGGER, because lock-refresh runs on `main` via cron/dispatch and
  # therefore never sees an unmerged PR's bump. The bump then sits permanently blocked by
  # `tests/test_lock_coverage.py::test_system_lock_versions_match_pins` in
  # contract-preflight: a deadlock, not a missed step, because the only job
  # that can fix the lock only ever runs on a branch that already has it.
  #
  # Scope is deliberately narrow: ONLY the two image locks, via
  # `mise run lock-image -- --no-container` (the runner already IS
  # linux-x64, so no devcontainer routing). Host locks stay Renovate's, and
  # the composite's root `mise lock` step is NOT run here — it is currently
  # producing a defective artifact for an unrelated reason (#821) that this
  # job must not inject into every bot PR.
  # ============================================================
  image-lock-pr:
    # Same-repo Renovate PRs only. Forks: `secrets.*` are unavailable to
    # `pull_request` runs from a fork, so the App-token mint below would fail
    # and red-X every fork PR. Dependabot: Dependabot-triggered runs read the
    # Dependabot secret store, not Actions secrets, so the same mint would
    # fail there too — this repo has an active `.github/dependabot.yml`.
    #
    # Deliberately NO actor-based loop guard. `gcc-sha-repair.yml` mints from
    # the SAME REFRESH_APP_ID/REFRESH_APP_PRIVATE_KEY and pushes to
    # `renovate/**` too, so it can push as the same bot; renovate.json's
    # `image-build inputs` packageRule groups `.devcontainer/Dockerfile` and
    # `.config/mise/conf.d/shared.toml` into ONE PR, so a PR touching both a
    # dated gcc `.deb` and a `shared.toml` pin is the default shape, not an
    # edge case. (This used to say `extends group:all`, which grouped
    # EVERYTHING; that was dropped in #1062 because one red pin then blocked
    # all the others. The conclusion is unchanged -- these two paths are still
    # deliberately in the same group -- only the rule that does it.) A guard on
    # `github.actor` would then skip this job on the very `synchronize` that
    # OTHER job's push causes, restoring the #887 deadlock on the commonest
    # PR shape. The drift check below is genuinely idempotent — after our own
    # push, the next `synchronize` finds no drift and exits 0 in ~1 minute —
    # so that IS the terminator; no belt-and-braces guard is needed or safe.
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: image-lock-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      # The repo no longer installs hooks from mise postinstall (jdx/hk#1376),
      # but keep the skip in case another setup installs them: this job commits
      # and pushes, and the hooks fail here without `gh auth` and `claude`.
      # ADR-0001; `workflow_hk_skip_hooks` enforces it on any new job.
      HK_SKIP_HOOKS: pre-commit,pre-push
    steps:
      - name: Mint GitHub App token
        # An App-token push re-triggers the PR's own `pull_request` checks
        # (ci.yml has no `paths:` filter); a plain `secrets.GITHUB_TOKEN`
        # push does not (GitHub's recursion guard) — #887 INV-9.
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REFRESH_APP_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Resolve the App's bot user id
        # actions/create-github-app-token's own README documents the correct
        # committer address as `<numeric-user-id>+<app-slug>[bot]@…` — the
        # id is NOT derivable from the token/app-slug alone, hence this extra
        # lookup. Deriving both pieces (never hardcoding the slug or the id)
        # means this survives an App rename without a code change.
        id: bot-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      - name: Checkout PR branch
        # persist-credentials: false — the App token is used ONLY in the push
        # step below (via a tokenized remote), never persisted to .git/config
        # (zizmor artipacked). Default GITHUB_TOKEN suffices to check out a
        # same-repo branch read-only. Matches gcc-sha-repair.yml's precedent.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: Record the checked-out branch head
        # With no actor-based loop guard, two runs of this job CAN overlap on
        # a busy PR (e.g. a Renovate resync racing this job's own push). This
        # is the baseline the push step compares against before pushing.
        id: base-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install mise (python + uv)
        uses: $/.github/actions/setup-mise
        with:
          install_args: "python uv"
      - name: Check image-lock drift (five node IDs only, never the whole file)
        # tests/test_lock_coverage.py holds 13 tests across five lockfiles;
        # eight are outside this job's domain, including one that is
        # currently red for an unrelated reason (#821, stale root mise.lock
        # entries) this job must not touch. Never `-k` — a substring matcher
        # would silently absorb a future same-named test. This is the
        # primary loop terminator: once a fix commit lands, this passes and
        # the job below exits 0 on the next `synchronize`, no push.
        id: drift-check
        continue-on-error: true
        run: |
          uv run --project python pytest \
            tests/test_lock_coverage.py::test_system_lock_versions_match_pins \
            tests/test_lock_coverage.py::test_runtime_lock_versions_match_pins \
            tests/test_lock_coverage.py::test_system_lock_covers_merged_config \
            tests/test_lock_coverage.py::test_runtime_lock_covers_runtime_config \
            tests/test_lock_coverage.py::test_image_locks_carry_no_provenance -q
      - name: Regenerate image locks
        if: steps.drift-check.outcome == 'failure'
        env:
          # mise run lock-image inherits env and injects no token itself;
          # anonymous, its convergence loop can exhaust GitHub's rate limit
          # and raise "did not converge in 5 pass(es)". That is ONE cause, not
          # the only one: a tool whose candidate set is empty fails all five
          # identically and no token helps (2026-09-10; #964).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --skip-tools (#963): this job installs only python+uv, so a bare
        # `mise run` first installs the ~51 missing root tools, UNLOCKED, and
        # each fresh install of an aqua `type: http` tool with no published
        # checksum (aws-cli, docker-cli) writes its blake3 into the tracked
        # root mise.lock — tripping the containment guard below. The task
        # needs only uv/python (image_lock.py runs its own pinned mise in a
        # stage dir). Measured: `mise run --skip-tools t` leaves the lock
        # untouched; bare `mise run t` adds the checksum line.
        run: mise run --skip-tools lock-image -- --no-container
      - name: Re-check image-lock drift after regeneration
        # Second terminator (#887 INV-2): this must now PASS unconditionally
        # — a failure here fails the job and skips every step below, so
        # nothing is ever pushed on top of a regen that didn't fix it. This
        # job is not a required status check (main only requires `ci-gate`),
        # so this re-check is the ONLY guard on what gets committed.
        if: steps.drift-check.outcome == 'failure'
        run: |
          uv run --project python pytest \
            tests/test_lock_coverage.py::test_system_lock_versions_match_pins \
            tests/test_lock_coverage.py::test_runtime_lock_versions_match_pins \
            tests/test_lock_coverage.py::test_system_lock_covers_merged_config \
            tests/test_lock_coverage.py::test_runtime_lock_covers_runtime_config \
            tests/test_lock_coverage.py::test_image_locks_carry_no_provenance -q
      - name: Confirm the diff is confined to the two image locks
        # Two guards in one step: (1) `continue-on-error: true` on the drift
        # check converts ANY non-pass outcome (a real failure, but also a
        # pytest collection error, a renamed node ID, a network flake) into
        # "outcome == failure" — without this, a regen that (correctly)
        # changed nothing would hit `git commit` with nothing staged and
        # red-X on a misleading message. (2) pathspec-exclude the two
        # allowed files rather than parsing `git status --porcelain` output —
        # `awk '{print $2}'` yields the OLD path on a rename and splits
        # wrong on any path containing a space; this asks git directly instead.
        id: confine-check
        if: steps.drift-check.outcome == 'failure'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "drift-check failed but regeneration produced no changes — likely a flake in the check itself, not real drift. Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          unexpected=$(git status --porcelain -- . ':!.devcontainer/mise-system.lock' ':!.devcontainer/mise-runtime.lock')
          if [ -n "$unexpected" ]; then
            echo "regeneration touched files outside the image locks:" >&2
            echo "$unexpected" >&2
            # #947: the status lines above name WHICH file moved but never
            # WHAT changed, so the run log cannot identify the writer — the
            # job has failed this way repeatedly (runs 33763936742,
            # 33780649870) leaving ` M mise.lock` and nothing else. Emit the
            # tracked diff for the same pathspec so the next failure is
            # self-diagnosing. Untracked files have no diff; the status
            # lines above already name them.
            echo "--- what changed in the unexpected tracked paths ---" >&2
            git diff --stat -- . ':!.devcontainer/mise-system.lock' ':!.devcontainer/mise-runtime.lock' >&2
            git diff -- . ':!.devcontainer/mise-system.lock' ':!.devcontainer/mise-runtime.lock' >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Configure git identity
        # The App's own bot identity, deliberately NOT `github-actions[bot]`:
        # this repo's renovate.json inherits `github>jdx/renovate-config`,
        # whose preset already puts `github-actions[bot]`'s address in
        # `gitIgnoredAuthors`. A commit under that identity would make
        # Renovate's `isBranchModified` false and let it rebase this commit
        # away on the branch's next sync — silently defeating the one thing
        # this job depends on to survive (`shouldReuseExistingBranch` refusing
        # to rebase a MODIFIED branch). Both the slug and the numeric id are
        # derived (never hardcoded) per actions/create-github-app-token's own
        # documented committer-identity recipe.
        # SUPERSEDED 2026-09-29 (#1435, Ray, option B′): "never rebase a
        # modified branch" froze #947 and #1063 FOREVER on their first repair
        # commit. renovate.json now lists this address AND gcc-sha-repair's in
        # `gitIgnoredAuthors`, with `rebaseWhen: "conflicted"` pinned locally
        # (the livelock the old reasoning feared needed `behind-base-branch`).
        # A Renovate rebase now drops the repair, and this job re-runs on that
        # `synchronize` and re-commits it. Keep that list in lockstep with the
        # identity below (tests/test_renovate_ignored_authors.py).
        if: steps.drift-check.outcome == 'failure' && steps.confine-check.outputs.changed == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_ID: ${{ steps.bot-id.outputs.id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
      - name: Commit the regenerated image locks
        if: steps.drift-check.outcome == 'failure' && steps.confine-check.outputs.changed == 'true'
        run: |
          git add .devcontainer/mise-system.lock .devcontainer/mise-runtime.lock
          git commit -m "chore: regenerate image locks for this PR's pin bump (#887)"
      - name: Push to the PR branch
        # Pushed via a tokenized remote URL (App token in env, never
        # persisted — see checkout above), and the untrusted PR-controlled
        # branch name is passed through env too, not interpolated directly
        # into the script (actionlint script-injection). Same shape as
        # gcc-sha-repair.yml's commit+push step.
        #
        # No actor-based loop guard (see the job's `if:` comment) means two
        # runs of this job can overlap; without a race guard, a push onto a
        # branch that moved since checkout is rejected non-fast-forward and
        # red-Xes the PR. The race check must be ATOMIC: a separate
        # ls-remote-then-push compare leaves a window where another writer
        # pushes between the two commands and the loser still red-Xes.
        # `--force-with-lease=<ref>:<expected>` closes it: the ref update is a
        # compare-and-swap against BASE_SHA, enforced at update time, not at
        # observe time. HEAD descends from BASE_SHA, so an accepted push is
        # always a plain fast-forward; the lease can never rewrite history.
        # On rejection, re-observe the remote head: if the branch moved, exit
        # 0 (a clean no-op, a newer `synchronize` run redoes the work); any
        # other push error stays a real failure.
        if: steps.drift-check.outcome == 'failure' && steps.confine-check.outputs.changed == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ steps.base-sha.outputs.sha }}
        run: |
          set -euo pipefail
          if git push --force-with-lease="refs/heads/${HEAD_REF}:${BASE_SHA}" \
              "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:${HEAD_REF}"; then
            exit 0
          fi
          remote_sha=$(git ls-remote origin "refs/heads/${HEAD_REF}" | cut -f1)
          if [ "$remote_sha" != "$BASE_SHA" ]; then
            echo "the PR branch moved since checkout (remote=$remote_sha, checked-out=$BASE_SHA); a newer run will redo this regen. Skipping as a clean no-op."
            exit 0
          fi
          exit 1

  # ============================================================
  # Vendored config-schema refresh (ITEM 11): re-download schemas/mise.json,
  # schemas/ruff.json and schemas/typos.json at each tool's CURRENT pin and
  # PR the result when the pin moved. Same shape as lock-refresh above —
  # scheduled, App-token push, open-refresh-pr — because the offline
  # config.schema-vendor-drift suite (mise run verify) can only DETECT
  # drift; it makes no network call by design (taplo does not cache
  # schemas between runs, so a lint-time fetch would be a per-run network
  # dependency). This job does the one network-using step, in CI, never on
  # the lint path.
  # ============================================================
  schema-refresh:
    # Never on pull_request — same reasoning as lock-refresh (#887 INV-7).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: schema-refresh
      cancel-in-progress: false
    env:
      # See lock-refresh's identical comment above: `mise install`/`uv run`
      # fires hk's git hooks on the runner without this.
      HK_SKIP_HOOKS: pre-commit,pre-push
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REFRESH_APP_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise (python + uv + hk)
        uses: $/.github/actions/setup-mise
        with:
          # hk: schema_vendor._hygiene_normalize shells out to `hk util` on
          # every fetched schema; with --skip-tools below nothing else
          # installs it. A --locked subset install writes nothing to mise.lock.
          install_args: "python uv hk"
      - name: Refresh vendored schemas
        # --skip-tools: same #963 class as image-lock-pr — a subset install, so
        # a bare `mise run` would install every other root tool UNLOCKED and
        # rewrite mise.lock. Anything the task shells out to must be in
        # install_args above.
        run: mise run --skip-tools schema-vendor-refresh
      - name: Open PR if any schema drifted
        uses: $/.github/actions/open-refresh-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: refresh vendored config schemas"
          title: "chore: refresh vendored config schemas"
          body: |
            Automated re-download of the vendored `#:schema` targets (#160,
            ITEM 11) whose recorded version in `schemas/sources.toml` no
            longer matches the tool's current pin:

            - `schemas/mise.json` (`.github/actions/setup-mise/action.yml`)
            - `schemas/ruff.json` (`python/uv.lock`)
            - `schemas/typos.json` (`.config/mise/conf.d/shared.toml`)

            These are vendored rather than referenced by a remote URL because
            taplo does not cache schemas between runs — a remote `#:schema`
            would make `mise run lint` a per-run network dependency. This PR
            auto-merges (squash) once ci-gate passes.

            Trigger: ${{ github.event_name }}.
          branch: chore/schema-refresh
          # EVERY vendored file sources.toml records, plus codex-agent.json,
          # which refresh re-derives from codex-config.json (#1443 staged only
          # sources.toml, so codex-config.json's new sha256 landed without its
          # bytes and `mise run verify`'s config.schema-vendor-drift broke on
          # main). Keep in lockstep with the `file =` entries there.
          paths: |
            schemas/mise.json
            schemas/ruff.json
            schemas/typos.json
            schemas/codex-config.json
            schemas/codex-agent.json
            .claude/types/claude-code.d.ts
            schemas/sources.toml
          labels: dependencies
          summary-heading: Schema refresh
          auto-merge: "true"
