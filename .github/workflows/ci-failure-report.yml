name: ci-failure-report
# zizmor: ignore[dangerous-triggers] — workflow_run is the DELIBERATE design
# here: this workflow runs off the PR critical path, triggered by CI
# completion, and never checks out or executes PR-authored code with its
# token (single-maintainer repo, no fork PRs). See workflows/AGENTS.md.
on: # zizmor: ignore[dangerous-triggers] — deliberate: see comment above
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  actions: read
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  failure-report:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Generate normalized failure report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          uv run --script plugins/dotfiles-build-optimizer/scripts/github_failure_report.py \
            --repo "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --output-dir artifacts/ci-failure
      - name: Upload failure report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-report-${{ github.event.workflow_run.id }}
          path: artifacts/ci-failure
