# Dependabot configuration — LIVE config for this repo (not a template).
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Scope: Python deps in /python, and nothing else. This is the repo's ONLY
# Python dependency updater — renovate.json's `enabledManagers` lists no
# pip/pep621 manager, so removing this file silently stops Python bumps.

version: 2

# NOTE: github-actions ecosystem is intentionally NOT in `updates` here.
# Renovate handles GHA action bumps via `enabledManagers: ["github-actions", ...]`
# in renovate.json (extending github>jdx/renovate-config). Having both would
# generate duplicate PRs and race-condition merge conflicts. See the
# "SHA-pin audit" research artifact for the full rationale.

updates:
  - package-ecosystem: "pip"  # Use "pip" even for pyproject.toml projects
    directory: "/python"      # Location of your pyproject.toml
    schedule:
      interval: "cron"
      # Daily midnight America/Chicago. Dependabot rejects cron expressions
      # under a 24h minimum, so sub-daily intervals (e.g. "0 * * * *") fail
      # validation against dependabot-api.githubapp.com.
      cronjob: "0 0 * * *"
      timezone: "America/Chicago"

    open-pull-requests-limit: 5

    groups:
      # Named for the ecosystem above, NOT github-actions — that name was residue
      # from the github-actions ecosystem removed in #93 (1dd95a1), and it made a
      # multi-dep Python bump arrive titled "bump the github-actions group …".
      python-deps:
        patterns:
          - "*"         # Group all /python updates into a single PR

    labels:
      - "dependencies"

    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
