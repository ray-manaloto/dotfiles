name: "Set up Claude Code"
description: >-
  Install Claude Code at the pin recorded in schemas/sources.toml, for jobs
  that run hk. hk's `fnhook_gates` step shells out to
  `claude plugin validate --strict`, so a job that runs `hk run check` or
  `hk run pre-commit` without this step fails on a missing binary.

  Ordering: like setup-mise, a *local* composite resolves from
  $GITHUB_WORKSPACE, so the caller runs `actions/checkout` first. It must also
  run `setup-mise` first — reading the pin goes through `uv`.

runs:
  using: composite
  steps:
    - name: Install Claude Code at the vendored pin
      shell: bash
      # It cannot come from mise. The `github:anthropics/claude-code` [tools]
      # pin was removed in `6d1ae23` so the native installer owns PATH
      # (grilling decision Q1), and with no pin to activate `mise exec` falls
      # through to an on-demand `@latest` install that MISE_LOCKED=1 refuses on
      # a runner — which is exactly how PR #1128 went red while the development
      # Mac, where that install is allowed, stayed green.
      #
      # The version is READ from schemas/sources.toml, never restated here:
      # that file is the pin for this tool, a second copy in YAML is the drift
      # `pin_parity` exists to reject, and reading it keeps the validator on the
      # same release as the vendored .d.ts declarations.
      #
      # `set -o pipefail` is load-bearing — a plain `bash -e` returns the PIPE's
      # exit code, so a failed `curl` would install nothing and still report
      # success.
      #
      # Deliberately NOT written to $GITHUB_PATH. The installer's target is
      # already on the runner's PATH — measured in CI run 35050785004, whose
      # mise step logged
      #   "PATH": "…:/snap/bin:/home/runner/.local/bin:/opt/pipx_bin:…"
      # — so the write was redundant, and zizmor flags any GITHUB_PATH write as
      # `github-env` (high). `command -v` below ASSERTS the reachability the
      # gate actually needs instead of forcing it, so a future runner image
      # that drops the directory fails here, loudly, rather than surfacing as a
      # confusing missing-binary error inside hk.
      run: |
        set -euo pipefail
        version="$(uv run --project python dotfiles-setup schema-vendor pin --tool claude-code)"
        curl -fsSL https://claude.ai/install.sh | bash -s "$version"
        # Control arm 1: hk runs `claude` off PATH, so PATH is what must resolve
        # — not the install path the installer happens to have chosen.
        resolved="$(command -v claude)" || {
          echo "FAIL: claude installed but not on PATH" >&2; exit 1; }
        # Control arm 2: prove it is the pin we asked for. A wrong-version
        # install would otherwise validate plugins against a release the
        # vendored declarations never described.
        installed="$(claude --version)"
        echo "claude -> $resolved, --version -> $installed (pin: $version)"
        case "$installed" in
          *"$version"*) ;;
          *) echo "FAIL: installed Claude Code is not the $version pin" >&2; exit 1 ;;
        esac
