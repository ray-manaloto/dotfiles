name: "Refresh lockfiles"
description: >-
  Regenerate the committed lockfiles in place (#160 T8): root mise.lock
  (runner mise), the two image locks .devcontainer/mise-system.lock and
  .devcontainer/mise-runtime.lock (delegated to `mise run lock-image`,
  the single producer shared with the local path and with refresh.yml's
  image-lock-pr job), and .devcontainer/devcontainer-lock.json
  (devcontainer upgrade). The caller stages/commits the diff (refresh.yml
  PRs it via open-refresh-pr). Hosted Renovate cannot do this: it may not
  run `mise lock` (admin-allowlisted command) and does not know
  mise-system.lock by name. Requires actions/checkout + setup-mise
  (full install: mise tools incl. uv/python + @devcontainers/cli) to
  have run first. Linux-x64 runner REQUIRED — macOS mise silently omits
  linux-x64 conda checksums (session-2026-07-05 empirical correction).

inputs:
  github-token:
    description: >-
      Token exported as GITHUB_TOKEN/MISE_GITHUB_TOKEN so `mise lock`'s
      GitHub-backed resolutions are not rate-limited. Quota exhaustion is
      one cause of a short lock and the convergence loop covers it; a tool
      with no resolvable candidate is another, and no token fixes it (#964).
    required: true

runs:
  using: composite
  steps:
    - name: Regenerate root mise.lock
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MISE_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: mise run lock-refresh-root
    - name: Regenerate the image locks (mise-system.lock + mise-runtime.lock)
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MISE_GITHUB_TOKEN: ${{ inputs.github-token }}
      # Delegates to the SAME producer refresh.yml's image-lock-pr job calls,
      # rather than a second hand-rolled copy of the recipe. This step used to
      # inline `mise lock --bump --platform linux-x64` in a `for _ in 1 2 3 4 5`
      # loop; naming ONE platform is what made the scheduled path destructive.
      # `mise lock` writes only the platforms it is given, so every pass pruned
      # the five other platforms the committed lock carries (mise-system.lock
      # holds six — 46 linux-x64 and 29 macos-x64 tool entries — mise-runtime.lock
      # two), and `--bump` made that pruning land whenever a version advanced.
      # image_lock.platforms_to_lock derives the set from the committed lock
      # instead of naming one, and image_lock_main owns the whole recipe the
      # loop used to spell out: the npm-on-PATH precondition, lock-stage, the
      # pinned-mise install (lock formats are NOT cross-version compatible),
      # MISE_TRUSTED_CONFIG_PATHS, run_lock_passes' convergence, and
      # lock-collect's coverage verification against HEAD.
      #
      # --no-container: on a Linux runner the host can lock natively, so this
      # asks it to FAIL rather than route into a devcontainer that does not
      # exist here. Same flag refresh.yml's image-lock-pr job passes.
      run: mise run lock-image -- --no-container
    - name: Regenerate devcontainer-lock.json
      shell: bash
      run: devcontainer upgrade --workspace-folder .
