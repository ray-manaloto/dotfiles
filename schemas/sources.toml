# Vendored-schema provenance (ITEM 11). Read by
# `dotfiles_setup.schema_vendor` — both the offline drift check (wired into
# `mise run verify`) and the network-using `schema-vendor refresh` command
# that `refresh.yml`'s `schema-refresh` job runs in CI. Never hand-edit the
# `version`/`source`/`sha256` fields; run
# `mise run schema-vendor-refresh` and let it rewrite this file alongside
# the vendored JSON.
#
# `pin_source` names where `schema_vendor.current_pin()` reads the tool's
# CURRENT version from — informational here, the resolver itself is code.
# `sha256` is the vendored file's own hash, verified offline by
# `check_drift` — it is what actually proves the bytes on disk are what was
# fetched, since the version string alone cannot detect a hand-edited or
# corrupted file.

[[schema]]
tool = "mise"
file = "schemas/mise.json"
version = "2026.9.8"
source = "https://raw.githubusercontent.com/jdx/mise/v2026.9.8/schema/mise.json"
pin_source = ".github/actions/setup-mise/action.yml"
sha256 = "20757294fe90e3ef3f734946a66d8a5a5165f59976782c9975eeea1b0ebb7d80"

[[schema]]
tool = "ruff"
file = "schemas/ruff.json"
version = "0.16.5"
source = "https://raw.githubusercontent.com/astral-sh/ruff/0.16.5/ruff.schema.json"
pin_source = "python/uv.lock"
sha256 = "df7b92eed9062e44ee6557f4672292e17fe6eda559b78a6a5960ace3e3b4bf13"

[[schema]]
tool = "typos"
file = "schemas/typos.json"
version = "1.50.1"
source = "https://raw.githubusercontent.com/crate-ci/typos/v1.50.1/config.schema.json"
pin_source = ".config/mise/conf.d/shared.toml"
sha256 = "c7ba0c41d3e216c562b021a296de833c2c070d76f4ae550705d98bc2e1f6395b"

[[schema]]
tool = "codex"
file = "schemas/codex-config.json"
version = "0.154.0"
source = "https://learn.chatgpt.com/docs/config-schema.json"
pin_source = ".config/mise/conf.d/shared.toml"
sha256 = "895287b978baf5cb6dec9c2e91b71d067ed0ec8b67fd88e6be96ac2ffd3f027e"

[[schema]]
tool = "claude-code"
file = ".claude/types/claude-code.d.ts"
version = "2.1.278"
source = "https://raw.githubusercontent.com/anthropics/claude-code/v2.1.278/mods/types/claude-code.d.ts"
pin_source = "schemas/sources.toml (vendored; no mise [tools] pin)"
sha256 = "ac107a37c08ad46f8632edc1639b13a740fae0b8249a2245532adfd325e57d0d"
# WHAT: Vendor Claude Code's published function-hook type declarations instead of
# generating them with `claude -p '/plugin-types'`. Upstream publishes at
# https://github.com/anthropics/claude-code/blob/main/mods/types/claude-code.d.ts
#
# WHY: The `fnhook-types-refresh` task ran `/plugin-types`, making a local Claude
# Code binary a hard dependency of `mise run lint`. On CI runners under
# MISE_LOCKED=1, the tool cannot install, generation writes nothing, and the gate
# fails. Vendoring replaces this with `mise run schema-vendor-refresh` — a network
# task in CI only, never on the lint path.
#
# PROVEN SAFE: After normalize_claude_code_declarations, upstream's file (405,845 B)
# and our generated one (412,856 B) are byte-identical (368,789 bytes). The 7 KB
# raw difference is the two environment-dependent built-in-tool interfaces
# (BuiltinToolInputs, BuiltinToolResults), which the normalizer removes.
#
# NOTE: Upstream's types lag the RELEASE, and by more than one version — so this
# row's `version` and its file's header deliberately disagree, and forcing them
# to match would be wrong. Measured 2026-09-15 by fetching both tags: v2.1.272
# and v2.1.273 serve a BYTE-IDENTICAL file (405,845 B, sha256 69d14af889cae225…,
# the value recorded above) whose header still reads "Written by Claude Code
# 2.1.271". That is why bumping this row from 2.1.272 to 2.1.273 changed the
# version and the URL but NOT the sha256, and why `pin-parity.toml` registers
# this row and the README while deliberately excluding the .d.ts headers.
# This is not a bug — it is how Anthropic's release cycle works.
#
# 2026-09-18: the lag is NOT permanent. The v2.1.277 tag serves a NEW file
# (499,059 B, sha256 ac107a37c08ad46f…) whose header reads "Written by Claude
# Code 2.1.277", so this bump DID change the sha256 and the vendored bytes.
# Expect either outcome on a bump; `schema-vendor-refresh` records whichever.
#
# HOW TO REFRESH: `mise run schema-vendor-refresh` (CI job: refresh.yml's
# schema-refresh task). The task will rewrite this entry with the current version
# and sha256 when the version moves or the fetched bytes differ.
#
# NO MISE PIN: Claude Code's native installer owns PATH; the [tools] entry was
# removed 2026-09-14 (currency.toml:29-39). The version field above IS the pin.
# check_drift() and refresh() handle the absence of a pin resolver explicitly.
