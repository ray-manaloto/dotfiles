# Cross-repo rule sync — the declared set both repos must carry (#354 tier 0).
#
# WHY THIS FILE EXISTS. dotfiles and knowledge-base both document the same
# cross-vendor orchestration doctrine, and for a while only one of them
# actually carried it in config. That is the #354 defect class one level up:
# a declaration made twice and observed in neither place, invisible from
# inside either repo because each one looks internally consistent.
#
# SCOPE STARTED DELIBERATELY NARROW (Ray, 2026-07-24) and has been widened
# ONCE, on 2026-07-25, to cover `rules`. Everything still outside the gate is
# REPORTED by `mise run rule-sync` as an advisory divergence block and blocks
# nothing — because a narrow gate is only honest if the difference it declines
# to gate is still visible. At the original writing, 7 plugins, 23 skills, and
# **22 rules** existed in dotfiles and not in knowledge-base. The rules half is
# what closed: knowledge-base#24 ported all 22, so the `rules` key below states
# a fact about both repos rather than an aspiration about one.
#
# THE ORDER IS LOAD-BEARING, and this is the trap to remember. Widening the
# gate is a one-line edit here; making the other repo true is not. Adding an
# entry BEFORE the other repo carries it lands a RED gate on `main` — the gate
# fails for everyone, immediately, and the fix is a second PR in a different
# repo. Always: make the other repo true, merge that, THEN widen here.

[shared]
# Plugins that must be ENABLED (value `true`, not merely present as a key) in
# both repos' .claude/settings.json. antigravity is the one orchestration lane
# still delivered as a plugin; fable-orchestrator was removed (#1310) and its
# capabilities now live in each repo's own agents and routing skill.
plugins = [
    "antigravity@antigravity-for-claude-code",
]

# Whole lines that must appear in both repos' .claude/CLAUDE.md, matched
# exactly modulo whitespace. This is THE trigger whose absence opened #354; it
# now names each repo's own routing-doctrine skill instead of the removed
# plugin's (#1310). Substring matching would accept a doc that merely quotes
# it, which is the state the repo was actually in.
lines = [
    "- Without being reminded, on ANY session model: non-trivial implementation runs the architect-as-orchestrator flow — invoke this repo's routing-doctrine skill (`codex-sdlc-team` in dotfiles, `orchestrator-routing` in knowledge-base) before delegating and follow it as authoritative for routing, the spec contract, review tiers, and advisor escalation.",
]

# Rule files (`.claude/rules/<name>.md`, matched by STEM) that must exist in
# both repos. These are the eager, always-loaded governance layer: an agent
# session either has zero-skip, verify-before-advancing, and
# probes-need-a-control-arm in context, or it does not. Until knowledge-base#24
# the split was dotfiles 22 / knowledge-base 0 — so every KB session ran
# ungoverned, which no check inside either repo could see. That is the #354
# defect class exactly: a doctrine that is real in one place and absent in the
# other, with both repos internally consistent.
#
# Presence is by STEM, not by content, and that is on purpose. Each rule is
# ADAPTED per repo — knowledge-base's `local-devcontainer-first` is an
# ingestion cost ladder, not a container rule; its `ci-local-parity` states
# plainly that `.github/` does not exist there. Gating on byte-equality would
# force one repo to carry the other's false statements. What must not drift is
# WHICH concerns are governed.
rules = [
    "agent-report-persistence",
    "ai-cli-invocation",
    "ci-local-parity",
    "clarify-before-acting",
    "clean-git-state",
    "do-not",
    "gh-cli-watch",
    "local-devcontainer-first",
    "long-running-command-hangs",
    "md-size-budgets",
    "mise-tasks-only",
    "notepad-enforcement",
    "agent-artifact-conventions",
    "persistence-gate-retry",
    "probes-need-a-control-arm",
    "research-doc-sources",
    "research-repo-enumeration",
    "tool-currency-and-native-first",
    "use-tool-builtins",
    "verify-before-advancing",
    "zero-bash-logic",
    "zero-skip-policy",
]

# Agent files (`.claude/agents/<name>.md`, matched by STEM) that must exist in
# both repos (#1312). These are the repo-owned replacements for the removed
# plugin's Claude-side agents (#1310): the escalation-only Fable advisor and the
# pre-dispatch premise checker. Presence by stem, like `rules`: each repo writes
# its own body with its own grounding commands.
agents = [
    "claude-advisor",
    "premise-verifier",
]
