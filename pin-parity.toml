# pin-parity.toml — one logical tool, N pin sites, all must agree.
#
# WHY THIS FILE EXISTS (2026-09-14, four instances in one day)
#
# A tool pinned in more than one place drifts the moment something bumps one
# site and not the others. Renovate sees each site as a separate dependency,
# so ungrouping (#1062, which dropped `extends: group:all`) removed the
# accident that had been holding them together:
#
#   chezmoi  `.chezmoiversion` went to 2.72.2 in #1072 while shared.toml stayed
#            2.72.1. `chezmoi init --apply` refuses a source state whose floor
#            exceeds the binary, so `onCreateCommand` exited 1 and EVERY
#            devcontainer bring-up on main was broken for 7 hours. Nothing
#            caught it: `.chezmoiversion` was not an image-build input, so CI's
#            `changes` filter skipped the base build entirely.
#   hk       three `hk@X` pkl URLs vs shared.toml's `hk = "X"`, split across
#            PRs #1063 and #1079 — both `lint` FAILURE, both BLOCKED, neither
#            able to merge alone.
#   mise     four sites; the recipe carried in the session handoff listed
#            three, and `schemas/sources.toml` was missed.
#   mise     AGAIN, hours later: Renovate's #1085 bumped ONLY
#            `.github/actions/setup-mise/action.yml` to 2026.9.8, leaving the
#            Dockerfile ARG and schemas/sources.toml at 2026.9.7 on main.
#
# `mise outdated` cannot see any of this: it reads the manifest, and every one
# of these drifts is between the manifest and a site OUTSIDE it. That is the
# structural gap this file closes.
#
# This registry generalises the bespoke `hk_version_parity` hk step, which was
# inline shell in hk.pkl covering exactly one tool. Inline bash in hk.pkl is
# NOT covered by `bash_logic_budget` (it globs `scripts/*.sh` only), so that
# step was also an un-gated bash-logic reservoir.
#
# ADDING A TOOL
#
# List every site that carries the version. A site's `pattern` is a Python
# regex whose FIRST CAPTURE GROUP is the version; every match in the file is
# collected, so a file holding the pin twice (action.yml does) is checked
# against itself as well as against its siblings. A pattern that matches
# nothing is a FAILURE, not a pass — a silently-unmatched site is the same
# blind spot this file exists to end (`probes-need-a-control-arm.md` rule 1).

[meta]
version = "1"

[tools.graphify]
description = """
On 2026-09-21 the user-global PATH binary was graphify 0.9.65 while the repo \
still pinned 0.9.61, and no machine gate noticed. Bind both pyproject \
declarations, the runtime health constant, and all three tracked skill stamps \
so repository-owned Graphify versions move together. The user-global mise pin \
is outside this registry; doctor's PATH-binary check covers that live seam."""
sites = [
  { path = "python/pyproject.toml", pattern = 'graphifyy\[all\]==(\d+\.\d+\.\d+)' },
  { path = "python/src/dotfiles_setup/graphify.py", pattern = '^EXPECTED_GRAPHIFY_VERSION = "(\d+\.\d+\.\d+)"' },
  { path = ".claude/skills/graphify/.graphify_version", pattern = '^(\d+\.\d+\.\d+)\s*$' },
  { path = ".codex/skills/graphify/.graphify_version", pattern = '^(\d+\.\d+\.\d+)\s*$' },
  { path = ".agents/skills/graphify/.graphify_version", pattern = '^(\d+\.\d+\.\d+)\s*$' },
]

[tools.chezmoi]
description = """
`.chezmoiversion` is a MINIMUM-VERSION FLOOR, not a pin: chezmoi refuses to \
apply a source state whose floor exceeds the running binary. shared.toml is \
what actually installs that binary into the image, so the floor must never \
exceed it. Broke main for 7 hours on 2026-09-14 (#1072)."""
sites = [
  { path = ".chezmoiversion", pattern = '^(\d+\.\d+\.\d+)\s*$' },
  { path = ".config/mise/conf.d/shared.toml", pattern = '^chezmoi = "(\d+\.\d+\.\d+)"' },
]

[tools.hk]
description = """
Three pkl `amends`/`import` URLs plus the mise binary pin. hk refuses a config \
whose schema is newer than the binary, so a split is a hard failure in both \
directions. Replaces the bespoke `hk_version_parity` step (check-H)."""
sites = [
  { path = "hk.pkl", pattern = 'hk@(\d+\.\d+\.\d+)' },
  { path = "hk-common.pkl", pattern = 'hk@(\d+\.\d+\.\d+)' },
  { path = "hk-image.pkl", pattern = 'hk@(\d+\.\d+\.\d+)' },
  { path = ".config/mise/conf.d/shared.toml", pattern = '^hk = "(\d+\.\d+\.\d+)"' },
]

[tools.claude-code]
description = """
Claude Code has NO mise pin — `6d1ae23` removed the `[tools]` entry so the \
native installer owns PATH (grilling decision Q1), and `currency.toml:29-39` \
sends its currency to doctor's `claude-doctor` check instead. That left \
`schemas/sources.toml` as the sole pin with NOTHING checking the sites that \
must track it, which is exactly the manifest-outside blind spot this file \
exists to close: `mise outdated` cannot see a tool it does not manage at all. \
CI reads the pin rather than restating it \
(`.github/actions/setup-claude-code/action.yml` shells out to \
`dotfiles-setup schema-vendor pin --tool claude-code`), so the action is \
deliberately NOT a site — there is no literal in it to drift.

⚠️ The `.claude/types/*.d.ts` HEADERS are deliberately excluded. Upstream's \
declarations lag the release: measured 2026-09-15, tags v2.1.272 and v2.1.273 \
serve a byte-identical file whose header reads "Written by Claude Code \
2.1.271". Those headers are a record of upstream's content, not our pin, and \
registering them would make this check demand a value Anthropic does not \
publish. Same for `claude_doctor.py`'s docstrings and the `2.1.270` fixtures in \
`tests/test_claude_doctor.py`, which are about PARSING a version string, not \
about being current."""
sites = [
  # TWO patterns against the SAME file, deliberately. The `version` field and
  # the tag inside `source` are adjacent lines that must agree, and nothing
  # compared them: measured 2026-09-16, setting `version = "2.1.274"` while the
  # URL stayed at v2.1.273 left BOTH `pin-parity` and `schema-vendor check` at
  # rc=0 — and `schema-vendor pin` then hands CI 2.1.274 while the vendored
  # `.d.ts` came from 273. `pin_parity` collects EVERY match per site and
  # compares them all, so listing the file twice is what makes the two fields
  # check each other.
  #
  # The `version` pattern is anchored through `tool`/`file` because this file
  # carries one `version` per vendored schema; a bare `^version` would collide
  # with mise's, ruff's, typos' and codex's rows.
  { path = "schemas/sources.toml", pattern = 'tool = "claude-code"\nfile = "[^"]*"\nversion = "(\d+\.\d+\.\d+)"' },
  { path = "schemas/sources.toml", pattern = 'anthropics/claude-code/v(\d+\.\d+\.\d+)/mods/types' },
  { path = ".claude/types/README.md", pattern = '^\*\*Upstream version:\*\* (\d+\.\d+\.\d+)' },
]

[tools.mise]
description = """
Four sites across three subsystems: the image build arg, the CI action (TWICE \
in one file), and the vendored schema. `schemas/sources.toml` is matched on \
its source URL rather than its `version` field because that file carries one \
`version` per vendored schema and a bare match would collide with the others; \
the URL tag is unambiguously mise's. Regenerate that file with \
`mise run schema-vendor-refresh`, never by hand."""
sites = [
  { path = ".devcontainer/Dockerfile", pattern = '^ARG MISE_VERSION=(\d+\.\d+\.\d+)' },
  { path = ".github/actions/setup-mise/action.yml", pattern = 'version: "(\d+\.\d+\.\d+)"' },
  { path = "schemas/sources.toml", pattern = 'jdx/mise/v(\d+\.\d+\.\d+)/schema/mise\.json' },
]
