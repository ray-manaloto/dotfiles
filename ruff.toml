#:schema ./schemas/ruff.json
# Repo-root ruff config (#160 T12): extends the Python package's config so
# tests/ and plugins/ — which live OUTSIDE python/'s directory tree — resolve
# the same rules. Probe-verified: ruff resolves its config per-file by walking
# up from each file; before this file existed, tests/ and plugins/ silently
# got ruff DEFAULTS (select=ALL never applied there, and the
# "../tests/*.py" per-file-ignore in python/pyproject.toml was dead config).
extend = "python/pyproject.toml"

# ── Record trees: ruff 0.16 formats PYTHON FENCES INSIDE MARKDOWN ────────────
# `ruff format` reformats ```python blocks in .md, and the rewrite can change
# MEANING: measured 2026-09-14, `["mise","lock","--bump",*tools],` quoted from
# image.py became `(["mise","lock","--bump",*tools],)` — a one-tuple that does
# not exist in the source the report cites. A bare `uv run --project python
# ruff format` from the repo root rewrote 18 archived reports in one command.
#
# These trees are RECORDS, not source. The list mirrors `hk-common.pkl`'s
# `excludePaths`, which already protects them from hk's own builtins for the
# same reason (`.claude/rules/agent-artifact-conventions.md` rule 8, "Do not
# normalize records"; `.claude/rules/agent-report-persistence.md` rule 4,
# "Verbatim means verbatim"). hk was never the culprit — it already excluded
# them; ruff had no such list at all. Keep the two lists mirrored.
extend-exclude = [
    "docs/research/mintlify-cache/**",
    "docs/research/trail/findings/**",
    "docs/research/runs/**",
    "docs/research/kb/**",
    "docs/specs/**",
]

# Apply the exclusions even when a path is named EXPLICITLY on the command
# line. Without this, `ruff format docs/research/kb/reports/agents/x.md` still
# rewrites the file — the exclusion would only govern directory discovery, so
# the very invocation shape that caused the damage would stay live.
force-exclude = true

[lint.per-file-ignores]
# pytest convention: test functions self-describe via their names (D103),
# magic values in assertions are idiomatic (PLR2004), and `assert` IS the test
# mechanism (S101). S101 must be listed here (not left to python/pyproject.toml's
# "../tests/*.py" entry): once this root config declares its own
# per-file-ignores table, ruff re-anchors the extended pyproject glob to the
# repo root, so "../tests/*.py" points outside the tree and silently stops
# matching — the exact "dead config" fragility this file's header warns about.
"tests/**/*.py" = ["D103", "PLR2004", "S101"]
# TID251 (#675): the codec's own tests must reach msgspec DIRECTLY, because two
# of them are the control arms for the whole module — they assert that msgspec
# unaided fails on a `Path` in both directions, which is the premise `codec.py`
# rests on and cannot be demonstrated through `codec.py`.
#
# It lives HERE and not in python/pyproject.toml's per-file-ignores for the
# reason this file's header states: with a root table declared, an extended
# "../tests/…" glob re-anchors to the repo root and silently stops matching.
# Measured while writing #675 — the entry sat in the pyproject for four probe
# rounds doing nothing, and S101 stayed clean throughout because THIS line was
# the one suppressing it. A dead ignore looks exactly like a working one.
"tests/test_codec.py" = ["D103", "PLR2004", "S101", "TID251"]
# The plugins are standalone CLI helper scripts where print IS the user
# interface, so T201 (print) is expected rather than a defect.
"plugins/**/*.py" = ["T201"]
