[mcp]
# Servers whose command line declares a filesystem scope. Claude Code sends MCP
# Roots, and roots REPLACE the server's own arguments — measured, from the
# server's own startup line: "Client does not support MCP Roots, using allowed
# directories set from server args". So when the harness DOES support roots, the
# argument is inert and the real scope is the harness's working-directory set.
# A declared scope that differs from that set is a fiction.
scope_servers = ["filesystem"]

# Harness-namespaced as `mcp__<server>__<tool>`. These MUTATE state, so each
# needs an explicit permission decision in the TRACKED `.claude/settings.json`
# (or a PreToolUse matcher). Without one, the answer is given ad-hoc per session
# and lands in the gitignored `settings.local.json`, where nobody reviews it.
#
# The `--live` arm cross-checks this list against the server's real `tools/list`
# — a server pinned by version cannot change its tool set behind the list, which
# is why `pinned_servers` below is load-bearing rather than hygiene.
[mcp.mutating_tools]
filesystem = ["write_file", "edit_file", "create_directory", "move_file"]
memory = [
    "create_entities",
    "create_relations",
    "add_observations",
    "delete_entities",
    "delete_observations",
    "delete_relations",
]
