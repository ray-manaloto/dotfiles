# jbax: background accessibility for JetBrains IDEs (swift/, issue #502). No [tools]: the Swift toolchain is
# Xcode's, swiftlint is global (DL-757). From the repository root: //swift:<task>. jbax is macOS-only (AppKit,
# ApplicationServices), so every task skips elsewhere and the root test task stays green on Linux.

[tasks.build]
skip_if = "{{ os() != 'macos' }}"
description = "Build the JBAXKit library and the jbax executable"
run = "swift build"

# SwiftLint runs as hk's builtin step (hk check / pre-commit), so it is not repeated here.
[tasks.lint]
skip_if = "{{ os() != 'macos' }}"
description = "swift format lint (the toolchain's own), strict"
run = "swift format lint --strict --recursive Package.swift Sources Tests"

# The live scenario is skipped unless JBAX_LIVE=1, so this never touches an IDE.
[tasks.test]
skip_if = "{{ os() != 'macos' }}"
description = "Tests; the live-IDE scenario runs only with JBAX_LIVE=1"
run = "swift test"

# Brings the running IDE forward once for a few seconds (opening Settings and the key route need it); run it
# only when nobody is working in the IDE. Gate: at least 97% of lines in each Sources/ file. For the #502 MVP the
# rest is the failure guards a working IDE never triggers (select's value read-back, AX errors).
# llvm-cov has no per-line exclusion for Swift, so the allowance is a budget; tighten it with stand-ins.
[tasks.coverage]
skip_if = "{{ os() != 'macos' }}"
description = "Live-IDE scenario with coverage; fails below 97% of lines per Sources/ file (#502 MVP)"
env = { JBAX_LIVE = "1" }
run = [
  "swift test --enable-code-coverage",
  "jq -e '[.data[0].files[] | select(.filename | test(\"/swift/Sources/\")) | .summary | (.lines.percent >= 97)] | all' \"$(swift build --show-bin-path)/codecov/jbax.json\"",
]

# jbctl runs jbax by name (or $JBAX).
[tasks.install]
skip_if = "{{ os() != 'macos' }}"
description = "Build jbax for release and put it in ~/.local/bin"
run = ["swift build -c release", "install -m 0755 .build/release/jbax ~/.local/bin/jbax"]

[tasks.check]
skip_if = "{{ os() != 'macos' }}"
description = "lint and the non-live tests (which build first)"
depends = ["lint", "test"]
