# Public, secret-free OVERLAY ONLY. Never replace the existing private config.
# ROOT merges these keys while preserving cursor_secret, auth_token, identity and unrelated settings.
# Refuse active remote/AI/push configuration or conflicting source overrides before publication.
host = "127.0.0.1"
require_auth = true
disable_update_check = true
