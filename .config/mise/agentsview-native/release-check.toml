environment = { HOME = "/Users/rmanaloto", AGENTSVIEW_DATA_DIR = "/Users/rmanaloto/Library/Application Support/AgentsView-M1-working-b0ae79c5365e-20260915/archive", AGENTSVIEW_TELEMETRY_ENABLED = "0", PATH = "/usr/bin:/bin" }
