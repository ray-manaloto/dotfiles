# :schema https://mise.jdx.dev/schema/mise.json
#
# Shared tool versions — the SINGLE source of truth for tools used by BOTH the
# host lint workflow (root mise.toml) and the devcontainer image
# (.devcontainer/mise-system.toml). mise has no native `include`, so both sides
# merge this conf.d fragment:
#   - host: auto-loaded as <repo>/.config/mise/conf.d/shared.toml (mise merges
#     <project>/.config/mise/conf.d/*.toml alphabetically)
#   - image: COPYd to /usr/local/share/mise/conf.d/shared.toml by the Dockerfile
#     (mise merges the system conf.d the same way)
#
# Exact-pinned so host and image never drift; Renovate bumps THIS file and both
# sides move together. The image no longer floats `latest` for these tools —
# their versions come from here and are captured in .devcontainer/mise-system.lock.
# See epic #160 T5.
#
# NOT shared (intentionally): editorconfig-checker (removed from the image in
# T6 — host-only), npm:renovate (host-only; provides renovate-config-validator
# for the host hk step, not needed in the ~354MB-heavier image).
[tools]
actionlint = "1.7.12"
# bun: the npm package_manager (npm.package_manager = "bun") both host/CI and the
# image use under mise 2026.7.12 (aube default rejects our low-download npm
# tools). Shared so both install the same bun; the setup-mise action installs it
# before the npm: tools that need it.
bun = "1.4.0"
chezmoi = "2.72.0"
ghalint = "1.5.6"
gitleaks = "8.30.1"
hadolint = "2.15.1"
hk = "1.56.1"
jq = "1.8.2"
# The npm CLI shared by the root mise.toml's orchestrator executor lane and
# .devcontainer/mise-runtime.toml's #613 in-container review lane (both used
# to pin the same npm package under the same key in different tiers, which
# mise-parity's duplicate-tool check correctly flags as drift risk). allow_builds
# is needed because @openai/codex's postinstall builds a native module.
"npm:@openai/codex" = { version = "0.151.0", allow_builds = ["@openai/codex"] }
pinact = "4.1.1"
"pipx:check-jsonschema" = "0.38.0"
pixi = "0.77.1"
pkl = "0.32.1"
python = "3.14.7"
shellcheck = "0.11.0"
shfmt = "3.13.1"
taplo = "0.10.0"
typos = "1.49.1"
uv = "0.12.6"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
yq = "4.53.6"
