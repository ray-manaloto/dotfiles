# :schema https://mise.jdx.dev/schema/mise.json
#
# Shared tool versions — the SINGLE source of truth for tools used by BOTH the
# host lint workflow (root mise.toml) and the devcontainer image
# (.devcontainer/mise-system.toml). mise has no native `include`, so both sides
# merge this conf.d fragment:
#   - host: auto-loaded as <repo>/.config/mise/conf.d/shared.toml (mise merges
#     <project>/.config/mise/conf.d/*.toml alphabetically)
#   - image: COPYd to /usr/local/share/mise/conf.d/shared.toml by the Dockerfile
#     (mise merges the system conf.d the same way)
#
# Exact-pinned so host and image never drift; Renovate bumps THIS file and both
# sides move together. The image no longer floats `latest` for these tools —
# their versions come from here and are captured in .devcontainer/mise-system.lock.
# See epic #160 T5.
#
# NOT shared (intentionally): editorconfig-checker (removed from the image in
# T6 — host-only), npm:renovate (host-only; provides renovate-config-validator
# for the host hk step, not needed in the ~354MB-heavier image).
[tools]
actionlint = "1.7.12"
chezmoi = "2.70.5"
ghalint = "1.5.6"
gitleaks = "8.30.1"
hadolint = "2.14.0"
hk = "1.50.0"
jq = "1.8.2"
pinact = "4.1.0"
"pipx:check-jsonschema" = "0.37.4"
pixi = "0.72.0"
pkl = "0.31.1"
python = "3.14.6"
shellcheck = "0.11.0"
shfmt = "3.13.1"
taplo = "0.10.0"
typos = "1.48.0"
uv = "0.11.27"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
yq = "4.53.3"
