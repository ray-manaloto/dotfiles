[project]
name = "hometools"
version = "0.1.0"
description = "The global mise tasks' work: check and bootstrap the held Homebrew toolchain, update brew and check for drift (toolchain:verify, bootstrap:toolchain, update:brew, update:check)"
requires-python = ">=3.15"
# Uncapped: the latest of every dependency (DL-758).
dependencies = ["pydantic"]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
# D: one-line module docstrings only. CPY001: no copyright headers. TC001-TC003: annotations are
# lazy (Python 3.14+), so a TYPE_CHECKING block buys nothing. S603/S607: the checks run brew, xcrun,
# mise and the toolchain's own programs. COM812: conflicts with ruff format.
ignore = ["D", "CPY001", "TC001", "TC002", "TC003", "COM812", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest checks with assert. PLR2004: tests compare against literal exit codes.
"tests/**" = ["S101", "PLR2004"]
# Generated (DL-762): datamodel-codegen orders its imports its own way; every other rule applies.
"src/hometools/models.py" = ["I001"]

[tool.pytest.ini_options]
# The integration tier runs the real toolchain on this Mac; //home:integration selects it, the last -m wins.
addopts = "--strict-markers -m 'not integration' --cov=hometools --cov-branch --cov-report=term-missing --cov-fail-under=100"
markers = ["integration: real mise, Homebrew and compilers on this Mac, read-only (//home:integration)"]
testpaths = ["tests"]

[project.scripts]
hometools = "hometools.cli:main"

[build-system]
requires = ["uv_build>=0.13.6"]
build-backend = "uv_build"

# Flags live here, so the codegen task stays one line (zero-bash rule).
[tool.datamodel-codegen]
input = "schema/hometools.schema.json"
input-file-type = "jsonschema"
output = "src/hometools/models.py"
output-model-type = "pydantic_v2.BaseModel"
enable-faux-immutability = true
target-python-version = "3.15"
use-annotated = true
use-type-alias = true
strict-nullable = true
use-standard-collections = true
use-union-operator = true
use-schema-description = true
use-field-description = true
disable-timestamp = true
formatters = ["ruff-format"]
custom-file-header = "# Generated by datamodel-codegen from schema/hometools.schema.json; edit the schema, then mise run //home:codegen."
