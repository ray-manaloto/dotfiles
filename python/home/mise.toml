# The global toolchain and update tasks (DL-758, #391, #392): the hometools package does their work. Its
# commands run from the file tasks toolchain:verify, bootstrap:toolchain, update:brew and update:check in the
# global tasks folder; this file holds only the development tasks. From the repository root they are
# //home:<task>.

[env]
# This package's uv venv for every task, whatever VIRTUAL_ENV the caller has (mise python venv).
_.python.venv = { path = ".venv" }

# Development: uv runs only through these tasks; ruff, ty and datamodel-codegen are global tools.
[tasks.sync]
description = "Install the locked dependencies into .venv"
run = "uv sync --locked"

[tasks.lock]
description = "Re-resolve every dependency to its latest release"
run = "uv lock --upgrade"

[tasks.codegen]
description = "Generate src/hometools/models.py from schema/hometools.schema.json ([tool.datamodel-codegen])"
usage = 'flag "--check" help="Only fail when models.py differs from what the schema generates"'
run = "datamodel-codegen ${usage_check:+--check}"

[tasks.lint]
description = "ruff check, ruff format --check, ty check, and models.py matches the schema"
depends = ["sync", "codegen --check"]
run = ["ruff check .", "ruff format --check .", "ty check --python .venv"]

[tasks.test]
description = "Real tests (no mocking library) at 100% line and branch coverage; extra args go to pytest"
depends = ["sync"]
# prefix: mise reads the output, so task.logs keeps it for `mise run test:times`.
output = "prefix"
run = "uv run --locked pytest -n auto --durations=25"

[tasks."test:focus"]
# For a subset (-- -k <expr>, -- tests/test_x.py): the 100% gate stays on test and check; this reports
# coverage without failing on it. The command-line --cov-fail-under overrides the one in addopts.
description = "Focused tests: coverage reported, not gated; extra args go to pytest"
depends = ["sync"]
run = "uv run --locked pytest --cov-fail-under=0"

[tasks.integration]
description = "The real toolchain:verify on this Mac through this checkout's file task: read-only, macOS only"
depends = ["sync"]
run = "uv run --locked pytest -m integration --no-cov"

# The floor under the heavy test tasks (//python:test and //p2996:test, and so hk check --all): exits 1,
# naming the free space and the floor, when the data volume has under 100 GiB free (hometools.disk).
[tasks.disk-guard]
description = "Refuse to start heavy tests when the data volume has under 100 GiB free"
depends = ["sync"]
run = "uv run --locked hometools disk-guard"

# hk check's step "home": no real-toolchain test, so this Mac's Homebrew or Xcode never fails it.
[tasks.unit]
description = "lint and test"
depends = ["lint", "test"]

# hk's herdr step (pre-push and hk check): lint, then the doctor's and hc-safe's tests without coverage, so it shares
# no .coverage files with the home step that hk may run at the same time; the 100% gate stays on test.
[tasks.herdr-unit]
description = "lint and the herdr doctor and hc-safe tests (no coverage)"
depends = ["lint"]
run = "uv run --locked pytest --no-cov tests/test_herdr_doctor.py tests/test_herdr_contract.py"

# The commit gate: owner 2026-11-05, the real-toolchain test runs on every commit that reaches the toolchain
# tasks; hk's pre-commit step runs this through //repo:toolchain-gate, which says which commits those are.
[tasks.check]
description = "lint, test and integration"
depends = ["lint", "test", "integration"]
