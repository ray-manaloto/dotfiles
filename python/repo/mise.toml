# Checks for this repository: the repotools package does the work, one task per step. No [tools]:
# ruff, ty, uv and datamodel-codegen are global (DL-757). From the repository root: //repo:<task>.

[env]
# This package's uv venv for every task, whatever VIRTUAL_ENV the caller has (mise python venv).
_.python.venv = { path = ".venv" }

# From the repository root: a hook exports GIT_DIR, and git then takes the current folder as the top.
[tasks.pane-fingerprint]
description = "Print the hash of HEAD, the whole index and the commit message that the reviewer pane must approve"
usage = 'arg "<message>" help="The commit message file, which the reviewer reads"'
depends = ["sync"]
dir = "{{ config_root }}/../.."
run = 'uv run --project python/repo --locked repotools pane-fingerprint --message "$usage_message"'

[tasks.pane-pin]
description = "Name the reviewer for this checkout's commits: its Codex session, or with --subagent the fallback reviewer's transcript"
usage = '''
arg "[session]" help="The Codex session id, started in this checkout"
flag "--subagent <transcript>" help="While Codex is depleted: the read-only Claude subagent's agent-<id>.jsonl"
'''
depends = ["sync"]
dir = "{{ config_root }}/../.."
run = 'uv run --project python/repo --locked repotools pane-pin ${usage_session:+--session "$usage_session"} ${usage_subagent:+--subagent "$usage_subagent"}'

[tasks.pane-approved]
description = "Refuse unless the pinned reviewer's last answer approves exactly this HEAD, index and message"
usage = 'arg "<message>" help="The commit message file"'
depends = ["sync"]
dir = "{{ config_root }}/../.."
run = 'uv run --project python/repo --locked repotools pane-approved --message "$usage_message"'

[tasks.pr-fingerprint]
description = "Print the hash of HEAD and a pull request's title and body that the reviewer pane must approve"
usage = '''
arg "<title>" help="The pull request title"
arg "<body>" help="The file holding the body, which the reviewer reads"
'''
depends = ["sync"]
dir = "{{ config_root }}/../.."
run = 'uv run --project python/repo --locked repotools pr-fingerprint --title "$usage_title" --body-file "$usage_body"'

# The only way a pull request's text should reach GitHub: repotools reads the body once, checks it, and pipes it to gh.
[tasks.pr-create]
description = "Open a pull request against main once the pinned reviewer approved its title and body"
usage = '''
arg "<title>" help="The pull request title"
arg "<body>" help="The file holding the body"
'''
depends = ["sync"]
dir = "{{ config_root }}/../.."
run = 'uv run --project python/repo --locked repotools pr-create --title "$usage_title" --body-file "$usage_body"'

[tasks.zero-bash]
description = "Report tracked shell scripts, shell shebangs and multi-line mise run; --strict fails on any"
usage = 'flag "--strict" help="Exit 1 when anything is left"'
depends = ["sync"]
dir = "{{ config_root }}/../.."
run = 'uv run --project python/repo --locked repotools zero-bash ${usage_strict:+--strict}'

# hk's fnox-refs step: `fnox set` on a doppler provider writes the value into the TOML in plain text.
[tasks.fnox-refs]
description = "Fail when a tracked fnox TOML's Doppler entry holds anything but a Doppler secret name"
depends = ["sync"]
dir = "{{ config_root }}/../.."
run = "uv run --project python/repo --locked repotools fnox-refs"

# The main guard (AGENTS.md): git runs it from the shared .git/config on every ref update, so it lives in a
# uv tool outside every checkout, and the hook's shell line skips all but a prepared update of main.
[tasks.main-guard-copy]
description = "Install this checkout's repotools as a uv tool, the copy the main guard hook runs"
dir = "{{ config_root }}/../.."
run = "uv tool install --reinstall ./python/repo"

[tasks.tools-install]
# main-guard-copy remains a working-tree install route (Q-G1); a changed RECORD makes this task reinstall.
description = "Install workflowtools and repotools as uv tools from this checkout's committed trees; a second run changes nothing"
depends = ["sync"]
dir = "{{ config_root }}/../.."
run = "uv run --project python/repo --locked repotools tools-install"

[tasks.main-guard-install]
description = "Install the guard's copy and register it as this repository's reference-transaction hook"
depends = ["main-guard-copy"]
dir = "{{ config_root }}/../.."
run = '"$(uv tool dir --bin)/repotools" main-guard-install --bin "$(uv tool dir --bin)/repotools"'

# hk's post-merge step: the fast-forward that brings a guard to main installs it, and a newer one refreshes it.
# Git ignores post-merge's status, so a failed install never blocks the merge; the next one retries.
# Only a check that succeeds and prints install installs: a failing check fails the step and installs nothing.
[tasks.main-guard-arm]
description = "On main, install the main guard unless it is HEAD's already or the owner switched it off"
depends = ["sync"]
dir = "{{ config_root }}/../.."
run = 'r=$(uv run --project python/repo --locked repotools main-guard-armed) && { test "$r" != install || mise run //repo:main-guard-install; }'

# hk's pre-commit step for the toolchain tasks (#391): their real-toolchain test only when the staged change
# reaches what they run from, so a bump of an unrelated pin never waits on this Mac's Homebrew.
[tasks.toolchain-gate]
description = "Run //home:check, the real-toolchain test included, when the staged change reaches the toolchain tasks"
depends = ["sync"]
dir = "{{ config_root }}/../.."
run = 'r=$(uv run --project python/repo --locked repotools toolchain-gate) && { test "$r" != run || mise run //home:check; }'

[tasks.main-guard-remove]
description = "Remove the main guard's hook entry from this repository's config; post-merge then leaves it off"
depends = ["sync"]
dir = "{{ config_root }}/../.."
run = 'uv run --project python/repo --locked repotools main-guard-remove'

# Development: uv runs only through these tasks.
[tasks.sync]
description = "Install the locked dependencies into .venv"
run = "uv sync --locked"

[tasks.lock]
description = "Re-resolve every dependency to its latest release"
run = "uv lock --upgrade"

[tasks.codegen]
description = "Generate src/repotools/models.py from schema/repotools.schema.json ([tool.datamodel-codegen])"
usage = 'flag "--check" help="Only fail when models.py differs from what the schema generates"'
run = "datamodel-codegen ${usage_check:+--check}"

[tasks.lint]
description = "ruff, ty, generated models, and the subprocess pipe guard"
depends = ["sync", "codegen --check"]
run = ["ruff check .", "ruff format --check .", "ty check --python .venv", "ast-grep test --skip-snapshot-tests", "ast-grep scan src"]

[tasks.test]
description = "Real tests (no mocking library) at 100% line and branch coverage"
depends = ["sync"]
# prefix: mise reads the output, so task.logs keeps it for `mise run test:times`.
output = "prefix"
run = "uv run --locked pytest -n auto --durations=25"

[tasks."test:focus"]
# For a subset (-- -k <expr>, -- tests/test_x.py): the 100% gate stays on test and check; this reports
# coverage without failing on it. The command-line --cov-fail-under overrides the one in addopts.
description = "Focused tests: coverage reported, not gated; extra args go to pytest"
depends = ["sync"]
run = "uv run --locked pytest --cov-fail-under=0"

[tasks.check]
description = "lint and test"
depends = ["lint", "test"]
