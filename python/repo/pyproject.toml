[project]
name = "repotools"
version = "0.1.0"
description = "Checks this repository runs on itself"
requires-python = ">=3.15"
dependencies = ["pydantic", "pydantic-settings", "tomlkit"]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
# D: one-line module docstrings only. CPY001: no copyright headers. TC001-TC003: annotations are
# lazy (Python 3.14+), so a TYPE_CHECKING block buys nothing. S603/S607: the checks run git by name.
# COM812: conflicts with ruff format.
ignore = ["D", "CPY001", "TC001", "TC002", "TC003", "COM812", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest asserts with assert. PLR2004: a test states the exit code or value it expects.
"tests/**" = ["S101", "PLR2004"]
# Generated (DL-762): datamodel-codegen orders its imports its own way; every other rule applies.
"src/repotools/models.py" = ["I001"]

[tool.pytest.ini_options]
addopts = "--cov=repotools --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

# Measure the console script the tests run as a real process, too.
[tool.coverage.run]
patch = ["subprocess"]

# tests/test_gates.py runs the gates through mise in a copy of the checkout, whose venv imports
# repotools from the copy's src; combining maps those lines back onto this src.
[tool.coverage.paths]
source = ["src/repotools", "*/python/repo/src/repotools"]

# Flags live here, so the codegen task stays one line (zero-bash rule).
[tool.datamodel-codegen]
input = "schema/repotools.schema.json"
input-file-type = "jsonschema"
output = "src/repotools/models.py"
output-model-type = "pydantic_v2.BaseModel"
enable-faux-immutability = true
target-python-version = "3.15"
use-annotated = true
use-type-alias = true
strict-nullable = true
use-standard-collections = true
use-union-operator = true
use-schema-description = true
use-field-description = true
disable-timestamp = true
formatters = ["ruff-format"]
custom-file-header = "# Generated by datamodel-codegen from schema/repotools.schema.json; edit the schema, then mise run //repo:codegen."

[project.scripts]
repotools = "repotools.cli:main"

[build-system]
requires = ["uv_build>=0.13.6"]
build-backend = "uv_build"
