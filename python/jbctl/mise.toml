# jbctl (issue #502): drive JetBrains IDEs from code. No [tools]: ruff, ty, uv and datamodel-codegen are global
# (DL-757); rea comes from //jbctl:rea-install and jbax from //swift:install. From the repository root:
# //jbctl:<task>.

[env]
_.python.venv = { path = ".venv" }

[tasks.sync]
description = "Install the locked dependencies into .venv"
run = "uv sync --locked"

[tasks.codegen]
description = "Generate src/jbctl/models.py from schema/jbctl.schema.json ([tool.datamodel-codegen])"
usage = 'flag "--check" help="Only fail when models.py differs from what the schema generates"'
run = "datamodel-codegen ${usage_check:+--check}"

[tasks.lint]
description = "ruff check, ruff format --check, ty check, and models.py matches the schema"
depends = ["sync", "codegen --check"]
run = ["ruff check .", "ruff format --check .", "ty check --python .venv"]

# Run by hand, never from a hook: it writes ~/.agents/skills and ~/.claude/skills. Reads the install's jars on disk and
# contacts no IDE. E.g. mise run //jbctl:skills -- --ide clion --skill clion-debugger (--check writes nothing).
[tasks.skills]
description = "Copy bundled skills out of a Toolbox install for Claude Code and Codex (jbctl skills)"
depends = ["sync"]
run = "uv run --locked jbctl skills"

# jbctl on PATH, run by name from any folder. Like //workflow:install, it installs this checkout as it is, apart from
# //repo:tools-install, so a python/jbctl edit never blocks the repotools and workflowtools the approvals use. The
# installed copy does not follow later edits or pulls: run this again after jbctl changes land.
[tasks.install]
description = "Install this checkout's jbctl as a uv tool, so jbctl runs by name"
dir = "{{ config_root }}/../.."
run = "uv tool install --reinstall ./python/jbctl"

# #472: the pinned rea package (src/jbctl/data/rea-pin.json), a dotfiles release asset checked by its sha256, installed
# with its locked dependencies in ${XDG_DATA_HOME:-~/.local/share}/jbctl/rea, which rea.installed_helper() reads.
# npm runs with every install script off (Frida's included) and no user or global npm config. The task's own Node,
# the version the package was built and checked with, leaves the global one alone; npm is the one that Node bundles,
# and JBCTL_REA_NPM is its version, which rea-install checks (reainstall.check_tools). A folder that already holds the
# pinned archive and a verified install is kept. After the install it applies jbctl's patch to the helper and writes
# identity.json (the pin's source commit, package and patch sha256, Node version, time), which rea-doctor reads.
[tasks.rea-install]
description = "Install the pinned rea package in jbctl's rea folder (the patch test reads its helper)"
depends = ["sync"]
# #472 (owner ruling C): the Node the pinned package was built and checked with, and the npm that Node bundles. Both
# change with rea-pin.json: a pin built on another Node moves them to that Node and its npm.
tools = { node = "24.22.1" }
env = { JBCTL_REA_NPM = "11.19.1" }
usage = 'flag "--package <tgz>" help="Install this package.tgz (its sha256 must match the pin) instead of downloading it"'
run = 'uv run --locked jbctl rea-install ${usage_package:+--package="$usage_package"}'

# #472: the folder against the pin, as one JSON line: the installed source commit and package sha256, jbctl's patch
# marker in the helper, and rea --version run with the global Node (no task tools: it is the Node rea runs on in use).
# Exits 1 on any mismatch. A rea-agents left in npm's global prefix is a warning (stray_global), not a failure.
[tasks.rea-doctor]
description = "Check jbctl's rea folder against the pin (source commit, package sha256, patch, version)"
depends = ["sync"]
run = "uv run --locked jbctl rea-doctor"

# The live tests are skipped unless JBCTL_IDE is set (only the coverage task sets it), so this never touches an IDE.
[tasks.test]
# The tests drive macOS tools (agent-desktop, rea's macOS helper, jbax); skip elsewhere.
skip_if = "{{ os() != 'macos' }}"
description = "Real tests (no mocking library); the live-IDE ones run only with JBCTL_IDE set"
# The offline tests copy the installed rea helper, so rea is installed first (kept when already in place).
depends = ["sync", "rea-install"]
# prefix: mise reads the output, so task.logs keeps it for `mise run test:times`.
output = "prefix"
# Serial: jbctl finds IDEs by the machine-wide web ports 63342-63361 and process list, so a stand-in IDE
# from a parallel worker shows up in another test's status.
run = "uv run --locked pytest --durations=25"

# <ide> is the IDE's Toolbox shell-script name (clion, pycharm, clion1). The live tests run in the background,
# Settings included (opened through the IDE's station socket). Only the debug route that brings the IDE forward is
# marked out of the count ("# pragma: foreground"; //jbctl:markers refuses any other pragma). The #502 floor
# is 97.63%: a headless run on 2026-11-07, with jbctl skills, measured 97.75% (1260 of 1285 lines, 348 of 360
# branches), but it reached the cli.py page move below, which the floor assumes a run does not reach; without
# that line and its branch, the same run is 97.63%. What stays uncovered: three guards no working IDE or jbax
# trips, "Settings did not open" (ide.py), a Settings window without a search field (rea.py) and a jbax that
# crashed without printing JSON (ide.py); the move to the page asked for when Settings opens elsewhere (cli.py),
# which a headless run reaches only when a station open is still landing; and lifecycle states no run produces on
# demand: two new IDEs at once, windows jbax cannot inspect, a pid that changes between the check and /exit, a
# dialog that appears while stop waits before --force, and psutil's SystemError for a process that ends while it is
# read (toolbox.snapshot); and in skills, a renamex_np that fails, and the swap-backs for a swapped-out copy or folder
# that changed since the check, cannot be read, or is no longer a folder, or a run stopped mid-check. All are left
# visible as uncovered rather than marked.
# --foreground also runs the debug route against the real IDE, which brings it forward once.
[tasks.coverage]
skip_if = "{{ os() != 'macos' }}"
description = "Every test, live ones included; line and branch coverage of at least 97.63% (#502)"
# The offline tests copy the installed rea helper, so rea is installed first (kept when already in place).
depends = ["sync", "rea-install"]
usage = """
arg "<ide>" help="The IDE under test, by its Toolbox shell-script name, e.g. clion"
flag "--foreground" help="Also run the debug route that brings the IDE forward (menu-bar Settings)"
"""
run = 'JBCTL_IDE="$usage_ide" JETBRAINS_FOREGROUND="${usage_foreground:+1}" uv run --locked pytest --cov-fail-under=97.63'

# start, restart and stop of a real spare IDE: it comes forward and is quit, so the owner runs this, never a hook
# or the coverage gate. The IDE opens a throwaway worktree of ~/dev/github/jdx/mise (JBCTL_LIFECYCLE_REPO) under
# ~/.local/state/jbctl/lifecycle-projects (JBCTL_LIFECYCLE_PROJECTS), which the owner adds once to that IDE's
# Trusted Locations, or the IDE stops at its trust prompt.
[tasks.lifecycle]
skip_if = "{{ os() != 'macos' }}"
description = "Start, restart and stop a spare IDE for real (opt-in: it brings the IDE forward and quits it)"
depends = ["sync"]
usage = 'arg "<ide>" help="A spare IDE by its Toolbox script name, e.g. rustrover; never one you are working in"'
run = 'JBCTL_LIFECYCLE_IDE="$usage_ide" uv run --locked pytest --no-cov tests/test_lifecycle_live.py'

# The only coverage pragma allowed is "# pragma: foreground", and only in ide.py, on the debug route that brings
# the IDE forward: nothing else is marked out of the count to reach the gate. mise runs with errexit, so each
# line fails on a match (rg exits 0) or an rg error (2), and passes when nothing matches (1).
[tasks.markers]
description = "Fail on any coverage pragma but ide.py's foreground ones"
run = [
  "rg -n 'pragma:' src --glob '!src/jbctl/ide.py' && exit 1; test $? -eq 1",
  "rg -n -P 'pragma:(?!\\s*foreground\\b)' src/jbctl/ide.py && exit 1; test $? -eq 1",
]

[tasks.check]
description = "lint, the coverage-pragma policy and the non-live tests"
depends = ["lint", "markers", "test"]
