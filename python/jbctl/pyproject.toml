[project]
name = "jbctl"
version = "0.1.0"
description = "Drive JetBrains IDEs from code through macOS accessibility (rea, jbax, agent-desktop); issue #502"
requires-python = ">=3.15"
dependencies = [
    "filelock>=4.2.9",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pydantic",
    "pydantic-settings",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "pytest-xdist"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
# D: one-line module docstrings only. CPY001: no copyright headers. TC001-TC003: annotations are
# lazy (Python 3.14+), so a TYPE_CHECKING block buys nothing. S603/S607: the tools (agent-desktop,
# rea, jbax, patch, ps) run by name. COM812: conflicts with ruff format.
ignore = ["D", "CPY001", "TC001", "TC002", "TC003", "COM812", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest asserts with assert. PLR2004: a test states the exit code or value it expects.
"tests/**" = ["S101", "PLR2004"]
# Generated: datamodel-codegen orders its imports its own way; every other rule applies.
"src/jbctl/models.py" = ["I001"]

[tool.pytest.ini_options]
# The coverage gate (97.63%, #502) is //jbctl:coverage <ide> (sets JBCTL_IDE): the live tests drive a running IDE in the
# background, so a hook runs the rest without it.
addopts = "--cov=jbctl --cov-branch --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
patch = ["subprocess"]

# "# pragma: foreground" marks the only code allowed out of the coverage count: the debug route that brings the
# IDE forward (JETBRAINS_FOREGROUND=1), which the default, headless runs must never take. `mise run //jbctl:markers`
# (part of //jbctl:check) fails on any other pragma, so nothing else is marked to reach the gate.
[tool.coverage.report]
exclude_also = ["# pragma: foreground"]
partial_also = ["# pragma: foreground"]
# coverage.py rounds the total and --cov-fail-under to this many decimals: at 0, a 99 floor passes 98.5%.
precision = 2

[tool.datamodel-codegen]
input = "schema/jbctl.schema.json"
input-file-type = "jsonschema"
output = "src/jbctl/models.py"
output-model-type = "pydantic_v2.BaseModel"
enable-faux-immutability = true
target-python-version = "3.15"
use-annotated = true
snake-case-field = true
use-type-alias = true
strict-nullable = true
use-standard-collections = true
use-union-operator = true
use-schema-description = true
use-field-description = true
disable-timestamp = true
formatters = ["ruff-format"]
custom-file-header = "# Generated by datamodel-codegen from schema/jbctl.schema.json; run mise run //jbctl:codegen."

[project.scripts]
jbctl = "jbctl.cli:main"

[build-system]
requires = ["uv_build>=0.13.6"]
build-backend = "uv_build"
