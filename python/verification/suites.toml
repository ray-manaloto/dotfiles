[[suite]]
name = "workflow.codex-verdict-contract"
handler = "require_tokens"
description = "The Codex verdict contract + reaper (#580). The contract is PROVIDER-enforced, not prompt-enforced: OMC hand-rolls nine type checks in its consumer only because its Codex workers are persistent panes with no schema hook, and `codex exec` 0.146.0 is not stuck there — it ships `--output-schema <FILE>` (the provider enforces the final response's shape) and `-o/--output-last-message <FILE>`. So the verdict is a schema with a `schema_version`, the field OMC's payload lacks, 'which is why a contract change there breaks silently'. The CONSUMER mechanics are ported from OMC verbatim because they are the genuinely hard-won and transport-independent part: a liveness gate so a half-written file is never read, a compare-and-swap under a file lock re-verifying status AND owner, a `verdict.json` -> `verdict.processed.json` rename for idempotency, and a typed reap-outcome enum. ⚠️ TWO OMC DEFAULTS ARE DELIBERATELY INVERTED and this contract exists largely to stop them being 'fixed' back: `file_missing` and `parse_failed` are ESCALATION EDGES, not warnings, because leaving such a task stuck in_progress forever is incompatible with unattended operation. That inversion is measured, not assumed. The #580 NEEDS-PROBE asked whether a usage-limit-aborted run still writes its `-o` file; the codex 0.146.0 binary answers in the string sitting immediately beside the write path, both in `exec/src/lib.rs`: 'Warning: no last agent message; wrote empty content to <path>'. An empty `-o` file is therefore an explicit code path, not a hypothetical partial write, so 'the file exists' is necessary but NEVER sufficient and the consumer must validate CONTENT. Six empirical arms on the same binary, every rc recorded: a successful run writes a schema-valid file (rc=0, the positive control), while SIGINT (rc=1), SIGTERM (rc=143), SIGKILL (rc=137) and two distinct graceful exit(1) paths (a bogus model, a bogus provider) each left NO file at all — so codex exits before the write on every abort that could be induced, and both outcomes escalate here. ⚠️ What the probe did NOT establish, stated rather than implied: whether a usage-limit abort specifically takes the exit-before-write path or the completed-with-no-message path, because a usage limit cannot be induced on demand. It does not change the module, since both outcomes already escalate — but a future reader must not mistake the inference for a measurement. Three verdicts map to three edges rather than collapsing `revise` into failed (#575 R7): approve -> advance, revise -> reopen implement, reject -> reopen research, all bounded by #573's `max_rework` -> `dag:needs-human`. `approve` is deliberately NOT bounded — the budget exists to stop an endless rework loop, and approval ends the loop by definition. The CAS order is ownership -> idempotency -> status, and the middle position is load-bearing: a successful reap flips the lane out of in_progress itself, so a status-first order answers STATUS_MISMATCH on a re-run, which is true but reads as 'someone else changed this lane' when the fact is 'I already did this'. Every terminal path CONSUMES the verdict by rename, including the escalating ones — leaving the file would make the tick re-read the same broken verdict every 60s and re-escalate forever, a warning storm in place of the single escalation the inversion exists to produce. A lane that is NOT ours (owner or status mismatch) is the one case that does not consume: it is not ours to consume. ⚠️ WIRED INTO THE TICK, not module-only (Ray's scope ruling): `execute_tick` calls `reap_codex_lanes`, and the end-to-end test drives that through real stdout rather than grepping the source, because a source-substring check passes on a call site that is present but unreachable — 'a reaper nobody calls' is the #343 shape. Control-armed both ways: deleting the wiring line fails the test, restoring it passes. The tick line reports the edge as DECIDED, never applied — projection to the tracker is the SCHEDULER's job, one direction only (575 R1), and #602 implements it; naming an action this process does not perform is the #601 finding that cost two review rounds. Asserts the chain: the module carries the schema, the parse, the edge mapping, the liveness gate, the CAS and all ten reap outcomes; dag_tick wires the reaper and the rework counter; main.py registers --max-rework; and the tests bind both arms of the inversion."
