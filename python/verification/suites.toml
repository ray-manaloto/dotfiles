name = "workflow.path-drift-ambient-capture"
description = "#596: the PATH-drift preflight must keep the SEAM that lets it see anything. A long-lived shell caches its mise activation, so after a bump lands it keeps the OLD install dir on $PATH and every gate runs a stale binary while `mise which` truthfully reports the new one — four occurrences before the check existed (hk 1.52.0 vs a 1.54.0 pin, twice in session 2026-08-05g, two spurious red test runs each; npm:renovate 44.13.2 vs 44.14.10 and uv 0.12.2 vs 0.12.3 on 2026-08-08, both surviving an `mise install` that exited 0; and 14 tools at once, hk/uv/python/npm:renovate among them, on the check's first armed run). ⚠️ **The issue's own stated fix shape is structurally dead and that is what this contract exists to protect against re-adopting**: `mise exec` AND `mise run <task>` both REPLACE the stale install dir in PATH before the child starts (measured — ambient `command -v hk` -> 1.54.0, the same command under a mise task -> 1.54.1, with the stale entry gone rather than reordered), so a preflight wired into `mise run lint` observes a repaired PATH and can only ever report clean. `__MISE_ORIG_PATH` does not rescue it either: it holds the PRISTINE pre-activation PATH (zero installs/ entries, measured) and is byte-identical inside and outside `mise exec`. Two things therefore have to hold together or the shipped check is a probe with one face. FIRST, the CAPTURE: the SessionStart hook must record the shell's PATH into DOTFILES_AMBIENT_PATH BEFORE invoking mise, which is why the settings.json token binds the assignment ATTACHED to the mise invocation rather than the variable name anywhere in the file — the realistic regression is someone tidying the hook command and dropping the prefix, not renaming the variable. SECOND, the BLINDNESS BRANCH: `mise run <task>` sets MISE_TASK_NAME and an ambient shell does not, so that marker is a non-circular detector; with it present and no capture, resolve_ambient_path returns Provenance.BLIND, which the CLI exits 2 on and the doctor reports as a finding — NEVER as a pass. `return inherited, Provenance.BLIND` is bound as a token because deleting exactly that line is the realistic way the check degrades into a silent can-only-pass probe, and mutation-testing confirmed it fails 3 tests (one of which had to be tightened first: the exit-code test originally reached 2 via the error path with an empty listing, so it survived the mutation — a right-answer-wrong-reason test). The comparison itself asserts nothing about a hard-coded tool list: one `mise ls --current --json` gives every active tool's install_path, whose last two components are <slug>/<version>, and every $PATH entry under the same installs root parses identically, so the check ENUMERATES rather than naming the five tools that happen to have drifted so far (measured on the authoring host: 147 of 148 active tools had a PATH entry, ZERO PATH slugs were unknown to mise, 14 were drifted). doctor.toml's gate_tools only RANKS which drifts are named first. Complementary to workflow.renovate-re2-engine-assertion rather than redundant with it: a version comparison catches drift early and loudly across every tool but consults the pin, while a canary tests the binary that actually RUNS in the one gate that can afford it. Asserts the chain: settings.json captures the ambient PATH, doctor.py registers AND calls the check, main.py registers and dispatches the subcommand, the module carries both public functions plus the blindness branch, doctor.toml declares the baseline, and the test file binds the hook-capture guard. Tokens bind CALL SITES and the one behaviour-bearing line, never a bare definition a comment could satisfy."
