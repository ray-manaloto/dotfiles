ete_truth_table(', 'def test_classify_truth_table_is_exhaustive(', 'def test_classify_truth_table_mapping_matches_the_predicates(', 'def test_classify_truth_table_reaches_every_class_it_can(', 'def test_classify_queued_reply_on_a_live_node_is_visible_not_silent(', 'def test_classify_queued_reply_on_a_dead_node_still_reaches_respawn(', 'def test_is_reply_queued_is_the_complement_of_is_needs_human(', 'def test_classify_background_rows_reply_queued_note_always_prints(', 'def test_classify_escalation_with_a_queued_reply_is_dead_not_needs_human(', 'def test_execute_tick_respawns_an_escalation_whose_reply_is_queued(', 'def test_is_stalled_both_directions(', 'def test_plan_needs_human_reason_claims_no_action_this_module_skips(', '_EXPECTED_NEEDS_HUMAN_REASON = (', 'def test_reason_honesty_predicate_is_a_template_guard_not_a_classifier(', 'def test_classify_blocked_without_needs_still_dead_on_dead_pid(', 'def test_execute_tick_never_respawns_a_fresh_escalated_node(', 'def test_execute_tick_still_respawns_a_fresh_blocked_node_without_needs(', 'def test_execute_respawn_skips_a_node_that_escalated_since_classification(', 'def test_execute_respawn_still_spawns_when_the_node_did_not_escalate(', 'def test_execute_stop_skips_a_node_that_left_terminal_since_classification(', 'def test_execute_stop_still_stops_a_node_that_is_still_terminal(', 'def test_execute_stop_skips_when_state_json_vanished_before_execution(', 'def test_plan_stop_reason_states_the_recheck_and_its_residual(', '_EXPECTED_STOP_REASON = (', 'def test_classify_background_rows_escalated_and_stalled_keeps_both_facts(', 'def test_classify_background_rows_escalated_not_stalled_omits_the_clause(', 'def test_read_proc_start_discriminates_between_two_processes(', 'def test_read_proc_start_is_utc_not_this_host_local_time(', 'def test_background_pid_alive_differing_proc_start_is_dead(', 'def test_background_pid_alive_unreadable_proc_start_is_alive(', 'def test_background_pid_alive_blank_proc_start_is_alive(', 'def test_background_pid_alive_live_arm_recycled_pid_reads_dead(', 'def test_recycled_pid_classifies_dead_and_plans_a_respawn(', 'def test_execute_respawn_reconciles_on_a_recycled_pid('] }

[[suite]]
name = "workflow.dag-projection-wiring"
description = "The tracker projection for escalated background nodes (#602 phase 2), and the SCHEDULER'S first slice rather than a watchdog feature. `dag_tick` (#578/#601) classifies a node NEEDS_HUMAN — `state == \"blocked\"` AND a non-empty `needs` AND no `queuedPrompt` — logs it and NEVER respawns it, and nothing emitted the other half: `docs/receipts/575.md` R1 keeps projection one-directional and scheduler-owned, so the boundary was right and the far side was UNOWNED. The consequence was live — two nodes sat `blocked ∧ needs` since 2026-07-13 and 2026-07-22, visible in a launchd log and nowhere else. ⚠️ **The predicates are REUSED BY IMPORT, never re-derived**, and that is the contract's most load-bearing clause: `dag_project` calls `dag_tick.node_from_state` / `is_needs_human` / `normalize_needs` / `is_stalled`, because two readers of one `state.json` disagreeing about it is the EXACT defect class #601 v4 and #604 each shipped a fix for. A private copy of `is_needs_human` here would pass every test while re-opening that class, so the contract binds the CALL SITE. **#602 exposed a fork the ticket did not name: nothing binds a node to an issue** — no `issue`/`ticket` field in the union of every `state.json` key set on this host, and a job dir holds only `state.json`, `timeline.jsonl` and `tmp/`. Both live escalations were hand-launched long before any scheduler, so a bound-nodes-only reading would have shipped this surfacing 0 of its own 2 motivating cases. Resolved (Ray, 2026-08-07): the scheduler writes `dag-binding.json` at dispatch and an UNBOUND node projects to the standing escalation issue #623, created in phase 1. An unreadable or malformed binding reads as UNBOUND rather than as a reason to DROP — the failure #602 exists to end is SILENCE, so a binding we cannot route on costs the escalation its route, never its visibility. **R5 is a LABEL, not a GATE, and it is decided STRUCTURALLY rather than semantically**: `docs/receipts/575.md` R5 says a blocker is valid only if it names what was exhausted, and read as a gate that would DROP both live escalations, recreating the silence one layer up — `dag_tick`'s own REPLY_QUEUED precedent chose visibility for the same reason ('making it visible IS the fix'). So `r5_verdict` asks 'is there a machine-readable evidence field?', never 'does this prose sound like it names what was exhausted?' — a deliberate refusal to build a semantic classifier, because the #601 review killed substring-based reason checking across two rounds, concluding a substring guard cannot judge meaning so tightening it is unwinnable. Every harness-native escalation is therefore UNVALIDATED today, measured 3-for-3 across CLI 2.1.207, 2.1.217 and 2.1.224. ⚠️ **The payload is quoted in a FENCED BLOCK, never a blockquote, and that is a MEASURED correction rather than a style choice.** The spec's first draft used `>`; the phase-1 by-hand pilot showed `ad8baf35`'s `needs` CONTAINS BACKTICKS, so GitHub rendered them as inline code and the raw characters never appeared. The phase-1 gate as first written ('both comments render correctly') would have PASSED that, because a mangled payload renders beautifully — it only became a real check when restated as a BYTE COMPARISON against `state.json`, which is the generalisable lesson: a check on APPEARANCE cannot detect a fidelity loss that appears fine. Pinned by a test using the REAL backticked payload, because an invented one without backticks would pass against a renderer that mangles the real thing. **Dedupe is keyed on `(node, digest)` and both halves are load-bearing in OPPOSITE directions**: node alone silences a node that re-escalates with a NEW question, digest alone collides across nodes asking the SAME one; both failure modes are pinned. The marker cannot be the label instead — the label lives on the ISSUE, so on the standing issue the first node would label it and every later node's comment would be suppressed. **`updatedAt` is authoritative and the file mtime is the FALLBACK**, caught by phase 2's own gate: a fixture built with `cp` reported the mtime as the day of the COPY while `updatedAt` still held the node's real last write three weeks earlier, and a timestamp a file operation can rewrite is not a measurement of when a human was asked; a disagreement between the two is REPORTED rather than hidden, because it means something that is not the harness touched the file. The 'How to answer' line has TWO forms chosen by whether the job dir still exists — telling an operator to reply to something that cannot receive a reply is the same defect class as a log line naming an action the code does not perform. `_needs_human_reason()` is reproduced VERBATIM via the public `needs_human_reason()` accessor (a re-export, never a second copy) so the golden-equality pin in test_dag_tick.py now also guards operator-facing tracker content — and that string still says the projection is 'NOT done here — #602', which stays TRUE after this ships because `dag_project` is a separate process. **Phase 2 is READ-ONLY and REFUSES without `--dry-run`** rather than exiting 0 having done nothing, which would read as a successful projection; zero escalations means zero API calls, and the empty case is reported explicitly so 'no escalations' and 'never ran' can never look the same. Mutation-verified with DIFFERING blast radii: fence->blockquote fails 2, mtime-over-updatedAt fails 3, dropping the `queuedPrompt` delegation fails 4, dropping the digest from the marker fails 6. Asserts the chain: the mise task, main.py's subparser registration and dispatch call site, the module's public surface (the predicates it imports, the binding reader, the structural R5 verdict, the fenced renderer, the marker, the dry-run refusal), and the test file's coverage of the backticked payload, both dedupe directions, the binding arms, both answer forms and the updatedAt preference."
