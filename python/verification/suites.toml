[[suite]]
name = "workflow.token-preflight-shares-one-predicate"
description = "#652: the contract-token uniqueness predicate must exist ONCE and be reachable EARLY. #397's rule is that a `per_path_tokens` entry matching its file more than once can be satisfied by a stand-in, so the contract asserts less than it claims — measured: registering a second subjectless classifier made `subject_param=None,` match twice, and deleting either registry entry would have left the contract green (#394). `dotfiles-setup token-audit` encodes that predicate but can only speak once the contract EXISTS, surfacing in `mise run verify` after the work is done; the pre-flight asks the same question while the answer still costs one edit. ⚠️ **The property this contract protects is that the two scopes cannot drift apart**, which is why `for counted in count_tokens(root, raw, tokens)` is bound as a token rather than merely `def count_tokens(`: the whole-suite walk was re-inlining `text.count(token)` before this change, and re-inlining it again is exactly how the pre-flight would start giving permission the gate later refuses — the worst outcome, since the pre-flight's entire value is being BELIEVED before the contract is written. `test_the_suite_audit_and_the_preflight_agree_on_the_same_input` drives both scopes over one manifest and requires the same verdict, and is bound here for the same reason. Three design points worth keeping: zero and many are reported with DIFFERENT words (`MISSING` vs `AMBIGUOUS`) because they are different defects — many means the contract under-asserts, zero means the path or spelling is wrong and it would fail on arrival; the PASSING arm is printed too, because a silent success is indistinguishable from a probe that never ran and the caller is about to commit those strings into a gate; and `expected` is a parameter rather than a hard-coded 1, because deliberate multiplicity is real — `AMBIGUITY_ALLOWED` documents 18 bindings where both sites ARE the contract. ⚠️ **The count is necessary, not sufficient, and the skill carries that judgement**: a token binding exactly once can still be worthless if it names a DEFINITION rather than a CALL SITE, since a comment or a docstring in the same file satisfies it — #299 shipped `def changes_apt_pin_inputs(` and deleting the whole wiring line left the contract green. The tool proved itself on its first real use: pre-flighting THIS contract's own tokens rejected `\"--check\",` at 5 matches in main.py, so the token bound here is the unique help-string instead. Asserts the chain: the skill names the task, mise.toml's task shells out to the CLI flag, main.py registers the flag and dispatches to the pre-flight while keeping the whole-suite default, the module carries both scopes plus the shared call site, and the test file carries the agreement guard."
category = "workflow"
check_type = "static"
handler = "require_tokens"
paths_required = true
paths = [
    ".claude/skills/token-check/SKILL.md",
    "mise.toml",
    "python/src/dotfiles_setup/main.py",
    "python/src/dotfiles_setup/token_audit.py",
    "tests/test_token_preflight.py",
]
per_path_tokens = { ".claude/skills/token-check/SKILL.md" = ["name: token-check"], "mise.toml" = ["[tasks.token-check]", "dotfiles-setup token-audit --check'"], "python/src/dotfiles_setup/main.py" = ['help="PRE-FLIGHT (#652)', "else token_audit_main(project_root)", "preflight_main("], "python/src/dotfiles_setup/token_audit.py" = ["def count_tokens(", "def preflight_main(", "for counted in count_tokens(root, raw, tokens)"], "tests/test_token_preflight.py" = ["def test_the_suite_audit_and_the_preflight_agree_on_the_same_input("] }
tokens = [
    "def count_tokens(",
]

[[suite]]
name = "workflow.session-review-two-lanes"
description = "#654: the session review must keep BOTH lanes and both noise filters. It is the meta-layer over #650-#653, all four of which were found by doing this review by hand on 2026-08-08 — which is the argument for automating it. ⚠️ **The lanes are DISJOINT and neither is optional.** Lane 1 reuses `command_audit`'s transcript mine (same corpus, different verdict: that one asks 'should this be a GUARD REDIRECT', this one asks 'should this be a SKILL') and ranks by SESSION SPREAD rather than raw frequency, because twenty uses inside one session is one grind while three uses across three sessions is a workflow and only the second keeps costing. Lane 2 reads the notepad and the newest handoff for reasoning sinks. Lane 1 alone would have MISSED the best candidate: #650 was ~15 turns of reading CI config, transcribing a recipe, running it on the wrong platform, measuring the damage and re-running in a container, with NO repeated one-liner to count — frequency is a proxy for cost and a poor one. Lane 2 alone would miss the one-offs an agent does not remember running, which the transcript does. `session_review_main` therefore REFUSES `--transcript-only` together with `--narrative-only` rather than resolving them, since guessing which was meant loses a whole class of finding. ⚠️ **Both noise filters were derived from a real first run, not guessed, and both are bound here.** `is_reportable_shape` rejects shell constructs, harness mechanics and pasted literals: measured, `while [` / `for i` / `python3 -` / `mkdir -p` / a long `export VAR=...` took 5 of the top 8 lane-1 rows and none named a workflow — and the in-turn poll loop is MANDATED by `long-running-command-hangs.md` rule 2, so ranking it would put a required behaviour at the top of a list of things to stop doing. The `=` test looks at the WHOLE shape and not the head, a real defect the tests caught: `group_key` keeps two words, so an assignment lands in the second one and a head-only check waves it through. Lane 2's suppressors drop instructions NOT to do something by hand ('do NOT re-derive this') — 9 of 17 rows on the first run, and a handoff saying that is the previous session having already paid, the opposite of a finding; a control arm pins that a genuine 're-derived' still surfaces. ⚠️ **Both windows are declared in the report** because a bound-limited search that does not state its bound reads as complete (`probes-need-a-control-arm.md` rule 3): the transcript count is FILES including nested subagent transcripts and is explicitly NOT a session count (the first run printed '26 session(s)' against `--sessions 6`), and lane 2 reads a TAIL of the notepad plus only the NEWEST handoff, because the notepad accumulates across every session this repo has had and an unbounded scan answers a different question. The tail keeps real line numbers rather than window-relative ones, since a citation nobody can open is not a citation. The issue specified `--since <ref>`; that is not implemented and the deviation is recorded in the module docstring — `.agent/` is gitignored, so no git ref can bound a corpus git has never tracked. ⚠️ **The honest test the skill carries (#607/#608, 'prose was not the lever'): a candidate that cannot name a concrete cost it would have avoided is a preference, not a finding** — `render_report` puts that field in the template so it has to be filled in. Asserts the chain: the skill exists and names itself, mise.toml's task shells out to the CLI, main.py registers and dispatches it, the module carries both lanes plus the shape filter, `command_audit.truncate` is the shared renderer (promoted from `_truncate` when it gained a cross-module caller), and the test file carries the suppressor guard and the window-declaration guard."
category = "workflow"
check_type = "static"
handler = "require_tokens"
paths_required = true
paths = [
    ".claude/skills/session-review/SKILL.md",
    "mise.toml",
    "python/src/dotfiles_setup/main.py",
    "python/src/dotfiles_setup/session_review.py",
    "python/src/dotfiles_setup/command_audit.py",
    "tests/test_session_review.py",
]
per_path_tokens = { ".claude/skills/session-review/SKILL.md" = ["name: session-review"], "mise.toml" = ["[tasks.session-review]", "dotfiles-setup session-review'"], "python/src/dotfiles_setup/main.py" = ['"session-review",', '"session-review": lambda'], "python/src/dotfiles_setup/session_review.py" = ["def shape_candidates(", "def is_reportable_shape(", "def scan_narrative(", "def session_review_main("], "python/src/dotfiles_setup/command_audit.py" = ["def truncate("], "tests/test_session_review.py" = ["def test_an_instruction_not_to_do_it_by_hand_is_not_a_record_of_doing_it(", "def test_the_report_states_both_windows_it_looked_through("] }
tokens = [
    "def is_reportable_shape(",
]
