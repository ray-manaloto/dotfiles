]
per_path_tokens = { "hk.pkl" = ["bash_logic_budget", "dotfiles-setup bash-budget"], "python/src/dotfiles_setup/main.py" = ["bash-budget"], "python/src/dotfiles_setup/bash_budget.py" = ["def find_violations", "def bash_budget_main"] }
tokens = [
