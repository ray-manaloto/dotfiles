atches a bare stem (requiring brackets or .md missed 4 real citations in the live dir and told the reader a cited memory had none — the false reassurance that precedes a delete). On-demand by design: no hook wires it (Ray, 2026-07-14 — revisit once the numbers show how they move), so unlike command-audit there is deliberately no settings.json entry to assert."
