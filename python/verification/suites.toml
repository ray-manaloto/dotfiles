[[suite]]
name = "workflow.memory-index-wiring"
description = "Memory-index curation wiring: `mise run memory-index` must stay a thin caller of the python library (`dotfiles-setup memory-index`, zero-bash-logic), the memory_index module + its tests must exist, and the skill must carry the operating procedure. Why it exists: MEMORY.md auto-loads only to 200 lines / 25KB, so it must stay short — but shortening an index entry SILENTLY DESTROYS any fact that lives only in that entry. Measured 2026-07-14, not theorized: a routine trim of 4 bloated lines would have destroyed 4 facts (#244, #186, #194, 8010c61) that no topic file recorded, and the checker's first live run found a 5th (a hook claiming CI green at 3adff36 against a topic file saying c2cecd7 — a later commit). Hence the order the skill encodes and this contract pins: verify -> migrate/correct -> THEN shorten. Pins the design choices that make the report worth reading, each one a bug an adversarial review probe-verified before it shipped: load_cutoff_line enforces BOTH caps (the first draft checked only LINE_BUDGET, on the twice-asserted belief that lines bind first — at ~149 bytes/line the 25KB cap lands near line 168 and the line cap is UNREACHABLE, so the only axis that could fire was the unenforced one, and the report printed OVER in its own table while exiting 0); audit_index drops MEMORY.md itself (the index holds every entry, so including it resolves every fact as 'recorded somewhere' and returns a silent all-pass — the one failure a loss-checker cannot have); fact_present matches per-kind rather than by raw string (the prototype cried `25.8GB` missing against a file writing `25.8 GB`, and a checker that cries wolf gets ignored); _SHA demands a digit AND an a-f letter (a digit-only test read the repo's own research-YYYYMMDD-* slugs and GHA run ids as commit shas); _elsewhere never downgrades a size (17.5GB of image and 17.5GB of free disk share a number, not a fact, so the coincidence would pass a genuinely index-only measurement); and inbound_refs matches a bare stem (requiring brackets or .md missed 4 real citations in the live dir and told the reader a cited memory had none — the false reassurance that precedes a delete). On-demand by design: no hook wires it (Ray, 2026-07-14 — revisit once the numbers show how they move), so unlike command-audit there is deliberately no settings.json entry to assert."
