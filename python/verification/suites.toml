[[suite]]
name = "workflow.renovate-re2-engine-assertion"
description = "#644: the `renovate_config_validate` hk step must keep asserting that renovate-config-validator is really using RE2 before believing its verdict. `re2` is an OPTIONAL npm dependency of renovate, and npm optional deps FAIL SILENTLY; when it is absent the validator warns 'RE2 not usable, falling back to RegExp' and **still exits 0** (renovate/dist/util/regex.js sets `RegEx = RegExp` on the catch path; config-validator.js only `logger.warn`s). That is the worst possible shape — the tool knows it is degraded but reports success, so hk, CI and any agent reading `rc` are all told the config is fine while every regex in renovate.json goes unchecked. Renovate compiles with RE2 at runtime, which has NO lookahead, lookbehind or backreferences, so a `customManagers.matchStrings` entry using one is valid JS RegExp and invalid Renovate config: measured on this host, `(?!latest)` in the apt manager's matchStrings produced 'Config validated successfully' rc=0 on the degraded engine and `Invalid regExp for customManagers` rc=1 with RE2 present. The local gate was therefore WEAKER than CI, which is the wrong way round. ⚠️ **The premise the issue was filed on was FALSE and the correction is owed here**: #644 assumed re2 was unavailable on this platform and proposed a repo-side blacklist of RE2-unsupported constructs. It builds fine on macOS arm64 — it was already installed, compiled, under npm-renovate/44.14.10 while the pin sat at 44.13.2, so the gap was an INSTALL-TIME miss, not a platform limit (both versions declare the identical `optionalDependencies: {re2: 1.26.1}`). Hand-rolling a construct blacklist would have reimplemented an engine we can actually run, which `.claude/rules/use-tool-builtins.md` refuses as a hard gate; the validation here is 100% the native tool and nothing in `renovate_validate.py` parses a regex. ⚠️ **The assertion is a CANARY, not a log-string sniff, and that distinction is the contract's point.** Grepping stderr for 'RE2 not usable' binds a MESSAGE: reword it upstream and the check silently becomes a no-op that can only pass — the exact failure class `probes-need-a-control-arm.md` exists to refuse, and unusually the check here is INVERTED, so a broken canary fails toward SILENCE. `engine_rejects_lookahead()` instead feeds the validator a config whose only flaw is a negative lookahead and REQUIRES a non-zero exit; a zero exit is the alarm. The gate thus carries its own control arm at runtime, is immune to rewording, and tests the capability rather than a symptom of its loss. It is also strictly stronger than a VERSION check, proven by accident on first run: `mise which` reported 44.14.10 while the shell's PATH still resolved the stale 44.13.2, so a `--version` assertion would have consulted the pin and said 'fine' while the process actually executing was blind — the canary tests the binary that RUNS. ⚠️ **Ordering is a safety property, not style**: the engine check runs BEFORE the real validation, because otherwise a degraded run prints a green line and the failure mode this module exists for is reported as a pass with a footnote; `test_degraded_engine_never_validates_the_real_config` binds it by asserting the real config is never even reached. The canary must stay genuinely RE2-invalid AND genuinely JS-valid — a merely malformed pattern would fail on BOTH engines, so the gate would report 'healthy' on a degraded one — and both halves are pinned (`test_canary_actually_contains_an_re2_unsupported_construct` binds the construct itself so a 'tidy-up' cannot neuter it; a JS-compile arm proves its only sin is the lookahead). Mutation-verified in both realistic directions with DIFFERING blast radii: dropping the lookahead from the canary fails 4 tests including the real-engine and CLI arms, while ignoring the engine verdict fails exactly the 2 degradation/ordering arms. Asserts the chain: hk.pkl shells out to `dotfiles-setup renovate-validate` (NOT the bare validator, whose rc cannot be trusted), main.py imports/registers/dispatches the subcommand, the module carries the canary constant plus both public functions, and the test file binds the neutering guard and the ordering guard. Tokens bind CALL SITES rather than definitions, since a definition could be satisfied by prose."
category = "workflow"
check_type = "static"
handler = "require_tokens"
paths_required = true
paths = [
    "hk.pkl",
    "python/src/dotfiles_setup/main.py",
    "python/src/dotfiles_setup/renovate_validate.py",
    "tests/test_renovate_validate.py",
]
per_path_tokens = { "hk.pkl" = ['renovate_config_validate"', 'dotfiles-setup renovate-validate"'], "python/src/dotfiles_setup/main.py" = ['from dotfiles_setup.renovate_validate import renovate_validate_main', '"renovate-validate",', '"renovate-validate": lambda'], "python/src/dotfiles_setup/renovate_validate.py" = ['RE2_CANARY_CONFIG:', 'def engine_rejects_lookahead(', 'def renovate_validate_main('], "tests/test_renovate_validate.py" = ['def test_canary_actually_contains_an_re2_unsupported_construct(', 'def test_degraded_engine_never_validates_the_real_config('] }

[[suite]]
name = "workflow.dag-tick-wiring"
description = "The launchd watchdog tick (#578) that recovers this repo's background-agent fleet from the outside. A `dev.mise.dotfiles-dag-tick` LaunchAgent fires `mise run dag-tick` every 60s: it censuses `claude agents --json --cwd <path> --all`, classifies every `kind:\"background\"` row ALIVE/DEAD/WEDGED/DONE/NEEDS_HUMAN/REPLY_QUEUED, and recovers with `claude respawn`/`claude stop`. **REPLY_QUEUED is the LIVE-pid half of the queued-reply split, and it exists because the v5 fix opened a v6 hole**: adding `queuedPrompt` to `is_needs_human` restored delivery for a DEAD node (DEAD -> RESPAWN consumes the prompt), but a node whose pid is still ALIVE fell through every branch to plain ALIVE — no action, and on a non-verbose tick no note, so the shape got LESS visible than before #601 touched it. The binary makes it reachable: 2.1.223's reply handler can persist `queuedPrompt` after an ENOCONN/ETIMEOUT while the worker pid is alive, and its UI says the reply waits for a restart. Its branch sits AFTER the DEAD check by position, so it can never divert the delivery path, and the contract binds both arms plus the predicate partition — `is_needs_human` and `is_reply_queued` must never both hold, since a node that is simultaneously 'never respawn' and 'waiting for a restart' is the contradiction that produced the v5 deadlock. Its action is LOG, not respawn: this watchdog only respawns a confirmed-dead process and the CLI refuses an already-running session, so a respawn would be a no-op reported as a recovery. **Making it visible IS the fix** — the failure being ended is silence. ⚠️ **`plan()` alone does NOT make the escalation safe — `execute_respawn` re-checks it too.** The #601 v4 adversarial review's HIGH finding: actions execute from the CLASSIFICATION snapshot, and that function used to re-read only the roster, so a node planned DEAD -> RESPAWN which acquired `state=blocked` + `needs` in between was respawned anyway — the exact loss #601 exists to prevent (demonstrated: snapshot_class=dead -> planned_action=respawn -> latest_class_before_execution=needs_human -> 'dag-tick: RESPAWN race1'). The window is real because a roster read is not instantaneous truth: a node absent from the roster counts as dead by this module's own negative-evidence rule while its process may still be running, and a running node is exactly what can write `needs`. The fresh re-check covers BOTH axes, and BOTH reads happen first with both decisions after — the window is closed not by a check existing but by its DISTANCE from the action, and it took two rounds to get right: with the state read first a roster read sat between the escalation check and the spawn ('RESPAWN race2'), then moving the escalation check last pushed the PID check behind the state read instead ('RESPAWN race3'). A check cannot be last if another also must be; reading both up front leaves neither guard with I/O between it and `Popen`. It is NARROWED, not closed: check-then-act against a file another process may write is irreducibly racy without a lock the harness does not expose, and the operator-facing reason says so rather than enforcing a false 'never'. An unreadable `state.json` at execution SKIPs (which makes the node silent, not retried — a persistently unreadable one classifies conservative-ALIVE next tick), and `node_from_state` is shared by both sites so they cannot disagree about the same file — the finding was a disagreement of exactly that shape, where only one of the two read `needs` at all. Both arms are bound (escalate-after-plan SKIPs; no-escalation still RESPAWNs), mutation-verified: deleting the re-check fails the race arm alone. ⚠️ **`execute_stop` now carries the SAME re-check, and that is #604 — the untouched mirror of the finding above.** It re-read only the roster, so a node planned DONE -> STOP that stopped being terminal in the window was stopped anyway; `claude stop` is live-proven to stop mid-activity (565.md), so the watchdog could terminate work a human had just resumed and persist `stopped` over it. Both routes out of terminal are human-reachable inside that window — a delivered reply flips the ledger to `done + active`, a failed delivery persists a `queuedPrompt` — and `is_terminal` denies both. Same shape as the respawn side, deliberately: `node_from_state` + `is_terminal` reused so the census path and the re-check cannot disagree about one file, BOTH reads first with both decisions after (the DISTANCE lesson applies unchanged), and an unreadable `state.json` SKIPs under the one rule both actions share — silent, not retried, and the asymmetry is worth naming rather than glossing: refusing to STOP leaves a process running, refusing to RESPAWN leaves a node unrecovered, and both are quiet. One arm per axis `is_terminal` reads (state, tempo, queuedPrompt) plus a still-terminal control arm, mutation-verified with DIFFERING blast radii: deleting the terminal guard fails the three axis arms alone, deleting the unreadable-state guard fails exactly one. The STOP reason is a golden literal for the same reason the needs-human one is — it must claim the re-check WITHOUT claiming the race is gone. **NEEDS_HUMAN (#601, decided as `docs/receipts/575.md` R3) is log-only and binds a THREE-TERM CONJUNCTION**: `state == \"blocked\"` AND a non-empty `needs` payload (`is_needs_human`, fed by `normalize_needs`) AND **no pending `queuedPrompt`**. The third term was missing until the v5 review raised it HIGH, and its absence was a defect this change INTRODUCED: the `needs` lifecycle, settled from the 2.1.223 binary, is that a delivered reply clears `needs`, but a FAILED delivery persists `queuedPrompt` while leaving `state=blocked` and `needs` intact — and `claude respawn` is what consumes that queued prompt and clears `needs`. So `blocked ∧ needs ∧ queuedPrompt` means the human ALREADY ANSWERED and suppressing the respawn strands the answer forever, logging NEEDS_HUMAN every 60s while nothing reports it. A watchdog that silently stops recovering is worse than one that over-recovers. `is_terminal` already refuses to settle a node with a pending `queuedPrompt` for exactly this reason (565.md), so the contract binds the AGREEMENT of the two predicates, not just each — the defect was them contradicting each other. Both halves are load-bearing in opposite directions, so the contract binds the call site rather than the definition, and pins both test arms. Drop the classification and an escalated node whose process died classifies DEAD -> RESPAWN, and #565 measured that `claude respawn` returns a node IDLE with no prompt — a zombie that never re-asks, discarding the `needs`/`suggestedReply` payload #575's R1 makes load-bearing for the tracker projection (mutation-verified: deleting the `classify()` wiring line fails 5 tests incl. the end-to-end arm). Drop the `needs` half instead and ALL blocked nodes stop respawning, silently retiring the watchdog's primary recovery path (mutation-verified: 18 failures). ⚠️ `--max-age` is a BACKSTOP, not the escalation safety mechanism: before #601 the 24h bound was the only thing standing between this host's two sessions blocked/dead since July 13 and July 22 and a wrong respawn, which is why `plan()`'s NEEDS_HUMAN arm is deliberately NOT age-gated and its test fixture is deliberately FRESH. NEEDS_HUMAN also out-ranks WEDGED, so an escalated node that is ALSO stalled would lose its stall visibility — `is_stalled` is therefore shared by `classify()` and the NEEDS_HUMAN note, which appends the stall fact rather than dropping it (pinned both ways: a stale fixture prints `ALSO stalled`, a fresh one must not). Note `is_stalled` and `_is_stale_dead` treat an unknown age in OPPOSITE directions on purpose — unknown age blocks a respawn (never resurrect what cannot be proven fresh) but does NOT report a stall (that would invent a stall out of an unreadable file). Projection and the `dag:needs-human` label stay the SCHEDULER's job (575 R1 keeps projection one-directional and scheduler-owned; a tick that labelled directly would put a second writer on the tracker) — this module names `NEEDS_HUMAN_LABEL` in its log line and stops there. ⚠️ **#602 SHIPPED that projection (2026-08-07), and this module still does not perform it** — `dotfiles_setup.dag_project` writes the label and the append-only comment from its OWN LaunchAgent on a 300s schedule, importing this module's predicates rather than the reverse. So an escalated node now reaches the tracker; it simply does not get there from here, and a tick that labelled directly would be the second writer 575 R1 forbids. The `_needs_human_reason()` clause 'tracker projection to dag:needs-human is NOT done here — #602' therefore stays TRUE and must NOT be edited on the strength of the projector existing: it is scoped to THIS process, and it is pinned by golden equality. Read the status in three parts, because two rounds of #601 review got it wrong in OPPOSITE directions: ownership is SETTLED (575 R1 assigns projection to the scheduler, one direction only — which is exactly why this tick must not emit the label), this label's spelling is SETTLED (575: '#573's receipt `dag:needs-human` — the receipt is later and governs'), and only the IMPLEMENTATION is pending, alongside what 575 genuinely defers: the general `dag:*` spellings, the comment format, and each stage's evidence contract. The #601 adversarial review raised both halves of the log wording as HIGH: it read 'never auto-respawned at any age (project + label dag:needs-human)', asserting a GLOBAL no-respawn guarantee this module cannot make (it binds this watchdog only — the harness's own supervisor reads state/tempo/`queuedPrompt`, never `needs`, and whether it fires for `blocked` is the unverified single-route claim #590 inherits) and a projection no code here performs. Both are now scoped ('never respawned BY THIS TICK', 'is NOT done here'), and the emitted reason is pinned by GOLDEN EQUALITY against a known-good literal in the test file — NOT by substring conditions, which is the correction rounds 2 and 3 forced: each defeated a substring-based check by adding a clause it did not constrain (the round-3 counterexample still satisfies the clause-level predicate today, and an honest paraphrase fails it). A substring guard cannot judge meaning, so tightening it is unwinnable; equality ends it, because any wording change fails and forces a human to re-read the claim. Both counterexamples are kept verbatim as pinned inputs, and the predicate's failure in BOTH directions is itself asserted so nobody over-trusts it — a log line naming an action the code skips is how an operator concludes an escalation reached the tracker when it reached a launchd log. Slice 1 deliberately ships WITHOUT automated stall recovery — WEDGED is classify-and-log ONLY, and automated recovery is #590; the contract binds `plan()`'s LOG-only WEDGED arm so a later slice cannot silently start acting on it without touching this contract. The fleet gate is NOT remote (`docs/receipts/565.md`): both faces of the `claude logs <fresh-bogus-id>` preflight exit rc=1, so `gate_status()` reads stderr TEXT, never the exit code — the same probe-verified predicate `565.md` established for the terminal-state check `is_terminal()` encodes (`state in TERMINAL_STATES AND tempo != \"active\" AND no queuedPrompt`). Background pid liveness is NOT in the census and often not in `state.json` either (the harness's own agent-view docs: a background session can appear \"even when its process has exited\") — the actual record is `~/.claude/daemon/roster.json`'s per-worker `pid` (`docs/research/kb/reports/agents/wf-dag-recovery.md` §3), read via `read_roster` + `background_pid_alive`; a node absent from a READABLE roster is real negative evidence (DEAD), while an unreadable/missing roster file is conservative ALIVE so a read glitch can never trigger a respawn. ⚠️ **A PID IS A SLOT, NOT AN IDENTITY — #593, and the roster carries the second half of the pair.** `kill(pid, 0)` alone lets a recycled PID read ALIVE forever, so a crashed node's respawn is suppressed indefinitely; #578's cold review raised it and #578 DEFERRED it, because at close-out the live roster's `workers{}` was EMPTY, the encoding could not be sampled, and a blind comparison risks false-DEAD -> double-respawn, which is strictly worse than a missed recovery. The encoding is now PINNED from a live sample (a disposable `--bg` node, read WHILE running): `procStart` is the literal `ps -o lstart=` string under `LC_ALL=C TZ=UTC`, byte-exact, and the comparison is exact string equality — the binary's one tolerance (a numeric-units escape for the alternate `procStartFt` encoding) sits behind a mode function that is a hard `return!1` in all three on-disk bundles (2.1.222/223/224, the `!0` arm probed and 0-for-3), and an `lstart` string is not numeric anyway. `background_pid_alive` mirrors the harness's OWN roster predicate, which reads this same `roster.json` in its GC path and keeps a worker only when `isProcessRunning(pid) && isSameProcessAsync(pid, entry.procStart)`. **The asymmetry is the safety property and it is bound in all three directions**: no recorded `procStart` -> pid liveness decides (the harness's own `isSameProcessAsync(pid, undefined) -> true`); an UNANSWERED or BLANK `ps` -> ALIVE, never a mismatch (its comparator is `actual === undefined || actual === recorded`, and a blank compared AS a reading differs from every recorded value, i.e. fails toward the respawn — so it is normalized in the reader AND re-tested at the call site); only a positively-read, DIFFERING value adds a negative. `PermissionError` still reads ALIVE in `pid_is_alive` and that is deliberate, not the other half of #593 left undone: the bundle ships TWO predicates over the same syscall — `isProcessRunning` (any throw -> dead) and `isProcessProvablyGone` (`return zt(t)===\"ESRCH\"` — EPERM is NOT gone) — and this module is the second, which is right for a caller whose DEAD branch RESPAWNS. The EPERM hazard is an IDENTITY failure rather than a liveness one, and the identity read closes it exactly where `kill` is blind: verified live on pid 1, where `os.kill(1, 0)` raises `PermissionError` while `ps` still answers with a start time days old, so a recycled PID landing on another user's process now reads DEAD. ⚠️ **`TZ=UTC` in the reader is LOAD-BEARING and is the one axis no self-comparison can catch**: every other test compares the reader against ITSELF, so an off-by-the-host-offset reader passes them all while mismatching EVERY real node — the roster's value is written by the CLI, not by us. It is pinned as a PROPERTY against an independent adjudicator, `ps -o etime=`, a duration that carries no timezone at all (measured on this UTC-5 host: the same live process reads `Fri Aug  7 14:12:08 2026` locally against a roster holding `Fri Aug  7 19:12:08 2026`). Mutation-verified with DIFFERING blast radii: deleting the identity wiring fails 4 (unit, live-default, classifier end-to-end, `execute_respawn` end-to-end), dropping the unanswered-`ps` guard fails 1, dropping `TZ=UTC` fails 2. ⚠️ **A `kind:\"background\"` census row DOES carry a `pid` on 2.1.224, and it is the WRONG process** — this module's docstring said \"never `pid`\" until #593 sampled a live node and measured census `pid: 30723` (`claude bg-spare`) against roster `pid: 30714` (`claude bg-pty-host`), its parent. Do NOT \"simplify\" the roster read away now that a pid is visible in the census: the roster's is the one the harness itself pairs with `procStart`. Encoding, both arms and the live sample: `docs/receipts/593.md`. The launchd block in `mise.toml`'s `[bootstrap.macos.launchd.agents]` is inert by design — nothing applies it implicitly, only a human running `mise bootstrap macos launchd-agents apply` (`.claude/rules/do-not.md`) — so a tracked entry cannot surprise CI or a fresh clone. ⚠️ **The classification is bound as a COMPLETE TRUTH TABLE, not as sampled cases, and that is the #601 close-out.** Six adversarial rounds produced three HIGH findings of one shape — a reachable combination nobody had enumerated (round 5: `blocked+needs+queuedPrompt+dead`; round 6: the same with `alive`), each made reachable by the previous fix. Patching cell-by-cell cannot terminate; enumerating does. `_CLASSIFY_TABLE` crosses the FIVE class-deciding axes exhaustively (state-class x needs x queuedPrompt x pid_alive x tempo = 64 rows), every expected value derived BY HAND from the intended semantics and then checked against the code rather than read off a run — a table transcribed from behaviour asserts only that the code does what it does. ⚠️ **`tempo` is the fifth axis because the FIRST version of this table got that wrong**: it pinned tempo='idle' and asserted in a comment, a commit message AND this contract that tempo 'only matters for WEDGED'. False — `is_terminal` requires `tempo != \"active\"`, so a terminal state with tempo='active' is NOT terminal and falls through to the liveness rules (which is the watchdog's PRIMARY recovery case, 565.md arm B6). No test could catch it because the test encoded the same wrong assumption; only asking 'is the axis list COMPLETE?' did. Age remains pinned at None, which keeps WEDGED unreachable, and that pin is asserted rather than assumed. THREE meta-tests keep the table honest, each closing a different way it can pass while proving nothing: coverage is computed from the axis lists so a new axis value FAILS instead of silently leaving cells unenumerated; the expected column must reach every class the table can produce; and — the one the first two missed — per-class CELL COUNTS derived independently from the predicates (DONE 4, NEEDS_HUMAN 4, REPLY_QUEUED 2, DEAD 28, ALIVE 26) constrain the MAPPING, since coverage plus diversity both pass on a table assigning each class once and ALIVE to the other 59 cells. The counts are hand-written literals, not computed from the module, so they reject a wrong mapping even when the code agrees with it. Asserts the chain: the mise task AND the launchd agent block exist with the load-bearing literal fields (the binary path, not the `mise` shell function launchd cannot exec), main.py's subparser registration and dispatch call site, the module's full public surface (classification, the env denylist, the fleet-gate/census reads, the lock, and the tick orchestrator), and the test file's coverage of the terminal-predicate table, the env-strip both directions, the three gate faces, lock contention, and the plan() table."
