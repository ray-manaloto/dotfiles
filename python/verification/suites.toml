[[suite]]
name = "workflow.classifier-axis-enforcement"
description = "Classifier axis-enumeration gate (#601 close-out, post-mortem fix A2/'Fix 7'). #601 spent four of its seven adversarial review rounds on ONE root cause found twice: an axis a sibling predicate at the same call site already consumed, but the author's enumeration omitted. Round 5/6 was `queued_prompt` — commit 1 wrote `is_needs_human(state, needs)` while `is_terminal(state, tempo, *, queued_prompt)` two functions above it already read it. Round 7 was `tempo` — the first truth table pinned `tempo=\"idle\"` and asserted in a code comment, a commit message AND this very contract that tempo 'only matters for WEDGED', which was false in all three (`is_terminal` requires `tempo != \"active\"`). ⚠️ **No test could catch either, because the test encoded the same wrong assumption** — the defect is in the enumeration itself, so a hand-declared axis list that omits an axis is SELF-CONSISTENT and passes everything. The only mechanism that catches it is DERIVING the list from the code, with the post-mortem's literal definition, chosen because it is signature-derivable with ZERO judgement: **the axes are the union of `classify()`'s parameters and every `Node` field read by any predicate it calls** (transitively — a predicate taking the whole node hides its reads one frame down). ⚠️ **An earlier draft of this description overclaimed the replay, and the correction is owed here as much as in the module**: it said applying the definition at commit 1 names `queued_prompt` AND `tempo` at once, killing rounds 5-7 before they start. A replay of four registry-provenance worlds shows `undeclared: queued_prompt`, `illegal_pin: tempo` and `table_missing` fire in THREE DIFFERENT worlds and never in one run. `undeclared` fires only where the entry is BORN at commit 1 - but 'applied at commit 1' presumes the gate pre-existed the branch, and in that world `derive_axes` already yields `queued_prompt` at `d070cb5`, one commit EARLIER, so the gate is SILENT at commit 1. `illegal_pin: tempo` cannot fire at commit 1 at all, because there was no pin and no table until commit 8. What actually happens is a better result than the one claimed: the axis is named when the gate is ADOPTED, and from there the chain is `table_missing` forcing the table to EXIST -> `test_classify_truth_table_axes_match_the_registry` binding `frozenset(_AXIS_VALUES) == spec.axes` -> the declared `needs` forcing a `needs` column -> the round-5/6 cell enumerated at commit 1. A headline that overstates its own replay is the failure class this branch exists to fix. `classifier_tables.py` is modelled on `bash_budget.py` — a declarative REGISTRY, a pure `find_violations(repo_root)`, a thin `classifier_axes_main` CLI entry, and a `stale` kind so the map cannot rot after a rename. SEVEN violation kinds, and the second one is NOT redundant with the first: `undeclared` (the code reads an axis declared neither crossed nor pinned — the round-5/6 defect); `illegal_pin` (an axis PINNED although the code lets it decide a class the table does not declare out of scope — the round-7 defect, and the shape `undeclared` structurally MISSES, because an author who thinks of `tempo` and pins it on a false premise satisfies the enumeration check; the premise itself is derivable, so `_gated_classes` derives it — `tempo` flows into `is_terminal`, which gates DONE, which the table does not exclude, while `state_age_s`/`stall_after_s` flow only into `is_stalled`, which gates the WEDGED the table asserts unreachable); `phantom` (a declared axis nothing reads any more); `stale` (module/function gone); `table_missing` (the declared truth-table symbol is absent, so the axes guard nothing — commit 1 had no `_CLASSIFY_TABLE` at all, and Fix 7's stated value is forcing the table to EXIST at commit 1). Two more were added by a cold cross-family review that reproduced a HIGH against the derivation engine itself: `unresolved_subject` (the classifier hands the subject OBJECT to something this module cannot read — an imported predicate, a method, a builtin — or stores it in a binding the walk cannot model, so the derived set is a LOWER BOUND, not an enumeration), and the WITHHOLDING of `phantom` whenever that fires. ⚠️ **The reviewer's finding was not that aliasing is missed — it is that derivation emitted the OPPOSITE signal.** Adding one line, `n = node`, to the commit-1 fixture and rewriting `node.state` to `n.state` (an edit a reviewer waves through as 'shorter name below') made `derive_axes` report the axes as ['pid_alive','stall_after_s','state_age_s'] and raise a `phantom` instructing the author to DELETE the `queued_prompt`/`tempo`/`state`/`needs` declarations #601 exists to install. An author who complies strips the protection while the gate applauds; a miss is a gap, a confidently inverted instruction is a trap, and it landed on the fixture that IS the motivating defect. `_subject_aliases` now propagates subject-hood to a fixpoint through the binding forms it can PROVE (bare rebind, chained targets, literal-tuple unpack, annotated assignment, walrus, ternary/boolop operand) and enumerates in its docstring the ones it cannot (unpack from a non-literal, an unannotated call returning the subject, container/attribute storage, for/with binding, global/nonlocal); `_check_binding` and `_follow` catch that complement by reporting any subject flow they cannot follow, so the uncovered forms fail LOUD instead of quietly. `phantom` is withheld under any unresolved flow because it is the only kind that instructs a DELETION, i.e. the only one whose false positive destroys protection rather than wasting time — 'declared but unread' is sound only when the walk saw everything, while `undeclared` and `illegal_pin` stay live because an incomplete walk can only under-report and both fail safe. Control-armed in both directions: the aliased fixture now derives an axis set and a `gated_classes` map BYTE-IDENTICAL to the un-aliased control (equality, not merely 'phantom is gone' — a walk that found nothing and stayed quiet would satisfy the weaker claim); `_CROSS_MODULE_SOURCE` raises `unresolved_subject` while the same predicate defined locally (`_TRANSITIVE_SOURCE`) is clean; a readable walk still reports a real `phantom`; `x = node.state` is NOT treated as a store; and both shipped classifiers resolve completely, asserted by `test_the_real_registry_resolves_completely`. ⚠️ **The gate is one half of a PAIR and is worth little alone.** `tests/test_dag_tick.py` derives its axis NAMES from this registry (`_AXIS_VALUES` / `_PINNED_AXES`, bound by `test_classify_truth_table_axes_match_the_registry`) instead of restating them as local literals, which is what it did until v7 and is precisely how a real axis went missing from BOTH the code's enumeration and the table's. That fourth meta-test is the one the existing three structurally could not be: coverage, class-diversity and the per-class counts all judge the table AGAINST ITSELF, so every one of them passes on a table that is internally perfect and externally short a column. Column ORDER is asserted separately because three of the five axes share the values `(False, True)`, so a swap among them is undetectable by the cross product. Mutation-verified in BOTH directions, with recorded output: the real commit-1 source at `e9da8cb` (an OMITTED PARAMETER, not a rename — a rename leaves the original as a substring and makes substring checks no-ops) fails naming `queued_prompt`; a registry with `tempo` deleted fails naming `tempo`; a registry with `tempo` NAMED but pinned on round 7's false premise fails `illegal_pin` (it PASSED before that kind existed — the arm is what motivated it); the round-7-era 4-axis table from `eda53d6` fails the new meta-test naming `tempo`; a genuinely NEW field read (`node.suggested_reply`) fails `undeclared` through the real CLI; and HEAD with the shipped registry passes rc=0. ⚠️ Known blind spots, stated rather than papered over: the gate is a CONSISTENCY check between a declaration and the code's actual reads, so it cannot invent an axis NO code reads; it is blind to VALUES (it names `state` as an axis, never that `blocked` vs `done` vs `None` are the distinct cases); and it is blind to TEMPORAL defects — #601 round 4's classify->execute race is not a cell in any state table and no enumeration would have found it (the post-mortem's Q-FRESH brief question covers that, not this gate). Asserts the chain: the hk step shells out to `dotfiles-setup classifier-axes`, main.py registers the subcommand AND dispatches it, the module carries the derivation + all seven kinds + the registry entry for `dag_tick:classify`, the tests bind both arms of every kind, and the truth table binds its axes to the registry rather than restating them. Tokens bind CALL SITES, not definitions, wherever a definition could be satisfied by prose. ⚠️ **A SIXTH kind, `unlisted`, is what makes the registry GROW — and it is the one `bash_budget` has and the first version of this gate lacked.** Five kinds that all presuppose an entry cannot see a classifier nobody registered, so the gate would have guarded exactly one call site forever; that was the standing objection to Fix 7 and it was correct. `classifier_shaped()` identifies a classifier as *a function whose return annotation names an enum defined in the SAME module* — measured across all 48 modules in `python/src/dotfiles_setup`: **3 hits, all three real classifiers, ZERO false positives** (re-measured 2026-08-07; it was 2 across 45 when this gate was written). ⚠️ The original two were both named `classify`, and this description used to SAY so — a fact that invited reading the predicate as recognising that name. The third hit retires it: `codex_verdict.edge_for` is not named `classify` and is found anyway, because the only thing tested is whether the return annotation names an enum defined in the SAME module. Deliberately narrow: it does NOT match on name, parameter shape, or an imported enum, since a predicate that misfires on ordinary functions would be worse than none. **It immediately found `branch_guard:classify`, a real second classifier with no truth table at all** — now registered as the second entry, with `_COMBINED_TABLE` (3 code-classes x 2 fact-count = 6 cells) built for it. Enumerating it found **TWO cells the previous 7 SAMPLED cases never wrote down** (`code=1 with the exact count`, and `code=128 with the exact count`); neither is a defect, but unenumerated is the state #601's three HIGH findings lived in. `branch_guard.classify` is SUBJECTLESS (`subject_param=None`) — no dataclass, its axes ARE its parameters — and both are crossed as the FINITE PARTITION the code actually reads rather than their raw types: `code: int` is compared against exactly two values so it has three equivalence classes, and `lines: list[str]` is asked exactly one question (`len(lines) == _COMBINED_FACT_COUNT`) so it is a BOOLEAN. Neither is pinned, because both are finitely modellable and pinning a modellable axis is the move `illegal_pin` exists to refuse. That boolean projection is itself ARMED by `test_wrong_fact_count_is_a_single_equivalence_class`: four different non-exact lengths (0, 1, 2, 4) must all answer FALL_BACK, because if any did not, the projection would be hiding a real axis — the #601 defect wearing a different hat. ⚠️ Registering it also forced a REAL FIX to the gate: `branch_guard.classify` returns via a TERNARY (`RESOLVED if len(lines)==N else FALL_BACK`), and requiring a bare `return Enum.MEMBER` made `_gated_classes` return an EMPTY map for it — and an empty map makes every pin vacuously legal, so `illegal_pin` would have failed OPEN on the very second classifier registered (the branch reader now walks INTO the return expression, and `_ternary_tests` feeds the ternary's own condition in, so `lines` gates {RESOLVED, FALL_BACK} instead of nothing). Its docstring's claim that the `code==0 with a wrong line count` case 'cannot be produced by any real git' is an UNENFORCEABLE claim about an external tool — no file:line can enforce it — and was probed across 7 real git states on 2.50.1 (control-armed: a missing dir gives rc=128/0 lines, a created one rc=0/3): no state produced rc=0 with a line count != 3, so the claim is empirically supported but rests on nothing in our code, and the cell is enumerated anyway because the branch exists precisely to survive a future git that breaks it. Note line count and rc vary INDEPENDENTLY in reality (unborn HEAD returns 2 lines with rc=128), which is why the pair really is two axes. ⚠️ **`illegal_pin` was then CONVICTED of exactly what it convicts others of.** An adversarial pass measured all SEVEN return shapes, each pinning `tempo` on round 7's literal false premise under the shipped `table_excluded_classes={\"WEDGED\"}`: **four of the seven ALLOWED the pin.** Control arm: a bare `return K.DONE` under an `if` DENIES it, so the probe discriminates. The kill is `if tempo == \"active\": return WEDGED` / `else: return DONE` - round 7's own premise written with an `else` - because the branch reader read `body` and never `orelse`, crediting `tempo` with the excluded WEDGED alone. A `match` classifier had zero `ast.If` nodes; `verdict = K.DONE; return verdict` resolved to no member; a predicate reached as `_h.term(node)` was skipped by the `isinstance(call.func, ast.Name)` guard. Each yielded an EMPTY gate map, and an empty map makes every pin vacuously legal - so the gate's headline claim survived exactly one syntactic rearrangement of the code it was derived from. Fixed by READING what can be read and FAILING CLOSED on what cannot: `_decision_at` unions `body` and `orelse` and reads `ast.Match` (subject plus case guards gate the union of all case bodies); `_class_holding_locals` resolves a local assigned an enum member, to a fixpoint; `_ClassNames` tells `NodeClass.DONE` from `node.tempo` by module-local enum name (both are `Attribute(value=Name)`, and taking every one as a class is why a probe reported an AXIS among the CLASSES, `tempo_gates=['DONE','LIVE','tempo']`); and `_unreadable_returns` makes ANY unresolvable return - plus any `unresolved` subject flow - refuse EVERY pin instead of granting them. All seven shapes now refuse. ⚠️ The control arm keeping this from being a check that can only DENY is `test_the_shipped_pins_are_still_allowed`: `state_age_s`/`stall_after_s` gate only the excluded WEDGED and their pins survive every tightening. Five realistic mutations were run (delete the WIRING, never rename the function): dropping `orelse` fails 2 tests, removing the `ast.Match` arm 1, deleting the fail-closed blocker 2, disabling local resolution 1, reverting `table_missing` to a substring test 1. ⚠️ That fourth arm initially PASSED - shape E was refused via the fail-CLOSED path, the right answer for the wrong reason - so `test_a_local_assigned_a_class_is_resolved_not_merely_failed_closed` asserts the MECHANISM (`unreadable_decisions` empty, `tempo` gates exactly DONE) rather than the verdict. ⚠️ `table_missing` was ALSO a plain substring test: a file whose entire content was a COMMENT naming `_CLASSIFY_TABLE` satisfied it (control-armed - deleting the mention fired the violation), the same unanchored-substring shape #601's v1 review filed against `per_path_tokens`, reproduced inside the gate written to answer that review. `_binds_symbol` now requires a real ASSIGNMENT. SUSPECT settled: `command_audit.classify()` returns `str` and its module defines NO enum, so `classifier_shaped` correctly does not flag it and the '0 false positives' claim stands. ⭐ **THE GATE THEN PROVED ITSELF ON A CLASSIFIER NOBODY WROTE IT FOR.** #611 was branched before #580/#613 landed; on the merge, `unlisted` immediately named `codex_verdict:edge_for` — a real third classifier that shipped on `main` AFTER this module was written, with a truth table (`_EDGE_TABLE`) that already existed but was bound to NOTHING. That is the standing objection to Fix 7 ('it will guard exactly one call site forever') answered by measurement rather than by argument: the registry grew without being asked. `edge_for` is SUBJECTLESS like `branch_guard.classify`, and its `rework_count`/`max_rework` are two PARAMETERS asked ONE question (`rework_count >= max_rework`), so both are crossed as the two sides of that single boolean — armed by `test_the_rework_bound_is_a_single_equivalence_class`, which asserts no two numbers on the same side disagree AND (the control arm, without which the first assertion is vacuous) that the table really writes down both sides for every verdict. `Edge.NONE` is the one class declared out of scope, and that declaration restates an assertion the table already makes rather than granting a licence on trust. ⚠️ Registering a SECOND subjectless classifier also broke a token, and #397's uniqueness audit caught it rather than a test: `subject_param=None,` now matches TWICE, so either entry could stand in for the other and deleting one would leave the contract green — the exact #394 shape. It is replaced by `if spec.subject_type is None:`, which binds the MECHANISM that makes subjectlessness work instead of one of two interchangeable declarations of it, and which no registry entry can satisfy by proxy."
