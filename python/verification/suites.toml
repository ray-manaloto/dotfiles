[[suite]]
name = "ci.push-to-main-skips-build"
description = "Push-to-main must skip the heavy rebuild path. Since Phase B (#118) the build chain (base-prep → p2996-prep → build → smoke-test) lives in the reusable build-publish.yml and is invoked by a single 'build-publish' caller job in ci.yml; that caller carries the push-to-main skip clause '(github.event_name != \"push\" || github.ref != \"refs/heads/main\")' (parenthesized because it also gates on the path-filter && needs.changes.outputs.build == 'true'). Promote job retags the PR's image instead. This checks for the clause as a sub-expression rather than a bare 'if:'."
category = "ci"
check_type = "static"
handler = "require_tokens"
paths = [".github/workflows/ci.yml"]
per_path_tokens = { ".github/workflows/ci.yml" = ["(github.event_name != 'push' || github.ref != 'refs/heads/main')"] }

[[suite]]
name = "ci.ci-gate-aggregator-exists"
description = "Branch protection requires the always-run `ci-gate` aggregator (not the path-gated `build-publish / smoke-test`, which produces no check run on non-build PRs and would block them). ci-gate must `needs` the upstream jobs, run `if: always()`, and fail unless each result is success or skipped — preserving auto-merge safety while unblocking non-build PRs (#119)."
category = "ci"
check_type = "static"
handler = "require_tokens"
paths = [".github/workflows/ci.yml"]
per_path_tokens = { ".github/workflows/ci.yml" = [
    "  ci-gate:\n    needs: [lint, contract-preflight, changes, build-publish]\n    if: always()\n",
    "needs.build-publish.result",
    "success|skipped",
] }

[[suite]]
name = "ci.promote-job-exists"
description = "Push-to-main must trigger the promote job (manifest-only retag of the PR image as :dev/:latest, no rebuild). Direct-push fallback dispatches workflow with force_dev_tag=true."
category = "ci"
check_type = "static"
handler = "require_tokens"
paths = [".github/workflows/ci.yml"]
per_path_tokens = { ".github/workflows/ci.yml" = [
    "promote:",
    "docker buildx imagetools create",
    "associatedPullRequests(first:1) { nodes { number } }",
    "-f force_dev_tag=true",
] }

[[suite]]
name = "ci.p2996-prep-job-exists"
description = "p2996-prep job must compute the content-hash via dotfiles-setup p2996-hash and probe ghcr.io for ':p2996-<hash>' before triggering the build; the build job consumes the artifact as a digest-pinned p2996-export named context (#160 T11). Cache hit short-circuits the ~80–120 min clang compile. Lives in the reusable build-publish.yml since Phase B (#118)."
category = "ci"
check_type = "static"
handler = "require_tokens"
paths = [".github/workflows/build-publish.yml"]
per_path_tokens = { ".github/workflows/build-publish.yml" = [
    "\n  p2996-prep:\n",
    "hash=$(uv run --project python dotfiles-setup p2996-hash)",
    "docker manifest inspect",
    "targets: p2996-cache",
    "dev.contexts.p2996-export=docker-image://",
    "dev.contexts.devcontainer-base=docker-image://",
] }

[[suite]]
name = "ci.dev-prep-gate-exists"
description = "The third-tier dev-image content-hash gate (#122) must exist: a dev-prep job probes ':dev-<hash>' (via dotfiles-setup dev-hash) to skip build+smoke on an unchanged image, and a dev-tag job pushes the ':dev-<hash>' marker ONLY after smoke-test passes (validated-marker invariant — what makes the probe-skip safe). Lives in the reusable build-publish.yml (Phase B / #118)."
category = "ci"
check_type = "static"
handler = "require_tokens"
paths = [".github/workflows/build-publish.yml"]
per_path_tokens = { ".github/workflows/build-publish.yml" = [
    "dev-prep:",
    "hash=$(uv run --project python dotfiles-setup dev-hash)",
    "dev-tag:",
    "needs.smoke-test.result == 'success'",
] }

[[suite]]
name = "ci.p2996-ref-dispatch-wired"
description = "Phase D (#120): the p2996_ref override must stay wired in build-publish.yml — inputs.p2996_ref resolves into CLANG_P2996_REF (a 'Resolve p2996 ref override' step) so BOTH the content hash AND docker bake's variable override track the same upstream SHA — never poisoning the canonical pinned-ref cache. Empty override => the committed docker-bake.hcl pin is authoritative. The dispatch-build.yml repository_dispatch caller was RETIRED 2026-07-07 (zero lifetime runs; resurrect from git history) — this contract now guards only the reusable-workflow side that makes resurrection possible."
category = "ci"
check_type = "static"
handler = "require_tokens"
paths = [
  ".github/workflows/build-publish.yml",
]
per_path_tokens = { ".github/workflows/build-publish.yml" = [
  "inputs.p2996_ref != ''",
  "CLANG_P2996_REF=${P2996_REF}",
] }

