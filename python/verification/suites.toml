[[suite]]
name = "workflow.lock-integrity-wiring"
description = "Lockfile platform-coverage gate (#370, jdx/mise#7700). A whole-file re-lock re-resolves for the platform it runs on, and macOS mise cannot write linux-x64 conda entries — so it strips the conda entries the linux/amd64 devcontainer needs. Measured 2026-07-29 on mise 2026.7.16, REAL writes hash-compared against the committed bytes: bare `mise lock` with every tool installed and NO config change took conda entries 962 -> 427 and linux-x64 628 -> 80; `mise install biome` (an aqua binary with no conda relationship) 962 -> 417 / 628 -> 80; only the scoped `mise lock biome` held at 962/628. The first conclusion this session published was the opposite, resting on `mise lock --dry-run` — which prints 'would update <tool> for linux-x64' across all 11 platforms and changes nothing, so it can only reassure; a dry run is not a control arm for a write, and mise's own --help ('updates all platforms already specified') is a claim, not evidence. Hence three things this contract binds: `mise run lock` REFUSES the bare form and locks only named tools (safe by construction, not merely documented as dangerous); an undeclared tool name is rejected before shelling out, because `mise lock <unknown>` exits 0 having done nothing (a silent no-op that an exit code cannot distinguish from success — the same trap fires on a short name standing in for a backend-qualified key); and the gate checks the ARTIFACT against HEAD rather than guarding any command, since `auto_install = true` lets any task reach the re-lock path. It is a REGRESSION check, not floor counts, so adding/removing/bumping a tool stays silent. NOT redundant with workflow lock-coverage/test_lock_coverage.py: through the damage the `[[tools.*]]` block count never moved (226 -> 226), so a tool-level check passes on a damaged lock — what vanished was 548 conda lines. Asserts the chain: hk step, the `mise run lock` wrapper, CLI subcommands, module (both finding kinds, the refusal, the undeclared-name guard, and the call sites wiring them together), tests (both arms, since the observed failure exercises only the conda one), and the evidence doc."
category = "workflow"
check_type = "static"
handler = "require_tokens"
paths_required = true
paths = [
    "hk.pkl",
    "mise.toml",
    "python/src/dotfiles_setup/main.py",
    "python/src/dotfiles_setup/lock_integrity.py",
    "tests/test_lock_integrity.py",
    "docs/rules-evidence/local-devcontainer-first.md",
]
per_path_tokens = { "hk.pkl" = ['mise_lock_integrity"', 'dotfiles-setup lock-check"'], "mise.toml" = ['dotfiles-setup lock-tools'], "python/src/dotfiles_setup/main.py" = ['"lock-check",', '"lock-check": lambda', '"lock-tools": lambda'], "python/src/dotfiles_setup/lock_integrity.py" = ['def regressions(', 'def check_lockfiles(', 'def scoped_lock_main(', 'regressions(committed, path.read_text())', 'declared_host_tools(repo_root)'], "tests/test_lock_integrity.py" = ['def test_conda_platform_loss_is_reported(', 'def test_tool_platform_loss_is_reported(', 'def test_bare_lock_is_refused('], "docs/rules-evidence/local-devcontainer-first.md" = ['jdx/mise#7700'] }

[[suite]]
name = "workflow.doctor-wiring"
description = "Project doctor (#418): the declared setup vs reality on this host. Every other gate in this repo reads the working tree, so all of them were blind to the three defects that motivated it — context7 MCP interpolating `${CONTEXT7_API_KEY:-}` against an exec-only fnox secret and therefore running ANONYMOUS while reporting connected; fnox's `env = \"exec\"`, its 3 opt-ins and 49 sync blocks sitting one `bootstrap-config` run from a wipe, because the generator emits provider+value only; and the filesystem server's declared one-directory scope being inert, since MCP Roots REPLACE a server's own arguments (measured, from the server's own startup line: 'Client does not support MCP Roots, using allowed directories set from server args'). Deliberately NOT an hk step and NOT a CI job: it reads ~/.config/fnox and ~/.claude, which a runner does not have, so a SessionStart hook is the only place it can run — and it always exits 0 (`--strict` opts into a non-zero) so it can never disrupt a session, with a crashed check recorded to the error log AND surfaced rather than swallowed (#343's lesson: a fail-open nobody records is indistinguishable from enforcement). The `${VAR}` check's oracle is the doctor's OWN environment rather than a reading of fnox semantics, because the doctor is a child of the process that spawns the servers; fnox is consulted only to explain the absence. Control arms on the live host 2026-07-29: EXA_API_KEY PRESENT (env = true) vs CONTEXT7_API_KEY and AWS_SECRET_ACCESS_KEY absent (exec-only), so the probe discriminates. The live arm is off the per-session path by decision (a spawn per server is real latency for rare drift) and its docstring states what it CANNOT see: a standalone spawn negotiates no roots, so reading its one-directory answer as the session's scope is exactly the false negative the issue was filed over. Version-currency is DELEGATED to the shared kb_setup.currency engine, not re-implemented; the doctor asserts the delegate is both wired AND importable — the gap workflow.tool-currency-wiring cannot see, since a text grep proves the hook is written, not that it can run. FOLLOW-UP (#418b) closed the collection gap that cost the first version its own defect class: it read only .mcp.json plus the enabled-plugin configs, so check_mcp_duplicate reported PASS while `context7` and `filesystem` were EACH registered twice — once in ~/.claude.json as a stale `mde-mcp-*` wrapper, once by the plugin / .mcp.json. A check that compares registrations was blind to half of them. Nor was it cosmetic: a same-name user-global entry SHADOWS the project one, so the broken wrapper won and `claude mcp list` stopped showing the project's filesystem server at all. Collection now covers all four sources, and health is DELEGATED to `claude mcp list` — the harness's own view, which also reaches surfaces this module cannot read statically (13 claude.ai cloud connectors) and reports authentication state. It has no --json (probed), so the text parser is pinned by a fixture of real captured output; that fixture immediately caught a live bug, since a name may contain colons (`plugin:context7:context7`) and the first regex silently DROPPED that row — and a dropped row is a server reported healthy. Two wording rules keep the output worth reading: `Server.repo_owned` scopes the fix-this-repo checks to what the repo declares (the MCP_DOCKER gateway alone produced 32 findings about tools it neither owns nor can fix), and a consent state (Pending approval / Needs authentication) is worded as waiting-on-you rather than broken. Asserts the chain: the declarative baseline, the mise task, the SessionStart wiring, its hook_selfcheck gate, CLI subcommand + handler, module (all four collection sources, registration tuples, runner, fail-open recorder, the list parser), and tests binding both arms plus the registration call site itself."
