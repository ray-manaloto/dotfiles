ker, so a rework relaunch into a dirty run dir is reaped INSTANTLY, before the new run writes anything; verdict.processed.json is cleared for the sibling reason, since the CAS reads 'no verdict.json but a verdict.processed.json' as ALREADY_PROCESSED — a no-op edge — so a failed round 2 would report nothing instead of escalating. (2) lane.log carries LAUNCHER writes ONLY, never codex's stdout: the gate is a substring test, so a model that types 'EXIT: 0' mid-reasoning would settle its own lane and hand the reaper a half-written verdict. That is why `run_codex` does not capture output — it leaves it on the launcher's stdout where launchd logs it. ⭐ THE FAILURE PATH SETTLES TOO. A launcher that died between writing lane.json and recording an exit leaves the lane in_progress with no settled signal: NOT_SETTLED, a no-op edge, on every tick forever, watched by nobody. The handler catches BaseException rather than Exception deliberately — a Ctrl-C mid-launch leaves exactly the same invisible lane as an OSError, and 'the operator interrupted it' is not a reason for a node to go quiet forever — and re-raises immediately so nothing is swallowed. This converts a launcher crash into file_missing -> needs_human, the same inversion #580 chose for OMC's two warning defaults, applied to the producer. The CLI returns 0 whenever the lane was launched AND settled even when codex exited non-zero, because the launcher's job is a settled lane and what it MEANT is the reaper's to decide; surfacing codex's rc would make a supervisor read a correctly-escalated lane as a launcher failure, and the obvious response is a retry that double-launches into a run dir the reaper may already hold. ⭐ AND AN END-TO-END ARM THAT COSTS CREDITS: tests/test_codex_lane_e2e.py runs the real launcher, the real `codex exec` and the real reaper, gated behind the codex_exec marker that pytest.ini deselects by default (the same shape as image_exec). It exists because every #580 test passed on FIXTURES THAT WROTE THE ARTIFACTS THE CODE READS — a closed loop touching nothing real, `probes-need-a-control-arm.md` rule 8, arm the FIXTURE. Exactly one question survives substituting the codex process, and only a real call answers it: does --output-schema actually make the provider return a payload this contract accepts. Its schema arm is control-armed with a knowingly-invalid schema that must FAIL, so a codex build that stopped validating --output-schema cannot leave it green. ⭐ AND IT SPENDS THE BUDGET (#616), which re-crosses a boundary #613 drew on purpose and is therefore justified in writing rather than assumed. #613 stopped the producer DESTROYING #573's counter and left incrementing to 'the supervisor'; nothing was the supervisor — `reap_codex_lanes` only PRINTS the edge and its own string says so — so the count carried forward unchanged forever, `rework_count >= max_rework` never tripped, and the budget was written, read, bounded against and unspendable. Two reasons the producer owns it, and the second is the durable one: the supervisor does not exist (control-armed: no sched/relaunch/tracker/project module in the package, while codex_lane, codex_verdict and dag_tick all match the same ls), and NO OTHER COMPONENT CAN DO IT CORRECTLY — the evidence is the previous round's verdict.processed.json, whose whole lifetime is the window between the reap that renamed it and the clearing loop three lines below, and `prepare_lane` holds the reaper's flock across both ends of that window. An external incrementer would read that file OUTSIDE the lock and hand the value back: a read-modify-write split across a lock boundary, precisely the race the #613 review found in the clearing loop. ⚠️ THE ORDER IS THE MECHANISM: the increment reads one of the files the clearing loop unlinks, so reading FIRST is what charges the round and clearing SECOND is what makes charging it idempotent — no flag, nothing to remember. Moving it below the loop is the obvious tidy-up (both touch the same directory)