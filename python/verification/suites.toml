[meta]
version = "2"

# =============================================================================
# Build Constraints (~15) — Dockerfile structure and correctness
# =============================================================================

[[suite]]
name = "build.no-custom-mise-data-dir"
description = "MISE_DATA_DIR must be the canonical cookbook system path (/usr/local/share/mise). Review finding [20] 2026-07-07: the old forbid+ENV-allowlist form was fully vacuous (ENV is exactly how the var is set); the image DOES set it deliberately (mise Docker cookbook), so the honest contract asserts the expected value instead."
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = ["MISE_DATA_DIR=/usr/local/share/mise"]

[[suite]]
name = "build.mise-install-path-system"
description = "Base image should install the mise binary system-wide"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = ["MISE_INSTALL_PATH=/usr/local/bin/mise"]

[[suite]]
name = "build.no-custom-mise-cache-dir"
description = "Base image should rely on default cache locations instead of custom MISE_CACHE_DIR"
category = "build"
check_type = "static"
handler = "forbid_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = ["MISE_CACHE_DIR="]

[[suite]]
name = "build.home-not-root"
description = "HOME must not be /root in tools or devcontainer stage"
category = "build"
check_type = "static"
handler = "regex_forbid"
paths = [".devcontainer/Dockerfile"]
pattern = '^\s*ENV\s.*HOME=/root\b'

[[suite]]
name = "build.no-warning-suppression"
description = "Never suppress mise warnings"
category = "build"
check_type = "static"
handler = "forbid_tokens"
paths = [".devcontainer/Dockerfile", ".github/workflows/ci.yml"]
tokens = ["MISE_QUIET", "MISE_LOG_LEVEL=warn", "MISE_LOG_LEVEL=error"]

[[suite]]
name = "build.no-stderr-suppression"
description = "No blanket stderr suppression (2>/dev/null) except mise trust"
category = "build"
check_type = "static"
handler = "forbid_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = ["2>/dev/null"]
allowlist = ["mise trust", "\\$MISE trust"]

[[suite]]
name = "build.cache-mount-sharing-locked"
description = "All cache mounts must use sharing=locked"
category = "build"
check_type = "static"
handler = "regex_forbid"
paths = [".devcontainer/Dockerfile"]
pattern = '--mount=type=cache(?!.*sharing=locked).*target='

[[suite]]
name = "build.no-mise-data-cache-mount"
description = "Custom mise data dir must not be a cache mount (tools vanish from image)"
category = "build"
check_type = "static"
handler = "regex_forbid"
paths = [".devcontainer/Dockerfile"]
pattern = 'target=.*/mise/installs?[,\s]'

[[suite]]
name = "build.buildkit-syntax"
description = "BuildKit syntax directive required on first line"
category = "build"
check_type = "static"
handler = "regex_match"
paths = [".devcontainer/Dockerfile"]
pattern = '^#\s*syntax=docker/dockerfile'

[[suite]]
name = "build.openssh-not-in-base"
description = "openssh-server must not be in base Dockerfile (overlay only)"
category = "build"
check_type = "static"
handler = "forbid_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = ["openssh-server"]

[[suite]]
name = "build.amd64-platform-wired"
description = "R3 AMD64: devcontainer must build and run as linux/amd64/v2 x86_64. Required tokens: --platform=linux/amd64/v2 in devcontainer.json build.options (Dockerfile build arg). Runtime arch is additionally verified by `mise run verify-arch` via docker image inspect + uname -m + arch, which runs as part of verify-local. See AGENTS.md SSH Requirements section (R3)."
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/devcontainer.json"]
tokens = [
    "--platform=linux/amd64/v2",
]

[[suite]]
name = "build.amd64-platform-wired-mise"
description = "R3 AMD64: mise.toml lifecycle tasks (up/pull/verify-image) must export DOCKER_DEFAULT_PLATFORM=linux/amd64/v2 to match devcontainer.json build.options. PR #86 missed these three task envs and shipped a split-brain (devcontainer.json said /v2, mise tasks said v1). This contract prevents the regression."
category = "build"
check_type = "static"
handler = "require_tokens"
paths = ["mise.toml"]
tokens = [
    "DOCKER_DEFAULT_PLATFORM = \"linux/amd64/v2\"",
]

[[suite]]
name = "build.ssh-r1-inbound-wired"
description = "R1 INBOUND: ssh ${USER}@localhost -p 4444 opens a shell in the container. Requires: (1) the ghcr.io/devcontainers/features/sshd feature (provides openssh-server, internal port 2222 hardcoded); (2) appPort mapping ${DEVCONTAINER_SSH_PORT}:2222; (3) postCreateCommand copies /tmp/dotfiles-host-state/authorized_keys into ~/.ssh/authorized_keys. DO NOT DROP — see AGENTS.md SSH Requirements section and .omc/plans/session-2026-04-09-ssh-rewrite.md."
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/devcontainer.json"]
tokens = [
    "ghcr.io/devcontainers/features/sshd",
    "${localEnv:DEVCONTAINER_SSH_PORT}:2222",
    "authorized_keys",
]

[[suite]]
name = "build.ssh-r2-outbound-native-docker-desktop-wired"
description = "R2 OUTBOUND: ssh -T git@github.com inside the container reaches the host launchd SSH agent via Docker Desktop's native /run/host-services/ssh-auth.sock magic socket. Requires: (1) devcontainer.json bind-mounts /run/host-services/ssh-auth.sock; (2) containerEnv.SSH_AUTH_SOCK points at /run/host-services/ssh-auth.sock; (3) initializeCommand still writes authorized_keys (for R1 orthogonally). Research: .omc/research/research-20260409c-dockerdesktop-ssh/report.md. Runtime pin: Docker Desktop only — Colima has no equivalent (abiosoft/colima#1330, #942), tracked for follow-up in issue #78."
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/devcontainer.json"]
tokens = [
    "source=/run/host-services/ssh-auth.sock",
    "target=/run/host-services/ssh-auth.sock",
    "\"SSH_AUTH_SOCK\": \"/run/host-services/ssh-auth.sock\"",
    "dotfiles-setup docker initialize-host",
]

[[suite]]
name = "build.uv-link-mode-not-global"
description = "UV_LINK_MODE=copy must not be a global ENV (breaks runtime)"
category = "build"
check_type = "static"
handler = "regex_forbid"
paths = [".devcontainer/Dockerfile"]
pattern = '^\s*ENV\s.*UV_LINK_MODE'

[[suite]]
name = "build.base-image-arg"
description = "ARG BASE_IMAGE must exist for composability"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = ["ARG BASE_IMAGE"]


[[suite]]
name = "build.gnupg-installed"
description = "gnupg must be in the declarative [bootstrap.packages] apt set (the image's only apt source since #160 T4) for mise signature verification"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/mise-system.toml"]
tokens = ["\"apt:gnupg\""]

[[suite]]
name = "build.apt-via-mise-bootstrap"
description = "The full apt set installs via mise bootstrap packages apply from [bootstrap.packages] (#160 T4, wagov-dtt pattern); the Dockerfile seed layer carries only curl + ca-certificates for the mise installer. Required: the apply invocation, the status --missing anti-drift gate (exits 1 on missing/version-mismatch in the same RUN), and the apt.conf.d drop-in that disables Recommends/Suggests for mise-driven installs (mise has no apt-args flag)."
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = [
  "mise bootstrap packages apply --manager apt --yes --update",
  "mise bootstrap packages status --json --missing",
  "/etc/apt/apt.conf.d/99no-install-recommends",
]

[[suite]]
name = "build.npm-no-update-notifier"
description = "npm_config_update_notifier=false set in mise-system.toml to suppress build notices"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/mise-system.toml"]
tokens = ['npm_config_update_notifier = "false"']

[[suite]]
name = "build.path-includes-mise-shims"
description = "Overlay/runtime paths must include the default per-user mise shims path. PER-PATH by deliberate choice (#299): this contract named three files under combined-text `tokens`, where a token in ANY listed file satisfies it for all. Commit fc8af71 (#34, 2026-04-05) removed devcontainer.json's remoteEnv PATH entry — a file this contract names — inside a multi-topic refactor that never mentioned it, and the union kept the contract GREEN for ~3.5 months. The overlay ENV PATH is the load-bearing site (mise's own docs: shims are the mechanism for non-interactive contexts, and `mise activate` REMOVES the shims dir from PATH in login shells, so `_.path` cannot bootstrap shims), so it is bound explicitly below. `paths` stays as declared: the scope is visible, nothing is deleted, and a prior review's rejection of DELETING these paths is not re-litigated here."
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/Dockerfile.host-user", ".devcontainer/devcontainer.json", "home/.chezmoi.toml.tmpl"]
per_path_tokens = { ".devcontainer/Dockerfile.host-user" = [".local/share/mise/shims"] }
tokens = [".local/share/mise/shims"]

[[suite]]
name = "build.no-custom-cargo-home"
description = "Base image must not pin standard CARGO_HOME (runtime users get ~/.cargo via named volume per rust cookbook). MISE_CARGO_HOME for build-time isolation is allowed."
category = "build"
check_type = "static"
handler = "forbid_tokens"
paths = [".devcontainer/Dockerfile"]
# Leading space anchors the token to a fresh ENV line, so MISE_CARGO_HOME=
# (preceded by `MISE_`, not whitespace) does NOT false-positive.
tokens = [" CARGO_HOME="]

[[suite]]
name = "build.no-custom-rustup-home"
description = "Base image must not pin standard RUSTUP_HOME (runtime users get ~/.rustup via named volume per rust cookbook). MISE_RUSTUP_HOME for build-time isolation is allowed."
category = "build"
check_type = "static"
handler = "forbid_tokens"
paths = [".devcontainer/Dockerfile"]
# Leading space anchors the token to a fresh ENV line, so MISE_RUSTUP_HOME=
# (preceded by `MISE_`, not whitespace) does NOT false-positive.
tokens = [" RUSTUP_HOME="]

[[suite]]
name = "build.no-custom-gopath"
description = "Base image should rely on default Go locations instead of custom GOPATH"
category = "build"
check_type = "static"
handler = "forbid_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = ["GOPATH=", "GOBIN=", "GOMODCACHE=", "GOCACHE="]

[[suite]]
name = "build.no-custom-npm-prefix"
description = "Base image should rely on default npm locations instead of custom NPM_CONFIG_PREFIX"
category = "build"
check_type = "static"
handler = "forbid_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = ["NPM_CONFIG_PREFIX=", "NPM_CONFIG_CACHE="]

[[suite]]
name = "build.home-opt-home"
description = "Base image must not stage a fake /opt/home build user"
category = "build"
check_type = "static"
handler = "forbid_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = ["/opt/home"]

[[suite]]
name = "build.no-xdg-in-tools-stage"
description = "XDG_DATA_HOME/XDG_CACHE_HOME must not be in Dockerfile"
category = "build"
check_type = "static"
handler = "forbid_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = ["XDG_DATA_HOME", "XDG_CACHE_HOME"]

[[suite]]
name = "build.manpage-restore-sed-syntax"
description = "Base image must remove the manpage path exclusion with a valid exact-line sed expression"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = ["sed -i '/^path-exclude=\\/usr\\/share\\/man\\/\\*$/d' /etc/dpkg/dpkg.cfg.d/excludes"]

[[suite]]
name = "build.rustup-skip-path-check"
description = "mise env must disable rustup PATH checks during non-interactive installs"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/mise-system.toml"]
tokens = ['RUSTUP_INIT_SKIP_PATH_CHECK = "yes"']

[[suite]]
name = "build.gcc-latest-deb-checksum"
description = "Validation D (#160 T13): the gcc-latest .deb must be sha256-verified in the same RUN that downloads it — kayari publishes no checksum/signature, so the committed GCC_LATEST_DEB_SHA256 ARG is the only integrity handle for those bytes"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = [
  "ARG GCC_LATEST_DEB_SHA256=",
  "sha256sum -c -",
]

[[suite]]
name = "build.gcc-latest-reflection"
description = "GCC-16 with P2996 reflection must be installed via precompiled .deb"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = ["gcc-latest.deb", "/opt/gcc-latest/bin/g++", "-freflection"]

[[suite]]
name = "build.clang-p2996-reflection"
description = "Bloomberg clang-p2996 must be built from source in clang-builder stage"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = ["clang-p2996", "CLANG_P2996_REF", "COPY --from=clang-builder"]

[[suite]]
name = "build.clang-p2996-ref-in-bake"
description = "CLANG_P2996_REF must be wired through docker-bake.hcl for cache invalidation"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = ["docker-bake.hcl"]
tokens = ["CLANG_P2996_REF"]

[[suite]]
name = "build.p2996-cache-target"
description = "docker-bake.hcl must define the p2996-cache target backed by the p2996-export stage, parameterized by BUILDER_IMAGE (#160 T11 — the builder is decoupled from devcontainer-base; warm paths consume the artifact as a digest-pinned named context)"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = ["docker-bake.hcl"]
tokens = [
  "target \"p2996-cache\"",
  "p2996-export",
  "BUILDER_IMAGE",
]

[[suite]]
name = "build.base-cache-target"
description = "docker-bake.hcl must define the base target backed by the devcontainer-base stage; the dev build consumes it as the digest-pinned devcontainer-base named context on warm CI paths (#160 T11)"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = ["docker-bake.hcl"]
tokens = [
  "target \"base\"",
  "devcontainer-base",
]

[[suite]]
name = "build.no-retired-indirection-args"
description = "The ARG P2996_SOURCE / ARG DEVCONTAINER_BASE_REF FROM-indirection is retired (#160 T11) — digest-pinned named build contexts replaced it; reintroducing either ARG resurrects tag-pinned (repush-vulnerable) plumbing"
category = "build"
check_type = "static"
handler = "forbid_tokens"
paths = [".devcontainer/Dockerfile", "docker-bake.hcl"]
tokens = ["P2996_SOURCE", "DEVCONTAINER_BASE_REF"]

[[suite]]
name = "build.no-system-config-file-pin"
description = "MISE_SYSTEM_CONFIG_FILE must not be set in the image ENV or devcontainer containerEnv: per mise system_config_files() it short-circuits the system axis to that ONE file, hiding conf.d/shared.toml (shared tier, #160 T5) and config.runtime.toml (runtime tier, T9/T10) at devcontainer runtime — broke `chezmoi init` onCreate in PR #169. System-axis DIRECTORY discovery via MISE_SYSTEM_CONFIG_DIR is the supported shape (probe-verified against :pr-169)"
category = "build"
check_type = "static"
handler = "forbid_tokens"
paths = [
  ".devcontainer/Dockerfile",
  ".devcontainer/Dockerfile.host-user",
  ".devcontainer/devcontainer.json",
]
tokens = ["MISE_SYSTEM_CONFIG_FILE"]
allowlist = ["^\\s*//"]

[[suite]]
name = "build.dockerfile-section-markers"
description = "Dockerfile must contain BASE_HASH_BEGIN/END and P2996_HASH_BEGIN/END sentinel comments delimiting which stages feed which content hash; without these the hash function falls back to whole-file hashing and editing any line invalidates everything"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = [
  "BASE_HASH_BEGIN",
  "BASE_HASH_END",
  "P2996_HASH_BEGIN",
  "P2996_HASH_END",
]

[[suite]]
name = "build.p2996-cache-dockerfile-stages"
description = "Dockerfile must keep the decoupled p2996 pipeline (#160 T11): clang-builder-cold compiles FROM the parameterized ${BUILDER_IMAGE}; p2996-export is the scratch artifact stage the final COPY consumes (locally on cold paths, as a digest-pinned named context on warm paths)"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = [
  "FROM ${BUILDER_IMAGE} AS clang-builder-cold",
  "AS p2996-export",
  "COPY --from=p2996-export /opt/clang-p2996",
]

[[suite]]
name = "build.locked-install-with-conda-sha"
description = "Validation A (#160 T13): the base install must be `mise install --system --locked` and the committed mise-system.lock must carry rattler conda sha256 material (the [conda-packages] table) — an unlocked install or a checksum-less lock silently degrades reproducibility"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/Dockerfile", ".devcontainer/mise-system.lock"]
# Bound per-path (#299): under combined-text `tokens` the lock's conda table
# could satisfy the Dockerfile's `--locked` requirement and vice versa, so the
# contract had no opinion about either file individually.
per_path_tokens = { ".devcontainer/Dockerfile" = [
  "mise install --system --locked",
], ".devcontainer/mise-system.lock" = [
  "[conda-packages.linux-x64",
] }
tokens = [
  "mise install --system --locked",
  "[conda-packages.linux-x64",
]

[[suite]]
name = "build.base-image-digest-pinned"
description = "Validation C (#160 T13): BASE_IMAGE must be digest-pinned (ubuntu:<ver>@sha256:) in both docker-bake.hcl and the Dockerfile ARG — a bare tag would let the base drift under the content-hash"
category = "build"
check_type = "static"
handler = "regex_match"
paths = ["docker-bake.hcl", ".devcontainer/Dockerfile"]
pattern = 'ubuntu:[0-9.]+@sha256:[a-f0-9]{64}'
match_all_paths = true

[[suite]]
name = "build.runtime-tier-stage"
description = "The devcontainer-runtime stage (#160 T9/T10) must exist and install the runtime tool tier: FROM devcontainer, COPY mise-runtime.toml to config.runtime.toml + its per-env lock, ENV MISE_ENV=runtime persisted so runtime containers keep loading the tier, and a locked install. The dev bake target must publish THIS stage."
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/Dockerfile"]
tokens = [
  "FROM devcontainer AS devcontainer-runtime",
  "ENV MISE_ENV=runtime",
  "/usr/local/share/mise/config.runtime.toml",
  "/usr/local/share/mise/mise.runtime.lock",
]

[[suite]]
name = "build.dev-target-publishes-runtime-stage"
description = "docker-bake.hcl dev target must build the devcontainer-runtime stage (#160 T10) — publishing plain devcontainer would silently drop the runtime tool tier from :dev"
category = "build"
check_type = "static"
handler = "require_tokens"
paths = ["docker-bake.hcl"]
tokens = ["target   = \"devcontainer-runtime\""]

[[suite]]
name = "build.doppler-secrets-wired"
description = "S1 SECRETS: Doppler secrets injected via --env-file in runArgs. initializeCommand downloads secrets to staging area; runArgs passes the env file to docker run. DO NOT DROP — see AGENTS.md Secrets Injection section."
category = "build"
check_type = "static"
handler = "require_tokens"
paths = [".devcontainer/devcontainer.json"]
tokens = [
    "--env-file",
    "doppler.env",
    "doppler secrets download",
]

# =============================================================================
# CI Constraints (~6) — Workflow correctness
# =============================================================================

[[suite]]
name = "ci.sbom-attestation"
description = "SBOM attestation required in bake config"
category = "ci"
check_type = "static"
handler = "require_tokens"
paths = ["docker-bake.hcl"]
tokens = ["type=sbom"]

[[suite]]
name = "ci.provenance-attestation"
description = "Provenance attestation at mode=max required in bake config (#160 T7 — all published targets attest; mode=min drops the materials/steps detail T11's checks rely on)"
category = "ci"
check_type = "static"
handler = "require_tokens"
paths = ["docker-bake.hcl"]
tokens = ["type=provenance,mode=max"]

[[suite]]
name = "ci.bootstrap-gap-report-wired"
description = "smoke-test must capture `mise bootstrap packages status --json` from the published image, assert it via dotfiles-setup bootstrap-gap-report, and upload the raw JSON as an artifact (#160 T7). This is the CI half of the T4 apt switch: the build-time status gate catches missing packages; this catches unavailable-manager and set-drift conditions the exit code cannot see."
category = "ci"
check_type = "static"
handler = "require_tokens"
paths = [".github/workflows/build-publish.yml"]
tokens = [
  "mise bootstrap packages status --json",
  "dotfiles-setup bootstrap-gap-report",
  "bootstrap-gap-report.json",
]

[[suite]]
name = "ci.no-mise-data-in-cache-map"
description = "mise-data must not be in buildkit-cache-dance cache-map"
category = "ci"
check_type = "static"
handler = "regex_forbid"
paths = [".github/workflows/ci.yml"]
pattern = '"mise-data"'

[[suite]]
name = "ci.gha-cache-enabled"
description = "Buildx gha cache must remain enabled in bake config"
category = "ci"
check_type = "static"
handler = "require_tokens"
paths = ["docker-bake.hcl"]
tokens = ["type=gha,scope=dotfiles-dev"]

[[suite]]
name = "ci.no-actions-cache-workaround"
description = "Workflow must not use the deprecated actions/cache workaround for BuildKit mounts"
category = "ci"
check_type = "static"
handler = "forbid_tokens"
paths = [".github/workflows/ci.yml"]
tokens = ["actions/cache/restore", "actions/cache/save", "buildkit-cache-dance"]

[[suite]]
name = "ci.unconditional-ghcr-login"
description = "GHCR login must not be conditional on event type"
category = "ci"
check_type = "static"
handler = "regex_forbid"
paths = [".github/workflows/ci.yml"]
pattern = "if:.*github\\.event_name.*!=.*pull_request"

[[suite]]
name = "ci.image-name-dotfiles-devcontainer"
description = "CI must publish the dotfiles-devcontainer image"
category = "ci"
check_type = "static"
handler = "require_tokens"
paths = [".github/workflows/ci.yml"]
tokens = ["ray-manaloto/dotfiles-devcontainer"]

[[suite]]
name = "ci.explicit-packages-write"
description = "CI workflow must explicitly request packages: write for GHCR publishing"
category = "ci"
check_type = "static"
handler = "require_tokens"
paths = [".github/workflows/ci.yml"]
tokens = ["packages: write"]

[[suite]]
name = "ci.push-to-main-skips-build"
description = "Push-to-main must skip the heavy rebuild path. Since Phase B (#118) the build chain (base-prep → p2996-prep → build → smoke-test) lives in the reusable build-publish.yml and is invoked by a single 'build-publish' caller job in ci.yml; that caller carries the push-to-main skip clause '(github.event_name != \"push\" || github.ref != \"refs/heads/main\")' (parenthesized because it also gates on the path-filter && needs.changes.outputs.build == 'true'). Promote job retags the PR's image instead. This checks for the clause as a sub-expression rather than a bare 'if:'."
category = "ci"
check_type = "static"
handler = "require_tokens"
paths = [".github/workflows/ci.yml"]
tokens = ["(github.event_name != 'push' || github.ref != 'refs/heads/main')"]

[[suite]]
name = "ci.ci-gate-aggregator-exists"
description = "Branch protection requires the always-run `ci-gate` aggregator (not the path-gated `build-publish / smoke-test`, which produces no check run on non-build PRs and would block them). ci-gate must `needs` the upstream jobs, run `if: always()`, and fail unless each result is success or skipped — preserving auto-merge safety while unblocking non-build PRs (#119)."
category = "ci"
check_type = "static"
handler = "require_tokens"
paths = [".github/workflows/ci.yml"]
tokens = [
  "ci-gate:",
  "needs.build-publish.result",
  "if: always()",
  "success|skipped",
]

[[suite]]
name = "ci.promote-job-exists"
description = "Push-to-main must trigger the promote job (manifest-only retag of the PR image as :dev/:latest, no rebuild). Direct-push fallback dispatches workflow with force_dev_tag=true."
category = "ci"
check_type = "static"
handler = "require_tokens"
paths = [".github/workflows/ci.yml"]
tokens = [
  "promote:",
  "docker buildx imagetools create",
  "associatedPullRequests",
  "force_dev_tag",
