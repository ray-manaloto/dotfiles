# =============================================================================
# Orchestration + eval contracts (#354 tier 0) — every declaration gets an
# observer
#
# The defect class these close is not a code bug. Three bugs on 2026-07-24 —
# an inert orchestrator trigger, a `kb-add` that ingested nav shells, a stale
# `Workflow({name})` resolution — were all in CONFIG OR WIRING, all exited 0,
# and all produced a plausible-looking artifact. What they had in common is a
# declaration that nothing observed.
#
# The design test each of these answers: for every line of config that asserts
# a behaviour, name the thing that would go red if the behaviour stopped.
# Design: `docs/specs/eval-harness-design.md` §4 tier 0.
# =============================================================================

[[suite]]
name = "orchestration.trigger-armed"
description = "THE bug that opened #354. `.claude/CLAUDE.md` must carry the Fable-gated trigger line as a WHOLE LINE. Until 2026-07-24 only the mode line was present, and the fable-orchestrator plugin's own setup wizard states the mode line 'is inert without the trigger' — so the repo declared an implementation lane and never invoked it, for an unknown number of sessions, with nothing red anywhere. Uses require_lines, not require_tokens, deliberately: a substring is satisfied by a doc that merely QUOTES the trigger while narrating it, which is a state this repo has actually been in. Whitespace is normalised so re-indentation is not a failure; wording is not, so a paraphrase is."
category = "orchestration"
check_type = "static"
handler = "require_lines"
paths_required = true
paths = [".claude/CLAUDE.md"]
lines = [
    "- When the session model is Fable, without being reminded: non-trivial implementation runs the fable-orchestrator architect-as-orchestrator flow — invoke the fable-orchestrator:orchestration skill before delegating and follow it as authoritative for routing, verification, review tiers, and advisor consults.",
]

