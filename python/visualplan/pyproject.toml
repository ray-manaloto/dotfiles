[project]
name = "visualplan"
version = "0.1.0"
description = "Render a visual-plan plan.json into one self-contained HTML page"
requires-python = ">=3.15"
dependencies = ["pydantic"]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
# D: one-line module docstrings only. CPY001: no copyright headers. TC001-TC003: annotations are
# lazy (Python 3.14+), so a TYPE_CHECKING block buys nothing. COM812: conflicts with ruff format.
ignore = ["D", "CPY001", "TC001", "TC002", "TC003", "COM812"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest asserts with assert. S603: the tests run the installed console script, a fixed path, as a user would.
"tests/**" = ["S101", "S603"]
# Generated: datamodel-codegen orders its imports its own way, and S105 reads the Result member pass_ as a password.
"src/visualplan/models.py" = ["I001", "S105"]

[tool.pytest.ini_options]
addopts = "--cov=visualplan --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

# Measure the console script the tests run as a real process, too.
[tool.coverage.run]
patch = ["subprocess"]

# Flags live here, so the codegen task stays one line (zero-bash rule).
[tool.datamodel-codegen]
input = "schema/visualplan.schema.json"
input-file-type = "jsonschema"
output = "src/visualplan/models.py"
output-model-type = "pydantic_v2.BaseModel"
enable-faux-immutability = true
target-python-version = "3.15"
use-annotated = true
snake-case-field = true
use-type-alias = true
strict-nullable = true
strict-types = ["bool", "int"]
use-standard-collections = true
use-union-operator = true
use-schema-description = true
use-field-description = true
disable-timestamp = true
formatters = ["ruff-format"]
custom-file-header = "# Generated by datamodel-codegen from schema/visualplan.schema.json; run mise run //visualplan:codegen."

[project.scripts]
visualplan = "visualplan.cli:main"

[build-system]
requires = ["uv_build>=0.13.6"]
build-backend = "uv_build"
