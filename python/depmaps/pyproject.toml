[project]
name = "depmaps"
version = "0.1.0"
description = "Build and diff version-pinned code maps of the tools this machine depends on"
requires-python = ">=3.15"
# Uncapped: the latest of every dependency (DL-758).
dependencies = ["pydantic"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "pytest-xdist"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
# D: one-line module docstrings only. CPY001: no copyright headers. TC001-TC003: annotations are
# lazy (Python 3.14+), so a TYPE_CHECKING block buys nothing. S603/S607: the package runs git and cbm
# by name. COM812: conflicts with ruff format.
ignore = ["D", "CPY001", "TC001", "TC002", "TC003", "COM812", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest checks with assert. PLR2004: tests compare against literal expected counts and exit codes.
"tests/**" = ["S101", "PLR2004"]
# Generated (DL-762): datamodel-codegen orders its imports its own way.
"src/depmaps/models.py" = ["I001"]

[tool.pytest.ini_options]
addopts = "--cov=depmaps --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[project.scripts]
depmaps = "depmaps.cli:main"

[build-system]
requires = ["uv_build>=0.13.6"]
build-backend = "uv_build"

[tool.coverage.run]
# The tests run the installed depmaps command as a child process, the way a user does; measure it there.
patch = ["subprocess"]

# Flags live here, so the codegen task stays one line (zero-bash rule).
[tool.datamodel-codegen]
input = "schema/depmaps.schema.json"
input-file-type = "jsonschema"
output = "src/depmaps/models.py"
output-model-type = "pydantic_v2.BaseModel"
enable-faux-immutability = true
target-python-version = "3.15"
use-annotated = true
use-type-alias = true
strict-nullable = true
use-standard-collections = true
use-union-operator = true
use-schema-description = true
use-field-description = true
disable-timestamp = true
formatters = ["ruff-format"]
custom-file-header = "# Generated by datamodel-codegen from schema/depmaps.schema.json; edit the schema, then mise run //depmaps:codegen."
