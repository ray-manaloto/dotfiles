[project]
name = "dotfiles-setup"
version = "0.1.0"
description = "Python orchestration library for dotfiles setup"
requires-python = ">=3.14"
dependencies = [
    # Graphify is a Python runtime dependency, not a second mise/pipx tool.
    # The CLI console script and SDK therefore resolve from the same uv lock.
    "graphifyy[all]",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    # deb822 control-file parser, maintained by Debian's own
    # pkg-python-debian-maint (salsa.debian.org/python-debian-team). Ubuntu
    # ships the same code as `python3-debian`. Used by `apt_repo` to read an
    # apt repository's Packages index without configuring the repo first and
    # without libapt (`use_apt_pkg=False`), so enumeration works before we
    # decide to adopt a source. Hand-rolling deb822 was rejected per
    # .claude/rules/use-tool-builtins.md.
    "python-debian>=1.1.1",
    "pyyaml>=6.0.3",
    # The SHARED engines (D2/G4: one implementation, never a second copy that
    # drifts). Two live here now: tool-currency (dotfiles' tool_currency.py was
    # deleted), md_budget (dotfiles' md_budget.py + tests deleted 2026-07-25; the
    # `md_size_budget` hk step shells out to `kb-setup md-budget`), and the eval
    # runner (`kb_setup.evals` — tier-1 probes plus the tier-2 guard fixture
    # engine; this repo declares its own cases in dotfiles_setup.eval_cases),
    # and `kb_setup.launch` (the `mise run cc` launcher).
    # FOUR gates/entry points now ride this pin, which is why
    # tier1.shared-engine-resolves probes that it actually imports.
    #
    # BUMPING IS NOT A DRIVE-BY (#391): this pin sat at 23e4a724 — a revision
    # that PREDATES `kb_setup/launch.py` — so `mise run cc` had never once
    # worked in this repo, while every gate stayed green because no gate
    # invoked it. A pin is a DECLARATION; only a probe that runs the thing is
    # RESOLUTION. `tier1.cc-subcommand-dispatches` is that probe.
    # SHA-PINNED (D3) so it is reproducible on a clean CI runner and via uv.lock;
    # neither repo has tags, so a SHA is the only stable pin. Renovate's git-refs
    # datasource bumps this the same way it bumps CLANG_P2996_REF. Dependency
    # direction is dotfiles → KB only; the KB never learns about its consumers.
    "kb-setup @ git+https://github.com/ray-manaloto/knowledge-base@e8fe42ae208fbae227e733d38356416223d83ba7",
    "msgspec>=0.21.1",
]

[project.scripts]
dotfiles-setup = "dotfiles_setup.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# The SHA-pinned kb-setup dependency above (line 40) itself pins
# graphifyy 0.9.57 (with all extras). Without this override, `uv lock` refuses to
# resolve: "your project's requirements are unsatisfiable." The override governs
# resolution and makes the dependency line's version specifier dead text, so both
# declarations stay loose and python/uv.lock is the single version pin.
[tool.uv]
override-dependencies = ["graphifyy[all]"]
# `codegen` is a DEFAULT group so every sync keeps the generator installed.
# As an opt-in group, any plain `uv run`/`uv sync --locked` (each hk step, the
# mise `[deps.uv]` sync) uninstalled it again, racing the `codegen_check` step's
# `uv run --group codegen`: CI saw "datamodel-codegen not found" right after
# "Installed 29 packages" (dotfiles PR #1534, run 37011622846). Same cure as
# knowledge-base#833. The `--group codegen` flags in mise.toml/hk.pkl stay,
# explicit and now redundant, so the tasks still work if this list changes.
default-groups = ["dev", "codegen"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # ── Mutually contradictory docstring rules (ruff docs: pick one set) ──
    # D203 requires a blank line before class docstring; D211 forbids it.
    # D212 requires summary on the first line; D213 requires it on the second.
    # These pairs are logically incompatible — ruff itself warns when both
    # are enabled. We follow Google convention (D211 + D212 active).
    "D203", "D211", "D212", "D213",
    # ── Formatter conflicts (ruff format compatibility) ──
    # COM812 (missing trailing comma) and ISC001 (implicit string concat)
    # produce fixes that fight ruff format. Ruff docs explicitly recommend
    # ignoring both when using the built-in formatter:
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "COM812", "ISC001",
    # ── Subprocess security: intentional design, not oversight ──
    # S603 flags every subprocess.run() call as potential untrusted input.
    # S607 flags partial executable paths (e.g., "ssh-add" not "/usr/bin/ssh-add").
    # This is a CLI orchestration tool — subprocess calls are the core mechanism.
    # Tools are resolved via mise shims on $PATH; hardcoding absolute paths would
    # break in containers where shim paths differ from system paths.
    # Verified: 346 hits across the codebase, all intentional tool invocations.
    "S603", "S607",
]

[tool.ruff.lint.per-file-ignores]
# S108 (hardcoded /tmp paths): container paths are intentional, not insecure
# temp file usage. These are well-known mount points defined by devcontainer.json.
"src/dotfiles_setup/config.py" = ["S108"]
# S101 (assert in tests): standard pytest practice — assert is the test mechanism.
"../tests/*.py" = ["S101"]
# TID251: `codec.py` is the ONE module allowed to call msgspec's hook-taking
# entry points — it is what every other caller is redirected to (#675). Without
# this allowance the ban would make the module it exists to protect unwritable.
"src/dotfiles_setup/codec.py" = ["TID251"]
# SLF001 (private member access): `graphify_skill.py` deliberately reads
# graphify's own `_PLATFORM_CONFIG` (private by the vendor's naming) as the
# repo-owned installer's placement table — the whole point is that it CANNOT
# drift from what the installed graphify version's own installer would do.
# The install *functions* it wraps are never called; only this one data table
# is read. See do-not.md #8 for why a repo-owned installer exists at all.
"src/dotfiles_setup/graphify_skill.py" = ["SLF001"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Every msgspec entry point that accepts a conversion hook (#675 AC4).
#
# ENUMERATED, not hand-listed: the set was read out of msgspec 0.21.1 by
# scanning every public callable in `msgspec`, `.json`, `.msgpack`, `.yaml` and
# `.toml` for `enc_hook`/`dec_hook` in its signature docs. That found FOURTEEN;
# the four anyone would write from memory (`json.encode/decode`,
# `msgpack.encode/decode`) are under a third of them. The `Encoder`/`Decoder`
# classes matter as much as the functions — they take the same hooks and are the
# form a performance-minded caller reaches for — and `convert`/`to_builtins` are
# the ones that would slip past entirely.
#
# Ruff resolves attribute access AND aliased imports, both verified against this
# config before it was committed: `msgspec.json.encode(1)` and
# `from msgspec.json import encode` are each flagged, while `msgspec.Struct`
# passes. That last one is the control arm — the ban is specific, so declaring a
# model stays free.
"msgspec.convert".msg = "route through dotfiles_setup.codec — msgspec's hooks are per-call, so a direct call carries its own conversion table and drifts (#675)"
"msgspec.to_builtins".msg = "route through dotfiles_setup.codec (#675)"
"msgspec.json.encode".msg = "use dotfiles_setup.codec.encode (#675)"
"msgspec.json.decode".msg = "use dotfiles_setup.codec.decode (#675)"
"msgspec.json.Encoder".msg = "use dotfiles_setup.codec.encode (#675)"
"msgspec.json.Decoder".msg = "use dotfiles_setup.codec.decode (#675)"
"msgspec.msgpack.encode".msg = "use dotfiles_setup.codec.encode(fmt=Format.MSGPACK) (#675)"
"msgspec.msgpack.decode".msg = "use dotfiles_setup.codec.decode(fmt=Format.MSGPACK) (#675)"
"msgspec.msgpack.Encoder".msg = "use dotfiles_setup.codec.encode(fmt=Format.MSGPACK) (#675)"
"msgspec.msgpack.Decoder".msg = "use dotfiles_setup.codec.decode(fmt=Format.MSGPACK) (#675)"
# yaml/toml carry no `Format` yet. The ban is deliberate rather than an
# oversight: adding a wire format should be a decision recorded in `Format`, not
# a call site that quietly introduces a third serialization path.
"msgspec.yaml.encode".msg = "add a codec.Format before introducing a third wire format (#675)"
"msgspec.yaml.decode".msg = "add a codec.Format before introducing a third wire format (#675)"
"msgspec.toml.encode".msg = "add a codec.Format before introducing a third wire format (#675)"
"msgspec.toml.decode".msg = "add a codec.Format before introducing a third wire format (#675)"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# ty reads this ONLY when invoked with --project python (#160 T12 probe:
# with cwd at the repo root and no root pyproject, ty previously discovered
# NO config at all — this section was silently dead, and its python-version
# key sat at the wrong level; the schema wants it under [tool.ty.environment]).
[tool.ty.environment]
python-version = "3.14"

[tool.pylint.MASTER]
load-plugins = [
    "pylint.extensions.docparams",
    "pylint.extensions.mccabe",
]

[tool.pylint.MESSAGES_CONTROL]
enable = ["all"]

[tool.vulture]
min_confidence = 80
paths = ["src"]
sort_by_size = true

[tool.refurb]
enable_all = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Linter/formatter and type-checker invoked directly by hk.pkl via
    # `uv run --project python` so hk uses pyproject.toml config with no
    # builtin-step rule dropouts (see Issue #45). Unpinned → `uv lock`
    # resolves latest; bump via `uv lock --upgrade-package ruff --upgrade-package ty`.
    "ruff",
    "ty",
]
# New models and enums are produced by code generation (R16/D23; #1329).
# Exact pin, isolated group: the `codegen`/`codegen-check` mise tasks run it
# with `--locked --group codegen`, so the binary comes from uv.lock, never a
# PATH copy. EVERY extra (Ray 2026-10-01): `all` plus the two experimental
# ones `all` deliberately omits (httpx2, ryaml). `ruff` is among them, and is
# the one the ruff-check/ruff-format formatters below shell out to — without it
# the formatter's ruff would arrive only by accident via the `dev` group. Cost
# recorded: `validation` pulls jsonschema-path 0.3.4, which caps referencing
# <0.37 for the whole lock (0.37.0 -> 0.36.2). Research:
# docs/research/kb/reports/agents/datamodel-codegen-extras-features-2026-10-01.md
codegen = ["datamodel-code-generator[all,httpx2,ryaml]==0.83.0"]

# Every model/enum generated from a committed schema (R16/D23; #1329). This
# table plus the `codegen`/`codegen-check` mise tasks IS the generator. Job
# paths are relative to THIS file's directory (both tasks run the generator
# with cwd = python/). Ruff gets no config flag: upstream runs it from the
# OUTPUT directory, and every output is under python/src/, so discovery walks
# up to this file's [tool.ruff] — the same config hk lints with. That is why
# codegen-check refuses an output outside generated/. Settings follow
# knowledge-base's table, each reason here:
[tool.datamodel-codegen]
input-file-type = "jsonschema"
schema-version = "2020-12"
schema-version-mode = "strict"
strict-refs = true
output-model-type = "msgspec.Struct"
target-python-version = "3.14"
# Explicit ruff formatters: the default (black+isort) is deprecated upstream,
# and these run the venv's ruff with hk's own config.
formatters = ["ruff-check", "ruff-format"]
# Without it every run stamps a timestamp, so `--check` can never pass.
disable-timestamp = true
# `extra-fields = "forbid"` reaches msgspec output ONLY through the generic
# base class (`forbid_unknown_fields`); without `use-generic-base-class` an
# unknown field decodes silently (#1329 cold review F1, armed by
# tests/test_codegen_check.py).
extra-fields = "forbid"
use-generic-base-class = true
# That generic base class has no schema, so no description; upstream's
# template renders it docstring-less, which ruff's D101 rejects. The one
# override is a fallback docstring (schemas/templates/msgspec.jinja2).
custom-template-dir = "../schemas/templates"
# Redundant on 0.83.0 for msgspec output (the sweep measured byte-identical
# output without them), kept so a regression in that auto-enable cannot drop
# every `Meta(...)` constraint silently.
use-annotated = true
field-constraints = true
use-specialized-enum = true
use-standard-collections = true
# The schema `description` becomes the class docstring (ruff's D101 needs one;
# a class without a description gets the template's fallback above).
use-schema-description = true

[tool.datamodel-codegen.jobs.drift-verdict]
input = "../schemas/drift-verdict.schema.json"
output = "src/dotfiles_setup/generated/drift_verdict.py"
custom-file-header = '''# Copyright (c) 2026 Raymond Manaloto
"""Generated drift-verdict enum; edit the schema and rerun `mise run codegen`."""'''
