[project]
name = "cbm"
version = "0.1.0"
description = "Install codebase-memory-mcp's agent setup for Claude Code, Codex and OpenCode through one stable launcher, and check it"
requires-python = ">=3.15"
# Uncapped: the latest of every dependency (DL-758).
dependencies = ["pydantic"]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
# D: one-line module docstrings only. CPY001: no copyright headers. TC001-TC003: annotations are
# lazy (Python 3.14+), so a TYPE_CHECKING block buys nothing. S603/S607: the package runs the CBM
# binary by path. COM812: conflicts with ruff format.
ignore = ["D", "CPY001", "TC001", "TC002", "TC003", "COM812", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest checks with assert. PLR2004: tests compare against literal expected counts and exit codes.
"tests/**" = ["S101", "PLR2004"]
# Generated (DL-762): datamodel-codegen orders its imports its own way, and its --validators adapter
# types the value as Any (ANN401); every other rule applies.
"src/cbm/models.py" = ["I001", "ANN401"]

[tool.pytest.ini_options]
addopts = "--cov=cbm --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[project.scripts]
cbm = "cbm.cli:main"

[build-system]
requires = ["uv_build>=0.13.6"]
build-backend = "uv_build"

[tool.coverage.run]
# The tests run the installed cbm command as a child process, the way a user does; measure it there.
patch = ["subprocess"]

# Flags live here, so the codegen task stays one line (zero-bash rule).
[tool.datamodel-codegen]
input = "schema/cbm.schema.json"
input-file-type = "jsonschema"
output = "src/cbm/models.py"
output-model-type = "pydantic_v2.BaseModel"
enable-faux-immutability = true
target-python-version = "3.15"
use-annotated = true
use-type-alias = true
strict-nullable = true
use-standard-collections = true
use-union-operator = true
use-schema-description = true
use-field-description = true
disable-timestamp = true
formatters = ["ruff-format"]
custom-file-header = "# Generated by datamodel-codegen from schema/cbm.schema.json; edit the schema, then mise run //cbm:codegen."
# The schema's uniqueItems on Config.clients: a generated field validator calls this package's check
# (datamodel-codegen 0.88 leaves uniqueItems out by default; --generate-schema-validators is experimental
# and adds a ~260-line generic runtime, --use-unique-items-as-set silently drops a repeat).
[tool.datamodel-codegen.validators.Config]
validators = [{ field = "clients", function = "cbm.validation.unique_clients", mode = "after" }]
