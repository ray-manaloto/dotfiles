[project]
name = "p2996"
version = "0.1.0"
description = "Fetch, build, install and check clang-p2996 (C++26 reflection) on arm64 macOS"
requires-python = ">=3.15"
# What LLVM's configure looks for in the Python it is given: opt-viewer (pygments, pyyaml) and the
# MLIR Python bindings (mlir/python/requirements.txt). Uncapped: the latest of every dependency
# (DL-758), although that file caps each at the versions upstream tested (nanobind below 3).
# p2996 build hands CMake this project's venv python.
dependencies = ["pygments", "pyyaml", "numpy", "nanobind", "pybind11", "ml_dtypes"]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
# D: one-line module docstrings only. CPY001: no copyright headers. TC001/TC003: annotations are
# lazy (Python 3.14+), so a TYPE_CHECKING block buys nothing. S603/S607: the recipe runs git, cmake,
# xcrun and codex by name. T201: the tasks report with print. COM812: conflicts with ruff format.
ignore = ["D", "CPY001", "TC001", "TC003", "COM812", "S603", "S607", "T201"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"src/p2996/models.py" = ["ALL"]

[tool.pytest.ini_options]
addopts = "--cov=p2996 --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[project.scripts]
p2996 = "p2996.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
