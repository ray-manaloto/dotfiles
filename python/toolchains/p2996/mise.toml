# clang-p2996 recipe (DL-758): the p2996 Python package does the work; this file holds every value it
# reads and one task per step. No [tools]: cmake, ninja, swig, lua, doxygen and opam are global (DL-757).
# From the repository root the tasks are //p2996:<task>.

[env]
# This package's uv venv for every task, whatever VIRTUAL_ENV the caller has (mise python venv).
_.python.venv = { path = ".venv" }
P2996_REMOTE = "https://github.com/bloomberg/clang-p2996.git"
# p2996 source builds the newest commit of this branch unless --commit names one.
P2996_BRANCH = "p2996"
# Install root: ROOT/<id> is the prefix, ROOT/current the active one, ROOT/bin on PATH follows it.
P2996_ROOT = "{{ env.HOME }}/.local/share/p2996"
P2996_CACHE = "{{ get_env(name='XDG_CACHE_HOME', default=env.HOME ~ '/.cache') }}/dotfiles/p2996"
# Compile jobs: not part of the build id.
P2996_JOBS = "{{ num_cpus() }}"
# sccache: one store that outlives every id. p2996 build adds the launcher path.
# Eviction is size LRU only, with no age limit (sccache docs/Local.md); p2996 clean --sccache empties it by hand.
SCCACHE_DIR = "{{ get_env(name='XDG_CACHE_HOME', default=env.HOME ~ '/.cache') }}/dotfiles/sccache"
SCCACHE_CACHE_SIZE = "60G"
# Linking at the end of a build can pass the default 10 idle minutes.
SCCACHE_IDLE_TIMEOUT = "0"

[tasks.source]
description = "Check out the newest P2996 commit (or --commit) in the cache and apply the macOS patches"
usage = 'flag "--commit <sha>" help="Build this commit instead of the newest on P2996_BRANCH"'
run = 'uv run --locked p2996 source ${usage_commit:+--commit "$usage_commit"}'

[tasks.build]
description = "Prepare, configure and build one commit (hours), skipping an installed id; a rerun resumes it"
usage = '''
flag "--commit <sha>" help="Build this commit instead of the newest on P2996_BRANCH"
flag "--dry-run" help="Print the cmake commands only"
flag "--force" help="Recompile past sccache even when the id is installed; install then replaces it"
'''
run = 'uv run --locked p2996 build ${usage_commit:+--commit "$usage_commit"} ${usage_dry_run:+--dry-run} ${usage_force:+--force}'

[tasks.install]
description = "Install the last successful build, verify it, then make it active in one rename"
run = "uv run --locked p2996 install"

[tasks.verify]
description = "Compile and run reflection.cpp with clang++-p2996"
run = "uv run --locked p2996 verify"

[tasks.clean]
description = "Delete the build tree for a clean build; --source also deletes the source tree"
usage = '''
flag "--source" help="Also delete the source checkout (source fetches it again)"
flag "--sccache" help="Instead stop sccache and delete only its store"
'''
run = 'uv run --locked p2996 clean ${usage_source:+--source} ${usage_sccache:+--sccache}'

[tasks.review-log]
description = "Have a read-only Codex review team report every warning, error and skipped part in a build log"
usage = '''
arg "<log>" help="Build log to review"
flag "--out <file>" help="Report file (default: <log>.review.md)"
'''
run = 'uv run --locked p2996 review-log --log "$usage_log" ${usage_out:+--out "$usage_out"}'

[tasks.projects]
description = "Compile glaze and simdjson with clang-p2996 through the toolchain file, running nothing"
usage = 'flag "--manifest <file>" help="Manifest file (default: the shipped projects.json)"'
run = 'uv run --locked p2996 projects ${usage_manifest:+--manifest "$usage_manifest"}'

# Development: uv runs only through these tasks; ruff, ty and datamodel-codegen are global tools.
[tasks.sync]
description = "Install the locked dependencies into .venv"
run = "uv sync --locked"

[tasks.lock]
description = "Re-resolve every dependency to its latest release"
run = "uv lock --upgrade"

[tasks.codegen]
description = "Generate src/p2996/models.py (every model, type and enum) from schema/p2996.schema.json; flags in pyproject.toml [tool.datamodel-codegen]"
usage = 'flag "--check" help="Only fail when models.py differs from what the schema generates"'
run = "datamodel-codegen ${usage_check:+--check}"

[tasks.lint]
description = "ruff check, ruff format --check, ty check, and models.py matches the schema"
depends = ["sync", "codegen --check"]
run = [
  "ruff check .",
  "ruff format --check .",
  "ty check --python .venv",
]

[tasks.test]
# No usage spec: everything after the task name goes to pytest unchanged, e.g. -- tests/test_cli.py -x
# --no-cov, -n auto, or --report-log <file> for the visual plan.
description = "Real tests (no mocking library) at 100% line and branch coverage; extra args go to pytest"
# Heavy (real cmake, ninja and clang builds, -n auto): refused under 100 GiB free.
depends = ["sync", "//home:disk-guard"]
# prefix: mise reads the output, so task.logs keeps it for `mise run test:times`.
output = "prefix"
run = "uv run --locked pytest -n auto --durations=25"

[tasks."test:focus"]
# For a subset (-- -k <expr>, -- tests/test_x.py): the 100% gate stays on test and check; this reports
# coverage without failing on it. The command-line --cov-fail-under overrides the one in addopts.
description = "Focused tests: coverage reported, not gated; extra args go to pytest"
depends = ["sync"]
run = "uv run --locked pytest --cov-fail-under=0"

[tasks.check]
description = "lint and test"
depends = ["lint", "test"]

# mise doctor project: what the build needs that a tool version cannot express.
[doctor.checks.sdk]
description = "Command Line Tools give an SDK and the bootstrap clang"
run = "xcrun --show-sdk-path && xcrun -f clang++"
hint = "Run `xcode-select --install`."

[doctor.checks.zstd]
description = "The managed static zstd the build links"
run = 'test -f "$(mise where conda:zstd-static)/lib/libzstd.a"'
hint = "Run `mise install` with the global config (conda:zstd-static)."

[doctor.checks.build-tools]
description = "cmake and ninja are on PATH"
run = "cmake --version && ninja --version"
hint = "Run `mise install` with the global config."

[doctor.checks.lldb-scripting]
description = "SWIG and Lua for lldb's Python and Lua bindings"
run = "swig -version && lua -v"
hint = "Run `mise install` with the global config (conda:swig, lua)."

[doctor.checks.doxygen]
description = "doxygen runs (a version-less shim breaks CMake's check)"
run = "doxygen --version"
hint = "Run `mise install` with the global config (conda:doxygen)."

[doctor.checks.ocaml]
description = "ocamlfind finds ctypes, for LLVM's OCaml bindings"
run = "ocamlfind query ctypes"
hint = "Run `opam install --switch llvm ocamlfind ctypes`; ~/.opam/llvm/bin must be on PATH."

[doctor.checks.python]
description = "The locked venv has the opt-viewer and MLIR Python modules"
run = "uv run --locked python -c 'import pygments.lexers.c_cpp, yaml, numpy, nanobind, pybind11, ml_dtypes'"
hint = "Run `mise run //p2996:sync`."
timeout = "120s"

[doctor.checks.upstream]
description = "The P2996 branch is reachable"
run = 'git ls-remote --exit-code "$P2996_REMOTE" "refs/heads/$P2996_BRANCH"'
timeout = "30s"

[doctor.checks.codex]
description = "Codex CLI for review-log"
run = "codex --version"
