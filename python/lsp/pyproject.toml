[project]
name = "lsptools"
version = "0.1.0"
description = "mise run lsp: add, update, remove, report and probe the language servers Claude Code runs, each a mise-managed install"
requires-python = ">=3.15"
# Uncapped: the latest of every dependency (DL-758). pygls is the LSP client (initialize, documentSymbol, ...),
# so no JSON-RPC is written here; lsprotocol holds the LSP types probe imports.
dependencies = ["lsprotocol", "pydantic", "pygls"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "pytest-xdist"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
# D: one-line module docstrings only. CPY001: no copyright headers. TC001-TC003: annotations are lazy
# (Python 3.14+). S603/S607: the actions run mise, claude and the language servers. COM812: conflicts with
# ruff format.
ignore = ["D", "CPY001", "TC001", "TC002", "TC003", "COM812", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest checks with assert. PLR2004: tests compare against literal counts and exit codes.
"tests/**" = ["S101", "PLR2004"]
# Generated (DL-762): datamodel-codegen orders its imports its own way; every other rule applies.
"src/lsptools/models.py" = ["I001"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=lsptools --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[project.scripts]
lsptools = "lsptools.cli:main"

[build-system]
requires = ["uv_build>=0.13.6"]
build-backend = "uv_build"

# Flags live here, so the codegen task stays one line (zero-bash rule).
[tool.datamodel-codegen]
input = "schema/lsptools.schema.json"
input-file-type = "jsonschema"
output = "src/lsptools/models.py"
output-model-type = "pydantic_v2.BaseModel"
enable-faux-immutability = true
target-python-version = "3.15"
use-annotated = true
use-type-alias = true
strict-nullable = true
use-standard-collections = true
use-union-operator = true
use-schema-description = true
snake-case-field = true
use-field-description = true
disable-timestamp = true
formatters = ["ruff-format"]
custom-file-header = "# Generated by datamodel-codegen from schema/lsptools.schema.json; edit the schema, then mise run //lsp:codegen."
