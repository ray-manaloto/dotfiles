# The PC's own bootstrap: loaded only where the `pc` config environment is selected (spec #633). The PC selects
# it in its untracked ~/.config/mise/miserc.local.toml (env = ["pc"]); the Mac never does, so its plan has none of
# this. Check from the Mac: mise run pc:doctor.
#
# Content is inline, not `source`: this file is a link in ~/.config/mise, and mise resolves a relative source
# against the link's folder, not the checkout's (mise 2026.11.9, read in a scratch config folder).

# The runner slot unit template. No file notifies the slots, so a change here never restarts one: mise runs
# daemon-reload and a `start`, a no-op for a running slot (mise 2026.11.8 crates/mise-system/src/services.rs:577).
#
# A slot starts only while gha-fence.service is active and its three drops are in place (#741). The check is four
# ExecStartPre commands, not a unit dependency: Requires= and Requisite= give the fence the reverse dependency
# (RequiredBy=, RequisiteOf=), which carries UNIT_ATOM_PROPAGATE_STOP, so a fence stop or restart would stop or
# restart every slot (systemd v262 src/core/unit-dependency-atom.c:43-52, src/core/transaction.c:1199-1214). After=
# and Wants= carry no propagate atom (:26-29, :54-55, :83-84): they only order a slot behind a fence start and pull
# the fence in. A refused start is an ExecStartPre exit code, which Restart=always retries every RestartSec
# (src/core/service.c:2455-2456); the PC's start limit (5 in 10 s) is never reached at one start per 10 s. The rule
# lines are the ones the fence's rules files add, spelled as iptables -S prints them.
[bootstrap.files."/etc/systemd/system/gha-slot@.service"]
os = "linux"
owner = "root"
group = "root"
mode = "0644"
content = '''
[Unit]
Description=GitHub Actions one-job runner slot %i (fresh container per job)
Documentation=file:///etc/gha-runner/README.md
After=network-online.target docker.service gha-fence.service
Wants=network-online.target gha-fence.service
Requires=docker.service

[Service]
Type=simple
# The job fence (gha-fence.service): no slot starts without it, and its restarts never touch a running slot.
ExecStartPre=/usr/bin/systemctl is-active --quiet gha-fence.service
ExecStartPre=/usr/bin/iptables -t mangle -C INPUT -i br-gha -m conntrack --ctstate NEW -j DROP
ExecStartPre=/usr/bin/iptables -t mangle -C FORWARD -i br-gha -o tailscale0 -j DROP
ExecStartPre=/usr/bin/ip6tables -t mangle -C INPUT -i br-gha ! -p ipv6-icmp -m conntrack --ctstate NEW -j DROP
ExecStart=/usr/local/sbin/gha-slot run %i
Restart=always
RestartSec=10
# Room for the stop path (remove the job container, then mint a token and delete the idle runner at GitHub,
# each call capped at 15 s, so up to about 30 s plus docker). This host sets DefaultTimeoutStopSec=5s, too
# short for that. The stop path exits 143 (TERM) or 130 (INT), which systemd must count as a clean stop.
TimeoutStopSec=45
SuccessExitStatus=130 143
SyslogIdentifier=gha-slot-%i
# The loop only talks to GitHub and the Docker daemon; jobs themselves run inside the containers.
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes

[Install]
WantedBy=multi-user.target
'''

# GPU containers get the GPU through a CDI device (`docker run --device nvidia.com/gpu=all`, never --privileged), and
# NVIDIA's own refresh units keep its spec current with the driver (#732): the path unit watches the kernel's modules
# and nvidia-ctk, and the oneshot service runs `nvidia-ctk cdi generate` into /run/cdi/nvidia.yaml at boot and on each
# change. Docker's daemon config is not managed. Check: the gpu-cdi line of mise run pc:doctor.
[bootstrap.packages]
"pacman:nvidia-container-toolkit" = "latest"

[bootstrap.services."nvidia-cdi-refresh.path"]
state = "running"
enabled = true

# A oneshot: inactive after a success, so `stopped` is its settled state (mise 2026.11.8 matches stopped to inactive
# only; a failed run reads as a change). enabled runs it at boot, before docker.service (the toolkit's drop-in).
[bootstrap.services."nvidia-cdi-refresh.service"]
state = "stopped"
enabled = true

# The hand-made spec, a second source of nvidia.com/gpu beside the refresh units' one. mise applies files before
# services, so on a PC that still has it apply in two steps: `mise bootstrap services apply`, check that
# `nvidia-ctk cdi list --spec-dir /run/cdi` lists nvidia.com/gpu=all, then `mise bootstrap`.
[bootstrap.files."/etc/cdi/nvidia.yaml"]
os = "linux"
state = "absent"

# The runner's folder on the PC. app.pem (the GitHub App key, the one secret at rest) and runner.json's backups sit in
# it unmanaged: bootstrap never reads or writes them.
[bootstrap.directories."/etc/gha-runner"]
os = "linux"
owner = "root"
group = "root"
mode = "0755"

# The job fence, part 3 (#741): mangle drops for the gha-jobs bridge, set at boot by gha-fence.service.
# - mangle INPUT, both families: tailscaled's ts-input chain accepts UDP 41641 on any interface and runs ahead of
#   ufw-before-input in filter INPUT, so ufw's br-gha host-input drop (part 1) never sees those packets. mangle INPUT
#   runs first, and tailscaled, ufw and Docker leave it alone (tailscaled's CONNMARK rules are in mangle PREROUTING
#   and OUTPUT). ICMPv6 stays allowed for neighbour discovery.
# - mangle FORWARD, IPv4: tailscaled's ts-forward accepts anything routed out tailscale0 before DOCKER-USER runs, so
#   the tailnet drop sits here. The launcher's netguard checks it with -C before each job and inserts it only when
#   missing, so the rule stays in the built-in chain, spelled as it checks it.
#
# Each file is one iptables-restore transaction: -F empties the chain and -A puts the one drop back, so a start or
# restart leaves exactly one copy of each drop, however many there were, and the drop is never absent. With
# --noflush the restore flushes no table, and a chain line for a built-in chain only sets its policy (iptables
# v1.8.13 iptables/xtables-restore.c:134-138 and :168-186), so the -F lines name the chains this unit owns. Every
# line up to COMMIT goes to the kernel as one nf_tables batch (:93-102, iptables/nft.c:3269-3395 and :3669-3674),
# which the kernel applies whole or not at all. The unit owns these three chains whole (owner's decision,
# 2026-11-17): any other rule in mangle INPUT (IPv4 and IPv6) or mangle FORWARD (IPv4) is removed at the next start or
# restart. Today nothing else uses them; tailscaled's CONNMARK rules are in PREROUTING and OUTPUT.
[bootstrap.files."/etc/gha-runner/fence.rules"]
os = "linux"
owner = "root"
group = "root"
mode = "0644"
notify = ["gha-fence.service"]
content = '''
# gha-fence.service (dotfiles #741): the job fence's IPv4 mangle drops, applied with iptables-restore --noflush.
*mangle
-F INPUT
-F FORWARD
-A INPUT -i br-gha -m conntrack --ctstate NEW -j DROP
-A FORWARD -i br-gha -o tailscale0 -j DROP
COMMIT
'''

[bootstrap.files."/etc/gha-runner/fence6.rules"]
os = "linux"
owner = "root"
group = "root"
mode = "0644"
notify = ["gha-fence.service"]
content = '''
# gha-fence.service (dotfiles #741): the job fence's IPv6 mangle drop, applied with ip6tables-restore --noflush.
*mangle
-F INPUT
-A INPUT -i br-gha ! -p ipv6-icmp -m conntrack --ctstate NEW -j DROP
COMMIT
'''

# A oneshot that stays active (RemainAfterExit). It has no ExecStop, so a stop or restart never removes a drop: a
# restart only runs the two restores again. Ordered like ufw.service (DefaultDependencies=no, before sysinit.target),
# so the drops are in place before Docker and any slot. The unit file notifies the service too: mise starts a unit
# it cannot find yet only when a file it manages provides it (services.rs:270-280).
[bootstrap.files."/etc/systemd/system/gha-fence.service"]
os = "linux"
owner = "root"
group = "root"
mode = "0644"
notify = ["gha-fence.service"]
content = '''
[Unit]
Description=Job fence: mangle drops for the gha-jobs bridge (br-gha)
Documentation=file:///etc/gha-runner/README.md
DefaultDependencies=no
After=systemd-sysctl.service
Before=sysinit.target

[Service]
Type=oneshot
RemainAfterExit=yes
ExecStart=/usr/bin/iptables-restore --noflush /etc/gha-runner/fence.rules
ExecStart=/usr/bin/ip6tables-restore --noflush /etc/gha-runner/fence6.rules

[Install]
WantedBy=multi-user.target
'''

# Declared before the slots: mise applies services in this file's order (services.rs:400-418). A changed rules file
# restarts the unit, which reapplies the drops without a gap and stops no slot.
#
# First application, with the slots drained (the two-run pattern of #636): between jobs,
#   sudo systemctl stop gha-slot@glaze gha-slot@cpp-utilities gha-slot@dotfiles
#   mise bootstrap --skip services       (writes the files; restarts nothing: src/cli/bootstrap.rs:2183 and :2381)
#   sudo systemctl daemon-reload
#   sudo systemctl start gha-fence.service
#   systemctl is-active gha-fence.service
#   sudo iptables -t mangle -S && sudo ip6tables -t mangle -S INPUT    (each drop exactly once)
#   mise bootstrap                       (enables the fence, starts the slots through their fence check)
#   mise run pc:doctor                   (from the Mac)
[bootstrap.services."gha-fence.service"]
state = "running"
enabled = true
on_change = "restart"

# One slot per repository, each an instance of the template above. mise accepts the name@instance form for system
# services (crates/mise-system/src/services.rs:381 and :677, mise 2026.11.8). Adding a repository is one more entry.
# No file notifies them, so a later edit of the unit template never restarts a slot in the middle of a job.
[bootstrap.services."gha-slot@glaze"]
state = "running"
enabled = true

[bootstrap.services."gha-slot@cpp-utilities"]
state = "running"
enabled = true

[bootstrap.services."gha-slot@dotfiles"]
state = "running"
enabled = true

# The job fence's rules files notify ufw. ufw.service is a oneshot with no reload command (CanReload=no), so the
# hook restarts it: ufw-init stop, then start. `ufw reload` does the same (ufw_reload in
# /usr/lib/ufw/ufw-init-functions stops, then starts), so neither is atomic: between the two, a job that is already
# running has no fence. Apply a fence change with the slots stopped until the new fence is checked. A plain mise
# bootstrap is not enough: it applies services in this file's order, so it starts the slots before it restarts ufw
# (mise 2026.11.8 crates/mise-system/src/services.rs:400-418 and :516-532). Instead, between jobs: stop the gha-slot@
# instances, run mise bootstrap --skip services (it writes the files and restarts nothing: src/cli/bootstrap.rs:2183
# and :2381), run sudo systemctl restart ufw, check the fence, then run mise bootstrap, which starts the slots.
[bootstrap.services.ufw]
state = "running"
enabled = true
on_change = "restart"

# The job fence, part 1: CI job containers on the gha-jobs bridge (br-gha) may not open connections to the PC itself.
# The whole file is managed: ufw's stock before.rules plus the two gha-jobs lines. tailscaled's ts-input runs ahead of
# this drop for UDP 41641, and the tailnet drop is in mangle FORWARD: gha-fence.service (part 3) sets both.
[bootstrap.files."/etc/ufw/before.rules"]
os = "linux"
owner = "root"
group = "root"
mode = "0644"
notify = ["ufw"]
content = '''
#
# rules.before
#
# Rules that should be run before the ufw command line added rules. Custom
# rules should be added to one of these chains:
#   ufw-before-input
#   ufw-before-output
#   ufw-before-forward
#

# Don't delete these required lines, otherwise there will be errors
*filter
:ufw-before-input - [0:0]
:ufw-before-output - [0:0]
:ufw-before-forward - [0:0]
:ufw-not-local - [0:0]
# End required lines


# allow all on loopback
-A ufw-before-input -i lo -j ACCEPT
# gha-jobs: runner job containers may not open connections to this host
-A ufw-before-input -i br-gha -m conntrack --ctstate NEW -j DROP
-A ufw-before-output -o lo -j ACCEPT

# quickly process packets for which we already have a connection
-A ufw-before-input -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
-A ufw-before-output -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
-A ufw-before-forward -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

# drop INVALID packets (logs these in loglevel medium and higher)
-A ufw-before-input -m conntrack --ctstate INVALID -j ufw-logging-deny
-A ufw-before-input -m conntrack --ctstate INVALID -j DROP

# ok icmp codes for INPUT
-A ufw-before-input -p icmp --icmp-type destination-unreachable -j ACCEPT
-A ufw-before-input -p icmp --icmp-type time-exceeded -j ACCEPT
-A ufw-before-input -p icmp --icmp-type parameter-problem -j ACCEPT
-A ufw-before-input -p icmp --icmp-type echo-request -j ACCEPT

# ok icmp code for FORWARD
-A ufw-before-forward -p icmp --icmp-type destination-unreachable -j ACCEPT
-A ufw-before-forward -p icmp --icmp-type time-exceeded -j ACCEPT
-A ufw-before-forward -p icmp --icmp-type parameter-problem -j ACCEPT
-A ufw-before-forward -p icmp --icmp-type echo-request -j ACCEPT

# allow dhcp client to work
-A ufw-before-input -p udp --sport 67 --dport 68 -j ACCEPT

#
# ufw-not-local
#
-A ufw-before-input -j ufw-not-local

# if LOCAL, RETURN
-A ufw-not-local -m addrtype --dst-type LOCAL -j RETURN

# if MULTICAST, RETURN
-A ufw-not-local -m addrtype --dst-type MULTICAST -j RETURN

# if BROADCAST, RETURN
-A ufw-not-local -m addrtype --dst-type BROADCAST -j RETURN

# all other non-local packets are dropped
-A ufw-not-local -m limit --limit 3/min --limit-burst 10 -j ufw-logging-deny
-A ufw-not-local -j DROP

# allow MULTICAST mDNS for service discovery (be sure the MULTICAST line above
# is uncommented)
-A ufw-before-input -p udp -d 224.0.0.251 --dport 5353 -j ACCEPT

# allow MULTICAST UPnP for service discovery (be sure the MULTICAST line above
# is uncommented)
-A ufw-before-input -p udp -d 239.255.255.250 --dport 1900 -j ACCEPT

# don't delete the 'COMMIT' line or these rules won't be processed
COMMIT
'''

# The job fence, part 2: the six DOCKER-USER drops that keep gha-jobs containers off private, tailnet, link-local and
# multicast ranges, inside the ufw-docker block. The whole file is managed. #735's apt-cache exceptions are ufw route
# rules (user.rules), which DOCKER-USER reaches first through ufw-user-forward; this file neither declares nor removes
# them.
[bootstrap.files."/etc/ufw/after.rules"]
os = "linux"
owner = "root"
group = "root"
mode = "0644"
notify = ["ufw"]
content = '''
#
# rules.input-after
#
# Rules that should be run after the ufw command line added rules. Custom
# rules should be added to one of these chains:
#   ufw-after-input
#   ufw-after-output
#   ufw-after-forward
#

# Don't delete these required lines, otherwise there will be errors
*filter
:ufw-after-input - [0:0]
:ufw-after-output - [0:0]
:ufw-after-forward - [0:0]
# End required lines

# don't log noisy services by default
-A ufw-after-input -p udp --dport 137 -j ufw-skip-to-policy-input
-A ufw-after-input -p udp --dport 138 -j ufw-skip-to-policy-input
-A ufw-after-input -p tcp --dport 139 -j ufw-skip-to-policy-input
-A ufw-after-input -p tcp --dport 445 -j ufw-skip-to-policy-input
-A ufw-after-input -p udp --dport 67 -j ufw-skip-to-policy-input
-A ufw-after-input -p udp --dport 68 -j ufw-skip-to-policy-input

# don't log noisy broadcast
-A ufw-after-input -m addrtype --dst-type BROADCAST -j ufw-skip-to-policy-input

# don't delete the 'COMMIT' line or these rules won't be processed
COMMIT
# BEGIN UFW AND DOCKER
*filter
:ufw-user-forward - [0:0]
:ufw-docker-logging-deny - [0:0]
:DOCKER-USER - [0:0]
-A DOCKER-USER -j ufw-user-forward

-A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN
-A DOCKER-USER -m conntrack --ctstate INVALID -j DROP
# gha-jobs (PC runner): one-job containers may reach the internet only, never LAN, tailnet or link-local
-A DOCKER-USER -i br-gha -m conntrack --ctstate NEW -d 10.0.0.0/8 -j ufw-docker-logging-deny
-A DOCKER-USER -i br-gha -m conntrack --ctstate NEW -d 172.16.0.0/12 -j ufw-docker-logging-deny
-A DOCKER-USER -i br-gha -m conntrack --ctstate NEW -d 192.168.0.0/16 -j ufw-docker-logging-deny
-A DOCKER-USER -i br-gha -m conntrack --ctstate NEW -d 100.64.0.0/10 -j ufw-docker-logging-deny
-A DOCKER-USER -i br-gha -m conntrack --ctstate NEW -d 169.254.0.0/16 -j ufw-docker-logging-deny
-A DOCKER-USER -i br-gha -m conntrack --ctstate NEW -d 224.0.0.0/4 -j ufw-docker-logging-deny
-A DOCKER-USER -i docker0 -o docker0 -j ACCEPT

-A DOCKER-USER -j RETURN -s 10.0.0.0/8
-A DOCKER-USER -j RETURN -s 172.16.0.0/12
-A DOCKER-USER -j RETURN -s 192.168.0.0/16
-A DOCKER-USER -j ufw-docker-logging-deny -m conntrack --ctstate NEW -d 10.0.0.0/8
-A DOCKER-USER -j ufw-docker-logging-deny -m conntrack --ctstate NEW -d 172.16.0.0/12
-A DOCKER-USER -j ufw-docker-logging-deny -m conntrack --ctstate NEW -d 192.168.0.0/16

-A DOCKER-USER -j RETURN

-A ufw-docker-logging-deny -m limit --limit 3/min --limit-burst 10 -j LOG --log-prefix "[UFW DOCKER BLOCK] "
-A ufw-docker-logging-deny -j DROP

COMMIT
# END UFW AND DOCKER
'''

# The runner image, built on the PC by the launcher (gha-slot build). Bootstrap only keeps the file; a change here is
# rebuilt by hand, and no running slot is restarted. runner.json holds private App ids and waits for #637's secrets.
[bootstrap.files."/etc/gha-runner/Dockerfile"]
os = "linux"
owner = "root"
group = "root"
mode = "0644"
content = '''
# Runner image for the PC's one-job container slots (public repos: glaze, cpp-utilities, dotfiles).
# Base: GitHub's official runner image (Ubuntu 24.04, user `runner`, uid 1001). Toolchains are mise-first: the
# image carries mise and sccache; each repo's own tools are installed by `gha-slot warm` (a trusted step, from the
# repo's default branch) into the slot's tools volume, which jobs see read-only at /cache/mise.
# Build on the PC: gha-slot build  (bump the versions below, then rebuild).
ARG RUNNER_VERSION=2.338.2
ARG MISE_VERSION=2026.11.5
FROM jdxcode/mise:${MISE_VERSION} AS mise
FROM ghcr.io/actions/actions-runner:${RUNNER_VERSION}
ARG SCCACHE_VERSION=0.19.0
ARG UV_VERSION=0.13.7

USER root
# Only what mise and typical C/C++ jobs need from the OS; compilers come from mise per repo.
RUN apt-get update \
 && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
      ca-certificates curl git xz-utils zstd unzip jq build-essential pkg-config \
 && rm -rf /var/lib/apt/lists/*
COPY --from=mise /usr/local/bin/mise /usr/local/bin/mise
# sccache and uv are baked into the image (installed by mise at build time). uv is what mise's pipx: backend
# uses when pipx itself is absent (repos pin Python tools as pipx:<pkg>, e.g. cpp-utilities' check-jsonschema).
RUN export MISE_DATA_DIR=/tmp/m MISE_CACHE_DIR=/tmp/c MISE_STATE_DIR=/tmp/s \
 && mise install-into "sccache@${SCCACHE_VERSION}" /opt/sccache && mise install-into "uv@${UV_VERSION}" /opt/uv \
 && ln -s /opt/sccache/*/sccache /usr/local/bin/sccache \
 && for b in uv uvx; do ln -s "$(find /opt/uv -name "$b" -type f | head -1)" /usr/local/bin/$b; done \
 && rm -rf /tmp/m /tmp/c /tmp/s && sccache --version && uv --version

# The job user may not regain root: drop the image's sudo rights and docker group membership.
RUN rm -f /etc/sudoers.d/* && gpasswd -d runner sudo && gpasswd -d runner docker || true

# /cache/mise = tools volume (read-only in jobs, written only by `gha-slot warm` with MISE_DATA_DIR=/cache/mise),
# /cache/sccache = compiler cache volume (writable). In jobs mise's data dir is the job's home, and the tools
# volume is a shared install dir that mise only reads: tools from the default branch come from there, and a tool a
# branch adds installs into the job's home and is thrown away with the container.
ENV MISE_DATA_DIR=/home/runner/.local/share/mise \
    MISE_SHARED_INSTALL_DIRS=/cache/mise/installs \
    MISE_CACHE_DIR=/home/runner/.cache/mise \
    MISE_STATE_DIR=/home/runner/.local/state/mise \
    MISE_YES=1 \
    SCCACHE_DIR=/cache/sccache \
    PATH=/home/runner/.local/share/mise/shims:$PATH

USER runner
WORKDIR /home/runner
'''
