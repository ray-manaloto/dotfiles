#:schema https://mise.jdx.dev/schema/mise.json

# Mac host target: ray-manaloto/dotfiles is the sole source for this user-global
# mise config through mise-native dotfiles. The takeover is pending as of
# 2026-10-09; this active file remains standalone. Preserve host changes here
# and stage the durable source in dotfiles before declaring migration complete.
# Tracking: https://github.com/ray-manaloto/dotfiles-legacy/issues/220 (global config)
# Broader takeover: https://github.com/ray-manaloto/dotfiles-legacy/issues/431
# Ownership decision: https://github.com/ray-manaloto/dotfiles-legacy/issues/448
# Plan: ray-manaloto/dotfiles/docs/specs/mise-native-dotfiles-plan.md
# Add the include below by array merge; never replace the actual global config.
# Built-in {{ mise_config_dir }} (2026.10.19) and system_brew_prefix need 2026.10.19 or newer;
# task.history needs 2026.11.3. A hard minimum, not a soft one: an older mise that meets a setting it
# doesn't know warns and drops this file's whole [settings] table (src/config/settings.rs:1635-1646 at
# v2026.10.19), paranoid and the disable lists included, where this stops it with an upgrade hint.
min_version = "2026.11.3"

[settings]
github.credential_command = "gh auth token"
experimental = true
#verbose = true
activate_aggressive = true
# Your own repos load by path, and so do Codex task copies (~/.codex/worktrees/<id>/<repo>): Codex
# makes one only for a task you started on that repo. mise matches these by folder prefix only, so
# a Codex copy of any repo loads. Any other repo runs no mise config until you approve it. Without
# paranoid config mode, `mise install`, `mise run` and `mise exec` in a fresh clone trust it on the
# spot and run its env, hooks and tasks. With it, they exit 1 until `mise trust`, that approval is
# tied to the file's contents (an edit needs approval again), and worktrees outside the trusted
# folder do not inherit it. Reading trees (third-party clones, mirrors, retired checkouts) are in
# miserc.toml's ignored_config_paths, which wins over this list, so their configs never load and
# shims there keep working. The global git hooks run `mise x hk`, so `git commit` in an unapproved
# clone with a mise.toml fails until `mise trust` (or `HK=0`). Test harnesses that make configs in temporary folders set
# MISE_TRUSTED_CONFIG_PATHS for their run. python/tests/test_mise_trust.py checks all of this.
paranoid = ["config"]
trusted_config_paths = ["~/.config/mise", "~/dev/github/ray-manaloto", "~/.codex/worktrees"]
minimum_release_age = "0s"
lockfile = true
# DL-768: one global config and one lock for every OS this repo supports.
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]

disable_tools = ["antigravity-cli", "aqua:google-antigravity/antigravity-cli", "npm:@openai/codex", "aqua:openai/codex", "codex", "claude-code", "npm:@anthropic-ai/claude-code", "github:anthropics/claude-code", "opencode", "aqua:anomalyco/opencode", "npm:opencode-ai", "npm:@opencode/cli", "github:anomalyco/opencode", "aqua:sst/opencode", "github:sst/opencode"]
# claude/codex/agy/opencode are native-installer-only (Ray, 2026-10-01; opencode 2026-11-02). `disable_tools` above is REPLACED by any
# project's own list, so a stale worktree pinning one of them still auto-installed it (dag-tick launchd job,
# `mise exec` in a pytest gate). This key is NOT overridden by any tracked project and blocks auto-install on
# `mise exec`/`mise run`; it does not block an explicit `mise install <tool>`. Match is literal to the config
# key, so every spelling is listed. Never use MISE_DISABLE_TOOLS for this: it replaces project lists.
auto_install_disable_tools = ["antigravity-cli", "aqua:google-antigravity/antigravity-cli", "codex", "aqua:openai/codex", "npm:@openai/codex", "claude-code", "github:anthropics/claude-code", "npm:@anthropic-ai/claude-code", "opencode", "aqua:anomalyco/opencode", "npm:opencode-ai", "npm:@opencode/cli", "github:anomalyco/opencode", "aqua:sst/opencode", "github:sst/opencode"]
pin = true
install_layout = "identity"
# Keep each task's last 20 runs (time, result, exit code) for `mise tasks history`, under
# $MISE_STATE_DIR/task-history/. On by default since 2026.11.3; set here so a default change can't
# turn it off. task.logs (each task's last output) stays off: it can keep unredacted private text.
task.history = true

[settings.self_update]
auto = true
check_duration = "1h"

#minimum_release_age_excludes = ["pipx:langgraph-cli", "pipx:specify-cli", "npm:oh-my-codex", "npm:skills", "npm:renovate", "rumdl", "docker-cli", "gemini", "npm:agent-browser", "npm:portless", "github:DopplerHQ/cli", "github:docker/docker-agent", "bats", "pipx:datamodel-code-generator", "pipx:notebooklm-py"]
[settings.go]
set_gobin = false

[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true

[settings.python]
compile = false
#precompiled_arch = "x86_64_v2"
#precompiled_flavor = "x86_64_v2-*"
#precompiled_os = "x86_64_v2"
# Walks up to the nearest uv.lock; if its .venv (or UV_PROJECT_ENVIRONMENT) is missing, creates it
# with uv, then activates it (mise src/uv.rs). Through a shim, `python3` still runs mise's Python, but
# a non-interactive caller whose PATH starts with the shims (hooks from a GUI-launched Claude, launchd)
# creates that .venv as a side effect. An activated zsh puts the install dirs first, so it does not.
uv_venv_auto = "create|source"

[settings.status]
show_tools = true
missing_tools = "always"
show_env = true

# mise-env-fnox is intentionally disabled. Empirical reproduction on
# 2026-04-09 showed that enabling it spawns runaway `fnox config-files`
# subprocesses (10+ concurrent at 100% CPU each, shell hangs during
# login-shell sourcing).
# Shells hold no secrets; commands get them through `fnox exec`.


[env]
HK_MISE = "1"
# Platform hints for tool backends
#MISE_OS = "macos"
#MISE_ARCH = "arm"
CONDA_SUBDIR = "osx-arm64"
GIT_TERMINAL_PROMPT = "0"
# vcpkg's root is the mise vcpkg-tool install (see [tools]); no telemetry.
VCPKG_ROOT = { value = "{{ tools['github:microsoft/vcpkg-tool'].path }}", tools = true }
VCPKG_DISABLE_METRICS = "1"
# NotebookLM auth: standardize paths so agents find credentials consistently
NOTEBOOKLM_HOME = "~/.notebooklm"
# Mossop pattern: name the brew prefix once; PATH entries below expand it (env_shell_expand).
HOMEBREW_PREFIX = "{{ system_brew_prefix }}"
# DL-766: ordinary LLVM clang owns CC/CXX; paths come from mise templates, never literals (DL-764).
CC = "{% if os() == 'macos' %}{{ system_brew_prefix }}/opt/llvm/bin/clang{% else %}clang{% endif %}"
CXX = "{% if os() == 'macos' %}{{ system_brew_prefix }}/opt/llvm/bin/clang++{% else %}clang++{% endif %}"
# bun's node-gyp helper runs `bun x node-gyp` when npm_config_node_gyp is unset; a stale mise
# node-gyp shim then falls back to that helper and it calls itself forever. Name the real node-gyp
# (node's bundled npm, version read from mise.lock) for every npm tool mise installs and every
# bun or npm run in a shell, so no shim is ever looked up. A home with no mise.lock next to this file
# (a scratch or test home) gets an empty value: read_toml of a missing file fails every mise command.
npm_config_node_gyp = "{% set lock = xdg_config_home ~ '/mise/mise.lock' %}{% if lock is file %}{{ xdg_data_home }}/mise/installs/node/{{ read_toml(path=lock)['tools']['node'][0]['version'] }}/lib/node_modules/npm/node_modules/node-gyp/bin/node-gyp.js{% endif %}"

[env._]
#_.fnox-env = { tools = true }
# LLVM/Clang: Homebrew's latest LLVM (clang-format, clang-tidy, lldb, lld included)
# Brew formula: https://formulae.brew.sh/formula/llvm (keg-only, needs explicit paths)
# Prefix is arch-aware: arm64=/opt/homebrew, amd64=/usr/local
# DL-591: keg-only llvm and lldb need their opt bins; make gnubin gives an unprefixed GNU make;
# DL-755: ~/.local/share/p2996/bin holds <name>-p2996 links into the prefix ~/.local/share/p2996/<id>.
path = [
  "$HOMEBREW_PREFIX/opt/llvm/bin",
  "$HOMEBREW_PREFIX/opt/lldb/bin",
  "$HOMEBREW_PREFIX/opt/make/libexec/gnubin",
  "~/.local/share/p2996/bin",
  # DL-757: opam switch "llvm" (OCaml, ocamlfind, ctypes) for LLVM's OCaml bindings.
  "~/.opam/llvm/bin",
  # DL-687: Orca CLI (orca) ships inside the app bundle.
  "/Applications/Orca.app/Contents/Resources/bin",
]

[tools]
#"github:docker/buildx" = { version = "0.38.1", asset_pattern = "buildx-v0.38.0.darwin-arm64", bin = "docker-buildx" }
