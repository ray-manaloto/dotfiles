# in [env] names this install, so CMake presets use $env{VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake.
"github:microsoft/vcpkg-tool" = { version = "2026-10-29", minimum_release_age = "0s", additional_asset_patterns = ["vcpkg-standalone-bundle.tar.gz"], rename_exe = "vcpkg", platforms = { macos-arm64 = { asset_pattern = "vcpkg-macos" }, linux-x64 = { asset_pattern = "vcpkg-glibc" }, linux-arm64 = { asset_pattern = "vcpkg-glibc-arm64" } } }

# P2996 build extras (DL-756, DL-757): tools live here, never in a project; mise registry first, then
# conda (swig, doxygen and ocaml are not in the mise registry), then brew. SWIG generates lldb's Python
# and Lua bindings; Lua is the latest mise release (lldb's build.rst names 5.3 and 5.4 only); doxygen
# replaces a version-less shim that broke CMake's doxygen check; opam provides ocamlfind and ctypes for
# LLVM's OCaml bindings (switch "llvm", on PATH above). The Python modules LLVM uses (opt-viewer, MLIR
# bindings) are locked in the p2996 uv project (DL-758). ruff and ty lint that project through hk.
"conda:swig" = { version = "4.5.1", minimum_release_age = "0s" }
lua = { version = "5.5.1", minimum_release_age = "0s" }
"conda:doxygen" = { version = "1.18.0", minimum_release_age = "0s" }
"conda:zstd-static" = { version = "1.5.7", minimum_release_age = "0s" }
"github:ocaml/opam" = { version = "2.6.1", minimum_release_age = "0s" }
ruff = { version = "0.17.4", minimum_release_age = "0s" }
ty = { version = "0.0.101", minimum_release_age = "0s" }
# swift/ (jbax): hk's swiftlint builtin; macOS only, like jbax. Formatting is the toolchain's own `swift format`.
swiftlint = { version = "0.65.1", minimum_release_age = "0s", os = ["macos"] }

# --- webclaw: local browser-enabled build -------------------------------------
# Added 2026-10-20. The prebuilt release (github:0xMassi/webclaw) is compiled
# WITHOUT the Cargo `browser` feature: `--render always` fails immediately with
# "this webclaw build has no browser support; build it with `--features browser`"
# and `--render auto` is compiled out. v0.7.0 publishes only the six platform
# tarballs (all built with a plain `cargo build --release`), and the crate is not
# on crates.io, so mise's `cargo:` backend is the only way to get browser support.
#
# What mise runs:
#   cargo install --git=https://github.com/0xMassi/webclaw.git --tag=v0.7.0 \
#                 --locked --features=browser webclaw-cli --root <install dir>
# Verify: `webclaw --version` must print "webclaw 0.7.0 +browser".
#
# Options, and why:
#   crate    = "webclaw-cli"  virtual workspace (members = ["crates/*"]);
#                             without it `cargo install --git` errors.
#   features = ["browser"]    the only non-default feature in the CLI graph;
#                             adds chromey (CDP client) and drives the local
#                             Chrome. Do NOT add default-features = false:
#                             quickjs is default-on in webclaw-core.
#   locked   = true           `cargo install` ignores Cargo.lock without it, and
#                             wreq is pinned to an rc with no semver stability.
#
# Upgrading (manual by design): for a cargo git source mise only lists HEAD as
# a remote version, so `mise upgrade` / `mise outdated` will NOT see new tags,
# and `mise upgrade --bump` would install the default branch (staging), not a
# release. Bump the tag explicitly:
#   git ls-remote --tags --refs https://github.com/0xMassi/webclaw.git \
#     | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1
# then edit tag:vX.Y.Z and run `mise install`. Renovate can automate this.
# minimum_release_age is ignored for tag: refs.
#
# Python (deferred 2026-10-20; webclaw-cli was not on PyPI yet): the repo's
# python/ package is a maturin bin wheel and already sets
#   [tool.maturin] features = ["browser"]
# so a published wheel will be browser-enabled too. Once it is on PyPI:
#   uv pip install webclaw-cli==0.7.0
# Until then build it from the same tag:
#   cd offline/webclaw/github/0xMassi/webclaw/python && uv build --wheel
#   uv pip install dist/webclaw_cli-0.7.0-*.whl
# The wheel bundles its own +browser binary; there is no env var to make it use
# the mise-installed one. PyPI `webclaw` is a DIFFERENT package: the hosted-API
# SDK (wc_ key, api.webclaw.io).
#
# Known traps:
#   - An existing shell keeps the old github install dir on PATH until
#     `mise activate` runs again (the shim comes later on PATH). Check with
#     `command -v webclaw`; `mise x -- webclaw --version` uses the active toolset.
#   - `--render auto` still skips webclaw.io /data/startups/company/* pages:
#     their text sits in a hidden Next.js wrapper (#S:0) that
#     visible_word_count counts, so the JS heuristic says "no render needed".
#     Retries of those URLs need `--render always`.
#
#"github:0xMassi/webclaw" = { version = "0.7.0", minimum_release_age = "0s" }
"cargo:0xMassi/webclaw" = { version = "tag:v0.7.0", crate = "webclaw-cli", features = ["browser"], locked = true, minimum_release_age = "0s" }

"pypi:pyrefly" = { version = "1.4.0", minimum_release_age = "0s" }
# agent-desktop drives macOS apps through the Accessibility tree (vercel-labs/agent-desktop, Apache-2.0). On trial:
# can an agent work with an IDE that is not the frontmost app? It needs Accessibility, which macOS charges to the
# process that launched it (herdr-core under herdr), not to this binary. The lock records its GitHub attestation.
"github:vercel-labs/agent-desktop" = { version = "1.2.0", minimum_release_age = "0s" }
"npm:@ai-sdk/openai-compatible" = { version = "3.0.90", minimum_release_age = "0s" }
"npm:apify-cli" = { version = "1.11.0", minimum_release_age = "0s" }
jouet = { version = "0.0.4", workflow = "release.yml@refs/heads/main", minimum_release_age = "0s" }

#[tool_alias]
#devcontainer = "npm:@devcontainers/cli"
# [hooks] postinstall = "mise lock"  -- REMOVED 2026-07-30.
# A bare `mise lock` re-locks the WHOLE lockfile and drops platform/conda
# entries for tools it cannot resolve on this host (dotfiles #370: 548
# linux-x64 entries lost). Wiring it to postinstall fired that on EVERY
# `mise install`. Only a scoped re-lock is safe:
#     mise lock "<backend>:<name>"      (dotfiles: mise run lock -- "<tool>")
# --- update tasks ------------------------------------------------------------
# Run `update-all` (the guarded alias in [shell_alias]) on its own: it already runs brew
# update/upgrade, mise self-update and mise upgrade, so running those first repeats the work.
# DAG: mise tasks deps --compact; plan: mise run -n update:all
# An unfinished tool install that holds mise's tool-version lock wedges every later `mise run`;
# scripts/mise_update_guard.py detects it (see [shell_alias]).
# update:brew and update:check are file tasks in tasks/update/: hometools update-brew and update-check
# do their work (#392).

[tasks."update:mise"]
description = "update mise tools"
# Always from $HOME: run from a stale worktree, `mise install -y` would install its pins (incl. agy/codex).
dir = "~/"
# wait_for, not depends: brew goes first only when both are scheduled (update:all), because
# mise's Python installs link Homebrew gettext (libintl) and a brew upgrade mid-run breaks
# them with a dyld error; `mise run update:mise` alone never runs brew.
wait_for = ["update:brew"]
# update_mise.py runs its phases one after another, because each needs the previous one (the
# first, self-update, replaces mise's own binary); `-j 8` on its upgrade phase parallelises the
# tool downloads inside that one upgrade.
#
# ⚠️ `mise upgrade --bump -y`, NOT `mise upgrade --bump -- --system -y`.
# `--system` is NOT an upgrade flag (measured: `error: unexpected argument
# '--system' found`); it exists only on `mise install`. Whoever hit that error
# followed mise's own tip — "to pass '--system' as a value, use `-- --system`" —
# which turned both tokens into positional TOOL NAMES, and `mise upgrade`
# discards unknown tool names silently (a bogus name returns "All tools are up
# to date", rc=0). So `--system` AND `-y` were both being thrown away, and the
# `-y` is the one that matters: without it this prompts.
#
# Python alone uses `mise lock --global --bump python`, then `mise install
# python`, to preserve its configured range without reinstalling historical
# pipx environments. Other tools use native upgrade/install lock updates.
# Keep the global lock format current: the outer guard treats mise warnings
# as incomplete even when every child command exits 0. See docs/python-upgrade-policy.md.
# AgentsView may perform a one-time archive resync before opening its listener.
# The owner returns STARTUP_PENDING (75) until it is ready; wait for the verified
# service and release-check job rather than treating that state as a failed update.
# The Python runner preserves these exact sequential commands, records each
# phase/return code, and passes one existing GitHub credential only to this
# task's mise children (including vfox plugins that read GITHUB_TOKEN).
run = "{{ mise_config_dir }}/scripts/update_mise.py"

[tasks."update:claude"]
# A leaf (no depends, no wait_for) that never calls mise, so it overlaps brew and mise.
description = "update claude, marketplace and plugins"
# Behaviour (every (id, scope) pair with no `.enabled` filter, marketplaces refreshed first,
# -y off a TTY, a thread pool because mise has no per-item worker pool): see the
# update_claude.py docstring.
# The script also emits a JSON summary (`$CLAUDE_UPDATE_JSON`, default
# `~/.config/mise/.update-claude.json`) and exits non-zero if `claude update`,
# any marketplace refresh, or any plugin update failed (since 2026-09-29),
# so a later step can consume the result instead of parsing this task's text.
# Concurrency: `CLAUDE_UPDATE_JOBS` (default 8).
# `{{config_root}}` for the GLOBAL config is `~`, not `~/.config/mise` — measured:
# `{{config_root}}/scripts/…` resolved to `~/scripts/…` and mise warned the file
# was missing. `run` with the built-in `mise_config_dir` keeps the username out of this file;
# a templated `file` runs too, but `mise tasks validate` checks it unrendered (DL-706).
run = "{{ mise_config_dir }}/scripts/update_claude.py"

[tasks."update:codex"]
description = "update the NATIVE codex install (never a mise pin)"
# claude, codex and agy are native-installer-only on this Mac (Ray, 2026-10-01):
# every mise name for them is in `disable_tools` above. Absolute path on purpose —
# a stale mise shim can sit ahead of ~/.local/bin on PATH.
run = "$HOME/.local/bin/codex update && $HOME/.local/bin/codex --version"

[tasks."update:agy"]
description = "update the NATIVE agy (Antigravity) install (never a mise pin)"
run = "$HOME/.local/bin/agy update && $HOME/.local/bin/agy --version"

[tasks."update:all"]
description = "update all tools (brew, mise, native claude/codex/agy) — the one command to run"
# depends entries start in parallel; update:mise waits for update:brew (see update:mise).
# Keep update:brew in depends: wait_for in update:mise only orders brew, it never schedules it.
depends = ["update:brew", "update:mise", "update:claude", "update:codex", "update:agy"]
run = ["mise doctor", "mise run toolchain:verify"]

[shell_alias]
# ⚠️ THESE CALL THE GUARD DIRECTLY, NOT `mise run`, AND THAT IS THE WHOLE POINT.
# `scripts/mise_update_guard.py` checks whether a tool-version install lock is
# held before starting: a LIVE holder is refused by name (pid + what it is
# installing, exit 2, never waits); a STALE one from a dead process is reported,
# cleared, and the run proceeds. Every run appends one line to
# ~/.config/mise/update-runs.log — timestamp | task | tools | duration | rc.
# The guard also holds a non-blocking update lock and checkpoints a private
# structured receipt under ~/.config/mise/update-evidence/<run-id>/run.json;
# update-evidence/latest.json points at the active or last run, and
# last-failure.json preserves the last unsuccessful attempt. A RUNNING receipt
# with an old updated_at and child_pid helps diagnose an interrupted wrapper.
# Task output is echoed live and retained in private stdout/stderr logs next
# to run.json. Mise already collects normal task output by line; the wrapper
# tees mise's streams without selecting `mise run --raw`. A child rc=0 with
# any mise warning, GitHub rate-limit error, or failed version query is
# INCOMPLETE (guard rc=2), while run.json retains the child's actual return
# code. The final summary includes the reason, counts, and triggering log lines.
#
# It must NOT be wired as a mise task (`file = ...`). A mise task runs INSIDE
# `mise run`, which resolves tools first — so the guard would block on the very
# lock it exists to detect, and report nothing. Running it outside mise is what
# lets it observe the lock rather than join the queue, where an unfinished tool install wedges it.
#
# Bypass deliberately with `mise run update:all` if you ever need the unguarded
# path; the guard is a seatbelt, not a cage.
update-claude = "$HOME/.config/mise/scripts/mise_update_guard.py update:claude"
update-all = "$HOME/.config/mise/scripts/mise_update_guard.py update:all"
update-check = "$HOME/.config/mise/scripts/mise_update_guard.py update:check"
claude_dangerous = "claude --dangerously-skip-permissions --brief"
codex_yolo = "codex --yolo"
gemini_yolo = "gemini --yolo"
# The opencode wrapper adds --standalone, which `opencode upgrade` rejects (v2.2.7 commands.ts:14-28): update the
# real binary directly.
opencode-update = "$HOME/.opencode/bin/opencode upgrade"
# Codex's installer appends a PATH block to ~/.zprofile (a tracked file) whenever it finds a second codex on PATH,
# and the mise wrapper is one (openai/codex scripts/install/install.sh:600-631 at rust-v0.165.0). Update with a PATH
# that leaves out mise's wrappers, so it sees one codex and leaves the profile alone.
codex-update = "PATH=\"$HOME/.local/bin:/usr/bin:/bin:/usr/sbin:/sbin\" $HOME/.local/bin/codex update"

# Codex and OpenCode start under `fnox proxy run` with the keys and proxy rules of the one fnox file
# (~/.config/fnox/config.toml): the harness gets placeholders and the proxy adds the real key for each rule's host
# (context7 and exa; OpenCode's model providers too). mise puts the command-wrappers dir first on PATH (v2026.11.6
# src/toolset/toolset_paths.rs:183-195) and, while a wrapper runs, sends its command and everything it starts to the
# real tool (src/cli/shim.rs:241-249), so fnox finds the real codex. Claude needs no wrapper: its apify key comes
# from a headersHelper. A Doppler error starts the harness with placeholders that the proxy refuses until Doppler is
# back. Shells only: herdr argv launches skip [wrappers] (codex-hc covers Codex).
# OpenCode runs --standalone: its background service (`opencode serve --service`) makes the MCP calls otherwise,
# outside the proxy (owner ruling 2026-11-11; packages/cli/src/services/server-connection.ts at v2.2.7).
# Bypass, no keys: run the real binary by path (`~/.local/bin/codex`, `~/.opencode/bin/opencode`);
# `mise exec -- codex` still goes through the wrapper. Run `mise reshim` after changing this table.
[wrappers.codex]
command = "fnox"
args = ["--non-interactive", "proxy", "run", "--", "codex"]

[wrappers.opencode]
command = "fnox"
args = ["--non-interactive", "proxy", "run", "--", "opencode", "--standalone"]

[vars]
# DL-764, DL-770: the one home for compiler and brew versions; conf.d/toolchain.toml renders
# [bootstrap.packages] from them and toolchain:verify checks the installs match.
# To bump gcc or llvm: install the new version first (unpin it, brew upgrade it, pin it again), then edit
# these and run `mise run bootstrap:toolchain`. A commit that changes [vars] runs //home:integration
# (repotools toolchain-gate), which fails until the installs match: a typo or an uninstalled version stops it.
gcc = "16.2.0"
gcc_major = "16"
llvm = "23.1.5"
llvm_major = "23"
iwyu = "0.27"
gdb = "18.1"
make = "4.4.1"
pkgconf = "3.0.10"

[task_config]
includes = ["{{ mise_config_dir }}/agentsview-native/tasks.toml", "{{ mise_config_dir }}/tasks"]

# D268: adopt existing Docker Desktop; updater lifecycle stays docker desktop CLI.
# DL-714: Ruby before the package plan, which evaluates the Orca cask.
# One line (zero-bash rule). Off macOS it renders empty and mise runs `sh -c ""`, exit 0, as the
# blank lines the multi-line form rendered did.
[bootstrap.hooks.pre-packages]
run = '{% if os() == "macos" %}mise bootstrap packages apply brew:ruby --yes{% endif %}'

# hc's skill is a mise-run install, so it waits for the tools phase. It goes to Claude (~/.claude/skills)
# and to ~/.agents/skills, which Codex and OpenCode read and Antigravity CLI reads through the
# ~/.gemini/config/skills link in the repo's mise.toml; herdr:doctor checks each (V10). The tag
# comes from the installed hc: `hc --version` prints `hc 0.1.19` and starts no core, and the line installs
# herdr-core#v0.1.19, so a Herdr self-update needs no pin bump to keep V10 green. With no hc on PATH (a
# new Mac before Herdr's first run installs it), the line says to open Herdr once and rerun bootstrap,
# and exits 0 so bootstrap goes on and V10 shows the gap. When hc prints no `hc X.Y.Z`, the line fails
# with a message and installs nothing. Like agent-desktop's line, it
# is not skipped when installed: a re-run puts the tag's files back, so a stale copy is replaced and a new
# hc's tag reaches every folder.
# Only claude-code and codex are named: before the repo's `mise dot apply` makes that link, antigravity-cli
# would make ~/.gemini/config/skills a real folder (skills 1.8.1 remove.mjs:1416-1421), which the apply
# then refuses to replace.
# The removal comes first: `skills add herdrdev/herdr` installed the Herdr TUI's skill, which tells
# agents to drive a TUI that no longer runs, and four skills for working on Herdr's own repo. The
# name matches the folder, and the source matches every lock entry from that repo (skills 1.7.5
# resolveSkillsToRemove); with nothing to remove it exits 0.
# agent-desktop's core, macOS, FFI and jev skills come from the tag of the pinned binary, which compiles
# the same files in (v1.2.0 crates/core/src/commands/skills.rs:4-16,44-54), so they match
# `agent-desktop skills get`. Windows and Linux are left out. jev needs an agent-desktop clone. The tag
# must equal the agent-desktop pin above (python/tests/test_herdr_app.py checks it). It is not skipped
# when installed: a re-run puts the tag's files back, so a bumped tag replaces the old ones.
[bootstrap.hooks.post-tools]
run = [
  "mise exec -- skills remove herdr herdrdev/herdr -g -y </dev/null",
  "command -v hc >/dev/null || { echo 'post-tools: herdr-core is not installed yet; open Herdr once, then rerun mise bootstrap' >&2; exit 0; }; v=$(hc --version </dev/null | sed -n 's/^hc \\([0-9][0-9]*\\.[0-9][0-9]*\\.[0-9][0-9]*\\)$/\\1/p') && [ -n \"$v\" ] || { echo 'post-tools: hc --version printed no hc X.Y.Z, so the herdr-core skill is not installed' >&2; exit 1; }; mise exec -- skills add \"herdrdev/herdr-core#v$v\" -g -a claude-code codex -s herdr-core -y </dev/null",
  "mise exec -- skills add vercel-labs/agent-desktop#v1.2.0 -g -a claude-code codex -s agent-desktop agent-desktop-macos agent-desktop-ffi jev-desktop -y </dev/null",
]

# DL-770: mise uses package specs exactly as written (docs/bootstrap.md:392), so [bootstrap.files]
# renders them from [vars] before the packages step. mise reads its config before this file is written:
# after a [vars] change run `mise run bootstrap:toolchain` (two bootstrap runs, then toolchain:verify).
# DL-591: native mise brew packages (mise bootstrap packages apply; not mise install).
# DL-595: exact versions hold these against `mise bootstrap packages upgrade` (which ignores brew pins);
# `brew pin` holds them against brew. A fresh machine skips exact entries with a warning: apply with
# "latest" once, then restore the exact values. Majors move together: unpin, upgrade, toolchain:verify, re-pin.
# Mac sshd takes keys only (owner, 2026-11-11; Mac-wide settings go through chief-of-staff): the PC runs public CI
# and reaches this Mac on port 22. sshd keeps the first value it reads, so 050 sorts before macOS's own
# 100-macos.conf. No restart needed: launchd starts a fresh sshd per connection (ssh.plist inetdCompatibility,
# Wait false), and each reads this file. Check: ssh -o BatchMode=yes -o PreferredAuthentications=none
# -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null localhost true prints Permission denied (publickey)
# (the two host-key options only stop an unknown localhost key failing first). Undo: state = "absent".
[bootstrap.files."/etc/ssh/sshd_config.d/050-no-password.conf"]
os = "macos"
owner = "root"
group = "wheel"
mode = "0644"
content = """
PasswordAuthentication no
KbdInteractiveAuthentication no
"""

[bootstrap.directories."~/.config/mise/conf.d"]
phase = "pre-packages"

[bootstrap.files."~/.config/mise/conf.d/toolchain.toml"]
phase = "pre-packages"
template = true
content = '''
# Generated by mise bootstrap from [vars] in ~/.config/mise/config.toml (DL-770); do not edit.
[bootstrap.packages]
"brew:gcc" = { version = "{{ vars.gcc }}", os = "macos" }
"brew:llvm" = { version = "{{ vars.llvm }}", os = "macos" }
"brew:lld" = { version = "{{ vars.llvm }}", os = "macos" }
"brew:lldb" = { version = "{{ vars.llvm }}", os = "macos" }
"brew:include-what-you-use" = { version = "{{ vars.iwyu }}", os = "macos" }
"brew:gdb" = { version = "{{ vars.gdb }}", os = "macos" }
"brew:make" = { version = "{{ vars.make }}", os = "macos" }
"brew:pkgconf" = { version = "{{ vars.pkgconf }}", os = "macos" }  # DL-603: vcpkg triplets use /opt/homebrew/opt/pkgconf
'''

# DL-770: the versioned brew packages render from [vars] into conf.d/toolchain.toml
# ([bootstrap.files] above); only unversioned entries stay here.
[bootstrap.packages]
"macos-app:docker-desktop" = { version = "4.97.0", url = "https://desktop.docker.com/mac/main/arm64/244584/Docker.dmg", sha256 = "94e4ccec4a035b7dcdf67cfff0520d4b46ee873ae04b155abc0d22b333cc90ad", artifact = "Docker.app", adopt = true, os = "macos/arm64" }
# DL-714: Orca self-updates, so the cask adopts the app in place instead of pinning a zip.
# mise evaluates a third-party-tap cask with Ruby 3+ on PATH; macOS ships 2.6 ([bootstrap.hooks.pre-packages]).
"brew:ruby" = { os = "macos" }
"brew-cask:stablyai/orca/orca" = { os = "macos", adopt = true }
# Herdr self-updates, so the cask adopts the app. No package ships herdr-core: the app's first-run
# setup runs Herdr's installer, which also adds hc.
"brew-cask:herdr-app" = { os = "macos", adopt = true, appdir = "~/Applications" }
# A current git instead of the one bundled with the Xcode Command Line Tools.
"brew:git" = { os = "macos" }
# Remote access to the x86 desktop. Tailscale is a pkg cask: installing it needs the owner's sudo.
# Moonlight was installed by a bare brew install before this entry: mise sees Homebrew owns the cask
# and leaves it unchanged. adopt keeps an existing app in place on a fresh mise install.
"brew-cask:tailscale-app" = { os = "macos", adopt = true }
"brew-cask:moonlight" = { os = "macos", adopt = true }
# The Omarchy (Arch) x86 desktop: Tailscale, and the Sunshine game-stream host from Omarchy's own
# pacman repository. mise runs `pacman -S --needed` with sudo; a machine without pacman skips
# these. Keep updates with the distribution's own full upgrade: `mise bootstrap packages upgrade`
# is an Arch partial upgrade.
"pacman:tailscale" = { os = "linux" }
"pacman:sunshine" = { os = "linux" }

# DL-591: gcc/g++ wrappers retired; use the Homebrew gcc-16 and g++-16 names.

# gh auth, for every project on this Mac: `mise doctor project`.
[doctor.checks.gh-env-token]
description = "No stale GH_TOKEN or GITHUB_TOKEN overrides the gh login"
run = '[ -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}" ] || gh api user --silent'
hint = "A bad env token beats the keyring with no fallback. Unset it or restart this process; pass tokens only through fnox exec."
timeout = "15s"

[doctor.checks.gh-keyring]
description = "The stored gh login works without env tokens"
run = "env -u GH_TOKEN -u GITHUB_TOKEN gh api user --silent"
hint = "Run `gh auth login`. Sandboxed agents without keychain access use dev/github-env.sh."
timeout = "15s"

[doctor.checks.gh-scopes]
description = "The stored gh login has repo, workflow and read:org"
# One line, so `mise doctor project` in the global pre-push hook never needs this checkout's Python.
# With --json, gh auth status always exits 0, so the jq prints ok or missing and the test compares it.
# Scopes are matched whole: a substring test would take public_repo for repo.
run = '''[ "$(env -u GH_TOKEN -u GITHUB_TOKEN gh auth status --active --no-refresh --hostname github.com --json hosts --jq '.hosts["github.com"][]? | select(.active) | if .state == "success" and (["repo","workflow","read:org"] - (.scopes | split(", ")) | length) == 0 then "ok" else "missing" end')" = ok ]'''
hint = "Run `gh auth refresh -s repo,workflow,read:org`."
timeout = "15s"
depends = "gh-keyring"

[doctor.checks.gh-hosts-file]
description = "gh keeps its token in the keyring, not in hosts.yml"
run = "! grep -q oauth_token ~/.config/gh/hosts.yml"
hint = "Run `gh auth logout`, then `gh auth login` so the token moves to the keyring."

[doctor.checks.gh-ssh]
description = "SSH to GitHub authenticates"
run = "ssh -T -o BatchMode=yes -o ConnectTimeout=8 git@github.com 2>&1 | grep -q 'successfully authenticated'"
hint = "Check your SSH key in the agent and on GitHub."
timeout = "15s"
