# --- webclaw: local browser-enabled build -------------------------------------
# Added 2026-10-20. The prebuilt release (github:0xMassi/webclaw) is compiled
# WITHOUT the Cargo `browser` feature: `--render always` fails immediately with
# "this webclaw build has no browser support; build it with `--features browser`"
# and `--render auto` is compiled out. v0.7.0 publishes only the six platform
# tarballs (all built with a plain `cargo build --release`), and the crate is not
# on crates.io, so mise's `cargo:` backend is the only way to get browser support.
#
# What mise runs:
#   cargo install --git=https://github.com/0xMassi/webclaw.git --tag=v0.7.0 \
#                 --locked --features=browser webclaw-cli --root <install dir>
# Verify: `webclaw --version` must print "webclaw 0.7.0 +browser".
#
# Options, and why:
#   crate    = "webclaw-cli"  virtual workspace (members = ["crates/*"]);
#                             without it `cargo install --git` errors.
#   features = ["browser"]    the only non-default feature in the CLI graph;
#                             adds chromey (CDP client) and drives the local
#                             Chrome. Do NOT add default-features = false:
#                             quickjs is default-on in webclaw-core.
#   locked   = true           `cargo install` ignores Cargo.lock without it, and
#                             wreq is pinned to an rc with no semver stability.
#
# Upgrading (manual by design): for a cargo git source mise only lists HEAD as
# a remote version, so `mise upgrade` / `mise outdated` will NOT see new tags,
# and `mise upgrade --bump` would install the default branch (staging), not a
# release. Bump the tag explicitly:
#   git ls-remote --tags --refs https://github.com/0xMassi/webclaw.git \
#     | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1
# then edit tag:vX.Y.Z and run `mise install`. Renovate can automate this.
# minimum_release_age is ignored for tag: refs.
#
# Python (deferred 2026-10-20; webclaw-cli was not on PyPI yet): the repo's
# python/ package is a maturin bin wheel and already sets
#   [tool.maturin] features = ["browser"]
# so a published wheel will be browser-enabled too. Once it is on PyPI:
#   uv pip install webclaw-cli==0.7.0
# Until then build it from the same tag:
#   cd offline/webclaw/github/0xMassi/webclaw/python && uv build --wheel
#   uv pip install dist/webclaw_cli-0.7.0-*.whl
# The wheel bundles its own +browser binary; there is no env var to make it use
# the mise-installed one. PyPI `webclaw` is a DIFFERENT package: the hosted-API
# SDK (wc_ key, api.webclaw.io).
#
# Known traps:
#   - An existing shell keeps the old github install dir on PATH until
#     `mise activate` runs again (the shim comes later on PATH). Check with
#     `command -v webclaw`; `mise x -- webclaw --version` uses the active toolset.
#   - `--render auto` still skips webclaw.io /data/startups/company/* pages:
#     their text sits in a hidden Next.js wrapper (#S:0) that
#     visible_word_count counts, so the JS heuristic says "no render needed".
#     Retries of those URLs need `--render always`.
#
#"github:0xMassi/webclaw" = { version = "0.7.0", minimum_release_age = "0s" }
"cargo:0xMassi/webclaw" = { version = "tag:v0.7.0", crate = "webclaw-cli", features = ["browser"], locked = true, minimum_release_age = "0s" }

"pypi:pyrefly" = { version = "1.4.0", minimum_release_age = "0s" }

#[tool_alias]
#devcontainer = "npm:@devcontainers/cli"
# [hooks] postinstall = "mise lock"  -- REMOVED 2026-07-30.
# A bare `mise lock` re-locks the WHOLE lockfile and drops platform/conda
# entries for tools it cannot resolve on this host (dotfiles #370: 548
# linux-x64 entries lost). Wiring it to postinstall fired that on EVERY
# `mise install`. Only a scoped re-lock is safe:
#     mise lock "<backend>:<name>"      (dotfiles: mise run lock -- "<tool>")
# --- update tasks ------------------------------------------------------------
# Run `update-all` (the guarded alias in [shell_alias]) on its own: it already runs brew
# update/upgrade, mise self-update and mise upgrade, so running those first repeats the work.
# DAG: mise tasks deps --compact; plan: mise run -n update:all
# A wedged install that holds mise's tool-version lock blocks every later `mise run`
# (knowledge-base #418); scripts/mise_update_guard.py detects it (see [shell_alias]).
[tasks."update:brew"]
description = "update brew tools (refuses while the compiler toolchain is unpinned)"
# --json is available on `brew outdated` if this ever needs to feed another step.
#
# `--yes` on the upgrade: brew CAN prompt (casks that need confirmation), and this
# task runs inside `update:all` where stdin is not a terminal — a prompt there
# hangs or fails rather than being answered. Checked against the installed brew:
# `upgrade` accepts `--yes`, `--force` and `--dry-run`; `update` has no prompt to
# suppress (only `--force`/`--quiet`), so it is left alone.
# DL-595: refuse unless the toolchain set is pinned, then upgrade the rest and verify the toolchain.
run = '''
set -euo pipefail
pinned="$(brew list --pinned)"
for f in gcc llvm lld lldb include-what-you-use gdb make pkgconf; do
  if ! printf '%s\n' "$pinned" | grep -qx "$f"; then
    echo "update:brew: $f is not pinned; run 'brew pin $f' or do a planned toolchain upgrade (DL-595)" >&2
    exit 1
  fi
done
brew update
brew upgrade --yes
mise run toolchain:verify
'''

[tasks."toolchain:verify"]
description = "Check the held Homebrew toolchain: versions, IWYU/LLVM match, dylib links, pins (DL-595)"
run = '''
set -euo pipefail
want_llvm=23
want_gcc=16
llvm=/opt/homebrew/opt/llvm/bin
clang_v="$("$llvm/clang" -dumpversion)"
case "$clang_v" in "$want_llvm".*) ;; *) echo "clang $clang_v is not $want_llvm.x" >&2; exit 1;; esac
gcc_v="$(/opt/homebrew/bin/gcc-$want_gcc -dumpfullversion)"
case "$gcc_v" in "$want_gcc".*) ;; *) echo "gcc-$want_gcc reports $gcc_v" >&2; exit 1;; esac
iwyu=/opt/homebrew/opt/include-what-you-use/bin/include-what-you-use
iwyu_v="$("$iwyu" --version)"
case "$iwyu_v" in *"based on Homebrew clang version $clang_v") ;; *) echo "iwyu/LLVM mismatch: $iwyu_v vs clang $clang_v" >&2; exit 1;; esac
for bin in "$iwyu" /opt/homebrew/opt/lld/bin/ld64.lld /opt/homebrew/opt/lldb/bin/lldb; do
  libs="$(/usr/bin/otool -L "$bin" | awk 'NR>1 && $1 ~ /^\/opt\/homebrew\// {print $1}')"
  for lib in $libs; do
    [ -e "$lib" ] || { echo "$bin: missing $lib" >&2; exit 1; }
  done
done
/opt/homebrew/opt/lld/bin/ld.lld --version
/opt/homebrew/bin/gdb --version | head -n 1
/opt/homebrew/bin/gmake --version | head -n 1
/opt/homebrew/opt/pkgconf/bin/pkgconf --version
p2996="$HOME/.local/state/marketplace-tool-foundation/p2996"
case "$(/bin/realpath "$p2996/current")" in "$p2996"-configure-*/prefix) ;; *) echo "p2996/current does not resolve to a dated prefix" >&2; exit 1;; esac
# P2996 default configs: unversioned triple names, versionless SDK equal to xcrun's (replaces the
# two-file existence loop). Needs $p2996 from the line above.
cur="$p2996/current/bin" sfx="$p2996/suffixed/bin"
sdk="$(xcrun --show-sdk-path)"
[ -d "$sdk" ] || { echo "xcrun SDK $sdk does not exist" >&2; exit 1; }
for cfg in arm64-apple-darwin.cfg arm64-apple-darwin-clang++.cfg; do
  [ -f "$cur/$cfg" ] && [ "$sfx/$cfg" -ef "$cur/$cfg" ] || { echo "missing P2996 default config $cfg in $cur or $sfx" >&2; exit 1; }
done
for stale in "$cur"/arm64-apple-darwin[0-9]*.cfg "$sfx"/arm64-apple-darwin[0-9]*.cfg; do
  if [ -e "$stale" ] || [ -L "$stale" ]; then echo "versioned P2996 config $stale shadows the unversioned one" >&2; exit 1; fi
done
cfg_sdk="$(sed -n 's/^-isysroot[ =]//p' "$cur/arm64-apple-darwin.cfg")"
[ -d "$cfg_sdk" ] || { echo "P2996 config SDK '$cfg_sdk' does not exist" >&2; exit 1; }
[ "$cfg_sdk" = "$sdk" ] || { echo "P2996 config SDK $cfg_sdk is not xcrun's $sdk" >&2; exit 1; }
for pair in clang-p2996:arm64-apple-darwin.cfg clang++-p2996:arm64-apple-darwin-clang++.cfg; do
  exe="$sfx/${pair%%:*}" want="${pair#*:}"
  ver="$(env -u SDKROOT -u CLANG_NO_DEFAULT_CONFIG "$exe" --version)"
  case "$ver" in *"Configuration file: "*"/$want"*) ;; *) echo "$exe does not load $want" >&2; exit 1;; esac
  got="$(env -u SDKROOT -u CLANG_NO_DEFAULT_CONFIG "$exe" -### -x c++ -c /dev/null 2>&1 | sed -n 's/.*"-isysroot" "\([^"]*\)".*/\1/p' | head -n 1)"
  [ "$got" = "$sdk" ] || { echo "$exe uses sysroot '$got', not xcrun's $sdk" >&2; exit 1; }
done
"$sfx/clang++-p2996" --version | head -n 1
pinned="$(brew list --pinned)"
for f in gcc llvm lld lldb include-what-you-use gdb make pkgconf; do
  printf '%s\n' "$pinned" | grep -qx "$f" || { echo "$f is not pinned" >&2; exit 1; }
done
mise bootstrap packages status --missing
echo "toolchain:verify OK: clang $clang_v, gcc $gcc_v, $iwyu_v"
'''

[tasks."update:mise"]
description = "update mise tools"
# Always from $HOME: run from a stale worktree, `mise install -y` would install its pins (incl. agy/codex).
dir = "~/"
# wait_for, not depends: brew goes first only when both are scheduled (update:all), because
# mise's Python installs link Homebrew gettext (libintl) and a brew upgrade mid-run breaks
# them with a dyld error; `mise run update:mise` alone never runs brew.
wait_for = ["update:brew"]
# update_mise.py runs its phases one after another, because each needs the previous one (the
# first, self-update, replaces mise's own binary); `-j 8` on its upgrade phase parallelises the
# tool downloads inside that one upgrade.
#
# ⚠️ `mise upgrade --bump -y`, NOT `mise upgrade --bump -- --system -y`.
# `--system` is NOT an upgrade flag (measured: `error: unexpected argument
# '--system' found`); it exists only on `mise install`. Whoever hit that error
# followed mise's own tip — "to pass '--system' as a value, use `-- --system`" —
# which turned both tokens into positional TOOL NAMES, and `mise upgrade`
# discards unknown tool names silently (a bogus name returns "All tools are up
# to date", rc=0). So `--system` AND `-y` were both being thrown away, and the
# `-y` is the one that matters: without it this prompts.
#
# Python alone uses `mise lock --global --bump python`, then `mise install
# python`, to preserve its configured range without reinstalling historical
# pipx environments. Other tools use native upgrade/install lock updates.
# Keep the global lock format current: the outer guard treats mise warnings
# as incomplete even when every child command exits 0. See docs/python-upgrade-policy.md.
# AgentsView may perform a one-time archive resync before opening its listener.
# The owner returns STARTUP_PENDING (75) until it is ready; wait for the verified
# service and release-check job rather than treating that state as a failed update.
# The Python runner preserves these exact sequential commands, records each
# phase/return code, and passes one existing GitHub credential only to this
# task's mise children (including vfox plugins that read GITHUB_TOKEN).
run = "{{ vars.mise_config_dir }}/scripts/update_mise.py"

[tasks."update:claude"]
# A leaf (no depends, no wait_for) that never calls mise, so it overlaps brew and mise.
description = "update claude, marketplace and plugins"
# Behaviour (every (id, scope) pair with no `.enabled` filter, marketplaces refreshed first,
# -y off a TTY, a thread pool because mise has no per-item worker pool): see the
# update_claude.py docstring.
# The script also emits a JSON summary (`$CLAUDE_UPDATE_JSON`, default
# `~/.config/mise/.update-claude.json`) and exits non-zero if `claude update`,
# any marketplace refresh, or any plugin update failed (since 2026-09-29),
# so a later step can consume the result instead of parsing this task's text.
# Concurrency: `CLAUDE_UPDATE_JOBS` (default 8).
# `{{config_root}}` for the GLOBAL config is `~`, not `~/.config/mise` — measured:
# `{{config_root}}/scripts/…` resolved to `~/scripts/…` and mise warned the file
# was missing. `run` with `vars.mise_config_dir` keeps the username out of this file;
# a templated `file` runs too, but `mise tasks validate` checks it unrendered (DL-706).
run = "{{ vars.mise_config_dir }}/scripts/update_claude.py"

[tasks."update:check"]
description = "structured, read-only: what is outdated? (exit 1 if anything is)"
# Cheap enough to run any time — nothing is installed or upgraded. Every source is
# printed AND gated, which is the fix made 2026-08-24: `mise upgrade --dry-run-code`
# exits 1 on mise drift, but `brew outdated` and `mise outdated` only ever PRINT, so
# the task reported rc=0 — "in sync" — with libksba and opencode-desktop both
# outdated, while the description above promised exit 1. `jq` is pinned above, so the
# emptiness tests read the STRUCTURE rather than grepping for a substring.
#
# Three exit codes, kept distinct because collapsing them is how the defect happened:
#   0  checked, nothing outdated
#   1  checked, something is outdated
#   2  COULD NOT CHECK — a source failed to answer. Never reported as green.
#
# Deliberately NOT gated: mise's "newer versions outside the configured version
# ranges" notice. Those are pinned on purpose, so gating them would make this task
# exit 1 essentially always. `mise upgrade --bump` is the tool for that question.
run = "set -uo pipefail\ndrift=0\n\nif ! brew_json=$(brew outdated --json); then\n  echo \"update:check: 'brew outdated' failed — COULD NOT CHECK\" >&2\n  exit 2\nfi\nprintf '%s\n' \"$brew_json\"\nprintf '%s' \"$brew_json\" | jq -e '((.formulae | length) + (.casks | length)) > 0' >/dev/null && drift=1\n\nif ! mise_json=$(mise outdated --json); then\n  echo \"update:check: 'mise outdated' failed — COULD NOT CHECK\" >&2\n  exit 2\nfi\nprintf '%s\n' \"$mise_json\"\nprintf '%s' \"$mise_json\" | jq -e 'length > 0' >/dev/null && drift=1\n\nmise upgrade --dry-run-code || drift=1\n\nexit \"$drift\"\n"

[tasks."update:codex"]
description = "update the NATIVE codex install (never a mise pin)"
# claude, codex and agy are native-installer-only on this Mac (Ray, 2026-10-01):
# every mise name for them is in `disable_tools` above. Absolute path on purpose —
# a stale mise shim can sit ahead of ~/.local/bin on PATH.
run = "$HOME/.local/bin/codex update && $HOME/.local/bin/codex --version"

[tasks."update:agy"]
description = "update the NATIVE agy (Antigravity) install (never a mise pin)"
run = "$HOME/.local/bin/agy update && $HOME/.local/bin/agy --version"

[tasks."update:all"]
description = "update all tools (brew, mise, native claude/codex/agy) — the one command to run"
# depends entries start in parallel; update:mise waits for update:brew (see update:mise).
# Keep update:brew in depends: wait_for in update:mise only orders brew, it never schedules it.
depends = ["update:brew", "update:mise", "update:claude", "update:codex", "update:agy"]
run = ["mise doctor", "mise run toolchain:verify"]

[shell_alias]
# ⚠️ THESE CALL THE GUARD DIRECTLY, NOT `mise run`, AND THAT IS THE WHOLE POINT.
# `scripts/mise_update_guard.py` checks whether a tool-version install lock is
# held before starting: a LIVE holder is refused by name (pid + what it is
# installing, exit 2, never waits); a STALE one from a dead process is reported,
# cleared, and the run proceeds. Every run appends one line to
# ~/.config/mise/update-runs.log — timestamp | task | tools | duration | rc.
# The guard also holds a non-blocking update lock and checkpoints a private
# structured receipt under ~/.config/mise/update-evidence/<run-id>/run.json;
# update-evidence/latest.json points at the active or last run, and
# last-failure.json preserves the last unsuccessful attempt. A RUNNING receipt
# with an old updated_at and child_pid helps diagnose an interrupted wrapper.
# Task output is echoed live and retained in private stdout/stderr logs next
# to run.json. Mise already collects normal task output by line; the wrapper
# tees mise's streams without selecting `mise run --raw`. A child rc=0 with
# any mise warning, GitHub rate-limit error, or failed version query is
# INCOMPLETE (guard rc=2), while run.json retains the child's actual return
# code. The final summary includes the reason, counts, and triggering log lines.
#
# It must NOT be wired as a mise task (`file = ...`). A mise task runs INSIDE
# `mise run`, which resolves tools first — so the guard would block on the very
# lock it exists to detect, and report nothing. Running it outside mise is what
# lets it observe the lock rather than join the queue. See knowledge-base #418.
#
# Bypass deliberately with `mise run update:all` if you ever need the unguarded
# path; the guard is a seatbelt, not a cage.
update-claude = "$HOME/.config/mise/scripts/mise_update_guard.py update:claude"
update-all = "$HOME/.config/mise/scripts/mise_update_guard.py update:all"
update-check = "$HOME/.config/mise/scripts/mise_update_guard.py update:check"
claude_dangerous = "claude --dangerously-skip-permissions --brief"
codex_yolo = "codex --yolo"
gemini_yolo = "gemini --yolo"

# DL-706: one home for the global mise directory; honours MISE_CONFIG_DIR, else the default.
[vars]
mise_config_dir = "{{ env.MISE_CONFIG_DIR | default(value=env.HOME ~ '/.config/mise') }}"

[task_config]
includes = ["{{ vars.mise_config_dir }}/agentsview-native/tasks.toml", "{{ vars.mise_config_dir }}/tasks"]

# D268: adopt existing Docker Desktop; updater lifecycle stays docker desktop CLI.
# DL-714: Ruby before the package plan, which evaluates the Orca cask.
[bootstrap.hooks.pre-packages]
run = '''
{% if os() == "macos" %}
mise bootstrap packages apply brew:ruby --yes
{% endif %}
'''

# DL-714: herdr writes its Claude and Codex hooks once per bootstrap, not on every herdr install.
# herdr re-adds its entry last and Orca rewrites its own entry in place, so ~/.codex/hooks.json
# settles at Orca first, herdr second; trust it once in Codex ("Hooks need review" -> Trust all).
[bootstrap.hooks.post-tools]
run = '''
for integration in claude codex; do
  mise exec -- herdr integration install "${integration}"
done
'''

[bootstrap.packages]
"brew:gcc" = { version = "16.2.0", os = "macos" }
"brew:llvm" = { version = "23.1.4", os = "macos" }
# DL-591: native mise brew packages (mise bootstrap packages apply; not mise install).
# DL-595: exact versions hold these against `mise bootstrap packages upgrade` (which ignores brew pins);
# `brew pin` holds them against brew. A fresh machine skips exact entries with a warning: apply with
# "latest" once, then restore the exact values. Majors move together: unpin, upgrade, toolchain:verify, re-pin.
"brew:lld" = { version = "23.1.4", os = "macos" }
"brew:lldb" = { version = "23.1.4", os = "macos" }
"brew:include-what-you-use" = { version = "0.27", os = "macos" }
"brew:gdb" = { version = "18.1", os = "macos" }
"brew:make" = { version = "4.4.1", os = "macos" }
"brew:pkgconf" = { version = "3.0.10", os = "macos" }  # DL-603: vcpkg triplets use /opt/homebrew/opt/pkgconf
"macos-app:docker-desktop" = { version = "4.97.0", url = "https://desktop.docker.com/mac/main/arm64/244584/Docker.dmg", sha256 = "94e4ccec4a035b7dcdf67cfff0520d4b46ee873ae04b155abc0d22b333cc90ad", artifact = "Docker.app", adopt = true, os = "macos/arm64" }
# DL-714: Orca self-updates, so the cask adopts the app in place instead of pinning a zip.
# mise evaluates a third-party-tap cask with Ruby 3+ on PATH; macOS ships 2.6 ([bootstrap.hooks.pre-packages]).
"brew:ruby" = { os = "macos" }
"brew-cask:stablyai/orca/orca" = { os = "macos", adopt = true }

# DL-591: gcc/g++ wrappers retired; use the Homebrew gcc-16 and g++-16 names.
