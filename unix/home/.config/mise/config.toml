#:schema https://mise.jdx.dev/schema/mise.json

# Mac host target: ray-manaloto/dotfiles is the sole source for this user-global
# mise config through mise-native dotfiles. The takeover is pending as of
# 2026-10-09; this active file remains standalone. Preserve host changes here
# and stage the durable source in dotfiles before declaring migration complete.
# Tracking: https://github.com/ray-manaloto/dotfiles-legacy/issues/220 (global config)
# Broader takeover: https://github.com/ray-manaloto/dotfiles-legacy/issues/431
# Ownership decision: https://github.com/ray-manaloto/dotfiles-legacy/issues/448
# Plan: ray-manaloto/dotfiles/docs/specs/mise-native-dotfiles-plan.md
# Add the include below by array merge; never replace the actual global config.
[settings]
experimental = true
#verbose = true
activate_aggressive = true
trusted_config_paths = ["/"]
minimum_release_age = "0s"
lockfile = true
lockfile_platforms = ["macos-arm64"]

disable_tools = ["antigravity-cli", "aqua:google-antigravity/antigravity-cli", "npm:@openai/codex", "aqua:openai/codex", "codex", "claude-code", "npm:@anthropic-ai/claude-code", "github:anthropics/claude-code"]
# claude/codex/agy are native-installer-only (Ray, 2026-10-01). `disable_tools` above is REPLACED by any
# project's own list, so a stale worktree pinning one of them still auto-installed it (dag-tick launchd job,
# `mise exec` in a pytest gate). This key is NOT overridden by any tracked project and blocks auto-install on
# `mise exec`/`mise run`; it does not block an explicit `mise install <tool>`. Match is literal to the config
# key, so every spelling is listed. Never use MISE_DISABLE_TOOLS for this: it replaces project lists.
auto_install_disable_tools = ["antigravity-cli", "aqua:google-antigravity/antigravity-cli", "codex", "aqua:openai/codex", "npm:@openai/codex", "claude-code", "github:anthropics/claude-code", "npm:@anthropic-ai/claude-code"]
pin = true
install_layout = "identity"

[settings.self_update]
auto = true
check_duration = "1h"

#minimum_release_age_excludes = ["pipx:langgraph-cli", "pipx:specify-cli", "npm:oh-my-codex", "npm:skills", "npm:renovate", "rumdl", "opencode", "docker-cli", "gemini", "npm:agent-browser", "npm:portless", "github:DopplerHQ/cli", "github:docker/docker-agent", "bats", "pipx:datamodel-code-generator", "pipx:notebooklm-py", "herdr"]
[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true

[settings.python]
compile = false
#precompiled_arch = "x86_64_v2"
#precompiled_flavor = "x86_64_v2-*"
#precompiled_os = "x86_64_v2"
uv_venv_auto = "create|source"

[settings.status]
show_tools = true
missing_tools = "always"
show_env = true

# mise-env-fnox is intentionally disabled. Empirical reproduction on
# 2026-04-09 showed that enabling it spawns runaway `fnox config-files`
# subprocesses (10+ concurrent at 100% CPU each, shell hangs during
# login-shell sourcing). Authoritative rationale + repro + suspected root
# causes are tracked in:
#   https://github.com/ray-manaloto/macos-development-environment/issues/75
# Secrets env loading is now handled by `fnox activate zsh` in
# home/dot_zshrc.d/50-mde-secrets.zsh, which installs chpwd/precmd hooks
# that decrypt the age-encrypted sync cache into the shell environment.
# See docs/secrets-workflow.md for the full architecture.


[env]
HK_MISE = "1"
# Platform hints for tool backends
#MISE_OS = "macos"
#MISE_ARCH = "arm"
CONDA_SUBDIR = "osx-arm64"
GIT_TERMINAL_PROMPT = "0"
# NotebookLM auth: standardize paths so agents find credentials consistently
NOTEBOOKLM_HOME = "~/.notebooklm"
# MDE path variables below locate data used by existing workflows. They do
# not define the source of this global mise config.
# Layer 2: mise expands $MDE_PROJECT_DIR/$MDE_GENERATED_DIR at shell activation via env_shell_expand
# Migration note: give MDE_PROJECT_DIR a dotfiles-native source before
# declaring the takeover complete.
# Other MDE variables compose from $MDE_PROJECT_DIR or $MDE_GENERATED_DIR.
MDE_PROJECT_DIR = "$HOME/dev/github/ray-manaloto/macos-development-environment"
MDE_GENERATED_DIR = "$MDE_PROJECT_DIR/.generated"
MDE_DIR_REMEMBER = "$MDE_GENERATED_DIR/remember"
MDE_DIR_LEARNINGS = "$MDE_GENERATED_DIR/learnings"
MDE_DIR_TRANSCRIPTS = "$MDE_GENERATED_DIR/transcripts"
MDE_DIR_SCHEMAS = "$MDE_GENERATED_DIR/schemas"
MDE_DIR_REPORTS = "$MDE_GENERATED_DIR/reports"
MDE_DIR_CONTEXT = "$MDE_GENERATED_DIR/context"
MDE_DIR_DREAM = "$MDE_GENERATED_DIR/dream"
MDE_DIR_TRAIL = "$MDE_GENERATED_DIR/trail"
CC = "/opt/homebrew/opt/llvm/bin/clang"
CXX = "/opt/homebrew/opt/llvm/bin/clang++"

[env._]
#_.fnox-env = { tools = true }
# LLVM/Clang: Homebrew's latest LLVM (clang-format, clang-tidy, lldb, lld included)
# Brew formula: https://formulae.brew.sh/formula/llvm (keg-only, needs explicit paths)
# Prefix is arch-aware: arm64=/opt/homebrew, amd64=/usr/local
# DL-591: keg-only llvm and lldb need their opt bins; make gnubin gives an unprefixed GNU make;
# p2996/suffixed is a prefix (bin/<name>-p2996, include, lib, libexec, share) linked through p2996/current,
# so tools that resolve ../include from argv[0] (clang-scan-deps) still find the P2996 libc++.
path = [
  "/opt/homebrew/opt/llvm/bin",
  "/opt/homebrew/opt/lldb/bin",
  "/opt/homebrew/opt/make/libexec/gnubin",
  "~/.local/state/marketplace-tool-foundation/p2996/suffixed/bin",
  # DL-757: opam switch "llvm" (OCaml, ocamlfind, ctypes) for LLVM's OCaml bindings.
  "~/.opam/llvm/bin",
  # DL-687: Orca CLI (orca) ships inside the app bundle.
  "/Applications/Orca.app/Contents/Resources/bin",
]

