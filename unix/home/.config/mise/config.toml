# Python 3.15 is the default; retain 3.14.8 for incompatible CLI environments.
# Affected tools select their interpreter with native per-tool options.
# Runtime selectors are native mise options; see docs/python-upgrade-policy.md.
# update:mise keeps these minor/patch selections and retains recovery installs.
python = [{ version = "3.15", minimum_release_age = "0s" }, { version = "3.14.8", minimum_release_age = "0s" }]
#python = { version = "3.15.2", minimum_release_age = "0s" }
