#:schema https://fnox.jdx.dev/schema.json
# Doppler references only; the provider and its service token come from the global fnox config.
root = true

[profiles.agentsview_recall.secrets]
OPENROUTER_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "OPENROUTER_API_KEY", env = true, if_missing = "error" }
AGENTSVIEW_RECALL_PROXY_KEY = { provider = "doppler_dotfiles_dev_personal", value = "AGENTSVIEW_RECALL_PROXY_KEY", env = true, if_missing = "error" }
