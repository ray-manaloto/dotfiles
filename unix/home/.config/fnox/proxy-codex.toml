#:schema https://fnox.jdx.dev/schema.json
# Proxy rules for `fnox proxy run -P agent-codex`, loaded with `-c` on top of the global config.toml (fnox 1.47.0:
# a -c file loads with the global config, and a later [proxy] table replaces the earlier one), so each harness
# gets only its own hosts: fnox has one [proxy] table and no per-profile rules, and every rule's secret must be
# in the profile. The harness holds placeholders; the proxy puts the real key into the Authorization header of
# requests to these hosts. Permissive egress: hosts without a rule (other model providers, git, package
# registries) pass through untouched; strict would refuse them. Not a sandbox: anything running as the user can
# still run fnox itself.
[proxy]
egress = "permissive"

[[proxy.rules]]
secret = "CONTEXT7_API_KEY"
domain = "mcp.context7.com"
header = "authorization"
methods = ["GET", "POST", "DELETE"]

[[proxy.rules]]
secret = "EXA_API_KEY"
domain = "mcp.exa.ai"
header = "authorization"
methods = ["GET", "POST", "DELETE"]
