#:schema https://fnox.jdx.dev/schema.json
# Global fnox config: the read-only Doppler service token for dotfiles/dev_personal, in the
# doppler_write profile the owner's read/write one that only `mise run secret:set` uses, and one
# profile per consumer (agent-<harness>, mcp-<server>, cli-<tool>) that the mise [wrappers], codex-hc
# and the apify headersHelper run with `fnox -c ~/.config/fnox/config.toml exec -P <profile>`.
# Other projects keep their Doppler references in their own fnox.toml.
# Replace the read token with `fnox set DOPPLER_TOKEN --global --provider age`, then keep env = false.
# Never `fnox set` a secret on the doppler provider: fnox writes its value here in plain text.
# Add a Doppler secret with `pbpaste | mise run secret:set NAME`.

# Keep resolved secrets in memory, so a harness started again reads them without a Doppler call.
# A first start while Doppler is unreachable waits on doppler's own retries (owner accepted).
[daemon]
enabled = true

[providers.keychain]
type = "keychain"
service = "dotfiles-fnox"

[providers.age]
type = "age"
recipients = ["age16djrq9gc4kgdaxve0lua75q97qed6g858ec4s830hpry6nx8qalqns0x8d"]
identity = { provider = "keychain", value = "AGE_PRIVATE_KEY" }

[providers.doppler_dotfiles_dev_personal]
type = "doppler"
project = "dotfiles"
config = "dev_personal"
token = { secret = "DOPPLER_TOKEN" }

# Every profile also gets these top-level secrets. Keep this table to the token with env = false, so no
# consumer receives it: a secret added here would reach every harness.
[secrets]
DOPPLER_TOKEN= { provider = "age", value = "", env = false }

# The read/write token for dotfiles/dev_personal, for `mise run secret:set` alone: it is the profile's own
# DOPPLER_TOKEN because that is the variable doppler reads, and only `fnox exec --profile doppler_write`
# hands it out. The owner stores it with
#   pbpaste | fnox set DOPPLER_TOKEN --global --profile doppler_write --provider age
# which keeps env, if_missing and daemon_cache. Until then the profile fails instead of running without a token.
# daemon_cache = false: the fnox daemon never holds the write token, so it is decrypted only for secret:set.
[profiles.doppler_write.secrets]
DOPPLER_TOKEN = { provider = "age", env = "exec", if_missing = "error", daemon_cache = false }

# Consumers. Each key is a Doppler reference read only into the command's environment; if_missing = "warn"
# starts the consumer without it when Doppler fails.
[profiles.agent-codex.secrets]
CONTEXT7_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "CONTEXT7_API_KEY", env = "exec", if_missing = "warn" }
EXA_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "EXA_API_KEY", env = "exec", if_missing = "warn" }

# The model-provider keys are for the providers in ~/.config/opencode/opencode.json ({env:VAR} there); its
# proxy rules are in proxy-opencode.toml, and every rule's secret must be in this profile.
[profiles.agent-opencode.secrets]
CONTEXT7_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "CONTEXT7_API_KEY", env = "exec", if_missing = "warn" }
EXA_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "EXA_API_KEY", env = "exec", if_missing = "warn" }
OPENROUTER_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "OPENROUTER_API_KEY", env = "exec", if_missing = "warn" }
APINEX_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "APINEX_API_KEY", env = "exec", if_missing = "warn" }
EXPERIENTIAL_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "EXPERIENTIAL_API_KEY", env = "exec", if_missing = "warn" }
RESPAN_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "RESPAN_API_KEY", env = "exec", if_missing = "warn" }

# For the apify server's headersHelper in ~/.claude.json, so Claude itself needs no wrapper.
[profiles.mcp-apify.secrets]
APIFY_TOKEN = { provider = "doppler_dotfiles_dev_personal", value = "APIFY_TOKEN", env = "exec", if_missing = "warn" }

[profiles.cli-hyperresearch.secrets]
EXA_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "EXA_API_KEY", env = "exec", if_missing = "warn" }
CORE_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "CORE_API_KEY", env = "exec", if_missing = "warn" }
FRED_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "FRED_API_KEY", env = "exec", if_missing = "warn" }
HYPERRESEARCH_CONTACT_EMAIL = { provider = "doppler_dotfiles_dev_personal", value = "HYPERRESEARCH_CONTACT_EMAIL", env = "exec", if_missing = "warn" }
