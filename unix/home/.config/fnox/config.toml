#:schema https://fnox.jdx.dev/schema.json
# Global fnox config: the read-only Doppler service token for dotfiles/dev_personal, and in the
# doppler_write profile the owner's read/write one that only `mise run secret:set` uses.
# Everything else is a Doppler reference in a project fnox.toml.
# Replace the read token with `fnox set DOPPLER_TOKEN --global --provider age`, then keep env = false.
# Never `fnox set` a secret on the doppler provider: fnox writes its value here in plain text.
# Add a Doppler secret with `pbpaste | mise run secret:set NAME`.

[providers.keychain]
type = "keychain"
service = "dotfiles-fnox"

[providers.age]
type = "age"
recipients = ["age16djrq9gc4kgdaxve0lua75q97qed6g858ec4s830hpry6nx8qalqns0x8d"]
identity = { provider = "keychain", value = "AGE_PRIVATE_KEY" }

[providers.doppler_dotfiles_dev_personal]
type = "doppler"
project = "dotfiles"
config = "dev_personal"
token = { secret = "DOPPLER_TOKEN" }

[secrets]
DOPPLER_TOKEN= { provider = "age", value = "", env = false }

# The read/write token for dotfiles/dev_personal, for `mise run secret:set` alone: it is the profile's own
# DOPPLER_TOKEN because that is the variable doppler reads, and only `fnox exec --profile doppler_write`
# hands it out. The owner stores it with
#   pbpaste | fnox set DOPPLER_TOKEN --global --profile doppler_write --provider age
# which keeps env and if_missing. Until then the profile fails instead of running without a token.
[profiles.doppler_write.secrets]
DOPPLER_TOKEN = { provider = "age", env = "exec", if_missing = "error" }
