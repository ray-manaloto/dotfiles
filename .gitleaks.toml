# gitleaks config (#154). The hk `gitleaks` builtin runs `gitleaks dir`, which
# scans the ENTIRE working tree — it ignores both the file list hk passes and
# .gitignore — so it flags example secrets in third-party cached docs, generated
# research artifacts, gitignored local tool caches, and illustrative token
# examples in documentation. `gitleaks git` (tracked/committed content) reports
# ZERO real secrets. This allowlist scopes the dir scan to first-party source.
title = "dotfiles-devcontainer"

[extend]
useDefault = true

[[allowlists]]
description = "Non-source paths and documentation examples (no real secrets)."
paths = [
  '''docs/research/mintlify-cache/''',
  '''docs/research/trail/findings/''',
  '''\.codex/''',
  '''\.agent/''',
  # Harness agent worktrees: FULL nested checkouts of this repo (ignored per-clone
  # via .git/info/exclude, 0 tracked files, never present in CI). The scan of the
  # real tree already covers their content. Before 2026-09-23 they were hidden
  # only by accident, by the unanchored research-tree entries.
  '''\.claude/worktrees/''',
  '''\.omg/''',
  '''\.omx/''',
  '''\.idea/''',
  '''\.logging/''',
  '''\.mise/''',
  '''graphify-out/''',
  '''__pycache__/''',
  # Documentation with illustrative `token = "..."` examples, not real secrets.
  '''\.github/workflows/AGENTS\.md''',
]

# The two VERBATIM agent-record trees, docs/research/kb/ and docs/research/runs/,
# were path-allowlisted here until 2026-09-23. They are no longer. These are the
# trees where subagent output, including probe output, is committed verbatim
# (agent-report-persistence.md), so a leaked credential is most likely to land
# there, and the blanket path entry hid all of them to suppress five
# false positives. Measured 2026-09-23 with the default rules and no allowlist:
# 3 findings in kb/ and 2 in runs/ (gitleaks 8.30.1), plus 1 more in runs/ from
# betterleaks 1.8.1. Each was read before being listed below: localhost/doc
# `curl` examples, a redacted placeholder, and a 5-character placeholder in a
# credential URI. A planted token in the same trees still fails both scanners.
#
# DELIBERATE DIVERGENCE from hk-common.pkl `excludePaths`, which still lists both
# trees. That list protects verbatim records from FIXERS rewriting them. It must
# not also blind the SCANNERS, which only read. hk-common.pkl is a base-image
# build input, so its comment ("kept mirrored") was left as it is instead of
# costing a cold rebuild. The hk.pkl step `betterleaks_verbatim_trees` scans
# these trees by path, because hk's global exclude removes them from every
# step's `{{files}}`.
#
# ⚠️ Why not a `.gitleaksignore` fingerprint file: measured 2026-09-23, neither
# gitleaks 8.30.1 nor betterleaks 1.8.1 honored one in `dir` mode (a finding
# listed by its exact fingerprint still returned rc=1). Narrow per-file,
# per-rule entries are the working equivalent.
[[allowlists]]
description = "Five read-and-judged documentation examples inside the verbatim agent-record trees."
targetRules = ["curl-auth-header", "generic-api-key"]
paths = [
  '''^docs/research/kb/raw/src-jan-api-server\.md$''',
  '''^docs/research/kb/reports/agents/claude-code-expert-settings-blast-radius\.md$''',
  '''^docs/research/kb/reports/track-a-cc-autonomy\.md$''',
  '''^docs/research/runs/research-20260709-r2-mac-automation/report\.md$''',
  '''^docs/research/runs/research-20260709-r2-knowledge-base/agents/repo-fit-design\.md$''',
]

# betterleaks-only rule `generic-credential-uri` (a 5-character placeholder in an
# `x-access-token:` URI). gitleaks 8.30.1 has no such rule and REFUSES to load a
# config whose `targetRules` names it ("target rule ID ... does not exist"), so
# this one file gets a path-only entry. That is broader per file, but it covers a
# single historical record.
[[allowlists]]
description = "betterleaks generic-credential-uri placeholder in one archived research run."
paths = [
  '''^docs/research/runs/research-20260709-r2-secrets/agents/ssh-r2-model\.md$''',
]

# ── Vendored raw mirrors under docs/research/kb/raw/ (Ray, 2026-10-01, AskUserQuestion; #1472) ──
# Mirrors of upstream repos/docs are committed BYTE-VERBATIM (agent-artifact-conventions.md rule 8),
# so their false positives are allowlisted by CONTENT, scoped to the mirror tree, rather than one
# path entry per mirrored file. Each value below was read and judged before it was listed.
#
# ⚠️ TRAP — every entry here MUST keep its `targetRules` (or carry no `paths` at all). Measured on
# gitleaks 8.30.1 (2026-10-01, scratch probe): a GLOBAL `[[allowlists]]` (no `targetRules`) that
# has `paths` blinds gitleaks to EVERY finding under that path, even with `condition = "AND"` and
# `regexes` — a planted GitHub PAT in the mirror tree went unreported. Rule-scoped entries honour
# AND in both gitleaks and betterleaks. Do not "simplify" an entry below into a global one; the
# pytest `tests/test_gitleaks_raw_mirror_allowlist.py` plants a token to catch exactly that.

# 1. GitHub commit/tree/blob URL SHAs: a 40-hex git object id inside a github.com URL trips
#    `sourcegraph-access-token`. A commit SHA is public by definition.
[[allowlists]]
description = "raw mirrors: 40-hex git SHAs inside github.com commit/tree/blob URLs."
condition = "AND"
targetRules = ["sourcegraph-access-token"]
regexTarget = "line"
regexes = ['''github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/(commit|tree|blob)/[0-9a-f]{40}''']
paths = ['''(^|/)docs/research/kb/raw/''']

# 2. Exact judged public values tripping `generic-api-key`: mise's PUBLIC minisign release-signing
#    key (`MISE_MINISIGN_KEY` in the Docker cookbook) and the Algolia DocSearch SEARCH-ONLY key in
#    mise's vitepress config (DocSearch keys ship to every browser by design). Exact match only.
[[allowlists]]
description = "raw mirrors: mise public minisign key and Algolia DocSearch search-only key."
condition = "AND"
targetRules = ["generic-api-key"]
regexes = [
  '''^RWTC3g8W3z4RZK3V3qv7fa1QY4JEWyBtqIHW\+85QlJpZc5yG\+uNYNBSZ$''',
  '''^ad09b96a7d2a30eddc2771800da7a1cf$''',
]
paths = ['''(^|/)docs/research/kb/raw/''']

# 3. mise showreel test captures: `"key": "<sha256>"` lines are content hashes, not credentials.
[[allowlists]]
description = "raw mirrors: sha256 cache keys in mise showreel test captures."
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*"key": "[0-9a-f]{64}",?\s*$''']
paths = ['''(^|/)docs/research/kb/raw/.*/showreel/test/captures/[^/]+\.json$''']

# 4. The illustrative `my_password` value in mise's environments docs trips betterleaks-only rule
#    `generic-password`. gitleaks REFUSES an unknown `targetRules` name, so this entry is
#    content-only: no `paths` (the P1 trap needs `paths`) and no `targetRules`, exact value.
[[allowlists]]
description = "mise docs: illustrative my_password placeholder (betterleaks generic-password)."
regexes = ['''^my_password$''']

# Omarchy mirror (2026-09-29b, Ray-approved, AskUserQuestion): plain prose ("credentials, <word>
# rules, packages ...") in a mirrored community README trips generic-api-key. Read and judged.
[[allowlists]]
description = "mise docs mirror: prose false positive in the oma-mise community README."
targetRules = ["generic-api-key"]
paths = [
  '''^docs/research/kb/raw/mise-dotfiles-2026-09-29/omarchy/community/FilipHarald_oma-mise__README\.md$''',
]
