# :schema https://mise.jdx.dev/schema/mise.json
#
# System-wide mise config for Docker devcontainer image
# This is a DEDICATED config — not derived from chezmoi templates.
# Installed to /usr/local/share/mise/config.toml during docker build
# (cookbook canonical path per https://mise.jdx.dev/mise-cookbook/docker).
# Changes here must be validated via CI (never `docker buildx bake dev-load`
# locally — see feedback_base_image_ci_only.md).

# BASE TIER (#160 T9): the tools the image needs to BUILD ITSELF and the core
# C++ toolchain — runtimes (rust STAYS base: cargo/rustup self-checks), the conda
# build tools (the p2996 stage runs cmake/ninja from these shims), bazel,
# micromamba, sqlite. The LLVM-family compiler/linker/debugger toolchain lives in
# apt (see [bootstrap.packages], #222 PR-C). Everything else moved out: the locked dev tools
# live in mise-runtime.toml (installed in the devcontainer-runtime stage
# under MISE_ENV=runtime), the interactive tools live in the chezmoi user
# overlay (home/dot_config/mise/config.toml.tmpl, eager-installed by
# onCreateCommand). Probe-verified: config.<env>.toml is discovered beside
# this file in $MISE_CONFIG_DIR and merged additively.
[tools]
# Core runtimes
node = "latest"
bun = "latest"
go = "latest"
rust = "latest"
zig = "latest"
java = "latest"
deno = "latest"
ruby = "latest"
cargo-binstall = "latest"
# The 20 tools shared with the host (hk, pkl, gitleaks, chezmoi, python, uv,
# pixi, pinact, and the linters) come from .config/mise/conf.d/shared.toml,
# COPYd to /usr/local/share/mise/conf.d/ and merged into this system config —
# exact-pinned so host and image never drift. See epic #160 T5.
# #154: hk-image.pkl's security group runs gitleaks (now provided by the shared
# fragment). It has NO editorconfig step — the editorconfig_checker builtin is
# wired only in the HOST hk.pkl — so editorconfig-checker was dead weight in the
# image and is removed here (#160 T6). Nothing else in the image invokes `ec`.
# Conda packages (C++ toolchain for devcontainer)
# NOTE (#222 PR-C): the LLVM-family toolchain (llvm, llvm-tools, clang, clangxx,
# clang-tools, clang-format, lld, lldb) was MOVED OUT of the conda backend to the
# Ubuntu apt LLVM-22 packages declared in [bootstrap.packages] below. mise's conda
# backend installs one isolated prefix PER tool (rattler per-tool extraction), so
# each carried its OWN 186 MB libLLVM.so — 9 duplicate copies, ~6.9 GB. The apt
# packages all depend on a single shared libLLVM-22 runtime (one 149 MB copy), so
# the same LLVM 22.1.x toolchain costs ~0.68 GB — a ~6.2 GB reclaim, capability
# preserved (clang/clang++/clangd/clang-tidy/clang-format/lld/lldb/llvm-* + the
# asan/ubsan/tsan/fuzzer sanitizers via libclang-rt-22-dev). mise has no non-source
# LLVM backend (conda dups; the asdf-llvm plugin builds from source ~2h), so apt is
# the native "system tools" install. include-what-you-use STAYS conda (Ubuntu's apt
# iwyu is built against clang-19 and drags libLLVM-19+21; conda keeps it on the
# matching clang-22 in one isolated env). cppcheck STAYS conda (no libLLVM — it was
# never part of the duplication). cmake/ninja STAY conda (the p2996 stage uses them).
"conda:cmake" = "latest"
"conda:ninja" = "latest"
"conda:mold" = "latest"
"conda:bear" = "latest"
"conda:ccache" = "latest"
"conda:cppcheck" = "latest"
"conda:include-what-you-use" = "latest"
# `.gdb-post-link.sh` ships in conda-forge gdb's `bin/` as standard conda-build
# packaging convention (recipe `post-link.sh` → `${PREFIX}/bin/.<pkg>-post-link.sh`).
# Its body is fully guarded by `if [[ $(uname) == "Darwin" ]]` (macOS gdb
# codesigning helper), so it is a no-op on Linux. mise's shim creation indexes
# every executable file in `bin/`, including this hidden file. mise doctor's
# missing-shims check then asymmetrically excludes dotfiles from the "actual
# shims" set (`src/shims.rs:467`) but enumerates them from `.mise-bins/`,
# producing a phantom "Missing shims: .gdb-post-link.sh" warning during
# `mise run verify-local`'s persistence gate. Removing the executable bit
# makes mise treat the file as a non-shimmable resource — no deletion of an
# upstream-owned file. See `.claude/rules/persistence-gate-retry.md`.
"conda:gdb" = { version = "latest", postinstall = "find \"$MISE_TOOL_INSTALL_PATH/bin\" -maxdepth 1 -name '.*' -type f -exec chmod -x {} +" }
# conda:lldb moved to apt lldb-22 (#222 PR-C) — see the LLVM note above. conda-forge
# had no lldb-22 build (it pinned lldb to LLVM 21); apt ships lldb-22 matching clang-22.
"conda:lcov" = "latest"
"conda:doxygen" = "latest"
"conda:git" = "latest"
"conda:make" = "latest"
"conda:linux-perf" = "latest"
"conda:tar" = "latest"
"conda:p7zip" = "latest"
"conda:valgrind" = "latest"
"bazel" = "latest"
"sqlite" = "latest"
"micromamba" = "latest"

# conda:imagemagick removed 2026-04-28 — conda-forge solve fails with
# "duplicate records for adwaita-icon-theme-40.1.1-ha770c72_1.tar.bz2"
# (heavy GUI dep chain conflict). If imagemagick is needed, install via
# apt in the Dockerfile (`imagemagick` is a standard Ubuntu package).
# Interactive shell tools (fzf, starship, zellij, htop, …) moved BACK to the
# per-user chezmoi overlay in #160 T9 — they are session conveniences, not
# image build inputs; the overlay eager-installs them at container create
# onto the home volume, so image cache stability no longer depends on them.

# Declarative apt packages — the REAL installer source (#160 T4, wagov-dtt
# pattern). The Dockerfile base stage seeds only curl + ca-certificates (for
# the mise installer), then runs `mise bootstrap packages apply --manager apt
# --yes --update` against this section. Recommends/Suggests are disabled
# image-wide via /etc/apt/apt.conf.d/99no-install-recommends (mise has no
# apt-args flag). The build fails loudly if anything is missing afterwards:
# `mise bootstrap packages status --json --missing` exits 1 (anti-drift gate);
# CI's T7 gap report additionally asserts the status JSON. Keys are
# `manager:package`; values stay "latest" — satisfied by any installed
# version (apply never upgrades), and mise.lock does NOT cover bootstrap
# packages, so pins would add no reproducibility.
# NOTE: mise renamed this from `[system.packages]`/`mise system` (2026.6.4) to
# `[bootstrap.packages]`/`mise bootstrap packages` by 2026.7.0.
[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:gnupg" = "latest"
# graphviz is installed separately below as a pinned GitLab .deb (15.1.0),
# NOT via apt (Ubuntu ships 14.1.2). See the graphviz RUN in
# .devcontainer/Dockerfile (#222 PR-A / folds #22).
"apt:pkg-config" = "latest"
"apt:sudo" = "latest"
"apt:unzip" = "latest"
"apt:zsh" = "latest"
"apt:libatomic1" = "latest"
"apt:libbz2-dev" = "latest"
"apt:libreadline-dev" = "latest"
"apt:libsqlite3-dev" = "latest"
"apt:libssl-dev" = "latest"
"apt:zlib1g-dev" = "latest"
# LLVM-22 C++ toolchain (#222 PR-C) — Ubuntu 26.04's version-suffixed apt packages
# all depend on ONE shared libLLVM-22 runtime, replacing the 8 conda LLVM tools that
# each duplicated a 186 MB libLLVM.so (~6.9 GB → ~0.68 GB). Version is pinned by the
# `-22` package name (no drift to 23; patch updates within 22 are fine). The
# unversioned binaries (clang, clang++, clangd, clang-tidy, clang-format, lld,
# ld.lld, lldb, llvm-*) live under /usr/lib/llvm-22/bin, added to PATH by the
# base-stage RUN in the Dockerfile. libclang-rt-22-dev supplies the sanitizer
# runtimes (asan/ubsan/tsan/fuzzer) the tier-3 smoke exercises via `clang++`.
#
# The set below is the COMPLETE llvm-toolchain-22 suite and is DERIVED, not
# hand-typed — every list written from memory has been wrong (#251 proposed
# `apt:mlir-22`, which does not exist; OpenMP is `libomp-22-dev`, matching no
# substring of "openmp"). Regenerate with:
#
#     mise run apt-repo -- --llvm-version 22 --toml
#
# (`--llvm-version` takes 21 | 22 | dev; dev is the UNNUMBERED apt.llvm.org
# suite — `llvm-toolchain-resolute-23` is a 404.) The task reads the repo's
# Packages index via python-debian; see python/src/dotfiles_setup/apt_repo.py.
#
# Deliberately NOT passing `--exclude-runtime`: that flag drops `Section: libs`
# on the assumption they always arrive via Depends:. True for 9 of the 10 it
# drops — and FALSE for libclc-22, which is the payload (124 OpenCL .bc libs)
# and which nothing depends on, because libclc inverts the usual arrow
# (`libclc-22` Depends: `libclc-22-dev`, not the reverse). A heuristic that
# silently drops payload must not generate this file. Declaring a package that
# would arrive via Depends: anyway is merely explicit — and it makes the
# Dockerfile's `status --json --missing` gate actually verify it is present.
#
# Covers every component apt.llvm.org advertises: LLVM, Clang, compiler-rt,
# polly, LLDB, LLD, libFuzzer, libc++, libc++abi, openmp, libclc, libunwind,
# MLIR, BOLT, flang, libc (libllvmlibc-22-dev), wasm.
#
# TWO PYTHONS COEXIST HERE, AND THAT IS CORRECT (Ray, 2026-07-15):
#
#   * mise's python (~113 MB, pinned in conf.d/shared.toml) is THE default —
#     `python3` resolves to /usr/local/share/mise/installs/python/<ver>. It is a
#     python-build-standalone build: Astral's project, the same artifact
#     `uv python install` fetches, which is why `uv python list --only-installed`
#     reports it as cpython-<ver>-linux-x86_64-gnu. mise downloads it directly
#     (it does NOT shell out to uv); uv's role here is venvs, via
#     `python.uv_venv_auto = "source"` below.
#   * Ubuntu's /usr/bin/python3 (~23 MB) is NOT removable: it is a hard Depends:
#     of the LLVM set above. `apt-get -s remove python3` would also remove
#     clang-format-22, clang-tidy-22, clang-tools-22, lldb-22, llvm-22-dev,
#     llvm-22-tools, liblldb-22-dev, libllvm-22-ocaml-dev, python3-clang-22 and
#     python3-lldb-22. Removing the 23 MB removes the toolchain.
#
# This is NOT the conda-LLVM duplication #222 PR-C fixed. That was ONE 186 MB
# libLLVM.so copied EIGHT times (~6.9 GB of pure redundancy). This is two
# interpreters with distinct jobs — the pinned dev python, and the one
# clang-format-22 links against — costing 23 MB against a 17.5 GB image (0.13%).
# Neither mise nor uv can install python "as the system binary" anyway: both
# ship relocatable python-build-standalone into a managed prefix by design
# (mise docs: "not a system-wide installation"; `uv python dir` likewise), with
# no dist-packages layout, so replacing /usr/bin/python3 would break every
# apt-installed python module. Tier-1 smoke asserts the DEFAULT python3 is
# mise's and matches this pin (dotfiles_setup.image._TIER1_PYTHON_DEFAULT).
#
# python3-clang-22 — installed, and DELIBERATELY not on the default python
# (Ray, 2026-07-15). It lands in /usr/lib/python3/dist-packages/, which only
# /usr/bin/python3 sees; the default `python3` here is the mise shim. That is
# the intended arrangement, not a defect:
#
#   * Debian's is the ONLY version-matched source. PyPI `clang` stops at
#     21.1.7 and `libclang` at 18.1.1 — both mismatch our libclang 22.1.2, and
#     cindex.py raises LibclangError when a binding's function is absent.
#     `libclang` also bundles its own .so, duplicating a lib we ship (#222).
#   * The module is pure-python ctypes (0 .so), so nothing is broken — it
#     imports, creates an Index and parses real C under /usr/bin/python3.
#     Reach it there; set LIBCLANG_LIBRARY_FILE=/usr/lib/llvm-22/lib/
#     libclang-22.so.1 (cindex.py reads that env var natively).
#
# DO NOT "fix" this with PYTHONPATH=/usr/lib/python3/dist-packages. PYTHONPATH
# lands at sys.path[1] while site-packages is [5], so dist-packages WINS:
# probed 2026-07-15, a venv pinning pyyaml==6.0.2 silently got Debian's 6.0.3.
# That trades every project's pinned deps for one import.
#
# These are Ubuntu 26.04 resolute/universe names at 22.1.2. apt.llvm.org
# publishes the same names at a 22.1.8 daily snapshot (#251 open decision).
"apt:bolt-22"                   = "latest"
"apt:clang-22"                  = "latest"
"apt:clang-format-22"           = "latest"
"apt:clang-tidy-22"             = "latest"
"apt:clang-tools-22"            = "latest"
"apt:clangd-22"                 = "latest"
"apt:flang-22"                  = "latest"
"apt:libbolt-22-dev"            = "latest"
"apt:libc++-22-dev"             = "latest"
"apt:libc++-22-dev-wasm32"      = "latest"
"apt:libc++1"                   = "latest"
"apt:libc++abi-22-dev"          = "latest"
"apt:libc++abi-22-dev-wasm32"   = "latest"
"apt:libc++abi1"                = "latest"
"apt:libclang-22-dev"           = "latest"
"apt:libclang-common-22-dev"    = "latest"
"apt:libclang-cpp22"            = "latest"
"apt:libclang-cpp22-dev"        = "latest"
"apt:libclang-rt-22-dev"        = "latest"
"apt:libclang-rt-22-dev-wasm32" = "latest"
"apt:libclang-rt-22-dev-wasm64" = "latest"
"apt:libclang1-22"              = "latest"
"apt:libclc-22"                 = "latest"
"apt:libclc-22-dev"             = "latest"
"apt:libflang-22-dev"           = "latest"
"apt:libfuzzer-22-dev"          = "latest"
"apt:liblld-22"                 = "latest"
"apt:liblld-22-dev"             = "latest"
"apt:liblldb-22"                = "latest"
"apt:liblldb-22-dev"            = "latest"
"apt:libllvm-22-ocaml-dev"      = "latest"
"apt:libllvm22"                 = "latest"
"apt:libllvmlibc-22-dev"        = "latest"
"apt:libmlir-22"                = "latest"
"apt:libmlir-22-dev"            = "latest"
"apt:liboffload-22"             = "latest"
"apt:liboffload-22-dev"         = "latest"
"apt:libomp-22-dev"             = "latest"
"apt:libomp5"                   = "latest"
"apt:libpolly-22-dev"           = "latest"
"apt:libunwind-22-dev"          = "latest"
"apt:lld-22"                    = "latest"
"apt:lldb-22"                   = "latest"
"apt:llvm-22"                   = "latest"
"apt:llvm-22-dev"               = "latest"
"apt:llvm-22-linker-tools"      = "latest"
"apt:llvm-22-runtime"           = "latest"
"apt:llvm-22-tools"             = "latest"
"apt:llvm-libunwind1"           = "latest"
"apt:mlir-22-tools"             = "latest"
"apt:python3-clang-22"          = "latest"
"apt:python3-lldb-22"           = "latest"

# NOT installed — listed so the set is visibly complete and a reader sees
# these were considered and rejected, not missed.
#
# docs/examples: pure image weight; #222 just took :dev 25.8 GB -> 17.5 GB.
# "apt:clang-22-doc"              = "latest"
# "apt:clang-22-examples"         = "latest"
# "apt:libomp-22-doc"             = "latest"
# "apt:llvm-22-doc"               = "latest"
# "apt:llvm-22-examples"          = "latest"
#
# libclang-rt-22-dev-win: UN-INSTALLABLE alongside libclang-rt-22-dev, which
# supplies the asan/ubsan/tsan/fuzzer runtimes tier-3 smoke exercises. Both
# ship /usr/lib/llvm-22/lib/clang/22/lib/windows/libclang_rt.builtins-aarch64.a
# and Ubuntu declares no Conflicts/Replaces, so dpkg aborts the WHOLE apt
# transaction — one bad package takes all 30 with it. Upstream packaging bug;
# probed in-container 2026-07-15, fails identically when installed alone. We
# do not target Windows, so this is no loss.
# "apt:libclang-rt-22-dev-win"    = "latest"

[settings]
arch = "x86_64"
experimental = true
# Scope mise's declarative package management to apt (the only manager present
# in the linux-x64 image) so apply/status never touch dnf/pacman/brew.
system_packages.managers = ["apt"]
auto_install = true
lockfile = true
# Scope `mise.lock` to the image target so `mise lock` doesn't fan out to all
# 7 platforms (native since mise v2026.4.9 — requires the pinned MISE_VERSION in
# the Dockerfile to honor it; older mise treats it as an unknown field). The
# committed .devcontainer/mise-system.lock is generated for linux-x64 and
# consumed by `mise install --system --locked`. See epic #160.
lockfile_platforms = ["linux-x64"]
jobs = 1
# Supply-chain hardening: ignore tool versions younger than 7 days when
# resolving `latest`/fuzzy requests (forwards the cutoff to npm:/pipx:
# transitive deps too). Network-free, needs no GITHUB_TOKEN — complements
# the intentional github_attestations=false / slsa=false below (disabled
# because a token isn't reliably available in buildkit secret mounts).
# NOTE: `mise lock` resolves `latest` WITHOUT this cutoff while bun
# enforces it at install, so a locked latest younger than 7d fail-closes
# (PR #169). Exempt fast-releasing tools via minimum_release_age_excludes
# (mise-runtime.toml [settings] does this for the AI CLIs).
minimum_release_age = "7d"
npm.package_manager = "bun"
pipx.uvx = true
cargo.binstall = true
cargo.binstall_only = false
conda.channel = "conda-forge"
# Attestation verification disabled in Docker builds — global override covers
# all backends (aqua, github, python, core/ruby). Per-backend settings don't
# cover core backends like ruby. GITHUB_TOKEN not reliably available in
# buildkit secret mounts; CI passes token but local builds hit rate limits.
# REVISITED #160 T12.5 (decision 16): per-tool disable now exists upstream
# and a token-free attestation proxy is proposed (jdx/mise#10127) — flip to
# per-tool opt-out once the proxy ships; until then the blanket-off stands
# for the token-availability reason above.
github_attestations = false
slsa = false
python.uv_venv_auto = "source"
# #160 T12.5 (decision 15): the http timeout moved from the MISE_HTTP_TIMEOUT
# env var to its native setting.
http_timeout = "120s"

[settings.status]
show_tools = true
missing_tools = "always"
show_env = true

[env]
# Expose the apt LLVM-22 toolchain (#222 PR-C) on PATH via mise's native path
# directive — NOT /etc/profile.d. mise manages PATH through activation (this is
# how every base tool is exposed), and the chezmoi-rendered ~/.profile runs
# `mise activate`, which resets PATH and would discard a profile.d addition. The
# old conda clang++ survived only because it was a mise shim in a dir mise's PATH
# includes; `_.path` restores that exact exposure for the apt binaries. mise puts
# this FIRST in the activated PATH, so the unversioned clang/clang++/clangd/
# clang-tidy/clang-format/lld/lldb/llvm-* win over /opt/clang-p2996 (the general
# toolchain, matching the pre-#222 behavior). Covers login + non-login +
# CI dev-image smoke (all mise-activated). See the base-stage smoke in the Dockerfile.
_.path = ["/usr/lib/llvm-22/bin"]
# Build toolchain
CC = "gcc"
CXX = "g++"
# Hook runner (HK_PKL_BACKEND dropped #160 T12 — pklr parity verified)
HK_MISE = "1"
# Locale (set here so all mise-activated shells inherit)
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
# Platform hints for tool backends
MISE_ARCH = "x86_64"
MISE_OS = "linux"
CONDA_SUBDIR = "linux-64"
# Network / install behavior (MISE_HTTP_TIMEOUT moved to [settings]
# http_timeout, #160 T12.5)
npm_config_update_notifier = "false"
# Rust: skip PATH check during non-interactive installs
RUSTUP_INIT_SKIP_PATH_CHECK = "yes"
# CARGO_HOME / RUSTUP_HOME intentionally unset — users fall back to
# ~/.cargo / ~/.rustup on named volumes (see devcontainer.json mounts).
# Build-time isolation via MISE_CARGO_HOME / MISE_RUSTUP_HOME in Dockerfile ENV.

[tasks."setup:tools"]
description = "Install all tools and reshim"
run = "mise install -y && mise reshim -f"

[tasks."setup:gpg"]
description = "Import GPG keys"
run = """
for keyfile in ~/.config/git/*.asc; do
    [ -f "$keyfile" ] || continue
    gpg --import "$keyfile" 2>/dev/null || true
done
"""

# [hooks] postinstall removed — Claude Code now installed via mise http:claude backend
# For per-user native binary in overlay: run `claude install` in Dockerfile.host-user
