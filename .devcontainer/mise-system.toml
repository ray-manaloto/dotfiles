# :schema https://mise.jdx.dev/schema/mise.json
#
# System-wide mise config for Docker devcontainer image
# This is a DEDICATED config — not derived from chezmoi templates.
# Installed to /usr/local/share/mise/config.toml during docker build
# (cookbook canonical path per https://mise.jdx.dev/mise-cookbook/docker).
# Changes here must be validated via CI (never `docker buildx bake dev-load`
# locally — see feedback_base_image_ci_only.md).

# BASE TIER (#160 T9): the tools the image needs to BUILD ITSELF and the core
# C++ toolchain — runtimes (rust STAYS base: cargo/rustup self-checks), the conda
# build tools (the p2996 stage runs cmake/ninja from these shims), bazel,
# micromamba, sqlite. The LLVM-family compiler/linker/debugger toolchain lives in
# apt (see [bootstrap.packages], #222 PR-C). Everything else moved out: the locked dev tools
# live in mise-runtime.toml (installed in the devcontainer-runtime stage
# under MISE_ENV=runtime), the interactive tools live in the chezmoi user
# overlay (home/dot_config/mise/config.toml.tmpl, eager-installed by
# onCreateCommand). Probe-verified: config.<env>.toml is discovered beside
# this file in $MISE_CONFIG_DIR and merged additively.
[tools]
# Core runtimes
node = "latest"
# bun moved to .config/mise/conf.d/shared.toml (host↔image shared: it is the
# npm package_manager both sides use; mise-parity forbids declaring it here too).
go = "latest"
rust = "latest"
zig = "latest"
java = "latest"
deno = "latest"
ruby = "latest"
cargo-binstall = "latest"
# The tools shared with the host (hk, pkl, gitleaks, chezmoi, python, uv,
# pixi, pinact, and the linters) come from .config/mise/conf.d/shared.toml,
# COPYd to /usr/local/share/mise/conf.d/ and merged into this system config —
# exact-pinned so host and image never drift. See epic #160 T5.
# #154: hk-image.pkl's security group runs gitleaks (now provided by the shared
# fragment). It has NO editorconfig step — the editorconfig_checker builtin is
# wired only in the HOST hk.pkl — so editorconfig-checker was dead weight in the
# image and is removed here (#160 T6). Nothing else in the image invokes `ec`.
# Conda packages (C++ toolchain for devcontainer)
# NOTE (#222 PR-C): the LLVM-family toolchain (llvm, llvm-tools, clang, clangxx,
# clang-tools, clang-format, lld, lldb) was MOVED OUT of the conda backend to the
# Ubuntu apt LLVM-22 packages declared in [bootstrap.packages] below. mise's conda
# backend installs one isolated prefix PER tool (rattler per-tool extraction), so
# each carried its OWN 186 MB libLLVM.so — 9 duplicate copies, ~6.9 GB. The apt
# packages all depend on a single shared libLLVM-22 runtime (one 149 MB copy), so
# the same LLVM 22.1.x toolchain costs ~0.68 GB — a ~6.2 GB reclaim, capability
# preserved (clang/clang++/clangd/clang-tidy/clang-format/lld/lldb/llvm-* + the
# asan/ubsan/tsan/fuzzer sanitizers via libclang-rt-22-dev). mise has no non-source
# LLVM backend (conda dups; the asdf-llvm plugin builds from source ~2h), so apt is
# the native "system tools" install. include-what-you-use STAYS conda (Ubuntu's apt
# iwyu is built against clang-19 and drags libLLVM-19+21; conda keeps it on the
# matching clang-22 in one isolated env). cppcheck STAYS conda (no libLLVM — it was
# never part of the duplication). cmake/ninja STAY conda (the p2996 stage uses them).
"conda:cmake" = "latest"
"conda:ninja" = "latest"
"conda:mold" = "latest"
"conda:bear" = "latest"
"conda:ccache" = "latest"
"conda:cppcheck" = "latest"
"conda:include-what-you-use" = "latest"
# `.gdb-post-link.sh` ships in conda-forge gdb's `bin/` as standard conda-build
# packaging convention (recipe `post-link.sh` → `${PREFIX}/bin/.<pkg>-post-link.sh`).
# Its body is fully guarded by `if [[ $(uname) == "Darwin" ]]` (macOS gdb
# codesigning helper), so it is a no-op on Linux. mise's shim creation indexes
# every executable file in `bin/`, including this hidden file. mise doctor's
# missing-shims check then asymmetrically excludes dotfiles from the "actual
# shims" set (`src/shims.rs:467`) but enumerates them from `.mise-bins/`,
# producing a phantom "Missing shims: .gdb-post-link.sh" warning during
# `mise run verify-local`'s persistence gate. Removing the executable bit
# makes mise treat the file as a non-shimmable resource — no deletion of an
# upstream-owned file. See `.claude/rules/persistence-gate-retry.md`.
"conda:gdb" = { version = "latest", postinstall = "find \"$MISE_TOOL_INSTALL_PATH/bin\" -maxdepth 1 -name '.*' -type f -exec chmod -x {} +" }
# conda:lldb moved to apt lldb-22 (#222 PR-C) — see the LLVM note above. conda-forge
# had no lldb-22 build (it pinned lldb to LLVM 21); apt ships lldb-22 matching clang-22.
"conda:lcov" = "latest"
"conda:doxygen" = "latest"
"conda:git" = "latest"
"conda:make" = "latest"
"conda:linux-perf" = "latest"
"conda:tar" = "latest"
"conda:p7zip" = "latest"
"conda:valgrind" = "latest"
"bazel" = "latest"
"sqlite" = "latest"
"micromamba" = "latest"

# conda:imagemagick removed 2026-04-28 — conda-forge solve fails with
# "duplicate records for adwaita-icon-theme-40.1.1-ha770c72_1.tar.bz2"
# (heavy GUI dep chain conflict). If imagemagick is needed, install via
# apt in the Dockerfile (`imagemagick` is a standard Ubuntu package).
# Interactive shell tools (fzf, starship, zellij, htop, …) moved BACK to the
# per-user chezmoi overlay in #160 T9 — they are session conveniences, not
# image build inputs; the overlay eager-installs them at container create
# onto the home volume, so image cache stability no longer depends on them.

# Declarative apt packages — the REAL installer source (#160 T4, wagov-dtt
# pattern). The Dockerfile base stage seeds only curl + ca-certificates (for
# the mise installer), then runs `mise bootstrap packages apply --manager apt
# --yes --update` against this section. Recommends/Suggests are disabled
# image-wide via /etc/apt/apt.conf.d/99no-install-recommends (mise has no
# apt-args flag). The build fails loudly if anything is missing afterwards:
# `mise bootstrap packages status --json --missing` exits 1 (anti-drift gate);
# CI's T7 gap report additionally asserts the status JSON. Keys are
# `manager:package`.
# NOTE: mise renamed this from `[system.packages]`/`mise system` (2026.6.4) to
# `[bootstrap.packages]`/`mise bootstrap packages` by 2026.7.0.
#
# WHY PINNED (#288, was "latest" until 2026-07-16): mise.lock does NOT cover
# bootstrap packages and the base content-hash keys on THIS FILE'S BYTES, so a
# "latest" entry drifts silently while the hash still reports "same" — an
# unrelated edit rebuilds against a different curl/openssl and nothing says so.
# A pin converts that silent drift into a LOUD build failure. Same reasoning as
# the LLVM block below, and the path `feedback_apt_snapshot_removed` prescribes
# ("if reproducibility is needed, use ... version-pinned packages") after
# snapshot.ubuntu.com was rejected as unreliable.
#
# WHAT THIS DOES **NOT** BUY: these pins pin the 14 NAMED packages only. Their
# transitive closure (libcurl4t64, libssl3t64, gcc-16, libc6-dev, ...) still
# floats, so the image is NOT reproducible from this file — the honest claim is
# drift-DETECTION on the named set, not a reproducible closure. A full-closure
# pin would need an apt lockfile mise does not have.
#
# THE POCKET TRAP (probed 2026-07-16, clean room, `mise run verify-apt-pins`):
# these versions are the newest across resolute + resolute-updates +
# resolute-security, NOT the `resolute` release-pocket versions. Ubuntu freezes
# the release pocket at release day, so pinning to it is not merely
# security-stale — it does not INSTALL:
#   apt-get install --simulate curl=8.18.0-1ubuntu2   ->
#     curl : Depends: libcurl4t64 (= 8.18.0-1ubuntu2)
#            but 8.18.0-1ubuntu2.3 is to be installed
# because curl hard-depends on its co-versioned libcurl4t64 and apt will not
# drag that dependency below its candidate. Renovate tracks all three pockets
# (registryStrategy 'merge'); see the `apt-mise-system` customManager +
# `apt-ubuntu-pockets` packageRules in renovate.json.
#
# CONSEQUENCE, accepted: that same co-versioning means a pin goes uninstallable
# the moment its security update lands, until Renovate bumps it. That is the
# intended loud failure, not a regression. Verify any edit here in ~60s with
# `mise run verify-apt-pins` BEFORE spending a ~2.5h CI base rebuild
# (`.claude/rules/local-devcontainer-first.md`).
[bootstrap.packages]
"apt:build-essential" = "12.12ubuntu2.26.04.2"
"apt:ca-certificates" = "20260601~26.04.1"
"apt:curl" = "8.18.0-1ubuntu2.3"
"apt:gnupg" = "2.4.8-4ubuntu3"
# graphviz is installed separately below as a pinned GitLab .deb (15.1.0),
# NOT via apt (Ubuntu ships 14.1.2). See the graphviz RUN in
# .devcontainer/Dockerfile (#222 PR-A / folds #22).
"apt:pkg-config" = "2.5.1-4"
"apt:sudo" = "1.9.17p2-1ubuntu3"
"apt:unzip" = "6.0-29ubuntu1"
"apt:zsh" = "5.9-8ubuntu3"
"apt:libatomic1" = "16-20260322-1ubuntu1"
"apt:libbz2-dev" = "1.0.8-6build2"
"apt:libreadline-dev" = "8.3-4"
"apt:libsqlite3-dev" = "3.46.1-9ubuntu0.2"
"apt:libssl-dev" = "3.5.5-1ubuntu3.3"
"apt:zlib1g-dev" = "1:1.3.dfsg+really1.3.1-1ubuntu3"
# LLVM-22 C++ toolchain (#222 PR-C) — Ubuntu 26.04's version-suffixed apt packages
# all depend on ONE shared libLLVM-22 runtime, replacing the 8 conda LLVM tools that
# each duplicated a 186 MB libLLVM.so (~6.9 GB → ~0.68 GB). Version is pinned by the
# `-22` package name (no drift to 23; patch updates within 22 are fine). The
# unversioned binaries (clang, clang++, clangd, clang-tidy, clang-format, lld,
# ld.lld, lldb, llvm-*) live under /usr/lib/llvm-22/bin, added to PATH by the
# base-stage RUN in the Dockerfile. libclang-rt-22-dev supplies the sanitizer
# runtimes (asan/ubsan/tsan/fuzzer) the tier-3 smoke exercises via `clang++`.
#
# The set below is the COMPLETE llvm-toolchain-22 suite, sourced from
# apt.llvm.org and PINNED. It is DERIVED, not hand-typed — every list written
# from memory has been wrong (#251 proposed `apt:mlir-22`, which does not
# exist; OpenMP is `libomp-22-dev`, matching no substring of "openmp").
# Regenerate with:
#
#     mise run apt-repo -- --llvm-version 22 --toml --pin
#
# (`--llvm-version` takes 21 | 22 | dev; dev is the UNNUMBERED apt.llvm.org
# suite — `llvm-toolchain-resolute-23` is a 404.) The task reads the repo's
# Packages index via python-debian; see python/src/dotfiles_setup/apt_repo.py.
#
# WHY apt.llvm.org and not Ubuntu's archive (#251, Ray 2026-07-15): Ubuntu
# resolute/universe froze at 22.1.2; apt.llvm.org's `-22` suite carries 22.1.8.
# Despite the site self-describing as "nightly", the NUMBERED suites build
# RELEASED TAGS — probed: `llvmorg-22.1.8` points at commit ca7933e47d3a, and
# the version string below embeds exactly that commit. "Nightly" names the
# packaging cadence, not the source tree. (The UNNUMBERED suite really is LLVM
# 23 trunk — deliberately NOT enabled: it outranks 22 on version and would
# silently win every unversioned package.) The repo + GPG key are added by a
# base-stage RUN in .devcontainer/Dockerfile BEFORE the bootstrap apply;
# `[bootstrap.repos]` cannot do it (that is git repos, not apt sources).
#
# WHY PINNED, not "latest": apt.llvm.org's pool retains exactly ONE build (58
# pkgs x arches = 141 debs, 1 distinct version), so `"latest"` drifts silently
# — and the base content-hash keys on THIS FILE'S BYTES, so an unrelated edit
# would rebuild against a different compiler while the hash still reports
# "same". A pin makes that drift a LOUD build failure instead. All 58 packages
# share one version string, so the pins are uniform. Renovate keeps them
# current via the `apt-mise-system` customManager in renovate.json (regex +
# `deb` datasource) — PROVEN end-to-end against this exact suite; the native
# mise manager CANNOT (its schema parses only `tools`/`tasks` and silently
# strips `[bootstrap.packages]`). #236 does not apply: bootstrap packages are
# not in mise.lock and a regex manager has no lockfile to regenerate.
#
# python3-clang-22 lands in /usr/lib/python3/dist-packages/, which only
# /usr/bin/python3 sees — the default `python3` here is the mise shim and will
# NOT import it (probed 2026-07-15). Working as packaged; use /usr/bin/python3.
"apt:bolt-22"                   = "1:22.1.8~++20260714015917+ca7933e47d3a-1~exp1~20260714135927.17"
"apt:clang-22"                  = "1:22.1.8~++20260714015917+ca7933e47d3a-1~exp1~20260714135927.17"
