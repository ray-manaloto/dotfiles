# NOT installed — listed (pinned, not "latest") so the set is visibly complete,
# a reader sees these were considered and rejected rather than missed, and an
# uncomment is correct as-is.
#
# docs/examples: pure image weight; #222 PR-C took :dev 25.8 GB -> 17.5 GB.
# "apt:clang-22-doc"              = "1:22.1.8~++20260714015917+ca7933e47d3a-1~exp1~20260714135927.17"
# "apt:clang-22-examples"         = "1:22.1.8~++20260714015917+ca7933e47d3a-1~exp1~20260714135927.17"
# "apt:libomp-22-doc"             = "1:22.1.8~++20260714015917+ca7933e47d3a-1~exp1~20260714135927.17"
# "apt:llvm-22-doc"               = "1:22.1.8~++20260714015917+ca7933e47d3a-1~exp1~20260714135927.17"
# "apt:llvm-22-examples"          = "1:22.1.8~++20260714015917+ca7933e47d3a-1~exp1~20260714135927.17"
#
# libclang-rt-22-dev-win: UN-INSTALLABLE alongside libclang-rt-22-dev, which we
# need (it supplies the asan/ubsan/tsan/fuzzer runtimes tier-3 smoke exercises).
# Both ship /usr/lib/llvm-22/lib/clang/22/lib/windows/libclang_rt.builtins-aarch64.a
# and Ubuntu declares no Conflicts/Replaces, so dpkg aborts the WHOLE apt
# transaction — one bad package takes all 30 with it. Upstream packaging bug;
# probed in-container 2026-07-15, fails identically installed alone. We do not
# target Windows, so this is no loss.
# "apt:libclang-rt-22-dev-win"    = "1:22.1.8~++20260714015917+ca7933e47d3a-1~exp1~20260714135927.17"

[settings]
# NO `arch` PIN (#698). It read `arch = "x86_64"`, which made every image
# resolve x86_64 tools regardless of what it was being built for — so #676's
# arm64 leg produced an arm64 image holding 131 x86_64 resolutions, and the
# build survived it because the self-checks below COUNT tools rather than run
# them. Each matrix leg builds inside a container of its own architecture, so
# mise's native detection already IS the build target; a literal can only
# disagree with it. Machine-enforced by `find_pinned_image_arch`.
experimental = true
# Scope mise's declarative package management to apt (the only manager present
# in the image, whatever its architecture) so apply/status never touch
# dnf/pacman/brew.
system_packages.managers = ["apt"]
auto_install = true
lockfile = true
# Scope `mise.lock` to the PUBLISHED architectures so `mise lock` doesn't fan
# out to all 7 platforms (native since mise v2026.4.9 — requires the pinned
# MISE_VERSION in the Dockerfile to honor it; older mise treats it as an unknown
# field). The committed .devcontainer/mise-system.lock carries an entry per tool
# PER platform here, and is consumed by `mise install --system --locked`.
#
# This list must cover every arch in `platform_target.PUBLISHED_ARCHES` — an
# architecture absent from it gets NO lock entries, and `--locked` then resolves
# that leg's tools from whichever platform IS present (#698). Enforced by
# `find_lock_platform_drift`; widen this BEFORE running `mise run lock-image`,
# which derives its platform set from the committed lock. See epic #160.
lockfile_platforms = ["linux-x64", "linux-arm64"]
jobs = 1
# Supply-chain hardening: ignore tool versions younger than 7 days when
# resolving `latest`/fuzzy requests (forwards the cutoff to npm:/pipx:
# transitive deps too). Network-free, needs no GITHUB_TOKEN — complements
# the intentional github_attestations=false / slsa=false below (disabled
# because a token isn't reliably available in buildkit secret mounts).
# NOTE: `mise lock` resolves `latest` WITHOUT this cutoff while bun
# enforces it at install, so a locked latest younger than 7d fail-closes
# (PR #169). Exempt fast-releasing tools via minimum_release_age_excludes
# (mise-runtime.toml [settings] does this for the AI CLIs).
minimum_release_age = "7d"
npm.package_manager = "bun"
pipx.uvx = true
cargo.binstall = true
cargo.binstall_only = false
conda.channel = "conda-forge"
# Attestation verification disabled in Docker builds — global override covers
# all backends (aqua, github, python, core/ruby). Per-backend settings don't
# cover core backends like ruby. GITHUB_TOKEN not reliably available in
# buildkit secret mounts; CI passes token but local builds hit rate limits.
# REVISITED #160 T12.5 (decision 16): per-tool disable now exists upstream
# and a token-free attestation proxy is proposed (jdx/mise#10127) — flip to
# per-tool opt-out once the proxy ships; until then the blanket-off stands
# for the token-availability reason above.
github_attestations = false
slsa = false
python.uv_venv_auto = "source"
# #160 T12.5 (decision 15): the http timeout moved from the MISE_HTTP_TIMEOUT
# env var to its native setting.
http_timeout = "120s"

[settings.status]
show_tools = true
missing_tools = "always"
show_env = true

[env]
# Expose the apt LLVM-22 toolchain (#222 PR-C) on PATH via mise's native path
# directive — NOT /etc/profile.d. mise manages PATH through activation (this is
# how every base tool is exposed), and the chezmoi-rendered ~/.profile runs
# `mise activate`, which resets PATH and would discard a profile.d addition. The
# old conda clang++ survived only because it was a mise shim in a dir mise's PATH
# includes; `_.path` restores that exact exposure for the apt binaries. mise puts
# this FIRST in the activated PATH, so the unversioned clang/clang++/clangd/
# clang-tidy/clang-format/lld/lldb/llvm-* win over /opt/clang-p2996 (the general
# toolchain, matching the pre-#222 behavior). Covers login + non-login +
# CI dev-image smoke (all mise-activated). See the base-stage smoke in the Dockerfile.
_.path = ["/usr/lib/llvm-22/bin"]
# Build toolchain
CC = "gcc"
CXX = "g++"
# Hook runner (HK_PKL_BACKEND dropped #160 T12 — pklr parity verified)
HK_MISE = "1"
# Locale (set here so all mise-activated shells inherit)
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
# Platform hints for tool backends
MISE_ARCH = "x86_64"
MISE_OS = "linux"
CONDA_SUBDIR = "linux-64"
# Network / install behavior (MISE_HTTP_TIMEOUT moved to [settings]
# http_timeout, #160 T12.5)
npm_config_update_notifier = "false"
# Rust: skip PATH check during non-interactive installs
RUSTUP_INIT_SKIP_PATH_CHECK = "yes"
# CARGO_HOME / RUSTUP_HOME intentionally unset — users fall back to
# ~/.cargo / ~/.rustup on named volumes (see devcontainer.json mounts).
# Build-time isolation via MISE_CARGO_HOME / MISE_RUSTUP_HOME in Dockerfile ENV.

[tasks."setup:tools"]
description = "Install all tools and reshim"
run = "mise install -y && mise reshim -f"

[tasks."setup:gpg"]
description = "Import GPG keys"
run = """
for keyfile in ~/.config/git/*.asc; do
    [ -f "$keyfile" ] || continue
    gpg --import "$keyfile" 2>/dev/null || true
done
"""

# [hooks] postinstall removed — Claude Code now installed via mise http:claude backend
# For per-user native binary in overlay: run `claude install` in Dockerfile.host-user
