# :schema https://mise.jdx.dev/schema/mise.json
#
# System-wide mise config for Docker devcontainer image
# This is a DEDICATED config — not derived from chezmoi templates.
# Installed to /usr/local/share/mise/config.toml during docker build
# (cookbook canonical path per https://mise.jdx.dev/mise-cookbook/docker).
# Changes here must be validated via CI (never `docker buildx bake dev-load`
# locally — see feedback_base_image_ci_only.md).

# BASE TIER (#160 T9): the 36 tools the image needs to BUILD ITSELF and the
# core C++ toolchain — runtimes (rust STAYS base: cargo/rustup self-checks),
# the conda toolchain (the p2996 stage runs cmake/ninja from these shims),
# bazel, micromamba, sqlite. Everything else moved out: the locked dev tools
# live in mise-runtime.toml (installed in the devcontainer-runtime stage
# under MISE_ENV=runtime), the interactive tools live in the chezmoi user
# overlay (home/dot_config/mise/config.toml.tmpl, eager-installed by
# onCreateCommand). Probe-verified: config.<env>.toml is discovered beside
# this file in $MISE_CONFIG_DIR and merged additively.
[tools]
# Core runtimes
node = "latest"
bun = "latest"
go = "latest"
rust = "latest"
zig = "latest"
java = "latest"
deno = "latest"
ruby = "latest"
cargo-binstall = "latest"
# The 20 tools shared with the host (hk, pkl, gitleaks, chezmoi, python, uv,
# pixi, pinact, and the linters) come from .config/mise/conf.d/shared.toml,
# COPYd to /usr/local/share/mise/conf.d/ and merged into this system config —
# exact-pinned so host and image never drift. See epic #160 T5.
# #154: hk-image.pkl's security group runs gitleaks (now provided by the shared
# fragment). It has NO editorconfig step — the editorconfig_checker builtin is
# wired only in the HOST hk.pkl — so editorconfig-checker was dead weight in the
# image and is removed here (#160 T6). Nothing else in the image invokes `ec`.
# Conda packages (C++ toolchain for devcontainer)
"conda:llvm" = "latest"
"conda:llvm-tools" = "latest"
"conda:clang" = "latest"
"conda:clangxx" = "latest"
"conda:cmake" = "latest"
"conda:ninja" = "latest"
"conda:clang-tools" = "latest"
"conda:clang-format" = "latest"
"conda:lld" = "latest"
"conda:mold" = "latest"
"conda:bear" = "latest"
"conda:ccache" = "latest"
"conda:cppcheck" = "latest"
"conda:include-what-you-use" = "latest"
# `.gdb-post-link.sh` ships in conda-forge gdb's `bin/` as standard conda-build
# packaging convention (recipe `post-link.sh` → `${PREFIX}/bin/.<pkg>-post-link.sh`).
# Its body is fully guarded by `if [[ $(uname) == "Darwin" ]]` (macOS gdb
# codesigning helper), so it is a no-op on Linux. mise's shim creation indexes
# every executable file in `bin/`, including this hidden file. mise doctor's
# missing-shims check then asymmetrically excludes dotfiles from the "actual
# shims" set (`src/shims.rs:467`) but enumerates them from `.mise-bins/`,
# producing a phantom "Missing shims: .gdb-post-link.sh" warning during
# `mise run verify-local`'s persistence gate. Removing the executable bit
# makes mise treat the file as a non-shimmable resource — no deletion of an
# upstream-owned file. See `.claude/rules/persistence-gate-retry.md`.
"conda:gdb" = { version = "latest", postinstall = "find \"$MISE_TOOL_INSTALL_PATH/bin\" -maxdepth 1 -name '.*' -type f -exec chmod -x {} +" }
"conda:lldb" = "latest"
"conda:lcov" = "latest"
"conda:doxygen" = "latest"
"conda:git" = "latest"
"conda:make" = "latest"
"conda:linux-perf" = "latest"
"conda:tar" = "latest"
"conda:p7zip" = "latest"
"conda:valgrind" = "latest"
"bazel" = "latest"
"sqlite" = "latest"
"micromamba" = "latest"

# conda:imagemagick removed 2026-04-28 — conda-forge solve fails with
# "duplicate records for adwaita-icon-theme-40.1.1-ha770c72_1.tar.bz2"
# (heavy GUI dep chain conflict). If imagemagick is needed, install via
# apt in the Dockerfile (`imagemagick` is a standard Ubuntu package).
# Interactive shell tools (fzf, starship, zellij, htop, …) moved BACK to the
# per-user chezmoi overlay in #160 T9 — they are session conveniences, not
# image build inputs; the overlay eager-installs them at container create
# onto the home volume, so image cache stability no longer depends on them.

# Declarative apt packages — the REAL installer source (#160 T4, wagov-dtt
# pattern). The Dockerfile base stage seeds only curl + ca-certificates (for
# the mise installer), then runs `mise bootstrap packages apply --manager apt
# --yes --update` against this section. Recommends/Suggests are disabled
# image-wide via /etc/apt/apt.conf.d/99no-install-recommends (mise has no
# apt-args flag). The build fails loudly if anything is missing afterwards:
# `mise bootstrap packages status --json --missing` exits 1 (anti-drift gate);
# CI's T7 gap report additionally asserts the status JSON. Keys are
# `manager:package`; values stay "latest" — satisfied by any installed
# version (apply never upgrades), and mise.lock does NOT cover bootstrap
# packages, so pins would add no reproducibility.
# NOTE: mise renamed this from `[system.packages]`/`mise system` (2026.6.4) to
# `[bootstrap.packages]`/`mise bootstrap packages` by 2026.7.0.
[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:gnupg" = "latest"
"apt:graphviz" = "latest"
"apt:pkg-config" = "latest"
"apt:sudo" = "latest"
"apt:unzip" = "latest"
"apt:zsh" = "latest"
"apt:libatomic1" = "latest"
"apt:libbz2-dev" = "latest"
"apt:libreadline-dev" = "latest"
"apt:libsqlite3-dev" = "latest"
"apt:libssl-dev" = "latest"
"apt:zlib1g-dev" = "latest"

[settings]
arch = "x86_64"
experimental = true
# Scope mise's declarative package management to apt (the only manager present
# in the linux-x64 image) so apply/status never touch dnf/pacman/brew.
system_packages.managers = ["apt"]
auto_install = true
lockfile = true
# Scope `mise.lock` to the image target so `mise lock` doesn't fan out to all
# 7 platforms (native since mise v2026.4.9 — requires the pinned MISE_VERSION in
# the Dockerfile to honor it; older mise treats it as an unknown field). The
# committed .devcontainer/mise-system.lock is generated for linux-x64 and
# consumed by `mise install --system --locked`. See epic #160.
lockfile_platforms = ["linux-x64"]
jobs = 1
# Supply-chain hardening: ignore tool versions younger than 7 days when
# resolving `latest`/fuzzy requests (forwards the cutoff to npm:/pipx:
# transitive deps too). Network-free, needs no GITHUB_TOKEN — complements
# the intentional github_attestations=false / slsa=false below (disabled
# because a token isn't reliably available in buildkit secret mounts).
# NOTE: `mise lock` resolves `latest` WITHOUT this cutoff while bun
# enforces it at install, so a locked latest younger than 7d fail-closes
# (PR #169). Exempt fast-releasing tools via minimum_release_age_excludes
# (mise-runtime.toml [settings] does this for the AI CLIs).
minimum_release_age = "7d"
npm.package_manager = "bun"
pipx.uvx = true
cargo.binstall = true
cargo.binstall_only = false
conda.channel = "conda-forge"
# Attestation verification disabled in Docker builds — global override covers
# all backends (aqua, github, python, core/ruby). Per-backend settings don't
# cover core backends like ruby. GITHUB_TOKEN not reliably available in
# buildkit secret mounts; CI passes token but local builds hit rate limits.
# REVISITED #160 T12.5 (decision 16): per-tool disable now exists upstream
# and a token-free attestation proxy is proposed (jdx/mise#10127) — flip to
# per-tool opt-out once the proxy ships; until then the blanket-off stands
# for the token-availability reason above.
github_attestations = false
slsa = false
python.uv_venv_auto = "source"
# #160 T12.5 (decision 15): the http timeout moved from the MISE_HTTP_TIMEOUT
# env var to its native setting.
http_timeout = "120s"

[settings.status]
show_tools = true
missing_tools = "always"
show_env = true

[env]
# Build toolchain
CC = "gcc"
CXX = "g++"
# Hook runner (HK_PKL_BACKEND dropped #160 T12 — pklr parity verified)
HK_MISE = "1"
# Locale (set here so all mise-activated shells inherit)
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
# Platform hints for tool backends
MISE_ARCH = "x86_64"
MISE_OS = "linux"
CONDA_SUBDIR = "linux-64"
# Network / install behavior (MISE_HTTP_TIMEOUT moved to [settings]
# http_timeout, #160 T12.5)
npm_config_update_notifier = "false"
# Rust: skip PATH check during non-interactive installs
RUSTUP_INIT_SKIP_PATH_CHECK = "yes"
# CARGO_HOME / RUSTUP_HOME intentionally unset — users fall back to
# ~/.cargo / ~/.rustup on named volumes (see devcontainer.json mounts).
# Build-time isolation via MISE_CARGO_HOME / MISE_RUSTUP_HOME in Dockerfile ENV.

[tasks."setup:tools"]
description = "Install all tools and reshim"
run = "mise install -y && mise reshim -f"

[tasks."setup:gpg"]
description = "Import GPG keys"
run = """
for keyfile in ~/.config/git/*.asc; do
    [ -f "$keyfile" ] || continue
    gpg --import "$keyfile" 2>/dev/null || true
done
"""

# [hooks] postinstall removed — Claude Code now installed via mise http:claude backend
# For per-user native binary in overlay: run `claude install` in Dockerfile.host-user
