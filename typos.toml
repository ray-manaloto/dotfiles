#:schema ./schemas/typos.json
# typos config (#154). Hex digests and commit SHAs (7-40 lowercase hex chars)
# are ignored by the [default] regex below; do not add per-SHA entries.
[default]
# Short hex SHAs in prose (7-40 chars) are split into "words" and read as typos
# (`ba` in `50ba9eec` -> "by", `afe` in `28afe3f5` -> "safe"). Measured 2026-09-26 (session-audit-dismissed-errors F4):
# without this, 3 errors incl. a planted real typo; with it, only the planted typo.
# Replaces per-SHA allowlist entries for commit hashes.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

[default.extend-identifiers]

# `HOMEs` is the plural of the env var `HOME` ("under both HOMEs": a real HOME and an
# empty one) in the verbatim cold review of the research-fanout fixes. Verbatim
# reports are not normalized (agent-report-persistence.md rule 4), so the exact
# token is allowlisted (repo-wide, exact identifier) rather than the report edited.
HOMEs = "HOMEs"

# `fpr` is gpg's --with-colons RECORD TYPE for a fingerprint line, not a
# misspelling of "for"/"far"/"fps" (#251). The Dockerfile's apt.llvm.org key
# check parses that exact format:
#   fpr:::::::::6084F3CF814B57C1CF12EFD515CF4D18AF4F7421:
# Allowlist the identifier so genuine typos elsewhere are still caught. gpg's
# format is not ours to rename, and weakening the check to dodge the word
# (grepping for the hex anywhere in the output) would match a subkey too.
fpr = "fpr"

# `sherif` is the real name of an hk builtin (and of its upstream monorepo
# linter, QuiiBz/sherif), not a misspelling of "sheriff". It reaches this repo
# through the GENERATED docs/hk-builtins-audit.md, which lists every builtin
# `hk builtins` reports — so the name is not ours to spell differently, and
# hand-editing the generated file would fail its own gate on the next run.
sherif = "sherif"

# `gae` is a minified symbol name in the Claude Code binary (the settings
# array-merge function), quoted verbatim as an evidence anchor in the
# claude-code-expert ledger (#568). The binary's minifier chose the name; it is
# not ours to respell, and rewording the anchor would break re-derivation
# against the binary.
gae = "gae"

# `HEL` is the session/lane shorthand for the ray-manaloto/harness-evolution-ledger repo
# (Ray, 2026-10-02 grilling: a machine allow-word, not prose). Exact identifier only:
# lowercase `hel` stays flagged, since it is a real typo of "help" elsewhere.
HEL = "HEL"


# `CPY001` is ruff's rule code for a missing copyright notice
# (flake8-copyright), not a misspelling of "COPY"/"CPU". It reaches this repo
# through #651's measurement of the ruff 0.15.20 -> 0.16.2 bump, where CPY001
# accounted for 106 of the 138 new violations — the single largest class, so
# naming it is the point of the record. Astral chose the code; rewording the
# measurement to dodge the word would make it uncheckable against ruff's own
# output.
CPY001 = "CPY001"

# ITEM 11: ruff's OWN vendored JSON Schema (schemas/ruff.json, byte-identical
# to upstream at its pinned tag) lists the bare rule-category code `CPY`
# (flake8-copyright) next to `CPY001` above — not a misspelling of
# "COPY"/"CPU". `default.extend-identifiers` is PROJECT-WIDE and was rejected
# for this token (4f1d527's revert): `CPY` IS a plausible typo for "COPY"
# anywhere else in the repo (a Dockerfile, a script), so a project-wide
# allowlist would silence a real one. Scoped instead to a `[type]` block
# bound by `extend-glob`, and two things about that scoping are NOT what they
# look like at a glance — say so here rather than implying precision this
# doesn't have:
#   - `extend-words`, not `extend-identifiers`. At the `default` level
#     `extend-identifiers` left `CPY` uncaught (rc=2) in schemas/ruff.json;
#     `extend-words` is what actually silences it (rc=0). Measured, not
#     assumed.
#   - `extend-glob` matches the BASENAME, not the path. There is no way to
#     scope this to the path `schemas/ruff.json` — `ruff.json` matches ANY
#     file named `ruff.json` anywhere in the repo, and `schemas/**/*.json` /
#     `**/schemas/*.json` do NOT bind at all (measured with
#     `check-file = false`). Narrower than a project-wide allowlist, which
#     was the objection, but not path-exact.
# Only bare `CPY` needed allowlisting — `CPY0`/`CPY00` (both present in
# schemas/ruff.json) were NOT among the three measured errors; add them only
# if a future measurement says otherwise.
[type.vendored-ruff-schema]
extend-glob = ["ruff.json"]

[type.vendored-ruff-schema.extend-words]
CPY = "CPY"

# `cpy` is the COBOL copybook extension (`.cpy`) in the Graphify 0.9.66 release
# receipt, which is verbatim vendor text. Scoped like `CPY` above — NOT
# project-wide, because `cpy` is a real typo for "copy" elsewhere (cold review
# of 6ef572d4 F3: a Dockerfile `RUN cpy` must still fail). `extend-glob`
# matches basenames, so this binds every `0.9.*.md` (only graphify receipts
# are named that way).
[type.graphify-receipt]
extend-glob = ["0.9.*.md"]

[type.graphify-receipt.extend-words]
cpy = "cpy"
